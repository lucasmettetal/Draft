<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<!-- Compare l'ancien tri, le nouveau tri et trois définitions de la frontline. Les variantes n'existent que dans cette page. -->
<script src="draft-role-sheet.js"></script><script src="draft-role-rates-live.js"></script><script src="draft-champions.js"></script><script src="draft-champion-official.js"></script>
<script>localStorage.setItem("draftProfile",JSON.stringify({role:"mid",pool:["TF"]}));localStorage.setItem("draftPatch","16.22");</script>
<script src="draft-engine.js"></script><script src="draft-data.js"></script>
<script>
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(20261105),pct=(x,n)=>Math.round(1000*x/n)/10;
const ids={};NAMES.forEach(n=>{ids[rateId(n)]=n});
const live=window.ROLE_RATES_LIVE.champions,w=[0,1,2,3,4].map(r=>Object.keys(live).filter(k=>ids[k]).map(k=>[ids[k],live[k][r]]));
const weighted=l=>{const total=l.reduce((s,x)=>s+x[1],0);let v=rng()*total;for(const x of l){v-=x[1];if(v<0)return x[0];}return l[l.length-1][0];};
const drafts=[];while(drafts.length<2500){const t=w.map(weighted);if(new Set(t).size===5)drafts.push(t);}
// Catégories, d'après les fiches existantes. Un bruiser très mobile ou plongeur n'est pas une frontline fiable.
const cat=n=>{const r=ROSTER[n]||"";if(/t/.test(r))return "tank";if(/b/.test(r)&&!/[am]/.test(r))return "situationnelle";return "aucune";};
const lists={tank:[],situationnelle:[],aucune:[]};NAMES.forEach(n=>lists[cat(n)].push(n));
const def=l=>{const v=l.map(n=>CHAMPION_OFFICIAL.champions[n].defense).filter(x=>x>0);return +(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)};
const out={categories:{tank:{nb:lists.tank.length,defenseRiot:def(lists.tank),noms:lists.tank.join(", ")},situationnelle:{nb:lists.situationnelle.length,defenseRiot:def(lists.situationnelle),noms:lists.situationnelle.join(", ")},bruiserExclu:{noms:NAMES.filter(n=>/b/.test(ROSTER[n])&&cat(n)==="aucune").join(", "),defenseRiot:def(NAMES.filter(n=>/b/.test(ROSTER[n])&&cat(n)==="aucune"))},aucune:{nb:lists.aucune.length,defenseRiot:def(lists.aucune)}}};
const compoBase=compoOf;
const models={
  ancien:null,
  // Correction minimale : seuls les bruisers très mobiles ou plongeurs quittent la frontline.
  sansMobiles:c=>Object.assign({},c,{front:c.front.filter(n=>cat(n)!=="aucune")}),
  tanks:c=>Object.assign({},c,{front:c.front.filter(n=>cat(n)==="tank")}),
  // Un tank compte pour 1, un situationnel pour 1/2 : c'est un choix, pas une mesure.
  categories:c=>{const t=c.front.filter(n=>cat(n)==="tank"),s=c.front.filter(n=>cat(n)==="situationnelle");const n=t.length+Math.floor(s.length/2);return Object.assign({},c,{front:t.concat(s).slice(0,n)});}
};
function setModel(m){compoOf=models[m]?(e=>models[m](compoBase(e))):compoBase;}
const pools={"Mid (tes 4)":["mid",["TF","Fizz","Kog'Maw","Xerath"]],"Jungle (Cho'Gath)":["jungle",["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"]],"Jungle (classique)":["jungle",["Vi","Amumu","Graves","Kha'Zix","Hecarim"]],"Top":["top",["Darius","Garen","Malphite","Ornn","Camille"]],"ADC":["adc",["Jinx","Caitlyn","Kog'Maw","Ezreal","Vayne"]],"Support":["support",["Thresh","Leona","Soraka","Lulu","Lux"]]};
function run(role,pool,m){applyProfile({role,pool});setModel(m);const share={},tops=[];let ties=0;const sum={};
  drafts.forEach(t=>{const r=analyze(t,identifiedOpponent(t),true,beliefScenarios(opponentBelief(t))).ranking;const g=[r[0].pick].concat(r[0].tiedWith);if(g.length>1)ties++;g.forEach(p=>{share[p]=(share[p]||0)+1/g.length});tops.push(r[0].pick+"|"+r[0].tiedWith.join());r.forEach(p=>{sum[p.pick]=(sum[p.pick]||0)+p.score});});
  setModel("ancien");
  return {part:Object.fromEntries(pool.map(p=>[p,pct(share[pickId(p)]||0,drafts.length)])),moyenne:Object.fromEntries(pool.map(p=>[p,+((sum[pickId(p)]||0)/drafts.length).toFixed(2)])),egalite:pct(ties,drafts.length),tops};}
out.pools={};
Object.keys(pools).forEach(k=>{const [role,pool]=pools[k];const r={};["ancien","sansMobiles","tanks","categories"].forEach(m=>{r[m]=run(role,pool,m)});
  const diff=m=>r[m].tops.filter((x,i)=>x.split("|")[0]!==r.ancien.tops[i].split("|")[0]).length;
  out.pools[k]={ancien:{part:r.ancien.part,moyenne:r.ancien.moyenne,egalite:r.ancien.egalite},sansMobiles:{part:r.sansMobiles.part,moyenne:r.sansMobiles.moyenne,egalite:r.sansMobiles.egalite,changements:pct(diff("sansMobiles"),drafts.length)},tanks:{part:r.tanks.part,moyenne:r.tanks.moyenne,egalite:r.tanks.egalite,changements:pct(diff("tanks"),drafts.length)},categories:{part:r.categories.part,moyenne:r.categories.moyenne,egalite:r.categories.egalite,changements:pct(diff("categories"),drafts.length)}};});
// Déclenchement du seuil de 2.
const trig=f=>pct(drafts.filter(t=>f(t)>=2).length,drafts.length);
out.seuil2={ancien:trig(t=>t.filter(n=>/[tb]/.test(ROSTER[n])).length),sansMobiles:trig(t=>t.filter(n=>cat(n)!=="aucune").length),tanks:trig(t=>t.filter(n=>cat(n)==="tank").length),categories:trig(t=>t.filter(n=>cat(n)==="tank").length+Math.floor(t.filter(n=>cat(n)==="situationnelle").length/2))};
// Cas écrits d'avance : ce qu'une définition doit raisonnablement dire. Vérifiable, sans prétendre mesurer une victoire.
const cases=[["Trois vrais tanks",["Ornn","Sion","Maokai","Jinx","Thresh"],true],["Trois bruisers mobiles",["Yasuo","Irelia","Fiora","Jinx","Thresh"],false],["Deux tanks",["Ornn","Malphite","Ahri","Jinx","Lulu"],true],["Deux bruisers lents",["Darius","Garen","Ahri","Jinx","Lulu"],true],["Quatre bruisers lents",["Darius","Garen","Sett","Olaf","Lulu"],true],["Assassins",["Zed","Talon","Akali","Jinx","Thresh"],false]];
out.cas=cases.map(([nom,t,attendu])=>{const r={nom,attendu};Object.keys(models).forEach(m=>{applyProfile({role:"mid",pool:["Kog'Maw"]});setModel(m);const c=evaluatePick("Kog'Maw",compoOf(t),{mid:null,hasFront:true}).criteria.find(x=>x.key==="front");r[m]=!!c&&c.impact>0;setModel("ancien");});return r;});
// Fiches à vérifier : contradictions avec les classes publiées par Riot.
const ocheck=(fn)=>NAMES.filter(n=>CHAMPION_OFFICIAL.champions[n]&&!PROVISIONAL.includes(n)&&fn(n,ROSTER[n]||"",CHAMPION_TRAITS[n]||"",CHAMPION_OFFICIAL.champions[n]));
out.fiches={
  tankSansClasseTank:ocheck((n,r,t,o)=>/t/.test(r)&&!o.tags.includes("Tank")&&o.defense<6),
  classeTankSansFiche:ocheck((n,r,t,o)=>o.tags[0]==="Tank"&&!/t/.test(r)),
  assassinSansFiche:ocheck((n,r,t,o)=>o.tags[0]==="Assassin"&&!/a/.test(r)),
  longuePorteeCorpsACorps:ocheck((n,r,t,o)=>t.includes("l")&&o.range<400),
  immobileAssassinOuBruiser:ocheck((n,r,t,o)=>t.includes("i")&&(o.tags[0]==="Assassin"||o.tags[0]==="Fighter")),
  tueurDeTanksFaible:ocheck((n,r,t,o)=>t.includes("k")&&o.tags[0]==="Tank"),
  chasseurSupport:ocheck((n,r,t,o)=>t.includes("h")&&o.tags[0]==="Support"),
  sansTrait:ocheck((n,r,t,o)=>t.length<=1)
};
document.getElementById("out").textContent=JSON.stringify(out);
</script></body></html>
