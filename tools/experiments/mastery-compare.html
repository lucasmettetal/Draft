<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<!-- Compare les modèles A, B, C et D sur des historiques FICTIFS. Décrit un comportement : ne mesure aucune victoire. -->
<script src="draft-role-sheet.js"></script><script src="draft-role-rates-live.js"></script><script src="draft-champions.js"></script><script src="draft-champion-official.js"></script>
<script>localStorage.setItem("draftProfile",JSON.stringify({role:"mid",pool:["TF"]}));localStorage.setItem("draftPatch","16.22");</script>
<script src="draft-engine.js"></script><script src="draft-data.js"></script><script src="draft-coaching.js"></script><script src="draft-mastery.js"></script>
<script>
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(20261105),pct=(x,n)=>Math.round(1000*x/n)/10;
const NOW=Date.UTC(2026,10,5),DAY=86400000;
const ids={};NAMES.forEach(n=>{ids[rateId(n)]=n});
const live=window.ROLE_RATES_LIVE.champions,w=[0,1,2,3,4].map(r=>Object.keys(live).filter(k=>ids[k]).map(k=>[ids[k],live[k][r]]));
const weighted=l=>{const total=l.reduce((s,x)=>s+x[1],0);let v=rng()*total;for(const x of l){v-=x[1];if(v<0)return x[0];}return l[l.length-1][0];};
const drafts=[];while(drafts.length<2000){const t=w.map(weighted);if(new Set(t).size===5)drafts.push(t);}
// [champion, parties, victoires, jours depuis la dernière]
function hist(pos,list){const out=[];list.forEach(([c,n,wn,ago])=>{for(let i=0;i<n;i++)out.push({champ:c,pos,win:(i*7)%n<wn,time:NOW-(ago+i*Math.min(2,120/n))*DAY,k:5,d:4,a:6,enemies:[]});});return out;}
const P=(pos,list,o)=>familiarityProfile(hist(pos,list),Object.assign({now:NOW},o));
const fill=(pos,c)=>[c,120,60,5];
const CASES=[
 {nom:"Mid, débutant sans historique",role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"],profile:null,level:"beginner"},
 {nom:"Mid, joueur TF expérimenté",enemies:["Malzahar","Ornn","Rengar","Samira","Pyke"],role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"],profile:P("MIDDLE",[["TwistedFate",150,80,2],["Fizz",20,10,30],["Xerath",8,4,40],fill("MIDDLE","Annie")])},
 {nom:"Mid, 5 parties Kog'Maw à 80 %, 150 Fizz à 55 %",role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"],profile:P("MIDDLE",[["KogMaw",5,4,3],["Fizz",150,83,2],fill("MIDDLE","Annie")])},
 {nom:"Mid, Xerath en apprentissage",role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"],profile:P("MIDDLE",[["Fizz",60,30,4],["TwistedFate",40,20,6],["Xerath",3,1,1],fill("MIDDLE","Annie")]),learning:["Xerath"]},
 {nom:"Jungle, sans historique",role:"jungle",pool:["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"],profile:null},
 {nom:"Jungle, joueur Lee Sin ancien",enemies:["Darius","Syndra","Jinx","Thresh","Vi"],role:"jungle",pool:["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"],profile:P("JUNGLE",[["LeeSin",200,108,500],["Viego",15,8,10],fill("JUNGLE","Amumu")])},
 {nom:"Jungle, joueur Master Yi régulier",role:"jungle",pool:["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"],profile:P("JUNGLE",[["MasterYi",120,62,3],["Viego",30,15,8],["Chogath",6,3,20],fill("JUNGLE","Amumu")])},
 {nom:"Top, joueur simple (Darius, Garen)",role:"top",pool:["Darius","Garen","Malphite","Ornn","Camille"],profile:P("TOP",[["Darius",100,52,3],["Garen",50,25,9],fill("TOP","Sion")])},
 {nom:"ADC, joueur Vayne, note Riot élevée",enemies:["Ornn","Lee Sin","Ahri","Caitlyn","Thresh"],role:"adc",pool:["Jinx","Caitlyn","Kog'Maw","Ezreal","Vayne"],profile:P("BOTTOM",[["Vayne",180,95,2],["Ezreal",15,7,14],fill("BOTTOM","Ashe")])},
 {nom:"ADC, débutant déclaré sans historique",role:"adc",pool:["Jinx","Caitlyn","Kog'Maw","Ezreal","Vayne"],profile:null,level:"beginner"},
 {nom:"Support, historique égal partout",role:"support",pool:["Thresh","Leona","Soraka","Lulu","Lux"],profile:P("UTILITY",[["Thresh",40,20,4],["Leona",40,20,4],["Soraka",40,20,4],["Lulu",40,20,4],["Lux",40,20,4]])}
];
const out={stats:[],examples:[]};
CASES.forEach(c=>{applyProfile({role:c.role,pool:c.pool});const row={nom:c.nom,models:{}};["A","B","C","D"].forEach(m=>{const share={};let changed=0,move=0,tie=0;drafts.forEach(t=>{const o=personalizedRanking({enemies:t,model:m,profile:c.profile,level:c.level,learning:c.learning}),a=personalizedRanking({enemies:t,model:"A"});const head=o.ranking[0];const g=[head.name].concat(head.tiedInModel);g.forEach(n=>{share[n]=(share[n]||0)+1/g.length});if(g.length>1)tie++;if(head.name!==a.ranking[0].name&&!a.ranking[0].tiedWith.map(label).includes(head.name))changed++;});row.models[m]={part:Object.fromEntries(c.pool.map(p=>[label(pickId(p)),pct(share[label(pickId(p))]||0,drafts.length)])),egalite:pct(tie,drafts.length),changeHorsEgalite:pct(changed,drafts.length)};});out.stats.push(row);});
const DRAFTS=[["Malzahar","Ornn","Rengar","Samira","Pyke"],["Yasuo","Yone","Lee Sin","Jinx","Thresh"],["Ornn","Sion","Maokai","Jinx","Thresh"],["Sett","Vi"]];
CASES.forEach((c,i)=>{applyProfile({role:c.role,pool:c.pool});const enemies=c.enemies||DRAFTS[i%DRAFTS.length];const cmp=compareModels({enemies,profile:c.profile,level:c.level,learning:c.learning});
 const view=cmp.C.ranking.map(r=>({n:r.name,strat:+r.parts.strategic.toFixed(2),exp:+r.parts.experience.toFixed(2),res:+r.parts.result.toFixed(2),cpx:+r.parts.complexity.toFixed(2),tot:+r.total.toFixed(2),note:r.complexity.official.value,parties:r.familiarity?r.familiarity.count:0,eff:r.familiarity?+usefulExperience(r.familiarity).toFixed(1):0}));
 const adv=masteryAdvice({enemies,profile:c.profile,level:c.level||"beginner",learning:c.learning}),adv3=masteryAdvice({enemies,profile:c.profile,level:"advanced",learning:c.learning});
 out.examples.push({nom:c.nom,enemies,tops:{A:cmp.A.ranking[0].name,B:cmp.B.ranking[0].name,C:cmp.C.ranking[0].name,D:cmp.D.ranking[0].name},view,debutant:adv.items.map(x=>[x.title,x.text,x.limits]),avance:adv3.items.slice(0,3).map(x=>[x.title,x.text])});});
document.getElementById("out").textContent=JSON.stringify(out);
</script></body></html>
