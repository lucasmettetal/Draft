<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<!-- Compare A, T et l'ancien B sur des historiques FICTIFS, et prépare des exemples pour débutant. Ne mesure aucune victoire. -->
<script src="draft-role-sheet.js"></script><script src="draft-role-rates-live.js"></script><script src="draft-champions.js"></script><script src="draft-champion-official.js"></script>
<script>localStorage.setItem("draftProfile",JSON.stringify({role:"mid",pool:["TF"]}));localStorage.setItem("draftPatch","16.22");</script>
<script src="i18n/fr.js"></script><script src="draft-i18n.js"></script><script src="draft-engine.js"></script><script src="draft-data.js"></script><script src="draft-coaching.js"></script><script src="draft-mastery.js"></script>
<script>
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry(20261105),pc=(x,n)=>Math.round(1000*x/n)/10;
const NOW=Date.UTC(2026,10,5),DAY=86400000;
const ids={};NAMES.forEach(n=>{ids[rateId(n)]=n});
const live=window.ROLE_RATES_LIVE.champions,w=[0,1,2,3,4].map(r=>Object.keys(live).filter(k=>ids[k]).map(k=>[ids[k],live[k][r]]));
const weighted=l=>{const total=l.reduce((s,x)=>s+x[1],0);let v=rng()*total;for(const x of l){v-=x[1];if(v<0)return x[0];}return l[l.length-1][0];};
const drafts=[];while(drafts.length<2000){const t=w.map(weighted);if(new Set(t).size===5)drafts.push(t);}
// [champion, parties, victoires, jours depuis la dernière]
function hist(pos,list){const out=[];list.forEach(([c,n,wn,ago])=>{for(let i=0;i<n;i++)out.push({champ:c,pos,win:(i*7)%n<wn,time:NOW-(ago+i*Math.min(2,120/n))*DAY,k:5,d:4,a:6,enemies:[]});});return out;}
const P=(pos,list,o)=>familiarityProfile(hist(pos,list),Object.assign({now:NOW},o));
const fill=c=>[c,120,60,5];
const MIDPOOL=["TF","Fizz","Kog'Maw","Xerath"],JG=["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"],TOP=["Darius","Garen","Malphite","Ornn","Camille"],BOT=["Jinx","Caitlyn","Kog'Maw","Ezreal","Vayne"];
const PERSONAS=[
 {nom:"Top, 100 parties de Darius à 52 %",role:"top",pool:TOP,profile:P("TOP",[["Darius",100,52,3],["Garen",50,25,9],fill("Sion")])},
 {nom:"Mid, 150 parties de Twisted Fate",role:"mid",pool:MIDPOOL,profile:P("MIDDLE",[["TwistedFate",150,80,2],["Fizz",20,10,30],["Xerath",8,4,40],fill("Annie")])},
 {nom:"Jungle, 120 parties de Master Yi",role:"jungle",pool:JG,profile:P("JUNGLE",[["MasterYi",120,62,3],["Viego",30,15,8],["Chogath",6,3,20],fill("Amumu")])},
 {nom:"ADC, 180 parties de Vayne",role:"adc",pool:BOT,profile:P("BOTTOM",[["Vayne",180,95,2],["Ezreal",15,7,14],fill("Ashe")])},
];
const out={stats:[],examples:[]};
PERSONAS.forEach(c=>{applyProfile({role:c.role,pool:c.pool});const row={nom:c.nom,models:{}};["A","T","B"].forEach(m=>{const share={};let changed=0,tie=0,head=0;const fav=mostFamiliar(personalizedRanking({enemies:[],profile:c.profile}).strategicRanking);drafts.forEach(t=>{const o=personalizedRanking({enemies:t,model:m,experimental:m==="B",profile:c.profile}),a=personalizedRanking({enemies:t,model:"A"});share[o.ranking[0].name]=(share[o.ranking[0].name]||0)+1;if(o.ranking[0].name!==a.ranking[0].name)changed++;if(o.ranking[0].name!==a.ranking[0].name&&!a.ranking[0].tiedWith.includes(o.ranking[0].name))head++;});row.familier=fav?fav.row.name:null;row.models[m]={part:Object.fromEntries(c.pool.map(p=>[label(pickId(p)),pc(share[label(pickId(p))]||0,drafts.length)])),nomChange:pc(changed,drafts.length),horsEgalite:pc(head,drafts.length)};});out.stats.push(row);});
const EX=[
 {nom:"Débutant sans historique",role:"mid",pool:MIDPOOL,enemies:["Malzahar","Ornn","Rengar","Samira","Pyke"],profile:null},
 {nom:"Le plus joué est aussi le meilleur choix sur la draft",role:"mid",pool:MIDPOOL,enemies:["Malzahar","Ornn","Rengar","Samira","Pyke"],profile:P("MIDDLE",[["TwistedFate",150,80,2],["Fizz",20,10,30],fill("Annie")])},
 {nom:"Le plus joué n'est pas le choix de la draft (petit écart)",role:"top",pool:TOP,enemies:["Sett","Vi"],profile:P("TOP",[["Darius",100,52,3],["Garen",50,25,9],fill("Sion")])},
 {nom:"Le plus joué n'est pas le choix de la draft (grand écart)",role:"mid",pool:MIDPOOL,enemies:["Ornn","Sion","Maokai","Jinx","Thresh"],profile:P("MIDDLE",[["KogMaw",5,4,3],["Fizz",150,83,2],fill("Annie")])},
 {nom:"Vraie égalité, départagée par l'expérience",role:"jungle",pool:["Viego","Master Yi"],enemies:["Ornn","Sion","Maokai","Jinx","Thresh"],profile:P("JUNGLE",[["Viego",80,42,4],fill("Amumu")])},
 {nom:"Égalité sans écart d'expérience",role:"jungle",pool:["Viego","Master Yi"],enemies:["Ornn","Sion","Maokai","Jinx","Thresh"],profile:P("JUNGLE",[["Viego",22,11,4],["MasterYi",20,10,4],fill("Amumu")])},
 {nom:"Beaucoup de parties, mais résultats bas",role:"mid",pool:MIDPOOL,enemies:["Syndra","Ornn","Lee Sin","Jinx","Thresh"],profile:P("MIDDLE",[["Xerath",150,45,3],fill("Annie")])},
 {nom:"Champion exigeant en apprentissage",role:"mid",pool:MIDPOOL,enemies:["Sett","Vi"],pick:"Xerath",learning:["Xerath"],profile:P("MIDDLE",[["Xerath",3,1,1],["Fizz",40,20,5],fill("Annie")])},
 {nom:"Expérience ancienne",role:"jungle",pool:JG,enemies:["Darius","Syndra","Jinx","Thresh","Vi"],profile:P("JUNGLE",[["LeeSin",200,108,500],["Viego",15,8,10],fill("Amumu")])},
 {nom:"Draft incomplète et adversaire supposé",role:"adc",pool:BOT,enemies:["Ornn","Lee Sin"],profile:P("BOTTOM",[["Vayne",180,95,2],["Ezreal",15,7,14],fill("Ashe")])}
];
const pack=i=>[i.title,i.text,i.limits,i.basisLabel];
EX.forEach(e=>{applyProfile({role:e.role,pool:e.pool});const o=Object.assign({},e,{level:"beginner"});const c=playerChoices(o);out.examples.push({nom:e.nom,enemies:e.enemies,role:e.role,pool:e.pool,strategic:c.strategic,familiar:c.familiar,compromise:c.compromise.text,ranking:c.ranking,theory:c.theory.map(pack),experience:c.experience.map(pack),uncertainty:c.uncertainty.map(pack)});});
document.getElementById("out").textContent=JSON.stringify(out);
</script></body></html>
