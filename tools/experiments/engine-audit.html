<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<!-- Audit du moteur : aucune modification du code livré. Les variantes sont appliquées dans cette page seulement. Graine fixe. -->
<script src="draft-role-sheet.js"></script><script src="draft-role-rates-live.js"></script><script src="draft-champions.js"></script>
<script>localStorage.setItem("draftProfile",JSON.stringify({role:"jungle",pool:["Viego"]}));localStorage.setItem("draftPatch","16.22");</script>
<script src="draft-engine.js"></script><script src="draft-data.js"></script>
<script>
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry(20261105);const reseed=s=>{rng=mulberry(s)};const pick=l=>l[Math.floor(rng()*l.length)];
const N=2000,TOP_ROLES=[0,1,2,3,4];
const live=window.ROLE_RATES_LIVE&&window.ROLE_RATES_LIVE.champions;
const ids={};NAMES.forEach(n=>{ids[rateId(n)]=n});
const usable=n=>!PROVISIONAL.includes(n);
// Générateur A : le bouton Draft aléatoire. Uniforme parmi les champions à au moins 25 % dans le rôle.
function drawButton(exclude){const lists=TOP_ROLES.map(r=>NAMES.filter(n=>usable(n)&&!exclude.includes(n)&&roleEvidence(n).shares[r]>=.25));for(;;){const t=lists.map(pick);if(new Set(t).size===5)return t;}}
// Générateur B : fréquences observées dans les 1 000 parties calculées, rôle par rôle.
const weights=TOP_ROLES.map(r=>Object.keys(live).filter(k=>ids[k]).map(k=>[ids[k],live[k][r]]));
function weighted(list){const total=list.reduce((s,x)=>s+x[1],0);let v=rng()*total;for(const x of list){v-=x[1];if(v<0)return x[0];}return list[list.length-1][0];}
function drawReal(exclude){for(;;){const t=weights.map(l=>weighted(l));if(new Set(t).size===5&&!t.some(n=>exclude.includes(n)))return t;}}
const gens={bouton:drawButton,observe:drawReal};
function pct(x,n){return Math.round(1000*x/n)/10}
function run(role,pool,gen,opts={}){
  applyProfile({role,pool});
  const size=opts.size||5,wins={},sum={},crit={},n0=opts.n||N;let ties=0,tieTop=0,flat=0;
  const own=pool.map(label);
  for(let i=0;i<n0;i++){
    const full=gens[gen](own);for(let j=full.length-1;j>0;j--){const k=Math.floor(rng()*(j+1));[full[j],full[k]]=[full[k],full[j]];}const team=full.slice(0,size);
    const b=opponentBelief(team),r=analyze(team,identifiedOpponent(team),true,beliefScenarios(b)).ranking;
    if(!r.length)continue;
    const top=r[0];wins[top.pick]=(wins[top.pick]||0)+1;
    r.forEach(p=>{sum[p.pick]=(sum[p.pick]||0)+p.score;p.criteria.forEach(c=>{const k=p.pick+"|"+c.key;crit[k]=(crit[k]||0)+c.impact;});});
    if(r[1]&&Math.abs(r[0].score-r[1].score)<1e-9){ties++;tieTop++;}
    if(Math.abs(r[0].score-r[r.length-1].score)<1e-9)flat++;
  }
  return {gen,size,wins:Object.fromEntries(Object.entries(wins).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[label(k),pct(v,n0)])),mean:Object.fromEntries(Object.entries(sum).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[label(k),+(v/n0).toFixed(2)])),ties:pct(ties,n0),flat:pct(flat,n0),crit:Object.fromEntries(pool.map(p=>[p,Object.fromEntries(Object.entries(crit).filter(([k])=>k.startsWith(pickId(p)+"|")).map(([k,v])=>[k.split("|")[1],+(v/n0).toFixed(2)]))]))};
}
const out={};
const JUNGLE=["Cho'Gath","Viego","Master Yi","Briar","Lee Sin"];
reseed(1);out.choPoolBouton=run("jungle",JUNGLE,"bouton");
reseed(1);out.choPoolObserve=run("jungle",JUNGLE,"observe");
reseed(1);out.choPoolPartiel=run("jungle",JUNGLE,"observe",{size:3});
// Ordre de la liste : mêmes champions, ordre inversé.
reseed(1);out.choOrdreInverse=run("jungle",JUNGLE.slice().reverse(),"observe");
reseed(1);out.sansCho=run("jungle",JUNGLE.slice(1),"observe");
reseed(1);out.sansChoInverse=run("jungle",JUNGLE.slice(1).reverse(),"observe");
// Cho'Gath seul contre chaque jungler courant.
applyProfile({role:"jungle",pool:["Viego"]});
const commons=championsForRole("jungle").filter(n=>n!=="Cho'Gath").slice(0,14);
reseed(2);out.duels=commons.map(o=>{const r=run("jungle",["Cho'Gath",o],"observe",{n:500});return {adverse:o,trait:CHAMPION_TRAITS[o],cho:r.wins["Cho'Gath"]||0,tie:r.ties}});
// Score moyen de chaque champion du rôle, sur les mêmes drafts : combien sont capables d'être conseillés ?
function ladder(role,seed){applyProfile({role,pool:["Viego"]});reseed(seed);const names=NAMES.filter(n=>usable(n)&&roleEvidence(n).shares[ROLE_ORDER.indexOf(role)]>=.25);const teams=[];for(let i=0;i<600;i++)teams.push(drawReal([]));
  const score={},nz={};names.forEach(n=>{score[n]=0;nz[n]=0;});teams.forEach(t=>{const c=compoOf(t),mid=guessMid(t);names.forEach(n=>{if(t.includes(n))return;const e=evaluatePick(pickId(n),c,{mid,hasFront:true});score[n]+=e.score;if(e.score!==0)nz[n]++;});});
  const rows=names.map(n=>({n,s:+(score[n]/600).toFixed(2),t:CHAMPION_TRAITS[n],actif:pct(nz[n],600)})).sort((a,b)=>b.s-a.s);
  return {nb:rows.length,haut:rows.slice(0,8),bas:rows.slice(-8),toujoursZero:rows.filter(r=>r.actif===0).map(r=>r.n+"["+r.t+"]")};}
out.echelleJungle=ladder("jungle",3);out.echelleTop=ladder("top",4);out.echelleSupport=ladder("support",5);
// Poids d'un trait : moyenne des champions qui l'ont ou non, sur tous les rôles.
applyProfile({role:"mid",pool:["Viego"]});reseed(6);
const tm=[];for(let i=0;i<600;i++)tm.push(drawReal([]));
const allScore={};NAMES.filter(usable).forEach(n=>{let s=0;tm.forEach(t=>{const c=compoOf(t);s+=evaluatePick(pickId(n),c,{mid:null,hasFront:true}).score});allScore[n]=s/600;});
out.traits=[..."hkdipqolgrnwetcE"].map(t=>{const y=Object.keys(allScore).filter(n=>CHAMPION_TRAITS[n].includes(t)),z=Object.keys(allScore).filter(n=>!CHAMPION_TRAITS[n].includes(t));const m=l=>l.reduce((s,n)=>s+allScore[n],0)/Math.max(1,l.length);return {t,avec:y.length,moyAvec:+m(y).toFixed(2),moySans:+m(z).toFixed(2)}}).sort((a,b)=>b.moyAvec-a.moyAvec);
// Conditions des drafts : le bonus « tanks » se déclenche-t-il souvent ?
function conditions(gen){reseed(7);let f2=0,f3=0,c2=0,d2=0,fr=[];const n=2000;for(let i=0;i<n;i++){const c=compoOf(gens[gen]([]));if(c.front.length>=2)f2++;if(c.front.length>=3)f3++;if(c.carries.length>=2)c2++;if(c.divers.length>=2)d2++;}return {frontline2:pct(f2,n),frontline3:pct(f3,n),cibles2:pct(c2,n),plongeurs2:pct(d2,n)}}
out.conditions={bouton:conditions("bouton"),observe:conditions("observe")};
const frontline=NAMES.filter(n=>/[tb]/.test(ROSTER[n]));
out.profilsRoster={total:NAMES.length,frontB:NAMES.filter(n=>/b/.test(ROSTER[n])).length,frontT:NAMES.filter(n=>/t/.test(ROSTER[n])).length,frontline:frontline.length,aussiPlongeurs:frontline.filter(n=>/a/.test(ROSTER[n])).length,aussiMobiles:frontline.filter(n=>/m/.test(ROSTER[n])).length,exemples:frontline.filter(n=>/m/.test(ROSTER[n])).slice(0,12)};
// Variante : seuls les vrais tanks comptent comme frontline pour ce bonus.
out.solidesParDraft=(()=>{reseed(7);let a=0,b=0;for(let i=0;i<2000;i++){const t=drawReal([]);const f=t.filter(n=>/[tb]/.test(ROSTER[n]));if(f.length>=2)a++;if(t.filter(n=>/t/.test(ROSTER[n])).length>=2)b++;}return {frontline2:pct(a,2000),tanks2:pct(b,2000)}})();
// Variantes, seulement dans cette page : quelle cause explique la fréquence ?
const original=RULES.front;
RULES.front=(p,c)=>{const r=original(p,c);return r&&r[0]>0&&!hasTrait(p,"i")?null:r};
reseed(1);out.varianteSansBonusFront=run("jungle",JUNGLE,"observe");
RULES.front=(p,c)=>{const r=original(p,c);return r&&r[0]>0&&!hasTrait(p,"i")?[r[0]/2,r[1]]:r};
reseed(1);out.varianteBonusFrontMoitie=run("jungle",JUNGLE,"observe");
const compoOriginal=compoOf;
RULES.front=(p,c)=>{const tanks=c.front.filter(n=>/t/.test(ROSTER[n]));return original(p,Object.assign({},c,{front:tanks}));};
reseed(1);out.varianteTanksSeulement=run("jungle",JUNGLE,"observe");
RULES.front=original;
// Couverture du critère de matchup, le plus lourd du moteur.
applyProfile({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]});reseed(8);
let covered=0,nomid=0;for(let i=0;i<1000;i++){const t=drawReal([]);const mid=guessMid(t);if(!mid){nomid++;continue;}if(matchupOf(mid))covered++;}
out.couvertureMid={adversairesTableau:MATCHUPS.length,deduitDansTableau:pct(covered,1000),sansAdversaire:pct(nomid,1000)};
reseed(9);out.profilOrigine=run("mid",["TF","Fizz","Kog'Maw","Xerath"],"observe");
// Incertitude : les hypothèses changent-elles le conseil ?
applyProfile({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]});reseed(10);let several=0,changed=0;for(let i=0;i<2000;i++){const t=drawReal([]);const b=opponentBelief(t),sc=beliefScenarios(b);if(sc.length<2)continue;several++;const g=guessMid(t);if(analyze(t,g,true).ranking[0].pick!==analyze(t,g,true,sc).ranking[0].pick)changed++;}
out.incertitude={plusieursHypotheses:pct(several,2000),conseilModifie:pct(changed,2000)};
document.getElementById("out").textContent=JSON.stringify(out);
</script></body></html>
