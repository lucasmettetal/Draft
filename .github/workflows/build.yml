name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        shell: powershell
        run: .\build.ps1
      - name: Tests natifs
        shell: powershell
        run: |
          $p = Start-Process .\dist\DraftMid-Portable.exe -ArgumentList '--selftest','--data',"$env:RUNNER_TEMP\dm",'--out',"$env:RUNNER_TEMP\selftest.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: DraftMid
          path: dist/*.exe
