name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        shell: powershell
        run: .\build.ps1
      - name: Tests natifs
        shell: powershell
        run: |
          $p = Start-Process .\dist\DRAFT-Portable.exe -ArgumentList '--selftest','--data',"$env:RUNNER_TEMP\dm",'--out',"$env:RUNNER_TEMP\selftest.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          exit $p.ExitCode
      - name: Publier l'exécutable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\DRAFT-Portable.exe dist\DRAFT-Setup.exe --title "DRAFT $env:GITHUB_REF_NAME" --notes "Outil non approuvé par Riot Games. Compilé et testé par GitHub Actions."
