name: Build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
# Lecture seule par défaut : seule la publication d'une release reçoit le droit d'écrire.
permissions:
  contents: read
jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compiler
        shell: powershell
        run: .\build.ps1
      - name: Tests natifs
        shell: powershell
        run: |
          $p = Start-Process .\dist\DRAFT-Portable.exe -ArgumentList '--selftest','--data',"$env:RUNNER_TEMP\dm",'--out',"$env:RUNNER_TEMP\selftest.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          exit $p.ExitCode
      # Catalogues de langue : forme JSON stricte, clés, variables, pluriels, longueurs (docs/i18n/FORMAT-CATALOGUE.md).
      # I18N-1 : chaque clé citée par la page existe, chaque {variable} est fournie, aucune clé orpheline ; messages de sécurité présents.
      # I18N-2 : l'anglais a exactement les clés du français, les mêmes {variables}, ses pluriels, aucune valeur vide.
      - name: Catalogues de langue
        shell: pwsh
        run: .\tools\i18n\check-catalogs.ps1 -Reference web\i18n\fr.js -Target web\i18n\en.js -Code . -Security tools\i18n\securite.json
      # Aucun texte visible écrit en dur dans la page (web/) ni dans le programme (src/, I18N-3), hors exclusions justifiées
      # (tools/i18n/exclusions.json). Lecture seule.
      - name: Textes en dur de la page et du programme
        shell: pwsh
        run: |
          .\tools\i18n\detect-hardcoded.ps1 -SelfTest
          if ($LASTEXITCODE) { exit 1 }
          .\tools\i18n\detect-hardcoded.ps1 -Max 0
      # Scénarios SYNTHÉTIQUES, jeu de développement seulement, contre l'instantané de référence. Hors ligne.
      # Chrome fait partie de l'image windows-latest ; s'il manque, le script s'arrête avec « Chrome introuvable ».
      - name: Banc d'évaluation du moteur
        shell: pwsh
        run: .\tools\run-engine-eval.ps1 -Work "$env:RUNNER_TEMP\engine-eval" -Generer
  release:
    # Un tag v* publie une release. « gh release create » échoue si elle existe déjà : une release publiée n'est jamais remplacée.
    # Les exécutables doivent ensuite être signés hors de GitHub (tools/sign-release.ps1) : la clé n'est jamais ici.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compiler
        shell: powershell
        run: .\build.ps1
      - name: Tests natifs
        shell: powershell
        run: |
          $p = Start-Process .\dist\DRAFT-Portable.exe -ArgumentList '--selftest','--data',"$env:RUNNER_TEMP\dm",'--out',"$env:RUNNER_TEMP\selftest.txt" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\selftest.txt"
          exit $p.ExitCode
      # Tag avec « - » (v3.0.0-beta.1) : préversion. Release marquée --prerelease et --latest=false, exe portable seul, notes lues
      # dans docs/release/NOTES-<version>.md. La version de l'exe (AssemblyInformationalVersion) doit être celle du tag : sinon
      # l'exe serait l'édition stable, qui partage les données de la 2.x. GitHub ne renvoie jamais une préversion à /releases/latest :
      # les 2.16.x ne la voient pas. Tag sans « - » : exactement la commande d'avant.
      # Le script est lu par Windows PowerShell 5.1 sans BOM : un accent écrit ici arrive abîmé (« approuvÃ© » dans les notes de
      # v2.16.2). La branche préversion n'a donc que de l'ASCII ; ses notes, accentuées, viennent d'un fichier lu par gh en UTF-8.
      - name: Publier l'exécutable
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $notes = "docs\release\NOTES-$version.md"
            $built = (Get-Item dist\DRAFT-Portable.exe).VersionInfo.ProductVersion
            if ($built -ne $version) { throw "Version de l'exe ($built) <> tag ($version) : rien n'est publie." }
            if (-not (Test-Path $notes)) { throw "Notes de version absentes : $notes" }
            gh release create $env:GITHUB_REF_NAME dist\DRAFT-Portable.exe --repo $env:GITHUB_REPOSITORY --title "DRAFT $env:GITHUB_REF_NAME" --notes-file $notes --prerelease --latest=false
          } else {
            gh release create $env:GITHUB_REF_NAME dist\DRAFT-Portable.exe dist\DRAFT-Setup.exe --repo $env:GITHUB_REPOSITORY --title "DRAFT $env:GITHUB_REF_NAME" --notes "Outil non approuvé par Riot Games. Compilé et testé par GitHub Actions. Signature DRAFT jointe séparément."
          }
