   {prepare(MID,null,null);const x=await openHost(lang,"right",256,608);hostMsg(x,{});x.$.dispatchDraft({type:"session-start"});hostMsg(x,{assignedRole:"support"});await settle();

   {const K=L+"trois pages : ",bc=(xs,extra)=>xs.forEach(x=>hostMsg(x,extra)),role=x=>x.$.myRole()+"|"+x.w.eval("PICKS.join()"),

   {prepare(MID,null,null);const x=await openHost(lang,"right",256,608);hostMsg(x,{});x.$.dispatchDraft({type:"session-start"});await settle();const st=q(x,'[data-test="role-state"]');
