<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Tests de rendu DraftMid</title><!-- Lance par tools/run-layout-tests.ps1 : mesure le rendu reel de chaque panneau, taille et etat. --><style>body{margin:0;background:#333;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}iframe{border:0;background:#000}</style></head><body><pre id="out" style="display:none"></pre><script>
const q=new URLSearchParams(location.search);const STATE=q.get('state')||'empty';const SET=q.get('set')||'all';const SHOT=q.get('shot')==='1';
const SIZES={left:[[230,576],[256,576],[280,720],[320,720],[360,720],[400,720],[320,540],[320,420]],right:[[230,576],[256,576],[280,720],[320,720],[360,720],[400,720],[320,540],[320,420]],compact:[[252,576],[282,576],[280,720],[320,720],[360,720],[400,720],[360,1030],[320,420]],full:[[1280,720],[1366,768],[1920,1080],[1024,640],[800,600]]};
const LONG='Nom De Champion Vraiment Extrêmement Long';
const STATES={
empty:w=>{},one:w=>{w.addEnemy('Aurelion Sol')},partial:w=>{['Renata Glasc','Miss Fortune','Ahri'].forEach(w.addEnemy)},
full:w=>{['Aurelion Sol','Miss Fortune','Renata Glasc','Tahm Kench','Master Yi'].forEach(w.addEnemy)},
midunknown:w=>{['Sett','Vi'].forEach(w.addEnemy)},uncertain:w=>{['Yasuo','Yone','Lee Sin','Jinx','Thresh'].forEach(w.addEnemy)},close:w=>{w.addEnemy('Ahri')},
excluded:w=>{w.savePrefs({excluded:['Fizz']});['Ahri','Ornn'].forEach(w.addEnemy)},
none:w=>{w.savePrefs({excluded:['TF','Fizz',"Kog'Maw",'Xerath']})},
picked:w=>{['Ahri','Ornn','Jinx'].forEach(w.addEnemy);w.choosePick(w.V.shown)},
history:w=>{const a=[];for(let i=0;i<300;i++)a.push({id:1e12+i,date:new Date(1.7e12+i*864e5).toISOString(),suggested:'Fizz',close:false,picked:['Fizz','TF',"Kog'Maw",'Xerath'][i%4],enemies:['Ahri','Ornn','Vi','Jinx','Lulu'],mid:'Ahri',result:i%3?'win':'loss'});w.saveJournal(a);['Ahri','Ornn'].forEach(w.addEnemy);},
extreme:w=>{['Aurelion Sol','Miss Fortune','Renata Glasc','Tahm Kench',LONG].forEach(w.addEnemy);},
};
function measure(w){const d=w.document,vw=w.innerWidth,vh=w.innerHeight,res=[];const add=(k,el,x)=>res.push(k+' '+sel(el)+(x?' '+x:''));
const sel=e=>{let c=(e.getAttribute&&e.getAttribute('class'))||'';return e.tagName.toLowerCase()+(c?'.'+c.trim().split(/\s+/).slice(0,2).join('.'):'')};
const skip=e=>(e.closest('details:not([open])')&&!e.closest('summary'))||e.closest('.sr,.rank-glow,.rank-ring,.role-flash,.sugg-hl,.tab-line,.portrait .init,.meter-delta')||[e,e.closest('.to-mid')].some(x=>x&&w.getComputedStyle(x).opacity==='0');
if(d.documentElement.scrollWidth>vw+1)res.push('PAGE-X '+(d.documentElement.scrollWidth-vw)+'px');
const modal=d.querySelector('.settings');const texts=[];const tw=d.createTreeWalker(d.body,w.NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){if(!n.nodeValue.trim()||skip(n.parentElement)||['SCRIPT','STYLE','OPTION'].includes(n.parentElement.tagName))continue;const cs=w.getComputedStyle(n.parentElement);if(cs.visibility==='hidden'||cs.display==='none')continue;const r=d.createRange();r.selectNodeContents(n);if(modal&&!modal.contains(n.parentElement))continue;const hid=[];for(let a=n.parentElement;a&&a!==d.body;a=a.parentElement){const c=w.getComputedStyle(a);if(c.textOverflow==='ellipsis'||c.webkitLineClamp!=='none'&&c.webkitLineClamp||['auto','scroll'].includes(c.overflowY))hid.push(a.getBoundingClientRect())}for(const b0 of r.getClientRects()){let b={left:b0.left,right:b0.right,top:b0.top,bottom:b0.bottom};for(const h of hid){b.left=Math.max(b.left,h.left);b.right=Math.min(b.right,h.right);b.top=Math.max(b.top,h.top);b.bottom=Math.min(b.bottom,h.bottom)}if(b.right-b.left>0&&b.bottom-b.top>0)texts.push({el:n.parentElement,b,t:n.nodeValue.trim().slice(0,22)})}}
const scrollY=e=>{for(let a=e.parentElement;a;a=a.parentElement){const o=w.getComputedStyle(a).overflowY;if((o==='auto'||o==='scroll')&&a.scrollHeight>a.clientHeight+1)return a}if(d.documentElement.scrollHeight>vh+1&&w.getComputedStyle(d.body).overflowY!=='hidden')return d.documentElement;return null};
const clip=e=>{for(let a=e.parentElement;a&&a!==d.documentElement;a=a.parentElement){const c=w.getComputedStyle(a);if(c.overflowX!=='visible'||c.overflowY!=='visible')return a}return null};
for(const T of texts){const {el,b}=T;
if(b.right>vw+1||b.left<-1)add('TEXTE-HORS-CADRE',el,'"'+T.t+'"');
if(!scrollY(el)&&b.bottom>vh+1)add('TEXTE-COUPE-BAS',el,'"'+T.t+'"');
const c=clip(el);if(c){const cb=c.getBoundingClientRect();const isSc=['auto','scroll'].includes(w.getComputedStyle(c).overflowY);if(b.right>cb.right+1||b.left<cb.left-1)add('TEXTE-CLIPPE-X',el,'par '+sel(c)+' "'+T.t+'"');if(!isSc&&(b.bottom>cb.bottom+1||b.top<cb.top-1))add('TEXTE-CLIPPE-Y',el,'par '+sel(c)+' "'+T.t+'"')}}
for(const e of d.body.querySelectorAll('*')){if(skip(e))continue;const r=e.getBoundingClientRect();if(!r.width||!r.height)continue;const cs=w.getComputedStyle(e);
if(cs.overflowX==='hidden'&&e.scrollWidth>e.clientWidth+1&&e.textContent.trim()&&!e.matches('.portrait,.splash-stack'))add(cs.textOverflow==='ellipsis'?'ELLIPSE':'COUPE-X',e,'"'+e.textContent.trim().slice(0,22)+'"');
if(cs.overflowX==='auto'&&e.scrollWidth>e.clientWidth+1){const lim=e.getBoundingClientRect().right;const cul=[...e.querySelectorAll('*')].filter(x=>x.getBoundingClientRect().right>lim+1).map(sel).slice(-3).join(' > ');add('DEFILE-X',e,(e.scrollWidth-e.clientWidth)+'px '+cul)}
if(cs.webkitLineClamp!=='none'&&cs.webkitLineClamp&&e.scrollHeight>e.clientHeight+1)add('CLAMP',e,'"'+e.textContent.trim().slice(0,22)+'"');
if(e.matches('button,a,input:not([type=checkbox]),select,summary')&&!e.matches('.role-hit')&&(r.width<24||r.height<24))add('CIBLE<24',e,Math.round(r.width)+'x'+Math.round(r.height));
if(r.right>vw+1&&!scrollY(e)&&!clip(e))add('BOITE-HORS-CADRE',e,Math.round(r.right-vw)+'px')}
for(let i=0;i<texts.length;i++)for(let j=i+1;j<texts.length;j++){const A=texts[i],B=texts[j];if(A.el===B.el||A.el.contains(B.el)||B.el.contains(A.el))continue;if(A.el.closest('.p-actions')||B.el.closest('.p-actions'))continue;const x=Math.min(A.b.right,B.b.right)-Math.max(A.b.left,B.b.left),y=Math.min(A.b.bottom,B.b.bottom)-Math.max(A.b.top,B.b.top);if(x>2&&y>3)add('TEXTES-SE-CHEVAUCHENT',A.el,'"'+A.t+'" / "'+B.t+'"')}
for(const t of texts){for(const b of d.querySelectorAll('button:not(.role-hit),.mini')){if(modal&&!modal.contains(b)||b.closest('.p-actions')||b.contains(t.el)||!b.getBoundingClientRect().width||w.getComputedStyle(b).opacity==='0')continue;if(t.el.closest('.p-actions'))continue;const r=b.getBoundingClientRect();const x=Math.min(t.b.right,r.right)-Math.max(t.b.left,r.left),y=Math.min(t.b.bottom,r.bottom)-Math.max(t.b.top,r.top);if(x>2&&y>3)add('BOUTON-SUR-TEXTE',b,'"'+t.t+'"')}}
const fold={};for(const s of ['.p-name','.p-alt','.p-reasons li','.p-actions .cta','.champ-name','.stage .cta']){const e=d.querySelector(s);if(e){const r=e.getBoundingClientRect();fold[s]=Math.round(r.bottom)<=vh?'ok':'SOUS-PLI('+Math.round(r.bottom-vh)+')'}}
const rects=q.get('rects')?q.get('rects').split(',').flatMap(s=>[...d.querySelectorAll(s)].slice(0,6).map(e=>{const r=e.getBoundingClientRect();return s+' x='+Math.round(r.left)+'..'+Math.round(r.right)+' y='+Math.round(r.top)+'..'+Math.round(r.bottom)+' tr='+w.getComputedStyle(e).transform+' ov='+w.getComputedStyle(e).overflowY})):null;
return {issues:[...new Set(res)].sort(),fold,rects}}
const wait=m=>new Promise(r=>setTimeout(r,m));
const prepare=async(f)=>{await new Promise(r=>f.onload=r);await wait(500);const w=f.contentWindow;if(q.get('host')){w.eval("Object.assign(hostState,{available:true,lcuConfirmed:true,lcuEnabled:"+(q.get('host')==='on')+",lcuStatus:'"+(q.get('host')==='on'?'connected':'off')+"',hotkey:true,autoDraft:true,follow:true,phase:'Client ouvert, hors draft',placement:'Panneaux placés de chaque côté du client.'});rerender();")}w.eval("window.addEnemy=addEnemy;window.savePrefs=savePrefs;window.choosePick=choosePick;window.saveJournal=saveJournal;window.ROSTER=ROSTER;window.FULL=FULL;window.rr=()=>rerender();Object.defineProperty(window,'V',{get:()=>V,configurable:true});");if(STATE==='extreme'){w.ROSTER[LONG]='sace';w.FULL.TF='Twisted Fate Le Maître Des Cartes Du Destin'}STATES[STATE](w);await wait(900);if(STATE==='extreme'){w.V.reasons=['Une raison très longue qui ne devrait jamais casser la mise en page même lorsqu’elle contient un motSansEspaceExtraordinairementLongQuiNePeutPasSeCouperNaturellementDansLePanneau','Seconde raison assez longue pour vérifier le retour à la ligne dans les conteneurs étroits'];w.rr();await wait(400)}if(q.get('tabclick')){const b=f.contentDocument.querySelector('[data-tab="'+q.get('tabclick')+'"]');if(b){b.click();await wait(600)}}if(q.get('open')){f.contentDocument.querySelectorAll('details').forEach(x=>x.open=true);await wait(200)}await wait(+(q.get('settle')||(STATE==='extreme'?1800:300)))};
const makeFrame=(k,W,H)=>{const f=document.createElement('iframe');f.width=W;f.height=H;f.src='index.html?panel='+k+(q.get('tab')?'&tab='+q.get('tab'):'');f.dataset.k=k+' '+W+'x'+H;document.body.appendChild(f);return f};
(async()=>{const o={state:STATE,frames:{}};
for(const k of Object.keys(SIZES)){if(SET!=='all'&&SET!==k)continue;
 if(SHOT){for(const [W,H] of SIZES[k]){if(k==='full'?W!==+(q.get('w')||1280):H!==+(q.get('h')||720))continue;localStorage.clear();localStorage.setItem("draftProfile",JSON.stringify(q.get("profile")==="none"?null:q.get("profile")==="support"?{role:"support",pool:["Renata Glasc","Tahm Kench","Blitzcrank","Soraka","Aurelion Sol"]}:{role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]}));const f=makeFrame(k,W,H);await prepare(f)}continue}
 for(const [W,H] of SIZES[k]){localStorage.clear();localStorage.setItem("draftProfile",JSON.stringify(q.get("profile")==="none"?null:q.get("profile")==="support"?{role:"support",pool:["Renata Glasc","Tahm Kench","Blitzcrank","Soraka","Aurelion Sol"]}:{role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]}));const f=makeFrame(k,W,H);await prepare(f);/* Pendant --dump-dom, aucune image n'est produite : un reclassement reste figé à son point de départ. On mesure sa position finale. */if(q.get('frozen'))f.contentDocument.querySelectorAll('button.rank').forEach(b=>{b.style.transform='none'});try{o.frames[f.dataset.k]=measure(f.contentWindow)}catch(e){o.frames[f.dataset.k]={err:e.message}}f.remove()}}
document.getElementById('out').textContent=JSON.stringify(o);document.title='done'})();
</script></body></html>
