<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Tests UX-5</title></head><body><pre id="out"></pre>
<!-- UX-5 : Mes statistiques (vue d'ensemble, journal, historique Riot), états vides et erreurs, collecte dite. Vraie page, données fictives. -->
<!-- Lancement : tools\run-v215-tests.ps1 -Page draft-ux5-tests.html -Work <dossier>. Page de test : exclue de la compilation. -->
<script>
const res={ok:0,ko:[],notes:{}};const t=(ok,text)=>{if(ok)res.ok++;else res.ko.push(text);};
const wait=m=>new Promise(r=>setTimeout(r,m));
const settle=()=>wait(150);
const text=e=>e?e.textContent.replace(/\s+/g," ").trim():"";
async function load(journal){localStorage.clear();localStorage.setItem("draftProfile",JSON.stringify({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]}));localStorage.setItem("draftPatch","16.22");if(journal)localStorage.setItem("draftJournal",JSON.stringify(journal));const f=document.createElement("iframe");f.width=1366;f.height=900;f.src="index.html?x=1&view=stats";document.body.appendChild(f);await new Promise(r=>f.onload=r);await wait(400);const w=f.contentWindow;return {f,w,d:f.contentDocument,ev:c=>w.eval(c)};}
const q=(x,s)=>x.d.querySelector(`[data-test="${s}"]`);
const JOURNAL=[1,2,3,4,5].map(i=>({id:i,date:"2026-11-0"+i+"T10:00:00Z",suggested:"Fizz",picked:i===5?"TF":"Fizz",close:false,enemies:["Ahri"],mid:"Ahri",result:i===3?"loss":i===4?null:"win",engine:"x"}));
const HIST={generated:"2026-11-08T10:00:00Z",accounts:["Test#TEST"],rows:[...Array(12)].map((_,i)=>({id:"H"+i,acct:"Test#TEST",time:Date.now()-i*864e5,patch:"16.22",sec:1800,champ:i<8?"Fizz":"Ahri",pos:i<10?"MIDDLE":"TOP",win:i%3!==0,k:5,d:4,a:6,mid:"",enemies:[]}))};

(async()=>{
// États vides : rien d'importé, rien de noté.
let x=await load(null);
t(!!q(x,"stats-tab-overview")&&!!q(x,"stats-tab-journal")&&!!q(x,"stats-tab-history"),"trois onglets : vue d'ensemble, journal, historique");
t(/Aucune partie notée pour l'instant/.test(text(q(x,"stats-journal"))),"journal vide : consigne claire");
t(/Aucun historique importé/.test(text(q(x,"stats-history-summary"))),"historique vide : consigne claire");
t(/Lu : tes parties classées solo\/duo\. Gardé sur ce PC/.test(text(q(x,"stats-collect"))),"collecte dite : ce qui est lu et gardé");
t(/une seule fois pour l'historique, les rôles et les matchups\. Elle n'est jamais enregistrée\./.test(text(q(x,"stats-history"))),"clé Riot : une seule saisie, jamais enregistrée");
t(/L'import se fait dans l'application DRAFT\./.test(text(q(x,"stats-history")))&&!q(x,"stats-import-history"),"hors application : pas de bouton d'import, consigne");
x.ev("Object.assign(hostState,{available:true,historyStatus:'Clé Riot refusée : vérifie-la sur developer.riotgames.com. 0 partie ajoutée, 0 au total.'});rerender()");await settle();
t(!!q(x,"stats-import-history")&&text(q(x,"stats-import-history"))==="Importer mon historique Riot","application : bouton d'import dans Mes statistiques");
t(/Clé Riot refusée/.test(text(q(x,"stats-history-status")))&&q(x,"stats-history-status").getAttribute("role")==="status","erreur d'import affichée, annoncée au lecteur d'écran");
x.f.remove();
// Données : journal et historique.
x=await load(JOURNAL);x.w.DRAFT_HISTORY=HIST;x.ev("rerender()");await settle();
const k=id=>[...q(x,id).children].map(text).join(" ");
t(/^Drafts notées 5$/.test(k("kpi-drafts")),"chiffre : 5 drafts notées ("+k("kpi-drafts")+")");
t(/^Victoires 3 sur 4 parties terminées$/.test(k("kpi-wins")),"chiffre : 3 victoires sur 4 parties terminées ("+k("kpi-wins")+")");
t(/^Conseil suivi 4 sur 5$/.test(k("kpi-followed")),"chiffre : conseil suivi 4 sur 5 ("+k("kpi-followed")+")");
t(/^Historique Riot 12 12 parties, 08\/11\/2026$/.test(k("kpi-history")),"chiffre : historique 12 parties et date ("+k("kpi-history")+")");
t(/12 parties importées, le 08\/11\/2026/.test(text(q(x,"stats-history-summary"))),"historique : nombre et date");
t(/Le plus joué en Mid/.test(text(q(x,"stats-history")))&&/Fizz/.test(text(q(x,"stats-history"))),"historique : le plus joué au rôle joué");
const rows=[...x.d.querySelectorAll('[data-test="stats-recent"] tbody tr')];t(rows.length===5&&/Autre choix/.test(text(rows[0]))&&/Suivi/.test(text(rows[1])),"dernières drafts : 5 lignes, conseil suivi ou non");
t(/En attente/.test(text(q(x,"stats-recent"))),"dernières drafts : partie sans résultat « En attente »");
q(x,"stats-all-journal").click();await settle();t(!!q(x,"stats-journal-full")&&!!x.d.querySelector('[data-test="import-journal"]'),"Voir tout le journal : journal complet et import d'un ancien fichier");
q(x,"stats-tab-history").click();await settle();t(/Parties par rôle/.test(text(x.d.body))&&!!q(x,"stats-old"),"onglet historique : parties par rôle et anciens imports");
t(!/RGAPI|puuid|Test#TEST/.test(x.d.body.innerText),"aucune clé ni identifiant de compte affiché");
x.f.remove();
// DA B+ : seuil de 10 parties, période, repère des 50 % (données fictives : 12 parties d'un champion, 2 d'un autre).
const BIG=[...Array(14)].map((_,i)=>({id:100+i,date:"2026-11-"+String(i+1).padStart(2,"0")+"T10:00:00Z",suggested:"Fizz",picked:i<12?"Fizz":"TF",close:false,enemies:["Ahri"],mid:"Ahri",result:i%3===2?"loss":"win",engine:"x"}));
x=await load(BIG);await wait(600);
{const bars=[...x.d.querySelectorAll('[data-test="stats-journal"] .winbar')];const big=bars.find(b=>/Fizz/.test(text(b))),few=bars.find(b=>/Twisted Fate/.test(text(b)));
t(!!big&&!big.classList.contains("few")&&!!big.querySelector(".winbar-track"),"12 parties : barre de victoires");
t(!!few&&!!few.querySelector(".notches")&&!few.querySelector(".winbar-track"),"2 parties : jauge de crans, jamais de barre ni de pourcentage");
const tr=big&&big.querySelector(".winbar-track"),mk=big&&big.querySelector(".winbar-mid");
if(tr&&mk){const a=tr.getBoundingClientRect(),b=mk.getBoundingClientRect(),c=(b.left+b.right)/2,m=(a.left+a.right)/2;res.notes.repere=`piste ${a.left.toFixed(1)}..${a.right.toFixed(1)} (milieu ${m.toFixed(1)}), repère ${b.left.toFixed(1)}..${b.right.toFixed(1)}, hauteur ${b.height.toFixed(1)} pour ${a.height.toFixed(1)}`;
 const lum=s=>{const v=s.match(/[\d.]+/g).slice(0,3).map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4});return .2126*v[0]+.7152*v[1]+.0722*v[2]};
 const cs=x.w.getComputedStyle,ratio=(p,q2)=>{const A=lum(p),B=lum(q2);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)};
 const rc=ratio(cs(mk).backgroundColor,cs(tr).backgroundColor);
 t(Math.abs(c-m)<=0.5,`[avant : échec] repère des 50 % au milieu exact de la piste (écart ${(c-m).toFixed(2)} px)`);
 t(b.top<=a.top+0.5&&b.bottom>=a.bottom-0.5&&b.width>=1.5,`[avant : échec] repère sur toute la hauteur de la piste (${res.notes.repere})`);
 t(rc>=3,`[avant : échec] repère visible sur la piste vide (contraste ${rc.toFixed(2)}:1, 3:1 attendu)`);}
else t(false,"barre ou repère absent");}
t(/Période : du 01\/11\/2026 au 14\/11\/2026/.test(text(q(x,"stats-sample")))&&/14 parties terminées/.test(text(q(x,"stats-sample"))),"période et nombre de parties écrits sous le bandeau");
t(/\d+ % de victoires/.test(text(q(x,"kpi-wins"))),"14 parties terminées : pourcentage affiché, avec l'échantillon");
x.f.remove();
document.getElementById("out").textContent=JSON.stringify(res);document.title="done";
})().catch(e=>{document.getElementById("out").textContent=JSON.stringify({ok:res.ok,ko:res.ko.concat("ERREUR "+e.message+" "+(e.stack||"").slice(0,300)),notes:res.notes});});
</script></body></html>
