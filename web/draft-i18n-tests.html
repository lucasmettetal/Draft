<script>

{const cut=RW.eval('listedText("engine.targets.many",["Lux","Jinx","Ahri","Zed"])');t0(RW.eval("coachReason")(cut)===cut+" et 1 autre","français : liste coupée signalée par le moteur, sans relire le texte");}
t0(RW.eval('scenarioText("Yasuo",{text:"1er choix contre Yasuo",short:"1er choix"})')==="Si c'est Yasuo : 1er choix","français : hypothèse nommée");
t0(RW.eval('joinScenarioTexts([{text:"Si c\'est A : 1er choix"},{text:"Si c\'est B : à éviter"}])')==="Si c'est A : 1er choix ; si c'est B : à éviter","français : deux hypothèses");

{const r=pluralCheck(RW.DRAFT_I18N_FR,R,"fr");res.notes.plurielsFr=r.n;t0(r.n>0&&r.bad.length===0,"français : aucun singulier oublié sur "+r.n+" rendus ("+r.bad.join(" | ")+")");}

t0(R.tp("stats.journal.pending",1)==="1 draft attend son résultat."&&R.tp("stats.journal.pending",3)==="3 drafts attendent leur résultat."&&R.tp("stats.riot.sample.patches",1,{first:"16.22",last:"16.22"})==="1 patch : 16.22"&&R.tp("stats.riot.sample.patches",6,{first:"16.6",last:"16.22"})==="6 patchs, de 16.6 à 16.22","français : drafts et patchs accordés chacun (verbe compris)");real.remove();

t0(E.tp("draft.seen",0)==="0 champions seen"&&E.tp("draft.seen",1)==="1 champion seen"&&E.tp("draft.seen",2)==="2 champions seen","anglais : pluriel (0 au pluriel, 1 au singulier)");
t0(E.tp("journal.import.added",1)==="1 game added to your journal."&&E.tp("data.line.observations",1)==="Observations: 1 game.","anglais : nombre devant un nom au singulier");
t0(E.fmtDecimal(1.5)==="1.5"&&E.fmtNumber(1.5)==="1.5"&&E.t("coach.draft.tie.l3",{score:E.fmtDecimal(4),cause:""}).startsWith("Identical score (4.0)."),"anglais : point décimal");
t0(E.fmtDate(new Date(2026,10,11,14,5))==="Nov 11, 2026"&&E.fmtTime(new Date(2026,10,11,14,5))==="2:05 PM","anglais : date sans ambiguïté jour/mois, heure");
t0(E.listOr(["A","B","C"])==="A or B or C"&&E.listAnd(["A","B","C"])==="A, B and C","anglais : listes");
{const cut=EW.eval('listedText("engine.targets.many",["Lux","Jinx","Ahri","Zed"])');t0(cut==="4 squishy carries to punish: Lux, Jinx, Ahri"&&EW.eval("coachReason")(cut)===cut+" and 1 more","anglais : liste coupée signalée (coachReason ne relit plus le texte)");}

t0(EW.eval('joinScenarioTexts([{text:"If it\'s A: top pick"},{text:"If it\'s B: avoid"}])')==="If it's A: top pick; if it's B: avoid","anglais : deux hypothèses");

{const r=pluralCheck(EW.DRAFT_I18N_EN,E,"en");res.notes.plurielsEn=r.n;t0(r.n>0&&r.bad.length===0,"anglais : aucun singulier oublié sur "+r.n+" rendus ("+r.bad.join(" | ")+")");}
