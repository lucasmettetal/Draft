// Accueil : « Dernière partie », rattrapage de l'écran de fin de partie (panneau fermé, partie finie sans lecture du client). Tant
// qu'une partie lancée attend son résultat (lastGameToComplete) : champion en grand, Victoire et Défaite en gros, Ignorer en petit.
// Après la saisie : courte confirmation, puis la carte disparaît.
function HomeLastGame() {
  const [done, setDone] = useState(null);
  useEffect(() => { if (!done) return; const id = setTimeout(() => setDone(null), 2500); return () => clearTimeout(id); }, [done]);
  if (done) return html`<section className="box home-card state-good home-last" data-test="home-last-game-done" role="status"><p className="gr-done">${t(RESULT_SAVED[done])}</p></section>`;
  const game = lastGameToComplete(loadJournal());
  if (!game) return null;
  return html`<section className="box home-card state-wait home-last" aria-labelledby="home-last-title">
    <h2 id="home-last-title" className="card-kicker">${t("home.lastGame.title")}</h2>
    <${GameResult} entry=${game} where="home" onResult=${r => { setResult(game.id, r); setDone(r); }} />
  </section>`;
}

function HomeView() {
  const role = PROFILES.active, fresh = !(role && PROFILES.roles[role].pool.length);
  const ob = onboarding();
  // Pendant le guide, les étapes tiennent lieu de cartes League, pool et panneaux : rien n'est dit deux fois.
  // Profil vierge : le guide démarre et reste jusqu'à ce que chaque étape soit faite ou ignorée. Un profil déjà configuré ne le voit jamais.
  // Dans l'application, on attend l'état du programme : un profil existant (copie de secours, ancien profil) arrive avec lui.
  const known = !IS_HOST || hostState.available;
  useEffect(() => { if (known && fresh && !ob.started) storeOnboarding({ started:true }); }, [known, fresh, ob.started]);
  const done = { pool:!fresh, lcu:!!hostState.lcuEnabled || (hostState.available && !hostState.lcuConfirmed), panels:ob.tried };
  const steps = known && (ob.started || fresh) ? ["pool", "lcu", "panels"].filter(s => !done[s] && !ob.skipped.includes(s)) : [];
  return html`<div className="view-page home" data-test="home">

// Exclusions et favori d'un rôle (UX-4) : chaque rôle garde les siens. Ceux du rôle joué sont aussi ceux du calcul (ENGINE_PREFS),
// exactement comme avant ; ceux des autres rôles ne s'appliquent qu'une fois ce rôle joué.
function setRoleChoices(role, change) {
  const r = PROFILES.roles[role];
  if (!r) return;
  if ("excluded" in change) r.excluded = uniqueList(change.excluded).filter(p => r.pool.includes(p));
  if ("favorite" in change) r.favorite = change.favorite && r.pool.includes(change.favorite) ? change.favorite : null;
  if (role === PROFILES.active) { savePrefs({ excluded:r.excluded.slice(), favorite:r.favorite }); return; }
  storeProfiles();
  publish(null);
}

function PoolPage() {
  const [role, setRole] = useState(PROFILES.active);
  const [query, setQuery] = useState("");
  const [saved, setSaved] = useState(null);
  const searchRef = useRef(null);
  const pool = role ? PROFILES.roles[role].pool.map(label) : [];
  const roleData = role ? PROFILES.roles[role] : null;
  const backToSearch = () => { if (searchRef.current) searchRef.current.focus(); };
  // Choisir un rôle ici montre et modifie son pool, sans changer le rôle joué (sauf s'il n'y en a pas encore).
  const pickRole = r => { if (!PROFILES.active) switchRole(r, "manual"); setRole(r); setQuery(""); setSaved(null); };
  const playRole = () => { switchRole(role, "manual"); setSaved(null); };
  const apply = (r, list) => { if (r) saveMyProfile(r, list); };
  const addChampion = n => { apply(role, pool.concat(n)); setSaved({ text:t("pool.saved.added", { champion: n, role: ROLE_NAMES[role] }) }); };
  const removeChampion = n => {
    const back = { role, pool, excluded:roleData.excluded.slice(), favorite:roleData.favorite };
    apply(role, pool.filter(x => x !== n));
    setSaved({ text:t("pool.saved.removed", { champion: n, role: ROLE_NAMES[role] }), back });
  };
  // Annuler un retrait : pool, exclusions et favori du rôle tels qu'ils étaient.
  const undoRemove = () => {
    const back = saved && saved.back;
    if (!back) return;
    apply(back.role, back.pool);
    setRoleChoices(back.role, { excluded:back.excluded, favorite:back.favorite });
    setSaved(null);
    backToSearch();
  };
  const toggleFavorite = p => {
    const next = roleData.favorite === p ? null : p;
    setRoleChoices(role, { favorite:next });
    setSaved({ text: next ? t("pool.saved.favorite", { champion:label(p), role:ROLE_NAMES[role] }) : t("pool.saved.favoriteNone", { role:ROLE_NAMES[role] }) });
  };
  const toggleExcluded = p => {
    const on = !roleData.excluded.includes(p);
    setRoleChoices(role, { excluded: on ? roleData.excluded.concat(p) : roleData.excluded.filter(x => x !== p) });
    setSaved({ text:t(on ? "pool.saved.excluded" : "pool.saved.included", { champion:label(p), role:ROLE_NAMES[role] }) });
  };
  const editingOther = role && PROFILES.active && role !== PROFILES.active;
  const key = norm(query);
  const found = key ? NAMES.filter(n => champKeys(n).some(k => k.includes(key))).slice(0, 12) : [];
  const choices = found.filter(n => !pool.includes(n));
  const suggested = role ? championsForRole(role).filter(n => !pool.includes(n)).slice(0, 12) : [];
  const chip = (n, already) => already
    ? html`<span key=${n} className="pool-chip already" data-test="pool-already" data-champion=${n}><${Portrait} name=${n} size=${28} /><span>${n}</span><small>${t("pool.search.already")}</small></span>`
    : html`<button key=${n} type="button" data-test="pool-add" data-champion=${n} className="pool-chip" onClick=${() => { addChampion(n); setQuery(""); backToSearch(); }}><${Portrait} name=${n} size=${28} /><span>${n}</span></button>`;
  return html`<div className="view-page pool-page">
    <${ViewHead} title=${t("nav.pool")} sub=${t("pool.sub")} />
    <${PlayedRoleBar} />
    <${LegacyNotice} />
    <div className="pool-layout">
      <${PoolRoleList} role=${role} onPick=${pickRole} />
      <div className="pool-main">
        <section className="box" data-test="pool-box" aria-labelledby="pool-title">
          <header className="pool-head">
            <div>
              <h2 id="pool-title" className="box-title">${role ? t("pool.box.title", { role:ROLE_NAMES[role] }) : t("pool.box.noRole")}${role ? html` <small className="num">${tp("pool.box.count", pool.length)}</small>` : null}</h2>
              ${editingOther ? html`<p className="set-hint flush" role="status" data-test="pool-editing">${t("pool.editing", { role: ROLE_NAMES[role], played: ROLE_NAMES[PROFILES.active] })} <button type="button" className="link-btn" data-test="pool-play-role" onClick=${playRole}>${t("pool.playRole")}</button></p>` : null}
              ${role ? null : html`<p className="set-hint flush" data-test="pool-need-role">${t("pool.needRole")}</p>`}
            </div>
            ${saved ? html`<p className="pool-saved" role="status" data-test="pool-saved">${saved.text}${saved.back ? html` <button type="button" className="ghost-btn" data-test="pool-undo" onClick=${undoRemove}>${t("common.cancel")}</button>` : null}</p>` : null}
          </header>
          <div className="pool-search-wrap">
            <input ref=${searchRef} className="pool-search" data-test="pool-search" type="search" value=${query} disabled=${!role} autoComplete="off" spellCheck="false" aria-label=${t("pool.search.label")} placeholder=${role ? t("pool.search.placeholder") : t("pool.search.placeholderNoRole")}
              onChange=${e => setQuery(e.target.value)}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); if (choices[0]) { addChampion(choices[0]); setQuery(""); } } else if (e.key === "Escape" && query) { e.stopPropagation(); setQuery(""); } }} />
            ${role ? html`<p className="small">${t("pool.search.hint")}</p>` : null}
            ${key ? html`<div className="pool-list" data-test="pool-results">
              ${found.map(n => chip(n, pool.includes(n)))}
              ${!found.length ? html`<span className="set-hint flush">${t("pool.search.none")}</span>` : null}
            </div>` : null}
          </div>
          ${role && pool.length ? html`<table className="pool-table" data-test="pool-table">
            <thead><tr><th scope="col">${t("pool.table.champion")}</th><th scope="col">${t("pool.table.favorite")}</th><th scope="col">${t("pool.table.excluded")}</th><th scope="col"><span className="sr">${t("pool.table.remove")}</span></th></tr></thead>
            <tbody>${roleData.pool.map(p => { const n = label(p); return html`<tr key=${p} data-test="pool-row" data-champion=${n} className=${`${roleData.favorite === p ? "is-fav" : ""}${roleData.excluded.includes(p) ? " is-out" : ""}`.trim() || undefined}>
              <th scope="row"><span className="pool-name"><${Portrait} name=${n} size=${40} />${n}</span></th>
              <td><input type="radio" name=${`fav-${role}`} data-test="pool-favorite" data-champion=${n} checked=${roleData.favorite === p} aria-label=${t("pool.table.favoriteOf", { champion:n })} onClick=${() => toggleFavorite(p)} onChange=${() => {}} /></td>
              <td><input type="checkbox" data-test="pool-exclude" data-champion=${n} checked=${roleData.excluded.includes(p)} aria-label=${t("pool.table.excludedOf", { champion:n })} onChange=${() => toggleExcluded(p)} /></td>
              <td><button type="button" className="mini x" data-test="pool-remove" data-champion=${n} title=${t("pool.table.removeOne", { champion: n })} aria-label=${t("pool.table.removeOne", { champion: n })} onClick=${() => { removeChampion(n); backToSearch(); }}>×</button></td>
            </tr>`; })}</tbody>
          </table>
          <p className="small pool-table-help">${t("pool.table.help")}</p>` : role ? html`<p className="empty-note">${t("pool.table.empty")}</p>` : null}
        </section>
        ${role && suggested.length ? html`<section className="box box-pad" data-test="pool-suggested">
          <h2 className="box-title">${t("pool.suggest.title", { role:ROLE_NAMES[role] })} <small>${t("pool.suggest.help", { role:ROLE_NAMES[role] })}</small></h2>
          <div className="pool-list">${suggested.map(n => chip(n, false))}</div>
        </section>` : null}
        <section className="box box-pad" data-test="pool-backup">
          <h2 className="box-title">${t("pool.backup.title")}</h2>
          <p className="set-hint flush">${t("pool.backup.help")}</p>
          <${ProfileBackup} />
          <p className="set-hint flush">${t("pool.backup.rulesNote")}</p>
        </section>
      </div>
    </div>
  </div>`;
}

function JournalImport() {
  const [importNote, setImportNote] = useState("");
  const importJournal = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(text => {
      const incoming = JSON.parse(text);
      if (!Array.isArray(incoming)) throw new Error("format");
      const list = loadJournal();
      const known = new Set(list.map(x => x.id));
      const added = incoming.filter(x => x && x.id && x.picked && !known.has(x.id));
      saveJournal(list.concat(added).sort((a, b) => a.id - b.id));
      setImportNote(tp("journal.import.added", added.length));
      publish(null);
    }).catch(() => setImportNote(t("journal.import.refused")));
  };
  return html`<details className="set-more" data-test="journal-import">
    <summary>${t("stats.oldFile.title")}</summary>
    <h3>${t("journal.import.title")}</h3>
    <p className="small">${t("journal.import.help")}</p>
    <p><input type="file" data-test="import-journal" accept=".json,application/json" aria-label=${t("journal.import.label")} onChange=${importJournal} /></p>
    ${importNote ? html`<p className="small" data-test="journal-import-note">${importNote}</p>` : null}
  </details>`;
}

      <section className="box box-pad set-body" role="tabpanel" data-test=${`settings-body-${section}`} aria-labelledby="set-title">
        <h2 id="set-title" className="box-title">${t(SECTION_KEYS[section][0])}</h2>
        <p className="box-sub">${t(SECTION_KEYS[section][1])}</p>
        <${SettingsSection} id=${section} />
      </section>
    </div>
  </div>`;
}

function SimView() {
  return html`<div className="app" data-test="view-sim-body">
    <header className="top">
      <h1 id="view-title" className="view-title">${t("nav.sim")}</h1>
      <${RoleSwitch} notes=${false} />
      <span className="patch">${t("sim.patch", { patch: ddVersion.split(".").slice(0, 2).join(".") })}</span>
      <span className="grow"></span>
      <div className="seg-tabs source-switch" role="group" aria-label=${t("sim.source.label")}>
        <button type="button" className=${`seg-tab${simulating ? "" : " on"}`} aria-pressed=${!simulating} data-test="source-live" onClick=${leaveSimulation}>${t("sim.source.live")}</button>
        <button type="button" className=${`seg-tab${simulating ? " on" : ""}`} aria-pressed=${simulating} data-test="source-sim" onClick=${startSimulation}>${t("sim.source.sim")}</button>
      </div>
      <button type="button" className="ghost-btn" data-test="random-draft" data-random-draft=${true} onClick=${startRandomDraft}>${t("sim.random")}</button>
      <button type="button" className="ghost-btn" data-test="new-draft" disabled=${!state.enemies.length} onClick=${() => withUndo(simulating ? t("sim.undo.simCleared") : t("sim.undo.draftCleared"), resetDraft)}>${simulating ? t("sim.new.simulation") : t("sim.new.draft")}</button>
    </header>
    ${simulating ? html`<div className="sim-band" role="status" data-test="simulation" data-simulation=${true}>
      <p>${tx("sim.band.text", { simulation: html`<b>${t("sim.source.sim")}</b>` })}</p>
      <span className="grow"></span>
      <button type="button" className="ghost-btn" data-test="resume-live" disabled=${!liveCopy || !(liveCopy.enemies || []).length} title=${t("sim.resume.title")} onClick=${resumeLiveInSimulation}>${t("sim.resume")}</button>
      <button type="button" className="ghost-btn" data-test="leave-simulation" onClick=${leaveSimulation}>${t("sim.leave")}</button>
    </div>` : null}
    <${RoleBand} />
    <div className="desk">
      <${EnemyPanel} />
      <div className="col col-mid"><${Stage} /><${Ranking} /></div>
      <${SidePanel} key=${navId} />
    </div>
    <${MobileBar} />
  </div>`;
}

// Ajustements V2 : la rangée des 5 adversaires (saisie, consultation) se replie d'elle-même quand la composition est complète (5/5),
// pour laisser la place au conseil ; reste la ligne « Composition 5/5 », qui la rouvre en un clic. Repliable et dépliable à la main
// (choix gardé jusqu'à la draft suivante). Ouverte et incomplète : le bouton qui replie est à droite de la recherche, sans ligne de plus.
function CompactEnemies() {
  const n = state.enemies.length, open = compoIsOpen(n < 5);
  return html`<div className=${`p-compact-enemies${open ? "" : " folded"}`}>
    ${!open || n >= 5 ? html`<${CompoLine} open=${open} text=${t("panel.compo.line", { count: n })} />`
      : html`<div className="p-compo-search"><${SearchBox} /><button type="button" className="p-btn p-compo-fold" data-test="compo-toggle" aria-expanded="true" title=${t("panel.compo.close")} aria-label=${t("panel.compo.close")} onClick=${() => setCompo(false)}></button></div>`}
    <${UndoNote} />
    ${open ? html`<${CompoRows} />` : null}
  </div>`;
}

// Composition adverse : le panneau gauche la porte ; le panneau droit sert à comprendre et comparer les recommandations. Le programme
// ne crée et n'affiche le panneau droit (panel=right) qu'en disposition « two », avec le gauche (Place, Place2, TranslatePanels).
// Rappel minimal gardé : « 3/5 adversaires » sur le conseil (tant qu'il en manque) et le portrait de la menace principale. Le compact
// (panneau unique ou étroit, sans gauche) montre les 5 postes. Ajustements V2 : le programme envoie la visibilité réelle de chaque
// panneau (hostState.panelVisible) ; gauche fermé seul, masqué ou hors de l'écran, le droit montre l'accès « Composition adverse X/5 ».
// ---------- Fin de partie (beta.2, retour de l'utilisateur) ----------
// Le programme affiche le panneau droit ou le compact quand le client passe en EndOfGame et qu'une partie lancée de la session, notée
// ici (gameNoted), attend son résultat : hostState.endGame porte la clé de sa sélection (src/DraftMid.cs, UpdateEndGame). Le panneau
// montre alors le champion joué en grand, Victoire et Défaite en gros, Ignorer en petit. Après un clic : confirmation, puis retrait
// (endGameDone). Sans clic : retrait au lobby ou à la sélection suivante, l'entrée reste « En attente ». Rien en simulation.
const RESULT_SAVED = { win:"endGame.saved.win", loss:"endGame.saved.loss", skip:"endGame.saved.skip" };
let endGameDone = null, endGameReleased = null, endGameCorrect = null;
function GameResult({ entry, where, onResult, auto, onCorrect }) {
  const name = label(entry.picked);
  const art = where === "panel"
    ? html`<section className="p-reco gr-art" aria-hidden="true"><${SplashStack} name=${name} /><div className="p-reco-scrim"></div>
        <div className="p-reco-text"><span className="p-chip">${t("endGame.noted")}</span><div className=${`p-name${name.length > 14 ? " long" : ""}`}>${name}</div></div></section>`
    : html`<div className="gr-art-home" aria-hidden="true"><${Portrait} name=${name} size=${88} /></div>`;
  return html`<div className=${`game-result gr-${where}`} data-test=${where === "panel" ? "end-game" : "home-last-game"}>
    ${art}
    ${where === "panel" ? (entry.mid ? html`<p className="gr-who" data-test="gr-who">${t("endGame.vs", { champion: entry.mid })}</p>` : null)
      : html`<p className="gr-who" data-test="gr-who"><span className="gr-noted">${t("endGame.noted")}</span> <b className="gr-name">${name}</b>${entry.mid ? html` <span className="gr-vs">${t("endGame.vs", { champion: entry.mid })}</span>` : null}</p>`}
    ${auto ? html`<p className="gr-done gr-auto" data-test="end-game-auto" role="status">${t(auto === "win" ? "endGame.auto.win" : "endGame.auto.loss")}</p>
      <button type="button" className="link-btn gr-skip" data-test="end-game-correct" onClick=${onCorrect}>${t("endGame.auto.correct")}</button>`
    : html`<div className="gr-buttons">
      <button type="button" className="gr-btn win" data-result="win" onClick=${() => onResult("win")}>${t("journal.result.win")}</button>
      <button type="button" className="gr-btn loss" data-result="loss" onClick=${() => onResult("loss")}>${t("journal.result.loss")}</button>
    </div>
    <button type="button" className="link-btn gr-skip" data-result="skip" onClick=${() => onResult("skip")}>${t("journal.result.skip")}</button>`}
  </div>`;
}
// Ce que montre le panneau en fin de partie : l'entrée à compléter, la confirmation, ou rien (mode normal).
function endGameView() {
  const key = hostState.available && hostState.endGame ? String(hostState.endGame) : null;
  if (!key || simulating || (PANEL !== "right" && PANEL !== "compact")) { endGameDone = null; endGameCorrect = null; return null; }
  if (endGameDone && endGameDone.key === key) return { done: endGameDone.result };
  const entry = loadJournal().find(x => x.selection === key);
  if (entry && entry.gameStarted === true && !isAbandoned(entry)) {
    if (entry.result === null) return { key, entry };
    // Beta.3 : résultat lu dans le client, l'écran devient une confirmation (« Corriger » réaffiche les boutons).
    if (entry.resultSource === "lcu" && (entry.result === "win" || entry.result === "loss")) return { key, entry, auto: endGameCorrect === key ? null : entry.result };
  }
  // Déjà renseignée ailleurs, ou introuvable : rien à demander, le programme retire l'écran.
  if (endGameReleased !== key) { endGameReleased = key; hostSend({ cmd:"endGameDone", draft:key }); }
  return null;
}
function EndGamePanel({ view }) {
  if (view.done) return html`<div className="p-end" data-test="end-game"><p className="gr-done" data-test="end-game-done" role="status">${t(RESULT_SAVED[view.done])}</p></div>`;
  const onResult = r => {
    setResult(view.entry.id, r);
    endGameDone = { key: view.key, result: r };
    rerender();
    setTimeout(() => { if (endGameDone && endGameDone.key === view.key) { endGameReleased = view.key; hostSend({ cmd:"endGameDone", draft:view.key }); } }, 1800);
  };
  return html`<div className="p-end" aria-label=${t("endGame.label")}><${GameResult} entry=${view.entry} where="panel" onResult=${onResult} auto=${view.auto} onCorrect=${() => { endGameCorrect = view.key; rerender(); }} /></div>`;
}

function PanelApp() {
  compoDraftCheck();
  const endView = endGameView();
  if (endView) return html`<div className=${`panel panel-${PANEL}`} data-test="panel"><${TitleBar} /><${EndGamePanel} view=${endView} /></div>`;
  return html`<div className=${`panel panel-${PANEL}`} data-test="panel">
    <${TitleBar} />
    ${PANEL !== "left" ? html`<${RoleSwitch} />` : null}
    ${PANEL === "left" ? html`<${EnemyPanel} />` : null}
    ${PANEL === "right" ? html`<${VerdictPanel} compact=${false} />` : null}
    ${PANEL === "compact" ? html`<div className="p-scroll"><${CompactEnemies} /><${VerdictPanel} compact=${true} /></div>` : null}
  </div>`;
}

const isTextEntry = el => !!el && (el.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName));

function App() {
  const [, force] = useReducer(x => x + 1, 0);
  // Ouverts pendant une draft, les réglages sont seuls à l'écran : les fermer referme la fenêtre, pour ne rien laisser devant le client.
  const settingsWindow = useRef(IS_HOST && new URLSearchParams(location.search).get("solo") === "1");
  const closeSettings = useCallback(() => {
    if (settingsWindow.current) { settingsWindow.current = false; goView(uiBack === "settings" ? "home" : uiBack); hostSend({ cmd:"closeFull" }); return; }
    goView(uiBack === "settings" ? "home" : uiBack);
  }, []);
  useEffect(() => {
    rerender = force;
    // « Simuler une draft » du menu de l'icône quand la fenêtre n'était pas encore chargée.
    if (!PANEL || PANEL === "full") { if (new URLSearchParams(location.search).get("tab") === "simulate") startSimulation(); }
    markSyncBase();
    if (channel) { channel.postMessage({ kind:"hello" }); setTimeout(() => { if (!synced) { synced = true; afterSync(); } }, SYNC_WAIT_MS); }
    if (IS_HOST) {
      window.chrome.webview.addEventListener("message", e => {
        const m = e.data;
        if (m.kind === "host") {
          takeLeague(m.league);
          takeAvailability(m.unavailable);
          Object.assign(hostState, m, { available:true });
          // Champion banni ou pris par un allié (ou fin de la lecture, autre sélection) : la liste candidate change, le calcul est refait.
          if (syncUnavailable()) computeVerdict();
          // Stockage du navigateur vide mais copie dans le dossier de données : les profils reviennent.
          if (!PROFILES.active && m.savedProfiles) {
            try { const back = normalizeProfiles(JSON.parse(m.savedProfiles)); if (back && back.active) { PROFILES = back; persistProfiles(PROFILES, localStorage); useActiveRole(); computeVerdict(); } } catch (e) {}
          }
          if (m.legacyProfile) {
            if (!PROFILE) { saveMyProfile(FIRST_PROFILE.role, FIRST_PROFILE.pool.map(label)); computeVerdict(); }
            hostSend({ cmd:"profileAdopted" });
          }
          if (PROFILE && !window.draftProfileSent) { window.draftProfileSent = true; sendProfile(); }
          if (!m.legacyProfile && !PROFILE && PANEL && PANEL !== "full" && !window.draftProfileAsked) { window.draftProfileAsked = true; hostSend({ cmd:"openFull", tab:"pool" }); }
          force();
          // Nouvelle sélection vue dans l'état du programme (message draftStart perdu ou page ouverte en retard) : remise à zéro,
          // une fois par clé, AVANT le rôle attribué de cette sélection.
          if (synced && m.draftOutcome === "draft") startSelection(m.draftKey);
          // Page qui s'ouvre pendant une draft (Détails, panneau recréé) : la correction manuelle ou la bascule déjà faite sont chez
          // les autres pages. Rien n'est décidé avant de les avoir reçues (afterSync), sinon cette page rebasculerait et réenregistrerait le rôle.
          if (synced) handleAssignedRole(m.assignedRole || null);
          // Verrouillage vu dans League : le conseil du moment est mémorisé (une fois par sélection).
          memoLock();
          // Page ouverte après la décision : l'issue gardée par le programme est notée (une seule fois).
          if (settleOutcome(m.draftKey, m.draftOutcome)) force();
          // Résultat lu dans le client (beta.3), une fois la partie notée.
          if (applyGameResult(m.gameResult)) force();
        }
        if (m.kind === "demo") runDemo(m.stepMs);
        // Avec sa clé (programme beta.2) : une fois par sélection. Sans clé (ancien programme, essais) : comme avant.
        if (m.kind === "draftStart") { if (m.draft) startSelection(m.draft); else onDraftStart(); }
        if (m.kind === "lcuEnemies") applyDetected(m.ids);
        // Fin de sélection : issue en attente (outcome "pending"), rien n'est écrit. Puis draftOutcome : partie lancée ou draft annulée.
        if (m.kind === "draftEnd") { sendValidationRow(); resetRoleSession(); dispatchDraft({ type:"session-end" }); }
        if (m.kind === "draftOutcome" && settleOutcome(m.draft, m.outcome)) force();
        // Message gardé une version (alias) : ouvre la section Réglages.
        if (m.kind === "openSettings") { goView("settings", m.section); window.__openSettingsSeen = m.token || 0; }
        if (m.kind === "openTab") { history.replaceState(null, "", `?panel=full&tab=${m.tab}`); location.reload(); }
        // Ouverture d'une section ou d'un onglet sans recharger la page (« Détails », « Comparer ») : la draft affichée reste, aucune diffusion.
        if (m.kind === "openView") { openViewInPage(m.tab || "", m.source || ""); window.__openViewSeen = m.token || 0; }
      });
      hostSend({ cmd:"getHost" });
    }
    const onKey = e => {
      // Les raccourcis de la saisie ne valent que dans le Simulateur, et jamais pendant une saisie.
      if (uiView !== "sim") return;
      const active = document.activeElement;
      const add = document.getElementById("add");
      const inField = isTextEntry(active);
      // Échap ne retire aucun adversaire : dans la recherche, il vide seulement le texte saisi (SearchBox).
      if (e.key === "Escape") return;
      if (!inField) {
        if (e.key === "Backspace" && state.enemies.length) { e.preventDefault(); removeLastEnemy(); }
        else if (e.key.length === 1 && e.key !== " " && !e.ctrlKey && !e.metaKey && !e.altKey && add && !add.disabled) add.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusAdd();
    PICKS.forEach(p => preloadSplash(label(p)));
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(list => { if (list && list[0]) { ddVersion = list[0]; setKnownPatch(list[0]); force(); } }).catch(() => {});
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  if (PANEL && PANEL !== "full") return html`<${MotionConfig} reducedMotion="user"><${PanelApp} /><//>`;
  const view = uiView === "home" ? html`<${HomeView} />` : uiView === "pool" ? html`<${PoolPage} />` : uiView === "stats" ? html`<${DraftStatsView.StatsView} />`
    : uiView === "settings" ? html`<${SettingsPage} onClose=${closeSettings} solo=${settingsWindow.current} />` : html`<${SimView} />`;
  return html`<${MotionConfig} reducedMotion="user">
    <div className="shell" data-test="app">
      <${MainNav} />
      <main className=${`view view-${uiView}`} data-test=${`view-${uiView}`} aria-labelledby="view-title">${view}</main>
    </div>
  <//>`;
}

Object.assign(state, { roleOf:{}, targetRole:null, selected:null });
computeVerdict();
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
