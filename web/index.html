const goneText = g => t(g.reason === "ban" ? "panel.gone.ban" : "panel.gone.ally", { champion:label(g.pick), next:g.next });
// Journal automatique : lecture du client opérationnelle, draft classique, sélection en cours ou juste finie. Pas de « Je joue » : le
// pick sera noté au lancement de la partie. Sinon (lecture désactivée ou perdue, autre mode, Simulateur), « Je joue » sert de repli.
function autoJournal() {
  const l = leagueNow();
  return !!l && !simulating && l.readable && l.supported && !l.lost && !!hostState.lcuEnabled
    && (hostState.draftOutcome === "draft" || hostState.draftOutcome === "pending");
}
// Identifiant de champion du client → pick de DRAFT (« TF » pour Twisted Fate), ou null.
function pickIdOf(id) {
  const name = id ? toName(CHAMPION_IDS[id]) : "";
  return name ? Object.keys(FULL).find(k => FULL[k] === name) || name : null;
}
// Conseil au moment du verrouillage (suggested, close, tied, tiedWith, recommended) : mémorisé une fois par sélection, par la première
// page qui voit le verrouillage. Jamais en simulation.
const LOCK_MEMO_KEY = "draftLockMemo";
function lockMemo(key) {
  try { const m = JSON.parse(localStorage.getItem(LOCK_MEMO_KEY)); return m && m.key === String(key) ? m : null; } catch (e) { return null; }
}
function memoLock() {
  const l = leagueNow();
  if (!l || simulating || !V || V.none || !l.lockedFirst || lockMemo(l.key)) return;
  try { localStorage.setItem(LOCK_MEMO_KEY, JSON.stringify({ key: l.key, context: pickContextFor(pickIdOf(l.lockedFirst)) })); } catch (e) {}
}
// Partie lancée après un verrouillage lu dans le client : UNE entrée, origin "lcu", picked = champion final. Une entrée « Je joue »
// de la même sélection est complétée, jamais doublée. result reste null : aucun résultat n'est inventé. Lecture perdue au lancement,
// autre mode ou Simulateur : rien ici (l'entrée « Je joue », s'il y en a une, suit la règle de l'issue).
function writeLeagueEntry(key) {
  const l = leaguePick;
  if (!IS_HOST || simulating || !l || l.key !== String(key) || !l.readable || !l.supported || l.lost || !l.lockedFirst || !l.champion) return false;
  const picked = pickIdOf(l.champion), first = pickIdOf(l.lockedFirst);
  if (!picked) return false;
  const list = loadJournal();
  const existing = selectionEntry(list, key, l.gameId);
  if (existing && existing.origin === "lcu") return false;
  const memo = lockMemo(key);
  const fields = Object.assign({}, memo ? memo.context : {}, { picked }, first && first !== picked ? { lockedFirst: first } : {},
    { traded: !!l.traded, origin: "lcu", selection: String(key) }, l.gameId ? { gameId: l.gameId } : {}, { gameStarted: true });
  let entry = existing;

function applyRemote(m, force) {

  if (v) Object.values(v).forEach(x => { if (x && x[0] > syncClock) syncClock = x[0]; });
  const take = g => force || !v || newerVer(v[g], syncVer[g]);
  const taken = Object.keys(SYNC_GROUPS).filter(take);
  if (!taken.length) return;
  taken.forEach(g => { SYNC_GROUPS[g].forEach(k => { state[k] = m[k]; }); });
  // Le poste attribué vient du programme, qui l'envoie à chaque page : l'état d'une autre page, en retard d'un message (début de
  // draft traité avant le poste), ne le remplace pas. Les décisions (bascule, correction, proposition ignorée) restent partagées.
  if (hostState.available) state.assignedRole = hostState.assignedRole || null;
  if (taken.includes("pools") || taken.includes("role")) {
    const sent = m.profiles ? normalizeProfiles(m.profiles) : null;
    const base = sent || loadProfiles(localStorage, PREFS);
    // Pools et rôle joué ont chacun leur version : un panneau qui change de rôle n'impose pas ses anciens pools.
    PROFILES = taken.includes("pools") && taken.includes("role") ? base
      : taken.includes("pools") ? Object.assign({}, base, { active:PROFILES.active }) : Object.assign({}, PROFILES, { active:base.active });
    if (PROFILES.active) useActiveRole(); else if (m.profile) applyProfile(m.profile);
  }
  if (taken.includes("prefs") && m.prefs) Object.assign(PREFS, m.prefs);
  ENGINE_PREFS.excluded = PREFS.excluded; ENGINE_PREFS.favorite = PREFS.favorite;
  taken.forEach(g => { if (v && v[g]) syncVer[g] = v[g]; });
  // Ce qui vient d'être reçu n'est pas un changement fait ici : rien à rediffuser avec une nouvelle version. Les exclusions et le
  // favori (préférences) se déduisent du rôle joué et de ses pools : ils suivent sans nouvelle version.
  (taken.includes("pools") || taken.includes("role") ? taken.concat("prefs") : taken).forEach(g => { syncSeen[g] = groupJson(g); });
  state.lastAction = m.action;
  computeVerdict();
  rerender();
}

// Les événements simulés passent par les mêmes opérations que la saisie.
const draftApi = {
  reset() { resetDraft(); },
  setActive(v) { state.sessionActive = v; state.notice = v ? t("draft.notice.active") : t("draft.notice.ended"); publish(null); },
  add(champion, role) {
    if (role) state.targetRole = role;
    addEnemy(champion);
  },
  remove(champion) { removeEnemy(champion); },
  replace(from, to) {
    const i = state.enemies.indexOf(from);
    if (i < 0 || state.enemies.includes(to)) return;
    const role = state.roleOf[from];
    state.enemies[i] = to;
    delete state.roleOf[from];
    if (role) state.roleOf[to] = role;
    if (state.manualMid === from) state.manualMid = to;
    state.lastAction = t("draft.notice.replaced", { from, to });
    state.notice = state.lastAction;
    commit();
  },
  setRole(champion, role) {
    if (!state.enemies.includes(champion)) return;
    if (role === myRole()) { setMid(champion); return; }
    if (state.manualMid === champion) state.manualMid = null;
    state.roleOf[champion] = role;
    state.notice = t("draft.notice.role", { champion, role: ROLE_LABEL[role] || role });
    commit();
  }
};

// Simulation à la main : aucune lecture du client, et rien n'entre dans le relevé de validation.
// Entrer en simulation : la draft en cours est mise de côté (liveCopy), la simulation part vide.
function startSimulation() {
  if (simulating) return;
  liveCopy = snapshotLive();
  simulating = true;
  clearUndo();
  resetDraft();
}
function startRandomDraft() {

// « Reprendre la draft en cours » : copie la draft réelle dans la simulation. Aucun lien : la suite ne change que la simulation.
function resumeLiveInSimulation() {
  if (!simulating || !liveCopy) return;
  withUndo(t("draft.undo.resumed"), () => {
    ["enemies", "manualMid", "roleOf"].forEach(k => { state[k] = liveCopy[k] === undefined ? undefined : JSON.parse(JSON.stringify(liveCopy[k])); });
    state.held = null; state.current = null; state.picked = null; state.pickContext = null; state.viewed = null; state.targetRole = null; state.selected = null; state.notice = null;
    state.lastAction = null;
    commit();
  });
}

// Retour à la draft en cours : la simulation est effacée, la draft en cours suivie à part revient tout de suite,
// puis l'état des autres fenêtres est redemandé. Rien n'est diffusé : la vraie draft n'est jamais écrasée.
function leaveSimulation() {
  if (!simulating) return;
  clearUndo();
  if (!liveCopy) resetDraft();
  simulating = false;
  if (liveCopy) applyRemote(Object.assign({}, liveCopy, { action:null }), true);
  liveCopy = null;
  rerender();
  if (channel) channel.postMessage({ kind:"hello" });
}

function addEnemy(name) {
  if (!name || state.enemies.includes(name) || state.enemies.length >= 5) return;
  state.enemies.push(name);
  state.lastAction = t("draft.notice.added", { champion: name });
  state.notice = state.lastAction;
  if (state.targetRole) {
    if (state.targetRole === myRole()) state.manualMid = name;
    else state.roleOf[name] = state.targetRole;
    state.targetRole = null;
  }
  commit();
}

function removeEnemy(name) {
  state.enemies = state.enemies.filter(n => n !== name);
  delete state.roleOf[name];
  if (state.manualMid === name) state.manualMid = null;
  state.lastAction = t("draft.notice.removed", { champion: name });
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function resetDraft() {
  state.enemies = [];

// Annuler (5 secondes) après une action qui retire des adversaires : Nouvelle draft, Retour arrière.
// La draft exacte est rétablie. L'annonce reste locale à la fenêtre qui a agi.
const UNDO_MS = 5000;
const UNDO_KEYS = ["enemies", "manualMid", "held", "current", "picked", "pickContext", "viewed", "roleOf", "targetRole", "selected", "notice"];
let undoOffer = null;
const copyOf = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
function withUndo(text, action) {
  const snapshot = {};
  UNDO_KEYS.forEach(k => { snapshot[k] = copyOf(state[k]); });
  action();
  if (undoOffer) clearTimeout(undoOffer.timer);
  const offer = { id:Date.now(), text, snapshot };
  offer.timer = setTimeout(() => { if (undoOffer === offer) { undoOffer = null; rerender(); } }, UNDO_MS);
  undoOffer = offer;
  rerender();
}
function clearUndo() { if (undoOffer) { clearTimeout(undoOffer.timer); undoOffer = null; } }
function undoLast() {
  if (!undoOffer) return;
  const snapshot = undoOffer.snapshot;
  clearUndo();
  UNDO_KEYS.forEach(k => { state[k] = copyOf(snapshot[k]); });
  state.lastAction = null;
  commit();
  focusAdd();
}
const removeLastEnemy = () => { const last = state.enemies[state.enemies.length - 1]; withUndo(t("draft.undo.removed", { champion: last }), () => removeEnemy(last)); };

function setMid(name) {
  const old = currentMid();
  if (old && old !== name && state.roleOf[name]) state.roleOf[old] = state.roleOf[name];
  delete state.roleOf[name];
  state.manualMid = name;
  state.selected = null;
  state.targetRole = null;
  state.lastAction = oppText("notice", { champion: name });
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function clickRole(role) {
  const slots = deriveSlots();
  const occupant = slots[role];
  const picked = state.selected;
  if (picked && picked !== occupant) {
    const from = Object.keys(slots).find(r => slots[r] === picked);
    if (role === myRole()) { setMid(picked); return; }
    if (occupant) state.roleOf[occupant] = from === myRole() ? role : from;
    if (from === myRole()) { state.manualMid = occupant || null; if (occupant) delete state.roleOf[occupant]; }
    state.roleOf[picked] = role;
    state.selected = null;
    state.notice = t("draft.notice.role", { champion: picked, role: ROLE_LABEL[role] });
    commit();
    return;
  }
  if (occupant) {
    state.selected = picked === occupant ? null : occupant;
    state.targetRole = null;
  } else {
    state.targetRole = state.targetRole === role ? null : role;
  }
  publish(null);
  if (state.targetRole) focusAdd();
}

// Choix du joueur pour la draft affichée, ou null. Il voyage avec l'état (state.picked) ; le journal ne sert que de repli.
function currentPick() {
  if (state.picked) return state.picked;
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  return entry ? entry.picked : null;
}
// Contexte du conseil au moment du choix (format : docs/technique/JOURNAL.md). suggested : le conseil ; à égalité, chaque ex æquo
// est conseillé, donc en choisir un, c'est suivre le conseil (règle validée). tied, tiedWith : égalité et groupe complet des ex æquo,
// pour distinguer plus tard une égalité d'un conseil unique. recommended : premier du classement (il peut différer du nom affiché,
// maintenu pendant la draft). close : conseil serré.
function pickContextFor(pick) {
  const tiedWith = V && V.tied ? V.tied.slice() : [];
  const first = V && V.res && V.res.ranking[0];
  return { suggested: tiedWith.includes(pick) ? pick : state.shown, close: !state.clear, tied: tiedWith.length > 0, tiedWith, recommended: first ? first.pick : null };
}
// Consulter un champion (sans rien noter) : ses conseils, son plan et sa comparaison avec le conseil s'affichent, le bouton propose
// « Je joue X ». Consulter le conseil, ou le champion déjà confirmé, revient à l'affichage normal. Le classement ne bouge pas.
function consult(pick) {
  // À égalité, aucun nom n'est le conseil à lui seul : chaque ex æquo se consulte, puis se confirme.
  const isAdvice = !V.tied && pick === V.shown;
  state.viewed = pick && !isAdvice && pick !== currentPick() && V.res.ranking.some(p => p.pick === pick) ? pick : null;
  publish(null);
}
// Champion consulté encore classé (un adversaire peut l'avoir pris entre-temps), ou null.
const viewedPick = () => state.viewed && V && !V.none && V.res.ranking.some(p => p.pick === state.viewed) ? state.viewed : null;
// Champion dont le plan, les menaces et la condition de victoire s'affichent : consulté, sinon confirmé, sinon le conseil.
const playingPick = () => viewedPick() || currentPick() || (V.tied ? null : V.shown);
// Origine des entrées créées par cette version : une vraie draft (rien n'est écrit en simulation), et la version de DRAFT.
// Une entrée sans ces champs vient d'une version plus ancienne : origine inconnue. Rien n'est reconstruit ni migré.
const JOURNAL_ORIGIN = "draft";

// Choix du joueur : toujours un champion précis (Ton pool, égalité, « Je joue », « Revenir au conseil »). Il ne touche ni au classement,
// ni au conseil, ni aux scores. Journal : picked = champion choisi, suggested = conseil au moment du choix ; « conseil suivi » si égaux.
// Simulation : le choix reste dans la simulation. Rien n'est écrit dans le journal, qui ne compte que les vraies drafts.
function choosePick(pick) {
  // Champion banni ou pris (lecture du client) : jamais confirmé, quel que soit le bouton.
  if (!pick || isOff(pick)) return;
  // Confirmer termine la consultation : le bouton et la coche montrent maintenant le choix confirmé.
  state.viewed = null;
  if (pick === currentPick() && (currentEntry() || simulating)) { publish(null); return; }
  state.picked = pick;
  state.pickContext = pickContextFor(pick);
  if (!simulating) {
    const list = loadJournal();
    const noted = Object.assign({}, state.pickContext, { picked: pick });
    // Correctif beta.2 : seulement l'entrée de CETTE sélection. Une page restée sur la draft d'avant n'y réécrit plus rien.
    const entry = currentEntry(list);
    if (entry) Object.assign(entry, noted);
    else {
      // « Je joue » de repli (lecture perdue) : la partie lue plus tard complète cette entrée (même clé ou même gameId).
      const id = Date.now(), selection = liveSelection(), l = selection && leagueNow();
      list.push(Object.assign({ id, date: new Date().toISOString() }, noted, { enemies: state.enemies.slice(), mid: currentMid(), result: null, engine: ENGINE_VERSION, origin: JOURNAL_ORIGIN, app: APP_VERSION }, selection ? { selection } : {}, l && l.gameId ? { gameId: l.gameId } : {}));
      state.current = id;
    }
    saveJournal(list);
  }
  publish(null);
}

function searchMatchups(query) {
  const byName = Object.fromEntries(MATCHUPS.map(m => [m.n, m]));
  return matchByKeys(MATCHUPS.map(m => m.n), n => [byName[n].n].concat(byName[n].a || []).map(norm), query).map(n => byName[n]);
}

function optionsFor(m) {
  const available = availablePicks([m.n]);
  const avoid = avoidedPicks(m);
  // Les notes viennent des vrais bilans quand ils existent, sinon du tableau : tri stable, donc le 1er choix écrit reste devant à égalité.
  const written = [m.first, m.second, ...PICKS].filter((p, i, all) => PICKS.includes(p) && all.indexOf(p) === i);
  const note = p => (RULES.matchup(p, null, { mid: m.n }) || [0])[0];
  const ranked = written.filter(p => available.includes(p) && !avoid.includes(p)).sort((a, b) => note(b) - note(a));
  return ranked.concat(written.filter(p => available.includes(p) && avoid.includes(p))).slice(0, 2);
}

function groupRows(rows, keyOf) {
  const map = new Map();
  rows.forEach(r => { const k = keyOf(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return [...map].map(([name, list]) => ({ name, rows: list })).sort((a, b) => b.rows.length - a.rows.length);
}

function SearchBox() {
  const [value, setValue] = useState("");
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const full = state.enemies.length >= 5;
  const list = open ? suggest(value) : [];
  const confirm = name => { addEnemy(name); setValue(""); setSel(0); setTimeout(focusAdd, 0); };
  const onKey = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!list.length) return;
      e.preventDefault();
      setSel(s => (s + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (list.length) confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Tab" && !e.shiftKey && list.length) {
      e.preventDefault();
      confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Backspace" && !value && state.enemies.length) {
      removeLastEnemy();
    } else if (e.key === "Escape" && value) {
      e.stopPropagation();
      setValue("");
    }
  };
  const target = state.targetRole ? t("draft.search.next", { role: ROLE_LABEL[state.targetRole] }) : "";
  return html`<div className="search">
    <input id="add" data-test="enemy-search" type="search" value=${value} disabled=${full} autoComplete="off" spellCheck="false"
      aria-label=${t("draft.search.label")}
      placeholder=${full ? t("draft.search.full") : (target || t("draft.search.placeholder"))}
      onChange=${e => { setValue(e.target.value); setSel(0); setOpen(true); }}

    ${open && value.trim() ? html`<div className="sugg" role="listbox">
      ${list.length ? list.map((n, i) => html`<button key=${n} type="button" role="option" aria-selected=${i === sel} className=${`sugg-item${i === sel ? " on" : ""}`}
          onMouseDown=${e => { e.preventDefault(); confirm(n); }}>

          <${Portrait} name=${n} size=${28} /> ${n}
        </button>`) : html`<div className="sugg-empty">${t("draft.search.none", { query: value })}</div>`}
    </div>` : null}
  </div>`;
}

// Une seule échelle pour ton vis-à-vis (docs/technique/GLOSSAIRE-LOL.md §3) : presque sûr, probable, hypothèse
// (1 ou 2 champions vus), pas identifié, pas encore choisi. Le mot suit la confiance calculée ; le seuil pour nommer ne change pas ici.

const OPPONENT_LEVEL_WORD = { guess:t("coach.opponentWord.guess"), likely:t("coach.opponentWord.likely"), sure:t("coach.opponentWord.sure") };
function opponentLevel() {
  if (!V.mid) return null;

// Personne de nommé : « pas encore choisi » (code "unrevealed") si aucun candidat plausible n'est révélé et qu'il reste une vraie chance
// qu'il ne soit pas encore pris (ou si rien n'est révélé), sinon « pas identifié » (code "unidentified").
function unnamedState() {
  const h = V.hypothesis;
  if (!V.n) return "unrevealed";
  return h && h.notYet && !h.others.length ? "unrevealed" : "unidentified";
}
const UNNAMED_WORD = { unrevealed:t("draft.unnamed.unrevealed"), unidentified:t("draft.unnamed.unidentified") };
const unnamedWord = () => UNNAMED_WORD[unnamedState()];
// Analyse, vis-à-vis pas nommé. Fidèle au calcul : avec des hypothèses, le critère matchup du pick affiché est leur moyenne pondérée.
function matchupUncertainText() {
  const shownEntry = V.res.ranking.find(p => p.pick === V.shown);
  return shownEntry && shownEntry.criteria.some(c => c.key === "matchup")
    ? t("analysis.matchupUncertain.average", { role: oppName() })

}
// Étiquette de la ligne de ton rôle dans la composition adverse.
function opponentTag() {
  const level = opponentLevel();
  if (!level) return t("enemy.tag.unidentified", { role: oppName() });
  return level === "guess" ? t("enemy.tag.guess", { role: oppName(), seen: seenText(V.n) }) : t("enemy.tag.level", { role: oppName(), level: OPPONENT_LEVEL_WORD[level] });
}

// Les hypothèses restent courtes, sans pourcentage : la qualité des données ne permet pas mieux.
function hypothesisText() {
  const h = V.hypothesis;
  if (!h) return "";
  const notYet = h.notYet;
  const named = h.others;
  if (!h.main && !named.length) return t(unnamedState() === "unrevealed" ? "draft.hyp.unrevealed" : "draft.hyp.unidentified", { role: oppName() });
  if (!h.main) return t(notYet ? "draft.hyp.unidentifiedNamesNotYet" : "draft.hyp.unidentifiedNames", { role: oppName(), names: I18N.listOr(named) });
  const rest = named.length ? (notYet ? "elseNotYet" : "else") : notYet ? "notYet" : "none";
  const level = opponentLevel();
  const vars = { role: oppName(), champion: h.main, seen: seenText(V.n), level: OPPONENT_LEVEL_WORD[level], names: I18N.listOr(named) };
  if (level === "guess") return t({ none:"draft.hyp.guess", else:"draft.hyp.guessElse", elseNotYet:"draft.hyp.guessElseNotYet", notYet:"draft.hyp.guessNotYet" }[rest], vars);
  return t({ none:"draft.hyp.level", else:"draft.hyp.levelElse", elseNotYet:"draft.hyp.levelElseNotYet", notYet:"draft.hyp.levelNotYet" }[rest], vars);
}

// Champion consulté : ses raisons, son risque, son matchup et sa comparaison avec le conseil. Rien n'est noté.
// short : la première phrase seulement (« Avantage net à X. »), pour la carte du champion consulté ; le détail est dans « Pourquoi X ».
function compareSummary(a, b, short) {
  const cmp = comparePicks(a, b), leader = a.score >= b.score ? a : b, trailer = leader === a ? b : a, lead = leadCriterion(leader, trailer);
  const other = comparePicks(trailer, leader).decisive.find(r => r.diff > 0);
  return [Math.abs(cmp.gap) < 1e-9 ? t("compare.summary.tie") : t(Math.abs(cmp.gap) < HOLD_GAP ? "compare.summary.close" : "compare.summary.clear", { champion: label(leader.pick) }),
    short ? "" : lead ? t(other ? "compare.summary.leadBoth" : "compare.summary.lead", { champion: label(leader.pick), criterion: lead.label, other: label(trailer.pick), otherCriterion: (other || {}).label }) : ""].filter(Boolean).join(" ");
}

const COACH_SHORT = 110;
// Les premières phrases seulement : le reste est dans l'onglet Conseils.
function shortAdvice(text) {
  let out = "";
  for (const sentence of text.split(/(?<=\.)\s+/)) {
    if ((out + " " + sentence).trim().length > COACH_SHORT) break;
    out = (out + " " + sentence).trim();
  }
  return out;
}

function rankWord(p, i) {
  if (V.tied && V.tied.includes(p.pick)) return [t("advice.rank.tie"), "best"];
  if (V.avoided.includes(p.pick)) return [t("advice.rank.avoid"), "bad"];
  if (i === 0) return [t(V.clear ? "advice.rank.recommended" : "advice.rank.veryClose"), "best"];
  if (i === 1) return [t(V.clear ? "advice.rank.alternative" : "advice.rank.veryClose"), V.clear ? "alt" : "best"];
  const far = V.order[0] && V.order[0].score - p.score >= HOLD_GAP;
  return [t(far ? "advice.rank.lessSuited" : "advice.rank.possible"), far ? "bad" : "other"];
}

// Au-delà, la liste écraserait le verdict : le reste du pool se lit dans Analyse et Comparer.
const RANK_SHOWN = 4;

// Coche : le champion choisi par le joueur (currentPick), qu'il soit ou non le conseil. Le classement, lui, reste celui du moteur.

    <h2 className="sec-title">${t("pool.rank.label")} <small>${V.order.length > RANK_SHOWN ? t("pool.rank.top", { shown: RANK_SHOWN, total: V.order.length }) : t("pool.rank.hint")}</small></h2>
    <${LayoutGroup}>
      <div className="rank-list">
        ${V.order.slice(0, RANK_SHOWN).map((p, i) => {
          const [word, tone] = rankWord(p, i);
          const name = label(p.pick);
          const isPicked = picked === p.pick, isViewed = viewedPick() === p.pick;
          const rows = STAT_ROWS.length ? record(STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === name)) : null;
          return html`<${motion.button} key=${p.pick} layout="position" transition=${SNAP} type="button" whileHover=${{ y:-2 }} whileTap=${{ scale:.98 }}
            data-pick=${p.pick} aria-pressed=${!!isPicked}
            className=${`rank tier-${tone}${i === 0 && !V.tied ? " first" : ""}${isPicked ? " picked" : ""}${isViewed ? " viewed" : ""}`} onClick=${() => consult(p.pick)}
            aria-current=${isViewed ? "true" : undefined} title=${t("viewed.help")}>
            ${isPicked ? html`<${motion.span} key="chosen" className="chosen" initial=${{ scale:.5 }} animate=${{ scale:1 }} transition=${SNAP} title=${t("pool.rank.chosen")}><span aria-hidden="true">✓</span><span className="sr">${t("pool.rank.chosenShort")}</span><//>` : null}
            ${i === 0 && !V.tied ? html`<${motion.span} key=${`best-${p.pick}`} className="rank-glow" aria-hidden="true" initial=${{ opacity:.55 }} animate=${{ opacity:0 }} transition=${{ duration:.45 }} />` : null}
            ${isPicked ? html`<${motion.span} layoutId="picked-ring" className="rank-ring" aria-hidden="true" transition=${SNAP} />` : null}
            <span className="rank-top">
              <${Portrait} name=${name} size=${44} />
              <span style=${{ minWidth:0 }}>
                <span className="rank-name" title=${name} style=${{ display:"block" }}>${name}</span>
                <${motion.span} key=${word} className=${`rank-word ${tone}`} initial=${{ y:5, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${QUICK}>${word}<//>
              </span>
            </span>
            <span className="force" aria-hidden="true"><${motion.i} initial=${false} animate=${{ scaleX: Math.max(.04, (p.score - lo) / (hi - lo || 1)) }} transition=${QUICK} /></span>
            ${rows && rows.games ? html`<span className="rank-rec">${fmtRecord(rows)}</span>` : null}
          <//>`;
        })}
      </div>
    <//>
  </section>`;
}

const IMPACT_MARK = v => v > 0 ? (v >= 2 ? "++" : "+") : v < 0 ? (v <= -2 ? "−−" : "−") : "=";
const impactText = v => t(v > 0 ? "analysis.impact.up" : v < 0 ? "analysis.impact.down" : "analysis.impact.neutral");

function CriteriaView() {
  const entries = V.res.ranking;
  const rows = CRITERIA.filter(def => entries.some(p => p.criteria.some(c => c.key === def.key)));
  const uncertain = [];
  if (V.hypothesis) uncertain.push(hypothesisText());
  if (V.res.ranking[0] && V.res.ranking[0].byScenario) uncertain.push(t("analysis.weighted"));
  if (!V.mid) uncertain.push(matchupUncertainText());
  if (V.mid && !matchupOf(V.mid) && !PICKS.some(p => liveMatchup(p, V.mid))) uncertain.push(t("analysis.noMatchupData", { champion: V.mid }));
  if (V.tied) uncertain.push(t("analysis.tied", { champions: V.tied.map(label).join(", "), cause: tieCauseText(tieCause(V.res.ranking, V.tied), V.tied[0]) }));
  if (entries[0] && V.shown !== entries[0].pick && !(V.tied && V.tied.includes(entries[0].pick))) uncertain.push(t("analysis.held", { champion: label(V.shown), leader: label(entries[0].pick) }));
  if (V.n < 5) uncertain.push(tp("analysis.incomplete", V.n));
  if (V.res.unknown.length) uncertain.push(t("analysis.provisional", { champions: V.res.unknown.join(", ") }));
  uncertain.push(PREFS.assumeFront ? t("analysis.front.on") : t("analysis.front.off"));
  return html`<div>
    <p className="small">${uncertain.join(" ")}</p>
    <div className="matrix" role="table" aria-label=${t("analysis.matrix.label")}>
      <div className="mx-row mx-head" role="row"><span role="columnheader">${t("analysis.matrix.criterion")}</span>${entries.map(p => html`<span key=${p.pick} role="columnheader" title=${label(p.pick)}><${Portrait} name=${label(p.pick)} size=${24} /></span>`)}</div>
      ${rows.map(def => html`<div key=${def.key} className="mx-row" role="row">
        <span role="cell">${def.label}</span>
        ${entries.map(p => {
          const c = p.criteria.find(x => x.key === def.key);
          const v = c ? c.impact : 0;
          return html`<span key=${p.pick} role="cell" className=${`mx-cell ${v > 0 ? "up" : v < 0 ? "down" : ""}`} title=${c ? c.text : t("analysis.matrix.notConcerned")} aria-label=${t("analysis.matrix.cell", { champion: label(p.pick), impact: impactText(v) })}>${IMPACT_MARK(v)}</span>`;
        })}
      </div>`)}
    </div>
    ${entries.map((p, i) => {
      const plus = p.why.filter(w => w.v > 0).sort((a, b) => b.v - a.v);
      const minus = p.why.filter(w => w.v < 0).sort((a, b) => a.v - b.v);
      const threats = threatsFor(p.pick, V.res.counts);
      const targets = targetsFor(p.pick, V.res.counts);
      const m = matchupOf(V.mid);
      return html`<details key=${p.pick} className="pick-detail" open=${i === 0}>
        <summary><${Portrait} name=${label(p.pick)} size=${24} /> ${label(p.pick)}</summary>
        <p className="small">${positionText(entries, p)}</p>
        ${plus.length ? html`<ul className="why">${plus.map(w => html`<li key=${w.text} className="pos">+ ${signedText(w, 1) || w.text}</li>`)}</ul>` : null}
        ${minus.length ? html`<ul className="why">${minus.map(w => html`<li key=${w.text} className="neg">− ${signedText(w, -1) || w.text}</li>`)}</ul>` : null}
        ${!plus.length && !minus.length ? html`<p className="small">${t("analysis.detail.none")}</p>` : null}

function CompareTab() {
  const entries = V.res.ranking;
  const [pair, setPair] = useState(null);
  if (entries.length < 2) return html`<p className="small">${t("compare.needTwo")}</p>`;
  // Un champion consulté se compare d'office au conseil.
  const vw = viewedPick();
  const defaults = vw ? [V.tied ? V.tied.find(x => x !== vw) || V.shown : V.shown, vw] : V.tied ? [V.tied[0], V.tied[1]] : [V.shown, V.rival ? V.rival.pick : entries.find(p => p.pick !== V.shown).pick];
  const valid = pair && pair.every(p => entries.some(x => x.pick === p)) && pair[0] !== pair[1];
  const [pa, pb] = valid ? pair : defaults;
  const a = entries.find(x => x.pick === pa);
  const b = entries.find(x => x.pick === pb);
  const cmp = comparePicks(a, b);
  const max = Math.max(1, ...cmp.rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)]));
  const leader = a.score >= b.score ? a : b;
  const trailer = leader === a ? b : a;
  const select = (slot, pick) => { const next = [pa, pb]; next[slot] = pick; if (next[0] === next[1]) next[1 - slot] = slot === 0 ? pb === pick ? pa : pb : pa === pick ? pb : pa; setPair(next); };
  const picker = (slot, cur) => html`<div className="cmp-pick" role="group" aria-label=${slot === 0 ? t("compare.first") : t("compare.second")}>
    ${entries.map(p => html`<button key=${p.pick} type="button" aria-pressed=${cur === p.pick} aria-label=${label(p.pick)} title=${label(p.pick)} className=${`cmp-btn${cur === p.pick ? " on" : ""}`} onClick=${() => select(slot, p.pick)}><${Portrait} name=${label(p.pick)} size=${26} /></button>`)}
  </div>`;
  const pros = (x, y) => cmp.rows.filter(r => (x === a ? r.diff > 0 : r.diff < 0)).map(r => x === a ? r.textA || t("compare.lessPenalized", { criterion: r.label }) : r.textB || t("compare.lessPenalized", { criterion: r.label })).slice(0, 3);
  // whenBetter compte une frontline alliée et ignore les hypothèses sur le vis-à-vis : sinon, rien n'est affirmé.
  const severalHypotheses = !!(V.res.ranking[0] && V.res.ranking[0].byScenario);
  const when = severalHypotheses || !PREFS.assumeFront ? null : whenBetter(trailer.pick, leader.pick, state.enemies, V.mid);
  return html`<div className="compare">
    <div className="cmp-head">${picker(0, pa)}<b>${t("compare.vs")}</b>${picker(1, pb)}</div>
    <p className="cmp-title">${tx("compare.title", { a: html`<b>${label(pa)}</b>`, b: html`<b>${label(pb)}</b>` })}</p>
    <p className="small">${[Math.abs(cmp.gap) < 1e-9 ? t("compare.summary.tie") : t(Math.abs(cmp.gap) < HOLD_GAP ? "compare.summary.close" : "compare.summary.clear", { champion: label(leader.pick) }), leadCriterion(leader, trailer) ? t(comparePicks(trailer, leader).decisive.find(r => r.diff > 0) ? "compare.summary.leadBoth" : "compare.summary.lead", { champion: label(leader.pick), criterion: leadCriterion(leader, trailer).label, other: label(trailer.pick), otherCriterion: (comparePicks(trailer, leader).decisive.find(r => r.diff > 0) || {}).label }) : ""].filter(Boolean).join(" ")}</p>
    ${cmp.rows.length ? html`<div className="cmp-row cmp-legend" aria-hidden="true"><span></span><span className="cmp-bars"><span>${label(pa)}</span><span>${label(pb)}</span></span></div>` : null}
    ${cmp.rows.length ? cmp.rows.map(r => html`<${CompareBar} key=${r.key} row=${r} max=${max} />`) : html`<p className="small">${t("compare.noCriterion")}</p>`}
    ${[[a, b], [b, a]].map(([x, y]) => {
      const list = pros(x, y);
      const risk = mainRisk(x);
      const on = currentPick() === x.pick;
      return html`<div key=${x.pick} className="cmp-side-text">
        <h3>${label(x.pick)}</h3>
        <button type="button" className=${`ghost-btn cmp-play${on ? " on" : ""}`} data-test="compare-choose" data-pick=${x.pick} aria-pressed=${on} title=${pickTitle()} onClick=${() => choosePick(x.pick)}>${on ? t(simulating ? "advice.cta.chosen" : "advice.cta.noted", { champion: label(x.pick) }) : t("advice.cta.play", { champion: label(x.pick) })}</button>
        <p className="small">${pickStyle(x.pick)}</p>
        ${list.length ? html`<ul className="why">${list.map(t => html`<li key=${t} className="pos">+ ${t}</li>`)}</ul>` : null}
        ${risk ? html`<ul className="why"><li className="neg">− ${risk}</li></ul>` : null}
      </div>`;
    })}
    <h3>${t("compare.whenTitle", { champion: label(trailer.pick) })}</h3>
    <p className="small">${severalHypotheses ? t("compare.when.hypotheses") : !when ? t("compare.when.noFront") : when.length ? t("compare.when.list", { cases: when.join(", ") }) : t("compare.when.none")}</p>
  </div>`;
}

function WinBars({ title, groups }) {
  if (!groups.length) return null;
  return html`<div>
    ${title ? html`<h3>${title}</h3>` : null}
    <div className="winbars">
      ${groups.map(g => {
        const rec = record(g.rows);
        const few = rec.games < MIN_GAMES;
        // QA-1 : sous 50 % de victoires, la barre quitte le vert des réussites (teinte neutre) ; le repère et le pourcentage restent.
        const under = !few && rec.wins / rec.games < 0.5;
        // Sous le seuil : pas de barre de victoires (elle suggérerait un taux), une jauge de crans montre l'échantillon.
        return html`<div key=${g.name} className=${`winbar${few ? " few" : ""}${under ? " under" : ""}`}>
          <span className="winbar-name">${g.name}</span>
          ${few ? html`<${SampleGauge} count=${rec.games} />` : html`<span className="winbar-track" role="img" aria-label=${t("stats.winbar.aria", { name: g.name, record: fmtRecord(rec) })}>
            <${motion.i} initial=${{ scaleX:0 }} animate=${{ scaleX: rec.games ? rec.wins / rec.games : 0 }} transition=${ARRIVE} /><b className="winbar-mid" aria-hidden="true"></b>
          </span>`}
          <span className="winbar-val">${few ? fmtRecord(rec) : t("stats.winbar.value", { record: fmtRecord(rec), percent: pct(rec) })}</span>
        </div>`;
      })}
    </div>
    <p className="small">${t("stats.winbar.few", { min: MIN_GAMES })}</p>
  </div>`;
}

function evolutionGroups(rows) {
  const sorted = [...rows].sort((x, y) => x.time - y.time);
  const groups = [];
  // La dernière tranche, incomplète, est gardée (avant : 80 parties montrées sur 93) ; sous 10 parties, WinBars montre une jauge.
  for (let i = 0; i < sorted.length; i += EVOLUTION_STEP) {
    const part = sorted.slice(i, i + EVOLUTION_STEP);
    groups.push({ name: part.length === EVOLUTION_STEP ? t("stats.range", { from: i + 1, to: i + EVOLUTION_STEP }) : t("stats.range.current", { from: i + 1, to: i + part.length }), rows: part });
  }
  return groups;
}

function RowsSample({ rows, test }) {
  if (!rows.length) return null;
  const times = rows.map(r => r.time).filter(x => typeof x === "number" && x > 0).sort((a, b) => a - b);
  const from = times.length ? fmtDate(times[0]) : "", to = times.length ? fmtDate(times[times.length - 1]) : "";
  const enough = rows.length >= MIN_GAMES;
  return html`<p className="stats-sample" data-test=${test}>${from ? html`<b className="num">${from === to ? t("stats.sample.periodOne", { date: from }) : t("stats.sample.period", { from, to })}</b>` : null}<span className="num">${tp("stats.sample.played", rows.length)}</span><span className=${enough ? "" : "stats-few"}>${t(enough ? "stats.sample.enough" : "stats.sample.few", { min: MIN_GAMES })}</span></p>`;
}

// Changement de rôle en un clic. Le rôle actif est toujours visible.
function roleSwitchTitle(r) {
  const n = PROFILES.roles[r].pool.length, base = n ? tp("role.switch.title", n, { role: ROLE_NAMES[r] }) : t("role.switch.titleEmpty", { role: ROLE_NAMES[r] });
  return state.assignedRole === r ? t("role.switch.assigned", { title: base }) : base;
}
// Bascule automatique de cette draft : visible et réversible d'un clic (le retour vaut choix à la main pour la draft). La notice ne vaut
// que tant que League indique toujours ce poste (poste effacé ou changé : plus de notice, le rôle joué ne change pas pour autant).
const autoFromRole = () => state.roleFrom && state.roleHandled && state.assignedRole === state.roleHandled && PROFILES.active === state.roleHandled && !state.roleManual ? state.roleFrom : null;
// notes : proposition, notice de bascule et état du rôle sous les boutons (panneaux). Dans la fenêtre, ils vont dans une bande (RoleBand).
function RoleSwitch({ notes = true }) {
  return html`<div className="role-switch-wrap">
    <div className="role-switch" role="group" aria-label=${t("role.switch.label")}>
      <span className="role-now" data-test="role-now">${PROFILES.active ? ROLE_NAMES[PROFILES.active] : t("role.switch.none")}</span>
      ${PROFILE_ROLES.map(r => html`<button key=${r} type="button" data-role=${r} data-test=${`role-switch-${r}`} aria-pressed=${PROFILES.active === r}
        className=${`role-btn${PROFILES.active === r ? " on" : ""}${state.assignedRole === r ? " assigned" : ""}`}
        title=${roleSwitchTitle(r)}
        aria-label=${t("role.switch.aria", { role: ROLE_NAMES[r] })} onClick=${() => switchRole(r, "manual")}><${RoleIcon} role=${r} /></button>`)}
    </div>
    ${notes ? html`<${RoleNotes} panel=${!!PANEL && PANEL !== "full"} />` : null}
  </div>`;
}
// Panneaux primaires : l'état du rôle tient en un mot, suivi du pool actif (« Rôle détecté · pool de 4 »), sur une ligne à 222 px.
// La raison complète reste dans le titre (survol) et dans la note « D'où viennent ces informations » des détails du panneau.
const PANEL_ROLE_WORD = { detected:"panel.roleState.detected", manual:"panel.roleState.manual", unknown:"panel.roleState.unknown" };
function panelRoleWord(rs) {
  if (!rs) return "";
  return t(rs.code === "manual" && rs.title !== "role.state.manual" ? "panel.roleState.noReading" : PANEL_ROLE_WORD[rs.code]);
}
function activePoolSize() { return PROFILES.active && PROFILES.roles[PROFILES.active] ? PROFILES.roles[PROFILES.active].pool.length : PICKS.length; }
function RoleNotes({ panel }) {
  const suggestion = roleSuggestion(), autoFrom = autoFromRole(), rs = roleState();
  return html`${suggestion ? html`<p className="role-hint" data-test="role-hint" role="status">${t("role.hint.assigned", { role: ROLE_NAMES[suggestion] })}
      <button type="button" className="link-btn" data-test="role-hint-switch" onClick=${() => switchRole(suggestion, "manual")}>${t("role.hint.switch", { role: ROLE_NAMES[suggestion] })}</button>
      <button type="button" className="link-btn" data-test="role-hint-dismiss" aria-label=${t("role.hint.dismiss")} onClick=${() => { state.roleDismissed = suggestion; publish(null); }}>${t("role.hint.dismiss")}</button></p>` : null}
    ${autoFrom ? html`<p className="role-hint role-auto" data-test="role-auto" role="status">${t("role.auto.done", { role: ROLE_NAMES[PROFILES.active] })}
      <button type="button" className="link-btn" data-test="role-auto-undo" onClick=${() => switchRole(autoFrom, "manual")}>${t("role.auto.undo", { role: ROLE_NAMES[autoFrom] })}</button></p>` : null}
    ${panel ? html`<p className="p-rolemeta" data-test="panel-role-meta">
        ${rs ? html`<span className=${`role-source ${rs.code}`} data-test="role-state" data-state=${rs.code} title=${t(rs.title)}>${panelRoleWord(rs)}</span>` : null}
        <span className="p-poolcount" data-test="panel-pool-count" title=${PICKS.length ? PICKS.map(label).join(", ") : t("panel.empty.noProfile")}>${t("panel.role.pool", { count: activePoolSize() })}</span>
      </p>`
    : rs ? html`<p className=${`role-source ${rs.code}`} data-test="role-state" data-state=${rs.code} title=${t(rs.title)}>${t(rs.text)}</p>` : null}`;
}
// Fenêtre : l'en-tête garde sa hauteur ; proposition, notice et état du rôle passent dessous, sur une ligne qui n'existe que s'il y a à dire.
function RoleBand() {
  if (!roleSuggestion() && !autoFromRole() && !roleState()) return null;
  return html`<div className="role-band" data-test="role-band"><${RoleNotes} panel=${false} /></div>`;
}
// Trois états du rôle, dans la fenêtre et les panneaux : DÉTECTÉ par League (son poste est le rôle joué), CHOISI À LA MAIN (correction
// pendant la draft, ou lecture du client indisponible : la raison est dite, sans présenter la lecture comme obligatoire), INCONNU
// (lecture active, sélection en cours, mais League n'indique pas de poste). Rien hors de l'application.
function roleState() {
  if (!hostState.available) return null;
  const reading = hostState.lcuEnabled && hostState.lcuStatus === "connected";
  const why = !hostState.lcuEnabled || hostState.lcuStatus === "off" ? "role.manual.off" : hostState.lcuStatus === "failed" ? "role.manual.failed" : "role.manual.closed";
  const manual = text => ({ code:"manual", text, title:text });
  // Sans lecture, la raison est toujours dite, même après un changement à la main (le joueur sait pourquoi rien n'est détecté).
  if (!reading) return state.roleHandled && PROFILES.active === state.roleHandled && !state.roleManual ? { code:"detected", text:"role.state.detected", title:"role.state.detected" } : { code:"manual", text:PANEL ? "role.manual.short" : why, title:why };
  if (state.roleManual) return manual("role.state.manual");
  if (state.assignedRole && state.assignedRole === PROFILES.active) return { code:"detected", text:"role.state.detected", title:"role.state.detected" };
  // League indique un autre poste (mode « proposer », pool vide) : le rôle joué reste celui du profil, la proposition est affichée.
  if (state.assignedRole) return manual("role.state.manual");
  return state.sessionActive ? { code:"unknown", text:"role.state.unknown", title:"role.state.unknown" } : null;
}

// Outils de l'overlay (UX-6) : trois icônes SVG au lieu de caractères. Réglages d'affichage ouvre Réglages > Affichage et fenêtres.
const TOOL_PATHS = {
  one: "M4 4h12v12H4z",
  two: "M3 4h6v12H3zM11 4h6v12h-6z",
  display: "M4 6h12M4 14h12M7 4v4M13 12v4",
  hide: "M5 5l10 10M15 5 5 15",
  details: "M11 4h5v5M16 4l-6 6M9 16H4v-5M4 16l6-6",
  // Panneaux primaires : « Détails » (liste, vers la lecture approfondie) et « Conseil » (retour en haut).
  list: "M4 6h12M4 10h12M4 14h8",
  up: "M5 12l5-5 5 5"
};
const ToolIcon = ({ name }) => html`<svg className="tool-icon" viewBox="0 0 20 20" aria-hidden="true"><path d=${TOOL_PATHS[name]} fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
function openDisplaySettings() {
  if (IS_HOST) hostSend({ cmd:"openFull", tab:"settings", section:"display" });
  else window.open("?panel=full&view=settings&section=display", "draftmid-full");
}
function TitleBar() {
  return html`<header className="p-title">
    <${LogoMark} /><span className="brand" title=${t("brand.tagline")}>DRAFT</span>
    <span className="grow"></span>
    ${IS_HOST ? html`<span className="p-tools">
      <button type="button" className="p-btn" data-test="panel-toggle-compact" title=${hostState.compact ? t("panel.compact.two") : t("panel.compact.one")} aria-label=${hostState.compact ? t("panel.compact.toTwo") : t("panel.compact.toOne")} onClick=${() => hostSend({ cmd:"toggleCompact" })}><${ToolIcon} name=${hostState.compact ? "two" : "one"} /></button>
      <button type="button" className="p-btn" data-test="panel-settings" title=${t("panel.tools.display")} aria-label=${t("panel.tools.display")} onClick=${openDisplaySettings}><${ToolIcon} name="display" /></button>
      <button type="button" className="p-btn" data-test="panel-hide" title=${t("panel.hide")} aria-label=${t("panel.hideAll")} onClick=${() => hostSend({ cmd:"hideAll" })}><${ToolIcon} name="hide" /></button>
    </span>` : null}
  </header>`;
}

// Le nom affiché est-il 1er du classement ? Pendant la draft, il peut être maintenu alors qu'un autre mène de moins de HOLD_GAP points.
const shownIsFirst = () => { const first = V.res.ranking[0]; return !first || first.pick === V.shown || (first.tiedWith || []).includes(V.shown); };

// Panneaux (interface principale) : CONSULTER un champion = un clic sur l'alternative ou une ligne du pool, comme dans « Ton pool »
// de la fenêtre ; CONFIRMER = « Je joue X » (bouton principal), jamais un pick envoyé au client. « Comparer » ouvre la comparaison
// dans le panneau et ne choisit jamais. Sémantique de chaque élément : docs/technique/JOURNAL.md.
// Panneaux primaires (docs/technique/PANNEAUX-PROPOSITION.md) : en haut, la lecture IMMÉDIATE, sans défiler (conseil et pourquoi,
// risque, menace ou ban, champion consulté, actions) ; dessous, la lecture APPROFONDIE en sections dépliables d'un seul niveau,
// dans le panneau lui-même. « Détails » y mène sans ouvrir la grande fenêtre ; « Ouvrir le Simulateur » reste en dernier recours.
const pickTitle = () => simulating ? t("advice.cta.simHelp") : CTA_HELP;

// Emplacement « Dans League » des panneaux V2 : champion survolé ou verrouillé DANS League, à part du champion consulté. Il vient du
// pick lu par le programme (leagueNow, journal automatique), seulement quand la lecture est opérationnelle ; sinon LeagueLine dit
// pourquoi (lecture perdue, mode non noté, draft annulée). leagueSlot est une donnée de TEST, null dans l'application : seules les
// pages et captures de mise en page le remplissent ({ champion, state: "hover" | "locked" }), avec une donnée signalée comme fictive.
let leagueSlot = null;
function leagueShown() {
  if (leagueSlot) return leagueSlot.champion && (leagueSlot.state === "hover" || leagueSlot.state === "locked") ? leagueSlot : null;
  const l = leagueNow();
  if (!l || simulating || !hostState.lcuEnabled || !l.readable || !l.supported || l.lost || hostState.draftOutcome === "abandoned") return null;
  const pick = pickIdOf(l.champion);
  if (!pick || (l.state !== "hover" && l.state !== "locked" && l.state !== "final")) return null;
  return { champion: pick, state: l.state === "hover" ? "hover" : "locked", real: l.state, traded: !!l.traded };
}

// Tout le pool classé : un clic consulte (le bouton propose alors « Je joue X »), la coche marque le confirmé. Barre de force : la
// même échelle que le classement de la fenêtre (écart au premier), sans chiffre.
// Disponibilité (beta.2) : les champions du pool bannis ou déjà pris restent en fin de liste, marqués et inactifs (ni consultés, ni
// confirmés). Seulement avec la lecture du client ; le titre compte les champions encore jouables.
function PanelPool({ open, onToggle }) {
  const off = unavailablePool();
  if (V.none || V.order.length + off.length < 2) return null;
  const picked = currentPick(), viewed = viewedPick();
  const scores = V.order.map(p => p.score), lo = Math.min(...scores, 0), hi = Math.max(...scores, 1);
  return html`<details className="p-pool p-sec" data-test="panel-pool" data-sec="pool" open=${open} onToggle=${onToggle}>
    <summary><span>${tp("panel.pool.title", V.order.length)}</span></summary>
    <ul className="p-pool-list">${V.order.map((p, i) => {
      const [word, tone] = rankWord(p, i), n = label(p.pick), on = picked === p.pick, seen = viewed === p.pick;
      return html`<li key=${p.pick}><button type="button" className=${`p-pool-row${on ? " picked" : ""}${seen ? " viewed" : ""}`} data-test="panel-pool-pick" data-pick=${p.pick} aria-pressed=${on} aria-current=${seen ? "true" : undefined} title=${t("viewed.help")} onClick=${() => consult(p.pick)}>
        <${Portrait} name=${n} size=${28} /><span className="p-pool-name"><span className="p-nm" title=${n}>${n}</span><small className=${`rank-word ${tone}`}>${word}</small><span className="force p-force" aria-hidden="true"><i style=${{ transform:`scaleX(${Math.max(.04, (p.score - lo) / (hi - lo || 1))})` }} /></span></span>
        <span className="p-pool-go">${on ? html`<span aria-hidden="true">✓ </span>${t("panel.pool.noted")}` : seen ? t("viewed.label") : t("panel.pool.view")}</span>
      </button></li>`;
    })}${off.map(x => html`<li key=${x.pick}><div className="p-pool-row off" data-test="panel-pool-off" data-pick=${x.pick} data-reason=${x.reason} aria-disabled="true" title=${t("panel.pool.offHelp")}>
        <${Portrait} name=${label(x.pick)} size=${28} /><span className="p-pool-name"><span className="p-nm" title=${label(x.pick)}>${label(x.pick)}</span><small className="rank-word bad">${t(OFF_KEYS[x.reason])}</small></span>
      </div></li>`)}</ul>
    <${FamiliarLine} />
  </details>`;
}

// Une section de la lecture approfondie : un seul niveau. Son contenu n'est calculé qu'une fois ouverte.
function PanelSec({ id, title, sub, open, onToggle, body }) {
  return html`<details className="p-sec" data-sec=${id} data-test=${`panel-sec-${id}`} open=${open} onToggle=${onToggle}>
    <summary title=${id === "why" && viewedPick() ? t("viewed.more") : undefined}><span>${title}</span>${sub ? html`<small>${sub}</small>` : null}</summary>
    ${open ? html`<div className="p-sec-body">${body()}</div>` : null}
  </details>`;
}

const sameAll = lists => lists.length ? lists.reduce((a, b) => a.filter(x => b.includes(x))) : [];
const FaceList = ({ names, text, cls }) => html`<ul className=${`p-faces${cls ? ` ${cls}` : ""}`}>${names.map(n => html`<li key=${n}><${Portrait} name=${n} size=${28} /><span><b>${n}</b>${text(n) ? html`<small>${text(n)}</small>` : null}</span></li>`)}</ul>`;

// Lecture approfondie : ce que la fenêtre montre pendant une draft, ramené dans le panneau. Elle suit le champion CONSULTÉ (sinon le
// choix confirmé, sinon le conseil) : avantages et inconvénients, pourquoi DRAFT préfère un autre, plan, menaces et cibles, critères.
function PanelDeep({ compact, open, toggle, alt }) {
  if (V.none) return null;
  const c = V.res.counts, playing = playingPick();
  const entry = playing ? V.res.ranking.find(p => p.pick === playing) : null;
  const ref = entry ? V.res.ranking.find(p => p.pick === (V.tied ? V.tied.find(x => x !== playing) || V.shown : V.shown)) : null;
  // À égalité sans champion consulté : seul ce qui vaut pour tous les ex æquo est montré.
  const subjects = playing ? [playing] : V.tied || [V.shown];
  const subject = entry || V.res.ranking.find(p => p.pick === subjects[0]);
  const pairPicks = viewedPick() && ref ? [ref.pick, viewedPick()] : V.tied ? V.tied.slice(0, 2) : V.rival ? [V.shown, V.rival.pick] : null;
  const pair = pairPicks ? pairPicks.map(p => V.res.ranking.find(x => x.pick === p)) : null;
  const sec = (id, title, body, sub) => html`<${PanelSec} key=${id} id=${id} title=${title} sub=${sub} open=${open.has(id)} onToggle=${e => toggle(id, e.currentTarget.open)} body=${body} />`;
  const rs = roleState(), reading = hostState.available && hostState.lcuEnabled && hostState.lcuStatus === "connected";

  const why = () => {
    const pros = entry ? entry.why.filter(w => w.v > 0).sort((a, b) => b.v - a.v).map(w => signedText(w, 1)).filter(Boolean) : V.commonReasons;
    const cons = entry ? entry.why.filter(w => w.v < 0).sort((a, b) => a.v - b.v).map(w => signedText(w, -1)).filter(Boolean) : [];
    const matchup = entry && entry.criteria.find(x => x.key === "matchup" && x.text);
    return html`<p className="p-sec-lead">${entry ? positionText(V.res.ranking, entry) : tieCauseText(tieCause(V.res.ranking, V.tied), V.tied[0])}</p>
      ${entry && ref && ref !== entry ? html`<p className="p-prefers" data-test="panel-prefers"><b>${t("panel.why.prefers", { champion: label(ref.pick) })}</b> ${compareSummary(entry, ref)}</p>` : null}
      <h3 className="p-sub good">${t("panel.pros")}</h3>
      <ul className="p-list pros">${(pros.length ? pros : [t("panel.pros.none")]).map(x => html`<li key=${x}>${x}</li>`)}</ul>
      ${entry ? html`<h3 className="p-sub bad">${t("panel.cons")}</h3>
        <ul className="p-list cons">${(cons.length ? cons : [t("panel.cons.none")]).map(x => html`<li key=${x}>${x}</li>`)}</ul>` : null}
      ${matchup ? html`<p className="note">${t("viewed.matchup", { text: matchup.text })}</p>` : null}
      <${OpponentLine} />
      ${playing === V.shown && V.avoided.length ? html`<p className="note">${t("advice.more.avoid")} <span className="avoid">${V.avoided.map(label).join(", ")}</span></p>` : null}
      ${playing === V.shown && V.personal ? html`<p className="note">${t("advice.more.personal", { record: V.personal })}</p>` : null}
      ${playing === V.shown && V.without ? html`<p className="note">${t("advice.more.noFront")} <b>${label(V.without)}</b></p>` : null}`;
  };
  const plan = () => {
    if (!playing) return html`<p className="note">${t("panel.choosePlan")}</p>`;
    const steps = buildPlan(playing, c, V.mid, deriveSlots().jungle);
    return html`<p className="p-win-line"><b>${t("plan.winIf")}</b> ${winCondition(playing, c)}</p>
      <${CoachLine} />
      ${PHASES.map(([k, text]) => steps[k] && steps[k].length ? html`<div key=${k} className="p-phase"><h3 className="p-sub">${text}</h3><ul className="p-list">${steps[k].map(x => html`<li key=${x}>${x}</li>`)}</ul></div>` : null)}
      <p className="note">${t(V.n > 1 ? "plan.basis.many" : V.n ? "plan.basis.one" : "plan.basis.none", { count: V.n })}</p>`;
  };
  const threats = () => {
    const th = sameAll(subjects.map(p => threatsFor(p, c))), tg = sameAll(subjects.map(p => targetsFor(p, c)));
    return html`<h3 className="p-sub bad">${t("plan.threats")}</h3>
      ${th.length ? html`<${FaceList} names=${th} cls="threat" text=${n => playing ? threatText(playing, n, c) : t("panel.threat.common")} />` : html`<p className="note">${t("plan.threatsNone")}</p>`}
      <h3 className="p-sub good">${t("plan.targets")}</h3>
      ${tg.length ? html`<${FaceList} names=${tg} cls="target" text=${() => ""} />` : html`<p className="note">${t("plan.targetsNone")}</p>`}`;
  };
  const bans = () => V.bans.length
    ? html`<${FaceList} names=${V.bans} cls="ban" text=${n => banReason(n) ? t("panel.ban.reason", { champion: n, reason: banReason(n) }) : ""} />`
    : html`<p className="note" data-test="panel-bans-none">${t(V.bansTaken ? "panel.bans.allTaken" : "plan.bansNone")}</p>`;
  const compare = () => {
    const [a, b] = pair, cmp = comparePicks(a, b), max = Math.max(1, ...cmp.rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)]));
    return html`<p className="p-sec-lead">${compareSummary(a, b)}</p>
      ${cmp.rows.length ? html`<div className="p-cmp">
          <div className="cmp-row cmp-legend" aria-hidden="true"><span></span><span className="cmp-bars"><span>${label(a.pick)}</span><span>${label(b.pick)}</span></span></div>
          ${cmp.rows.map(r => html`<${CompareBar} key=${r.key} row=${r} max=${max} />`)}
        </div>` : html`<p className="note">${t("compare.noCriterion")}</p>`}`;
  };
  const criteria = () => {
    const rows = CRITERIA.map(def => ({ def, cr: subject.criteria.find(x => x.key === def.key) })).filter(r => r.cr);
    return html`<p className="p-sec-lead">${t("panel.criteria.for", { champion: label(subject.pick) })}</p>
      <ul className="p-crit">${rows.map(({ def, cr }) => html`<li key=${def.key} className=${cr.impact > 0 ? "up" : cr.impact < 0 ? "down" : ""}>
        <span className="p-crit-mark" title=${impactText(cr.impact)}>${IMPACT_MARK(cr.impact)}</span><span><b>${def.label}</b>${cr.text ? html`<small>${cr.text}</small>` : null}</span></li>`)}</ul>
      ${V.n < 5 ? html`<p className="note">${tp("analysis.incomplete", V.n)}</p>` : null}`;
  };
  const compo = () => html`<${DraftEffects} />
    <div className="meters p-meters">
      <${Meter} label=${t("enemy.meter.front")} count=${c.front.length} />
      <${Meter} label=${t("enemy.meter.carries")} count=${c.carries.length} />
      <${Meter} label=${t("enemy.meter.dive")} count=${c.divers.length} danger=${true} />
      <${Meter} label=${t("enemy.meter.cc")} count=${c.cc.length} danger=${true} />
      <${Meter} label=${t("enemy.meter.engage")} count=${c.engage.length} />
    </div>
    <p className="note">${t("enemy.legend")}</p>`;
  const sources = () => html`<p className="note" data-test="panel-source">${t("panel.sources.enemies", { source: t(reading ? "panel.source.client" : "panel.source.manual") })}</p>
    ${rs ? html`<p className="note">${t(rs.title)}</p>` : null}
    <p className="note">${t(leagueSlot && leagueShown() ? "panel.sources.leagueTest" : leagueShown() ? "panel.sources.league" : "panel.sources.pick")}</p>`;

  return html`<section className="p-deep" id="p-deep" data-test="panel-details" aria-label=${t("panel.deep.title")}>
    <h2 className="p-deep-title">${t("panel.deep.title")}</h2>
    ${alt}
    <${PanelPool} open=${open.has("pool")} onToggle=${e => toggle("pool", e.currentTarget.open)} />
    ${sec("why", playing ? t("panel.sec.why", { champion: label(playing) }) : t("panel.sec.whyTie"), why)}
    ${sec("plan", playing ? t("panel.sec.plan", { champion: label(playing) }) : t("plan.title"), plan)}
    ${sec("threats", t("panel.sec.threats"), threats)}
    ${sec("bans", t("panel.sec.bans"), bans, V.bans.length ? V.bans.join(", ") : "")}
    ${pair && pair.every(Boolean) && pair[0] !== pair[1] ? sec("compare", t("panel.sec.compare", { a: label(pair[0].pick), b: label(pair[1].pick) }), compare) : null}
    ${subject ? sec("criteria", t("panel.sec.criteria"), criteria) : null}
    ${compact || leftHidden() ? sec("compo", t("panel.sec.compo"), compo) : null}
    ${sec("sources", t("panel.sec.sources"), sources)}
    <button type="button" className="link-btn p-openfull" data-test="open-full" title=${t("panel.openFullHelp")} onClick=${() => openDetail("analyse")}>${t("panel.openFull")}</button>
  </section>`;
}

// Carte du conseil : portrait en fond, étiquette, état (net, serré) et nombre d'adversaires connus.
function PanelReco({ name }) {
  return html`<section className="p-reco" data-test="panel-reco" aria-label=${t("panel.reco.label")}>
    <${SplashStack} name=${name} />
    <div className="p-reco-scrim"></div>
    <${motion.div} key=${name} className="p-reco-text" initial=${{ y:6, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${QUICK}>

function VerdictPanel({ compact }) {
  const [open, setOpen] = useState(() => new Set());
  const [deepIn, setDeepIn] = useState(false);
  const toggle = (id, on) => setOpen(prev => { if (prev.has(id) === !!on) return prev; const next = new Set(prev); if (on) next.add(id); else next.delete(id); return next; });
  // « Détails » mène à la lecture approfondie, et « Conseil » ramène en haut : défilement instantané, aucune animation longue.
  // « Conseil » seulement après un vrai défilement : à la hauteur V2 (711 px), la lecture approfondie commence déjà dans la moitié
  // haute sans défiler ; le bouton y proposait « Conseil », et un clic ne faisait rien. Sans défilement, « Détails » reste l'entrée.
  const scroller = deep => deep.closest(".p-scroll") || deep.closest(".p-body");
  useEffect(() => {
    const deep = document.getElementById("p-deep");
    if (!deep) return;
    const sc = scroller(deep);
    const on = () => { const r = sc.getBoundingClientRect(); setDeepIn(sc.scrollTop >= 1 && deep.getBoundingClientRect().top < r.top + r.height * .5); };
    on();
    sc.addEventListener("scroll", on, { passive:true });
    return () => sc.removeEventListener("scroll", on);
  });
  // Un champion consulté (alternative, liste du pool, autre fenêtre) : retour en haut du panneau, où sa carte et « Je joue » se lisent
  // sans défiler. Sa lecture approfondie (« Pourquoi X ») reste à un clic de « Détails ».
  // Le défilement demandé par « Détails » ou « Comparer » est fait après le rendu de la section ouverte (effet ci-dessous, sans
  // requestAnimationFrame) : une consultation faite entre-temps l'annule et ramène en haut.
  const viewedNow = viewedPick(), lastViewed = useRef(viewedNow), pendingScroll = useRef(null);
  const [, bump] = useReducer(x => x + 1, 0);
  useEffect(() => {
    const deep = document.getElementById("p-deep");
    if (viewedNow && viewedNow !== lastViewed.current) { pendingScroll.current = null; if (deep) scroller(deep).scrollTop = 0; }
    lastViewed.current = viewedNow;
    if (pendingScroll.current && deep) {
      const sc = scroller(deep), id = pendingScroll.current, el = id === "deep" ? deep : deep.querySelector(`[data-sec="${id}"]`) || deep;
      pendingScroll.current = null;
      sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 6;
    }
  });
  const goDeep = id => {
    const deep = document.getElementById("p-deep");
    if (!deep) return;
    const sc = scroller(deep);
    if (!id && deepIn) { sc.scrollTop = 0; return; }
    const target = id || (open.size ? null : "why");
    if (target) toggle(target, true);
    pendingScroll.current = id || "deep";
    bump();
  };
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const pending = !entry && !state.enemies.length && lastGameToComplete(loadJournal());
  if (V.none) return html`<div className="p-body"><p className="p-empty" data-test="no-pick">${noPickText()}</p><button type="button" className="ghost-btn" data-test="choose-profile" onClick=${() => hostSend({ cmd:"openFull", tab:"pool" })}>${t("panel.openPool")}</button></div>`;
  const name = label(V.shown);
  const c = V.res.counts;
  // À égalité, un danger ou un plan propre au premier nom le désignerait à tort : seul ce qui vaut pour tous reste affiché.
  const threats = (V.tied || [V.shown]).map(p => threatsFor(p, c)[0]);
  const threat = threats.every(x => x === threats[0]) ? threats[0] : null;
  const cta = pickCta();
  const why = (V.tied ? V.commonReasons : V.reasons)[0];
  const viewed = viewedPick();
  // Information stratégique principale, juste après le conseil : la menace ; avant tout adversaire, le ban conseillé.
  // QA-2 et correctif beta.1 : elle reste visible sans défiler à 125 %, au-dessus de la barre d'actions.
  const keyBox = threat ? html`<section className="p-threat" data-test="panel-threat" aria-label=${t("panel.threat.label")}>
      <${Portrait} name=${threat} size=${36} />
      <div><b title=${t("panel.threat.title", { champion: threat })}>${t("panel.threat.title", { champion: threat })}</b><p title=${V.tied ? t("panel.threat.common") : threatText(V.shown, threat, c)}>${V.tied ? t("panel.threat.common") : threatText(V.shown, threat, c)}</p></div>
    </section>`
    : !V.n && V.bans[0] ? html`<section className="p-keyban" data-test="panel-keyban" aria-label=${t("panel.ban.title")}>
      <${Portrait} name=${V.bans[0]} size=${36} />
      <div><b>${t("panel.keyban.title", { champion: V.bans[0] })}</b><p>${banReason(V.bans[0]) ? t("panel.ban.reason", { champion: V.bans[0], reason: banReason(V.bans[0]) }) : t("panel.keyban.none")}</p>${V.bans.length > 1 ? html`<p className="p-keyban-more">${t("panel.ban.or", { champions: V.bans.slice(1).join(", ") })}</p>` : null}</div>
    </section>`
    : !V.tied && V.risk ? html`<p className="p-why-con p-risk" data-test="panel-risk"><b>${t("panel.risk.label")}</b> ${V.risk}</p>` : null;
  const altLine = V.rival ? html`<div className=${`p-alt${viewed === V.rival.pick ? " viewed" : ""}`} data-test="alt-line">
      <button type="button" className="p-alt-view" data-test="view-alt" data-pick=${V.rival.pick} aria-current=${viewed === V.rival.pick ? "true" : undefined} title=${t("viewed.help")} onClick=${() => consult(V.rival.pick)}>
        <${Portrait} name=${label(V.rival.pick)} size=${compact ? 32 : 40} />
        <span className="p-alt-text"><small>${t(V.tied ? "advice.alt.else" : V.clear ? "advice.rank.alternative" : shownIsFirst() ? "panel.alt.almostTie" : "panel.alt.justAhead")}</small><span className="p-nm" title=${label(V.rival.pick)}>${label(V.rival.pick)}</span></span>
      </button>
      <button type="button" className="p-alt-go" data-test="open-compare" title=${t("panel.compareTitle")} onClick=${() => goDeep("compare")}>${t("panel.compare")}</button>
    </div>` : null;
  return html`<div className="p-body">
    <p className="sr" aria-live="polite">${speakVerdict(name)}</p>
    ${compact ? null : html`<${CompoAccess} />`}
    <div className="p-now" data-test="panel-now">
      ${V.tied ? html`<${TieGroup} detailed=${false} panel=${true} />` : html`<${PanelReco} name=${name} />`}
      ${!compact || why ? html`<div className="p-why" data-test="panel-why" aria-label=${t("panel.why")}>
          <p className="p-why-pro"><b>${t("panel.why.label")}</b> ${why || t(V.tied ? "panel.reasons.tieDiffer" : "panel.reasons.none")}</p>
        </div>` : null}
      ${keyBox}
      <${ViewedCard} panel=${true} />
      ${V.change ? html`<${motion.p} key=${V.change.id} className="p-change" initial=${{ opacity:.4 }} animate=${{ opacity:1 }} transition=${QUICK}>${tx("advice.change.line", { trigger: html`<b>${t("advice.change.trigger", { trigger: V.change.trigger })}</b>`, to: V.change.to, from: V.change.from })}</${motion.p}>`
        : V.gone ? html`<${motion.p} key=${V.gone.id} className="p-change p-gone" data-test="panel-gone" role="status" initial=${{ opacity:.4 }} animate=${{ opacity:1 }} transition=${QUICK}>${goneText(V.gone)}</${motion.p}>` : null}
      ${!compact && !(viewed && V.rival && viewed === V.rival.pick) ? altLine : null}
    </div>
    <${PanelDeep} compact=${compact} open=${open} toggle=${toggle} alt=${compact && !(viewed && V.rival && viewed === V.rival.pick) ? altLine : null} />
    <${PanelActions} cta=${cta} deepIn=${deepIn} onDetails=${() => goDeep(null)} />
    ${entry || pending ? html`<div className="p-results">
      ${pending ? html`<p className="result-note" data-test="last-game">${tx("plan.lastGame", { pick: html`<b>${label(pending.picked)}</b>` })}</p>` : null}
      <${EntryResult} entry=${entry} pending=${pending} />
    </div>` : null}
  </div>`;
}

// Modifie le pool d'un rôle sans toucher aux autres. Un pool vide est permis : le rôle reste configuré.
function saveMyProfile(role, names) {
  const pool = uniqueList(names.map(pickId));
  const r = PROFILES.roles[role];
  r.pool = pool;
  r.excluded = r.excluded.filter(p => pool.includes(p));
  if (!pool.includes(r.favorite)) r.favorite = null;
  // Premier rôle configuré : il devient le rôle joué. Ensuite, modifier le pool d'un autre rôle ne change
  // ni le rôle joué ni le conseil (audit UX, problème 4) : « Jouer ce rôle » le fait explicitement.
  if (!PROFILES.active) { switchRole(role, "manual"); return; }
  storeProfiles();
  if (PROFILES.active !== role) { publish(null); return; }
  useActiveRole();
  state.held = null;
  pool.forEach(p => preloadSplash(label(p)));
  sendProfile();
  commit();
}

function ProfileBackup() {
  const [note, setNote] = useState("");
  const [, refresh] = useState(0);
  const download = () => {
    const url = URL.createObjectURL(new Blob([exportConfig(PROFILES, PREFS, APP_VERSION)], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "draft-profils.json"; a.click(); URL.revokeObjectURL(url);
    setNote(t("pool.backup.exported"));
  };
  const load = e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    file.text().then(text => {
      const parsed = parseConfig(text);
      if (!parsed.ok) { setNote(t("pool.backup.refused", { error: parsed.error })); return; }
      const done = applyConfig(parsed, PROFILES, localStorage);
      if (!done.ok) { setNote(done.error); return; }
      PROFILES = done.profiles;
      Object.assign(PREFS, parsed.preferences);
      // Un export ne porte pas le marqueur du choix : « suggest » importé est traité comme l'ancien défaut, comme au chargement.
      if (PREFS.autoRole === "suggest" && !PREFS.autoRoleChosen) PREFS.autoRole = "auto";
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e2) {}
      writeLegacyMark(localStorage);
      storeProfiles();
      useActiveRole();
      sendProfile();
      commit();
      setNote(parsed.warnings.length ? t("pool.backup.importedWarnings", { warnings: parsed.warnings.join(" ") }) : t("pool.backup.imported"));
      refresh(x => x + 1);
    }).catch(() => setNote(t("pool.backup.unreadable")));
  };
  const undo = () => {
    const back = restoreLastBackup(localStorage);
    if (!back) return;
    PROFILES = back; storeProfiles(); useActiveRole(); sendProfile(); commit();
    setNote(t("pool.backup.restored")); refresh(x => x + 1);
  };
  return html`<div className="set-row profile-backup">
    <button type="button" className="ghost-btn" data-test="export-profiles" onClick=${download}>${t("pool.backup.export")}</button>
    <label className="ghost-btn file-btn">${t("pool.backup.import")}<input type="file" data-test="import-profiles" accept=".json,application/json" aria-label=${t("pool.backup.importLabel")} onChange=${load} /></label>
    ${latestProfilesBackup(localStorage) ? html`<button type="button" className="ghost-btn" data-test="undo-profiles-import" onClick=${undo}>${t("pool.backup.undo")}</button>` : null}
    ${note ? html`<p className="small" role="status">${note}</p>` : null}
  </div>`;
}

// ---------- Fenêtre principale : cinq sections (UX-3) ----------
// Adresses : ?view=home|pool|sim|stats|settings (&section= pour les Réglages). Alias gardés une version : ?tab=settings, ?tab=parties,
// et les onglets du Simulateur (?tab=analyse, compare, coach...). Les nouveaux textes passent par t() (web/i18n/fr.js).
const VIEWS = ["home", "pool", "sim", "stats", "settings"];
const SETTINGS_SECTIONS = ["general", "league", "display", "data", "updates", "diag"];
function viewFromAddress() {
  const q = new URLSearchParams(location.search), v = q.get("view"), tab = q.get("tab");
  if (VIEWS.includes(v)) return v;
  if (tab === "settings") return "settings";
  if (tab === "parties") return "stats";
  if (VIEWS.includes(tab)) return tab;
  // Tout autre onglet (« simulate », « analyse », « compare »...) est une demande précise du Simulateur.
  if (tab) return "sim";
  // UX-8 : sans demande précise (adresse sans vue ni onglet), la fenêtre principale s'ouvre sur l'Accueil.
  return "home";
}
let uiView = viewFromAddress(), uiBack = "home";
let uiSection = (() => { const s = new URLSearchParams(location.search).get("section"); return SETTINGS_SECTIONS.includes(s) ? s : "general"; })();
function goView(view, section) {
  if (!VIEWS.includes(view)) return;
  if (view === "settings" && uiView !== "settings") uiBack = uiView;
  uiView = view;
  if (SETTINGS_SECTIONS.includes(section)) uiSection = section;
  if (PANEL === "full") history.replaceState(null, "", `?panel=full&view=${view}${view === "settings" ? `&section=${uiSection}` : ""}`);
  rerender();
  if (view === "sim") setTimeout(focusAdd, 0);
}

const ViewHead = ({ title, sub, tools }) => html`<header className="view-head">

// ---------- Accueil (UX-8) : une seule chose forte, puis la chaîne de la draft et deux cartes d'état ----------
// L'Accueil lit l'état sans rien changer : aucun rôle, pool ou réglage n'est modifié sans un clic sur l'action qui le dit.
// Le guide du premier lancement ne garde que sa progression (étapes faites ou ignorées), dans sa propre clé du stockage.
const ONBOARDING_KEY = "draftOnboarding";
const onboarding = () => { try { return Object.assign({ started:false, skipped:[], tried:false }, JSON.parse(localStorage.getItem(ONBOARDING_KEY)) || {}); } catch (e) { return { started:false, skipped:[], tried:false }; } };
function storeOnboarding(change) {
  try { localStorage.setItem(ONBOARDING_KEY, JSON.stringify(Object.assign(onboarding(), change))); } catch (e) {}
  rerender();
}
// Dates et heures selon la langue (draft-i18n.js) : en français, rendu identique à avant.
const frDate = d => fmtDate(d);
const frTime = d => I18N.fmtTime(d);
// État de la lecture du client : « browser » hors application, « unavailable » si la version l'a coupée.
function leagueState() {
  if (!hostState.available) return "browser";
  if (!hostState.lcuConfirmed) return "unavailable";
  return ["connected", "waiting", "failed"].includes(hostState.lcuStatus) ? hostState.lcuStatus : "off";
}
const LEAGUE_DOT = { connected:"good", waiting:"wait", failed:"bad", off:"idle", unavailable:"idle", browser:"idle" };
// Conseil en blind du rôle joué : le 1er du même calcul que les panneaux sans adversaire (aucun poids ni tri propre à l'Accueil).
function blindAdvice() {
  if (!PROFILE || !PICKS.length) return null;
  const ranking = analyze([], null, PREFS.assumeFront).ranking;
  if (!ranking.length) return { none:true };
  return { names:[ranking[0].pick].concat(ranking[0].tiedWith || []).map(label) };
}
const liveDraft = () => { const s = simulating ? liveCopy : state; return s && s.sessionActive ? s : null; };

function HomeGuide({ steps }) {
  const shortcut = hostState.hotkey ? "home.guide.panels.text" : "home.guide.panels.textMenu";
  const skip = id => storeOnboarding({ started:true, skipped:onboarding().skipped.concat(id) });
  const step = (id, n, title, body, action) => html`<li key=${id} className="guide-step" data-test=${`guide-step-${id}`}>
    <div className="guide-head"><span className="guide-num num" aria-hidden="true">${n}</span><h3>${title}</h3></div>
    <div className="guide-text">${body}</div>
    <div className="guide-acts">${action}<button type="button" className="link-btn" data-test=${`guide-skip-${id}`} aria-label=${t("home.guide.skipLabel", { step:title })} onClick=${() => skip(id)}>${t("home.guide.skip")}</button></div>
  </li>`;
  const poolReady = !!PROFILE && PICKS.length > 0, busy = !!liveDraft() || !!hostState.panelsShown;
  return html`<section className="box home-guide" data-test="home-guide" aria-labelledby="guide-title">
    <h2 id="guide-title" className="home-title">${t("home.guide.title")}</h2>
    <p className="home-lead">${t("home.guide.lead")}</p>
    <ol className="guide-steps" aria-label=${t("home.guide.steps")}>
      ${steps.includes("pool") ? step("pool", 1, t("home.guide.pool.title"), html`<p>${t("home.guide.pool.text")}</p>`,
        html`<button type="button" className="cta" data-test="guide-pool" onClick=${() => { storeOnboarding({ started:true }); goView("pool"); }}>${t("home.guide.pool.action")}</button>`) : null}
      ${steps.includes("lcu") ? step("lcu", 2, t("home.guide.lcu.title"), html`<p><span className="guide-tag">${t("home.guide.lcu.tag")}</span> ${t("home.guide.lcu.text")}</p><p className="guide-risk" data-test="guide-lcu-risk">${t("home.lcu.risk")}</p>`,
        hostState.available ? html`<button type="button" className="ghost-btn guide-go" data-test="guide-lcu" onClick=${() => { storeOnboarding({ started:true }); hostSend({ cmd:"setLcu", value:true }); }}>${t("home.guide.lcu.action")}</button>`
          : html`<span className="small">${t("home.appOnly")}</span>`) : null}
      ${steps.includes("panels") ? step("panels", 3, t("home.guide.panels.title"), html`<p>${t(shortcut)}</p>${!poolReady ? html`<p className="small" data-test="guide-panels-wait">${t("home.guide.panels.needPool")}</p>` : busy ? html`<p className="small">${t("home.guide.panels.busy")}</p>` : null}`,
        hostState.available ? html`<button type="button" className="ghost-btn guide-go" data-test="guide-panels" disabled=${!poolReady || busy} onClick=${() => { storeOnboarding({ started:true, tried:true }); hostSend({ cmd:"tryPanels" }); }}>${t("home.guide.panels.action")}</button>`

function HomeHero() {
  const role = PROFILES.active, count = role ? PROFILES.roles[role].pool.length : 0, lcu = leagueState(), live = liveDraft();
  const blind = role && count ? blindAdvice() : null;
  const toPool = html`<button type="button" className="cta" data-test="home-open-pool" onClick=${() => goView("pool")}>${t("home.action.openPool")}</button>`;
  const simulate = html`<button type="button" className=${role && count ? "cta" : "ghost-btn"} data-test="home-simulate" onClick=${() => { startSimulation(); goView("sim"); }}>${t("home.action.simulate")}</button>`;
  let tone = "ready", title, lead, actions;
  if (!role) { tone = "todo"; title = t("home.hero.noRole"); lead = t("home.hero.noRole.lead"); actions = toPool; }
  else if (!count) { tone = "todo"; title = t("home.hero.emptyPool", { role:ROLE_NAMES[role] }); lead = t("home.hero.emptyPool.lead", { role:ROLE_NAMES[role] }); actions = toPool; }
  else if (blind && blind.none) { tone = "todo"; title = t("home.hero.allExcluded", { role:ROLE_NAMES[role] }); lead = t("home.hero.allExcluded.lead"); actions = toPool; }
  else if (lcu === "failed") {
    tone = "error"; title = t("home.hero.failed"); lead = t("home.hero.failed.lead");
    actions = html`<button type="button" className="cta" data-test="home-diagnostic" onClick=${() => hostSend({ cmd:"lcuDiagnostic" })}>${t("settings.diag.lcu")}</button>
      <button type="button" className="ghost-btn" data-test="home-league-settings" onClick=${() => goView("settings", "league")}>${t("home.action.leagueSettings")}</button>`;
  } else if (live) {
    tone = "live"; title = t("home.hero.live");
    lead = tp("home.hero.live.lead", live.enemies.length) + (!simulating && V && V.shown ? " " + t("home.hero.live.advice", { champion:label(V.shown) }) : "");
    actions = html`<button type="button" className="cta" data-test="home-see-draft" onClick=${() => openViewInPage("", "live")}>${t("home.action.seeDraft")}</button>`;
  } else {
    title = t("home.hero.ready");
    lead = t(lcu === "browser" ? "home.hero.ready.browser" : !hostState.autoDraft ? (hostState.hotkey ? "home.hero.ready.manualHotkey" : "home.hero.ready.manualMenu") : lcu === "connected" ? "home.hero.ready.connected" : lcu === "waiting" ? "home.hero.ready.waiting" : lcu === "unavailable" ? "home.hero.ready.unavailable" : "home.hero.ready.off");
    actions = simulate;
  }
  const mark = { ready:"check", todo:"dot", error:"alert", live:"pulse" }[tone];
  return html`<section className=${`box home-hero tone-${tone}`} data-test="home-hero" data-tone=${tone} aria-labelledby="home-hero-title">
    <span className="hero-mark" aria-hidden="true"><${NavIcon} name=${mark} /></span>
    <div className="hero-text"><h2 id="home-hero-title" className="home-title">${title}</h2><p className="home-lead">${lead}</p></div>
    <div className="hero-acts">${actions}${tone !== "ready" && tone !== "live" && role && count ? html`<button type="button" className="ghost-btn" data-test="home-simulate" onClick=${() => { startSimulation(); goView("sim"); }}>${t("home.action.simulate")}</button>` : null}</div>
  </section>`;
}

function LegacyNotice() {

  const n = legacyNotice(localStorage);
  if (!n) return null;
  return html`<p className="set-hint flush" role="status" data-test="legacy-notice" data-kind=${n.kind}>${t(n.kind === "taken" ? "profiles.legacy.taken" : "profiles.legacy.kept", { role:ROLE_NAMES[n.role] })} <button type="button" className="link-btn" data-test="legacy-notice-ok" onClick=${() => { dismissLegacyNotice(localStorage); setSeen(x => x + 1); }}>${t("profiles.legacy.dismiss")}</button></p>`;
