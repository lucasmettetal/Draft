<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file: https://ddragon.leagueoflegends.com; connect-src https://ddragon.leagueoflegends.com; font-src 'self' data: file:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAFT</title>
<style>
  :root {
    /* B+ (docs/direction/PLAN-B-PLUS.md) : graphite très sombre à nuance prune ; chaque couleur a un seul sens. */
    --bg:#17141D; --surface:#1E1A25; --raised:#26202E; --line:#362F40; --text:#F2ECE4; --muted:#B5ABA3;
    /* Or : conseil, priorité, pick choisi, action principale. Vert : réussite, force. Corail : menace, risque, faiblesse. */
    --prio:#E5B55A; --prio-ink:#241806; --good:#82CFA8; --good-ink:#0B2618; --threat:#F1847A; --threat-ink:#2B0D0A;
    /* Connexion League, sécurité (lecture seule, données locales), hypothèse ; sélection et focus en ivoire. */
    --conn:#79C6DA; --secure:#C9A7E8; --info:#A3B4EC; --focus:#F2ECE4; --select:#F2ECE4;
    --accent:var(--good); --accent-ink:var(--good-ink); --gold:var(--prio);
    /* Couleurs de rôle : cadres de portrait et icônes de rôle seulement. */
    --r-top:#D0703A; --r-jungle:#9DBF6E; --r-mid:#6FB0EC; --r-adc:#EC8AAE; --r-support:#B69AEE;
    --display:"Sitka Banner","Sitka Heading","Sitka Display",Georgia,serif;
    --condensed:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed",Bahnschrift,"Arial Narrow",Arial,sans-serif;
    --body:Bahnschrift,"Segoe UI",Arial,sans-serif;
    --figures:lining-nums tabular-nums;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  * { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 var(--body); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  h2, h3, p, ul { margin:0; padding:0; }
  ul { list-style:none; }

  .app { display:grid; grid-template-rows:52px minmax(0,1fr); height:100vh; }
  .top { display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line); }
.source-switch { margin:0; }
.sim-band { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:6px 18px; background:rgba(163,180,236,.08); border-bottom:1px dashed var(--info); color:var(--text); font-size:13px; }
.sim-band p { margin:0; }
.sim-band .grow { flex:1; }
.sim-band b { color:var(--info); font-weight:600; }
  .brand { font:18px var(--condensed); letter-spacing:.02em; }
  .brand b { color:var(--prio); font-weight:inherit; }
  .patch { color:var(--muted); font-size:13px; }
  .top .grow { flex:1; }
  .ghost-btn { min-height:32px; padding:4px 12px; background:transparent; border:1px solid var(--line-strong); border-radius:6px; color:var(--text); font-size:13px; }
  .ghost-btn:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .ghost-btn:disabled { color:var(--muted); opacity:.55; }

  .desk { display:grid; grid-template-columns:clamp(300px,23vw,420px) minmax(0,1fr) clamp(310px,24vw,440px); min-height:0; }
  .col { min-height:0; display:flex; flex-direction:column; }
  .col-left { padding:14px; background:var(--surface); border-right:1px solid var(--line); overflow:auto; }
  .col-mid { padding:14px; gap:12px; overflow:auto; }
  .col-right { background:var(--surface); border-left:1px solid var(--line); overflow:hidden; }

  .sec-title { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font:18px var(--condensed); letter-spacing:.02em; }
  .sec-title small { color:var(--muted); font:13px var(--body); }

  /* Saisie */
  .search { position:relative; margin-bottom:6px; }
  #add, #q { width:100%; height:42px; padding:0 12px; background:var(--bg); border:1px solid var(--line-strong); border-radius:6px; font-size:15px; outline:none; transition:border-color .12s; }
  #add:focus, #q:focus { border-color:var(--focus); }
  #add:disabled { opacity:.55; }
  #add::placeholder, #q::placeholder { color:var(--muted); opacity:1; }
  .sugg { position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px); padding:4px; background:var(--raised); border:1px solid var(--line); border-radius:6px; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .sugg-item { display:flex; align-items:center; gap:10px; width:100%; padding:5px 8px; background:none; border:0; border-radius:4px; text-align:left; }
  .sugg-item.on, .sugg-item:hover { background:var(--line); }
  .sugg-empty { padding:8px; color:var(--muted); font-size:13px; }
  .hint { min-height:18px; margin-bottom:10px; color:var(--muted); font-size:12px; }
  .hint.warn { color:var(--info); }

  /* Portraits */
  .portrait { position:relative; flex:none; display:block; overflow:hidden; background:var(--raised); border-radius:6px; }
  .portrait img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .16s; }
  .portrait img.ready { opacity:1; }
  .portrait.loading { background:linear-gradient(100deg,var(--raised) 30%,var(--line) 50%,var(--raised) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .portrait .init { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font:15px var(--condensed); }

  /* Rôles */
  .roles { flex:1 1 auto; display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
  .roles > .role { flex:1 1 60px; }
  .role .portrait { width:clamp(44px,6.6vh,76px) !important; height:clamp(44px,6.6vh,76px) !important; }
  .role { position:relative; display:flex; align-items:center; gap:10px; min-height:60px; padding:6px 8px; background:var(--bg); border:1px solid transparent; border-radius:6px; transition:border-color .12s, background-color .12s; }
  .role:hover { border-color:var(--line); }
  .role.target { border-color:var(--select); }
  .role.is-mid { background:var(--raised); }
  .role-hit { position:absolute; inset:0; background:none; border:0; border-radius:6px; }
  .who-wrap { display:flex; flex:1; min-width:0; align-items:center; gap:10px; pointer-events:none; }
  .role-name, .role-traits { display:block; }
  .role-icon { flex:none; width:40px; color:var(--muted); text-align:center; font-size:12px; line-height:1.1; pointer-events:none; }
  .role-icon svg { display:block; width:20px; height:20px; margin:0 auto 2px; }
  .role.is-mid .role-icon { color:var(--role, var(--text)); }
  .role-who { min-width:0; flex:1; pointer-events:none; }
  .role-name { font:18px/1.15 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-traits { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-empty { color:var(--muted); font-size:13px; pointer-events:none; }
  .role-tools { position:relative; display:flex; gap:2px; }
  .mini { min-width:28px; height:28px; padding:0 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:12px; }
  .mini:hover { color:var(--text); background:var(--line); }
  .mini.x { font-size:18px; line-height:1; }

  /* Profil de la composition */
  .meters { display:grid; gap:7px; }
  .meter { display:grid; grid-template-columns:96px 1fr; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .pips { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
  .pip { height:7px; background:var(--raised); border-radius:1px; overflow:hidden; }
  .pip i { display:block; height:100%; background:#CFC6BC; transform-origin:left; }
  .meter.danger .pip i { background:var(--threat); }

  /* Scène du verdict */
  .stage { position:relative; flex:1 1 300px; min-height:280px; overflow:hidden; background:var(--surface); border-radius:8px; isolation:isolate; }
  .splash { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
  .scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(23,20,29,.92) 0%,rgba(23,20,29,.62) 44%,rgba(23,20,29,.05) 78%), linear-gradient(0deg,rgba(23,20,29,.72),transparent 55%); }
  .stage-body { position:absolute; left:0; bottom:0; display:flex; flex-direction:column; gap:7px; max-width:min(560px,86%); padding:20px 22px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .badge { padding:2px 8px; background:rgba(23,20,29,.8); border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:13px; }
  .badge.net { background:var(--prio); color:var(--prio-ink); border-color:var(--prio); font-weight:600; }
  .badge.close { color:var(--prio); border:1px dashed var(--prio); font-weight:600; }
  .eyebrowless { color:var(--muted); font-size:13px; }
  .champ-name { font:600 clamp(42px,4vw,72px)/1 var(--display); letter-spacing:0; font-variant-numeric:var(--figures); }
  .alt-line { display:flex; align-items:center; gap:8px; font-size:15px; }
  .alt-line em { color:var(--muted); font-style:normal; }
  .reasons li { font-size:15px; }
  .note { color:var(--muted); font-size:13px; }
  .note b { color:var(--text); font-weight:600; }
  .note .avoid { color:var(--threat); font-weight:600; }
  .note.warn { color:var(--info); }
  .cta { align-self:flex-start; min-height:40px; margin-top:4px; padding:7px 18px; background:var(--prio); border:0; border-radius:6px; color:var(--prio-ink); font:600 18px var(--condensed); }
  .cta:hover { filter:brightness(1.07); }
  .cta.done { background:transparent; color:var(--prio); box-shadow:inset 0 0 0 1px var(--prio); }

  /* Classement du pool */
  .rank-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .rank { display:flex; flex-direction:column; gap:6px; min-width:0; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:6px; text-align:left; transition:border-color .12s, background-color .12s; }
  .rank:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .rank:disabled { opacity:.45; }
  .rank.first { border-color:var(--prio); background:rgba(229,181,90,.07); }
  .rank.picked { background:var(--raised); box-shadow:inset 0 0 0 2px var(--select); }
  .rank-top { display:flex; align-items:center; gap:8px; min-width:0; }
  .rank-name { font:15px/1.1 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-word { font-size:12px; color:var(--muted); white-space:nowrap; }
  .rank-word.good { color:var(--good); }
  .rank-word.bad { color:var(--threat); }
  .force { height:4px; background:var(--bg); border-radius:1px; overflow:hidden; }
  .force i { display:block; height:100%; background:var(--muted); transform-origin:left; }
  .rank.first .force i { background:var(--prio); }
  .rank-rec { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Colonne de droite */
  .plan-block { flex:none; padding:14px; border-bottom:1px solid var(--line); }
  .plan-row { display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:center; min-height:34px; padding:3px 0; }
  .plan-row > span:first-child { color:var(--muted); font-size:13px; }
  .faces { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .face { display:inline-flex; align-items:center; gap:5px; font-size:13px; }
  .ban-row { background:none; }
  .ban-row .face { color:var(--muted); }
  .results { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:8px; }
  .res { min-height:36px; padding:4px 10px; background:var(--raised); border:1px solid var(--line); border-radius:6px; font-size:15px; transition:background-color .12s, border-color .12s; }
  .res:hover:not(:disabled) { border-color:var(--muted); }
  .res:disabled { color:var(--muted); opacity:.5; }
  .res.win.on { background:var(--good); border-color:var(--good); color:var(--good-ink); font-weight:600; }
  .res.loss.on { background:var(--threat); border-color:var(--threat); color:var(--threat-ink); font-weight:600; }
  .res.skip.on { border-color:var(--text); }
  .result-note { margin-top:6px; color:var(--muted); font-size:13px; }

  .tabs { flex:none; display:flex; gap:0; padding:0 6px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab { position:relative; flex:none; padding:10px 7px; background:none; border:0; color:var(--muted); font-size:13px; }
  .tab:hover { color:var(--text); }
  .tab.on { color:var(--text); }
  .tab-line { position:absolute; left:5px; right:5px; bottom:-1px; height:2px; background:var(--text); }
  .tab-body { flex:1; min-height:0; padding:12px 14px 18px; overflow:auto; }
  .tab-help { flex:none; margin:0; padding:6px 14px 0; font-size:13px; }
  .tab-help .link-btn.on { color:var(--text); }
  .tab-body h3 { margin:12px 0 5px; font:15px var(--condensed); color:var(--muted); }
  .tab-body h3:first-child { margin-top:0; }
  .small { color:var(--muted); font-size:13px; margin:4px 0; }
  .why-name { display:flex; align-items:center; gap:7px; margin-top:10px; font:15px var(--condensed); }
  .why { margin:3px 0 0 33px; font-size:13px; }
  .why .pos { color:var(--text); }
  .why .neg { color:var(--threat); }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .mcard { display:grid; grid-template-columns:32px 1fr; gap:4px 9px; padding:8px 0; border-bottom:1px solid var(--line); }
  .mcard-name { font:15px var(--condensed); }
  .mcard-line { grid-column:2; font-size:13px; color:var(--muted); }
  .mcard-line b { color:var(--text); font-weight:600; }
  .mcard-line .avoid { color:var(--threat); }
  .plain li { margin-bottom:5px; font-size:13px; }
  .plain b { font-weight:600; }
  .legal { margin-top:14px; color:var(--muted); font-size:12px; }

  .splash-stack { position:absolute; inset:0; z-index:-2; overflow:hidden; }
  .splash-stack .splash { z-index:auto; }
  .change { position:absolute; top:14px; left:22px; right:22px; z-index:1; max-width:560px; padding:7px 11px; background:rgba(23,20,29,.88); border:1px solid var(--prio); border-radius:4px; font-size:13px; }
  .change b { color:var(--prio); font-weight:600; }
  .change span { display:block; color:var(--muted); font-size:13px; }
  .reasons { min-height:44px; }
  .stage-notes { min-height:38px; }
  .rank { position:relative; }
  .rank.picked { box-shadow:none; }
  .rank-glow, .rank-ring, .role-flash, .sugg-hl { position:absolute; inset:0; pointer-events:none; }
  .rank-glow { background:var(--prio); border-radius:6px; }
  .rank-ring { border:2px solid var(--prio); border-radius:6px; }
  .role-flash { border-radius:6px; }
  .role-flash.add { background:var(--text); }
  .role-flash.del { background:var(--threat); }
  .slot-ghost { flex:none; width:clamp(44px,6.6vh,76px); height:clamp(44px,6.6vh,76px); border:1px dashed var(--line); border-radius:6px; pointer-events:none; transition:border-color .12s; }
  .role:hover .slot-ghost, .role.target .slot-ghost { border-color:var(--muted); }
  .role .portrait { transition:transform .15s; }
  .role:hover .portrait { transform:scale(1.04); }
  .sugg { isolation:isolate; }
  .sugg-item { position:relative; }
  .sugg-item.on { background:none; }
  .sugg-hl { z-index:-1; background:var(--line); border-radius:4px; }
  .tab:active, .mini:active { transform:translateY(1px); }
  .mini { transition:color .12s, background-color .12s; }
  .tab { transition:color .12s; }
  /* V2 */
  .hint.done { color:var(--good); }
  .roles > .role.is-mid { flex-grow:1.3; box-shadow:inset 3px 0 0 var(--text); }
  .role.is-mid .role-name { font-size:18px; }
  .role-hit:focus-visible { outline-offset:-2px; }
  .who-wrap { padding-right:26px; }
  .role-tools { position:absolute; top:50%; right:6px; transform:translateY(-50%); align-items:center; }
  .to-mid { opacity:0; background:var(--raised); transition:opacity .12s, color .12s, background-color .12s; }
  .role:hover .to-mid, .role:focus-within .to-mid { opacity:1; }
  .to-mid:focus-visible { opacity:1; }
  .assumed, .role-flex { color:var(--info); font-weight:500; }
  .slot-ghost { display:flex; align-items:center; justify-content:center; color:var(--line); }
  .slot-ghost svg { width:42%; height:42%; }
  .role:hover .slot-ghost, .role.target .slot-ghost { color:var(--muted); }
  .role.target .slot-ghost { border-color:var(--select); color:var(--select); }
  .meter { grid-template-columns:96px 1fr 18px; }
  .meter-label { min-width:0; }
  .meter-delta { color:var(--text); font-size:12px; text-align:right; }
  .meter-delta span { display:block; }
  .effects { min-height:36px; margin-top:8px; color:var(--muted); font-size:13px; }
  .effects span { display:block; }
  .effects .help { color:var(--good); }
  .effects .hurt { color:var(--threat); }

  .splash-stack.loading { background:linear-gradient(100deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .splash-fail { position:absolute; top:12px; right:14px; color:var(--muted); font-size:13px; }

  .rank-word.best { display:inline-block; padding:0 6px; background:var(--prio); border-radius:999px; color:var(--prio-ink); font-weight:600; }
  .rank-word.alt { display:inline-block; padding:0 6px; border:1px solid var(--line-strong); border-radius:999px; color:var(--text); line-height:1.25; }
  .rank-word.other { color:var(--muted); }
  .rank-word.bad { color:var(--threat); }
  .rank.tier-other, .rank.tier-bad { background:transparent; }
  .rank.tier-other .rank-top, .rank.tier-bad .rank-top { opacity:.78; transition:opacity .12s; }
  .rank:hover .rank-top { opacity:1; }
  .rank .portrait { transition:transform .15s; }
  .rank:hover .portrait { transform:scale(1.05); }
  .rank.tier-alt .force i { background:var(--text); }
  .rank.tier-bad .force i { background:var(--threat); }
  .force i { transition:background-color .15s; }
  .chosen { position:absolute; top:6px; right:6px; z-index:1; display:flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--prio); border-radius:50%; color:var(--prio-ink); font-size:12px; font-weight:700; }
  .rank.picked .rank-name { padding-right:18px; }

  .wincon { margin:0 0 8px; padding:9px 11px; background:transparent; border-left:2px solid var(--prio); border-radius:0; padding:4px 0 4px 12px; font-size:16px; line-height:1.3; }
  .wincon span { display:block; margin-bottom:2px; color:var(--prio); font:600 13px var(--body); }
  .plan-row.threat > span:first-child { color:var(--threat); }
  .plan-row.threat .portrait { box-shadow:0 0 0 1.5px var(--threat); }
  .plan-row.ban-row > span:first-child { color:var(--muted); }
  .plan-row.ban-row .portrait { box-shadow:0 0 0 1.5px var(--line-strong); filter:grayscale(1) brightness(.85); }
  .faces { min-width:0; }
  .plan-block { padding-bottom:12px; }

  .winbars { display:grid; gap:6px; margin-bottom:4px; }
  .winbar { display:grid; grid-template-columns:minmax(0,90px) 1fr auto; align-items:center; gap:8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .winbar-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .winbar-track { position:relative; height:8px; background:var(--raised); border-radius:4px; overflow:hidden; }
  .winbar-track i { display:block; height:100%; background:var(--good); border-radius:4px; transform-origin:left; }
  .winbar.few .winbar-track { display:none; }
  .winbar-val { color:var(--muted); font-size:13px; font-variant-numeric:var(--figures); white-space:nowrap; }
  .history { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; }
  .game { width:13px; height:13px; border-radius:2px; }
  .game.win { background:var(--good); }
  .game.loss { background:var(--threat); }

  .mobile-bar { display:none; }

  /* V2.1 */
  .note.risk { color:var(--threat); }
  .tab { padding:10px 6px; font-size:13px; }
  .seg-tabs { display:flex; gap:2px; margin-bottom:8px; padding:2px; background:var(--bg); border-radius:6px; }
  .seg-tab { flex:1; min-height:28px; padding:3px 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:13px; transition:background-color .12s, color .12s; }
  .seg-tab:hover { color:var(--text); }
  .seg-tab.on { background:var(--raised); color:var(--text); }
  .tips { margin-bottom:8px; }
  .tips li { position:relative; margin-bottom:7px; padding-left:12px; font-size:13px; line-height:1.35; }
  .tips li::before { content:""; position:absolute; left:0; top:.5em; width:5px; height:5px; background:var(--muted); border-radius:50%; }
  .matrix { margin:6px 0 10px; font-size:13px; }
  .mx-row { display:grid; grid-template-columns:minmax(0,1fr) repeat(var(--n,4),30px); grid-auto-flow:column; grid-auto-columns:30px; align-items:center; min-height:26px; border-bottom:1px solid var(--line); }

  .pick-detail { border-bottom:1px solid var(--line); padding:4px 0 6px; }
  .pick-detail summary { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; font:15px var(--condensed); }
  .pick-detail .why { margin:4px 0 4px 2px; }
  .pick-detail a { color:var(--text); }
  .cmp-head { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; color:var(--muted); font-size:12px; }
  .cmp-pick { display:flex; gap:2px; }
  .cmp-btn { padding:2px; background:none; border:1px solid transparent; border-radius:6px; opacity:.55; transition:opacity .12s, border-color .12s; }
  .cmp-btn:hover { opacity:1; }
  .cmp-btn.on { border-color:var(--select); opacity:1; }
  .cmp-title { margin:0 0 2px; font-size:15px; }
  .cmp-row { display:grid; grid-template-columns:minmax(0,1fr) 112px; align-items:center; gap:8px; min-height:22px; font-size:13px; }
  .cmp-label { min-width:0; color:var(--muted); }
  .cmp-bars { display:grid; grid-template-columns:1fr 1fr; gap:2px; }
  .cmp-side { display:block; height:8px; background:var(--bg); overflow:hidden; }

  .cmp-side.left i { transform-origin:right; }
  .cmp-side.right i { transform-origin:left; }
  .cmp-side i.up { background:var(--good); }
  .cmp-side i.down { background:var(--threat); }
  .cmp-side-text .why { margin:3px 0 0 2px; }
  .cmp-legend { min-height:0; font-size:12px; color:var(--muted); }
  .cmp-legend .cmp-bars span:first-child { text-align:right; }
  .cmp-legend .cmp-bars span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .comps li { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:13px; }
  .comps b { min-width:80px; font-weight:600; }
  .comp-faces { display:flex; gap:2px; }
  /* Panneaux compagnon */
  .panel { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--bg); border:1px solid #4A3F57; border-radius:8px; }
  .p-title { flex:none; display:flex; align-items:center; gap:8px; height:40px; padding:0 6px 0 12px; border-bottom:1px solid var(--line); app-region:drag; -webkit-app-region:drag; user-select:none; }
  .p-title .grow { flex:1; }
  .p-logo { width:20px; height:20px; color:var(--prio); }
  /* QA-3 : outils de l'overlay en cibles de 32 px (40 px physiques à 125 %), séparés de 4 px ; survol avec fond et contour. */
  .p-tools { display:flex; gap:4px; app-region:no-drag; -webkit-app-region:no-drag; }
  .p-btn { width:32px; height:32px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:15px; line-height:1; }
  .p-btn:hover { background:var(--raised); color:var(--text); box-shadow:inset 0 0 0 1px var(--line); }
  .panel .col-left { flex:1; min-height:0; border:0; }
  .panel .role { background:var(--bg); border-color:var(--line); }
  .panel .role.is-mid { background:var(--raised); }
  .panel .role.target { border-color:var(--select); }
  .panel .sec-title::before { content:""; display:inline-block; width:4px; height:15px; margin-right:7px; vertical-align:-2px; background:var(--line-strong); }
  .panel .sec-title { justify-content:flex-start; }
  .panel .sec-title small { margin-left:auto; }
  /* Le panneau gauche est étroit, mais ce n'est pas un écran mobile : il garde des lignes par rôle. */
  .panel-left .col-left { display:flex; flex-direction:column; padding:10px 12px; }
  .panel-left .roles { flex:0 1 auto; display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .panel-left .roles > .role { flex:none; flex-direction:row; min-height:56px; padding:5px 6px; gap:8px; text-align:left; }
  .panel-left .role .portrait, .panel-left .slot-ghost { width:44px !important; height:44px !important; }
  .panel-left .who-wrap { flex:1; flex-direction:row; width:auto; min-width:0; gap:8px; padding-right:24px; }
  .panel-left .role-who { flex:1; width:auto; min-width:0; }
  .panel-left .role-name, .panel-left .role.is-mid .role-name { font-size:15px; }
  .panel-left .role-traits { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; font-size:12px; white-space:normal; line-height:1.2; }
  .panel-left .role-icon { width:36px; font-size:12px; }
  .panel-left .role-icon svg { width:18px; height:18px; }
  .panel-left .role-empty { font-size:13px; }
  .panel-left .role-empty .em { display:inline; }
  .panel-left .role-tools { top:50%; right:3px; transform:translateY(-50%); }
  .panel-left .to-mid { display:block; }
  .panel-left .profile { display:block; }
  .panel-left .sec-title.profile { display:flex; }
  .panel-left .meters.profile { display:grid; }
  .panel-left .roles > .role.is-mid { box-shadow:inset 3px 0 0 var(--text); }
  .panel-left .effects { margin:8px 0 0; padding:7px 9px; background:var(--surface); border:1px solid var(--line); border-radius:6px; }
  .panel-left .meter { grid-template-columns:minmax(0,84px) 1fr 16px; font-size:12px; }
  .p-scroll, .p-body { flex:1; min-height:0; overflow:auto; }
  .p-body { display:flex; flex-direction:column; gap:9px; padding:10px 12px 12px; }
  .panel-compact .p-body { overflow:visible; flex:none; }
  .p-compact-enemies { padding:10px 12px 0; }
  .compact-roles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; margin:0; }
  .compact-roles .role { flex-direction:column; min-height:84px; padding:4px 1px; gap:2px; text-align:center; }
  .compact-roles .who-wrap { flex:none; flex-direction:column; width:100%; padding:0; gap:2px; }
  .compact-roles .role-who { width:100%; flex:none; }
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { font-size:12px; }
  .compact-roles .role-traits, .compact-roles .to-mid, .compact-roles .role-empty .em { display:none; }
  .compact-roles .role-icon { width:100%; font-size:12px; }
  .compact-roles .role-icon svg { display:none; }
  .compact-roles .role-tools { top:14px; right:0; transform:none; }
  .compact-roles .mini.x { background:rgba(23,20,29,.85); border-radius:3px; color:var(--text); }
  .compact-roles .portrait, .compact-roles .slot-ghost { width:34px !important; height:34px !important; }
  .compact-roles .mini.x { min-width:20px; height:20px; font-size:15px; }
  .p-status { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; }
  .p-reco { position:relative; flex:none; height:clamp(120px,19vh,180px); overflow:hidden; background:var(--bg); border:2px solid var(--prio); border-radius:8px; isolation:isolate; }
  .p-reco .splash { object-position:70% 18%; }
  .p-reco-scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(23,20,29,.92),rgba(23,20,29,.22) 78%); }
  .p-reco-text { position:absolute; left:12px; bottom:10px; right:10px; }
  .p-chip { display:inline-block; padding:1px 7px; background:var(--prio); border-radius:999px; color:var(--prio-ink); font-size:12px; font-weight:600; }
  .p-name { font:clamp(26px,9vw,36px)/1.05 var(--condensed); margin-top:3px; }
  .p-change { margin:0; padding:5px 8px; border:1px solid var(--prio); border-radius:4px; font-size:13px; }
  .p-change b { color:var(--prio); font-weight:600; }
  .p-alt { flex:none; display:flex; align-items:center; gap:10px; width:100%; padding:6px 10px 6px 6px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; text-align:left; font:18px var(--condensed); transition:border-color .12s; }
  .p-alt:hover { border-color:var(--muted); }
  .p-alt-text { flex:1; min-width:0; }
  .p-alt small { display:block; color:var(--muted); font:12px var(--body); }
  .p-h { margin:2px 0 0; font:15px var(--condensed); }
  .p-h::before { content:""; display:inline-block; width:4px; height:14px; margin-right:7px; vertical-align:-2px; background:var(--line-strong); }
  .p-reasons li { position:relative; margin-bottom:5px; padding-left:13px; font-size:13px; line-height:1.3; }
  .p-reasons li::before { content:""; position:absolute; left:1px; top:.45em; width:5px; height:5px; background:var(--muted); transform:rotate(45deg); }
  .p-threat { flex:none; display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(241,132,122,.09); border:1px solid var(--threat); border-radius:6px; }
  .p-threat > div { flex:1; min-width:0; }
  .p-threat b { color:var(--threat); font:15px var(--condensed); }
  .p-threat p { margin:1px 0 0; font-size:13px; line-height:1.25; }
  .p-threat-who { display:flex; flex-direction:column; align-items:center; gap:2px; max-width:72px; font-size:12px; text-align:center; }
  .p-win { flex:none; padding:7px 10px; background:var(--raised); border-radius:6px; }
  .p-win b { color:var(--prio); font:15px var(--condensed); }
  .p-win p { margin:1px 0 0; font-size:13px; line-height:1.3; }
  .p-ban-row { display:flex; align-items:center; gap:8px; margin-top:5px; color:var(--muted); font-size:13px; }
  .p-ban-row b { color:var(--text); font:18px var(--condensed); }
  .p-ban .portrait { box-shadow:0 0 0 1.5px var(--line-strong); filter:grayscale(1) brightness(.85); }
  .p-ban .note { margin-top:3px; font-size:12px; }
  .p-actions { position:sticky; bottom:-12px; z-index:3; display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:auto -12px -12px; padding:8px 12px 10px; background:var(--bg); border-top:1px solid var(--line); }
  .p-actions .cta { margin:0; min-height:36px; padding:5px 13px; font-size:15px; }
  .p-empty { color:var(--muted); }
  .settings-back { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,8,14,.74); }
  .settings { width:min(520px,100%); max-height:100%; overflow:auto; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .settings .sec-title { align-items:center; }
  .settings h3 { margin:12px 0 5px; color:var(--muted); font:15px var(--condensed); }
  .set-row { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .set-check, .set-line { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:13px; }
  .settings select { padding:3px 6px; background:var(--bg); border:1px solid var(--line-strong); border-radius:4px; }
  @keyframes shimmer { from { background-position:120% 0; } to { background-position:-120% 0; } }

  /* V2.7 : textes longs. Un mot sans espace se coupe au lieu de sortir de son conteneur. */
  .p-reasons li, .reasons li, .p-win p, .p-threat p, .p-change, .note, .small, .tips li, .wincon, .effects, .why li, .plain li, .p-empty, .hint, .result-note, td { overflow-wrap:anywhere; }
  .p-name, .champ-name, .p-threat-who, .face, .p-alt-text { min-width:0; overflow-wrap:anywhere; }
  .p-name.long { font-size:24px; line-height:1.1; }
  .champ-name.long { font-size:clamp(26px,2.4vw,36px); line-height:1.08; }
  .cta { max-width:100%; }
  .settings input[type=file] { max-width:100%; }
  .set-check { align-items:flex-start; }
  .set-check input { flex:none; margin-top:3px; }
  .p-ban-row { flex-wrap:wrap; }
  /* Dans le petit bandeau du verdict, ce message passerait sur le nom : l'absence d'image se voit déjà. */
  .p-reco .splash-fail { display:none; }
  .results { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .res { min-width:0; padding-left:4px; padding-right:4px; }
  /* La scène grandit avec son contenu : un verdict long ne déborde plus sur le classement. */
  .col-mid .stage { flex:1 0 auto; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; }
  .stage-body { position:relative; left:auto; bottom:auto; }
  /* Le bandeau de changement reste dans le flux : long ou court, il ne couvre jamais le verdict. */
  .change { position:relative; top:auto; left:auto; right:auto; flex:none; margin:14px 22px auto; align-self:flex-start; }
  .stage:has(.change) .splash-fail { display:none; }
  .cmp-head { flex-wrap:wrap; justify-content:center; }
  /* Boutons très rapprochés : le contour de focus reste à l'intérieur pour ne pas toucher le voisin. */
  .p-btn:focus-visible, .mini:focus-visible, .cmp-btn:focus-visible, .seg-tab:focus-visible, .tab:focus-visible, .res:focus-visible { outline-offset:-2px; }
  .pick-detail a { display:inline-block; padding:5px 0; }
  .settings input[type=file] { min-height:28px; }
  /* Réglages : l'essentiel d'abord, et une ligne d'aide sous les options qui en ont besoin. */
  .settings h3 { color:var(--text); }
  .set-card { margin-bottom:8px; padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .set-card.on { border-color:var(--line-strong); }
  .set-main { margin-bottom:3px; font-size:15px; font-weight:600; }
  .set-hint { margin:0 0 6px 21px; color:var(--muted); font-size:13px; line-height:1.3; }
  .set-hint.flush { margin-left:0; }
  .role-pick { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .role-pick .on { border-color:var(--select); color:var(--select); }
  .pool-list { display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px; }
  .pool-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; min-height:30px; padding:2px 8px 2px 3px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13px; }
  .pool-chip:hover { background:var(--raised); border-color:var(--muted); }
  .pool-chip.on { border-color:var(--line-strong); }
  .pool-chip b { color:var(--muted); font-weight:400; }
  .pool-search { width:100%; height:34px; margin-bottom:6px; padding:0 10px; background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; color:var(--text); font-size:13px; }
  .lcu-state { display:flex; align-items:center; gap:7px; margin:0 0 6px 21px; font-size:13px; font-weight:600; }
  .lcu-state i { flex:none; width:8px; height:8px; background:currentColor; border-radius:50%; }
  .lcu-state.good { color:var(--conn); }
  .lcu-state.wait { color:var(--muted); }
  .lcu-state.bad { color:var(--threat); }
  .lcu-state.idle { color:var(--muted); }
  .data-list { margin:8px 0 0; padding:0; list-style:none; }
  .data-list li { margin-bottom:9px; font-size:13px; }
  .data-list li.off > b { color:var(--muted); }
  .data-list p { margin:2px 0 0; color:var(--muted); font-size:13px; line-height:1.3; overflow-wrap:anywhere; }
  .data-kind { color:var(--muted); font-size:12px; }
  .data-old { color:var(--threat); font-size:12px; }
  .set-more { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  .set-more summary { min-height:24px; color:var(--muted); font-size:13px; cursor:pointer; }
  .set-more p, .set-more .set-check { margin-top:6px; }

  /* Le panneau gauche défile au lieu de comprimer son contenu quand la hauteur manque. */
  .panel .col-left { overflow:auto; }
  .panel-left .col-left > * { flex-shrink:0; }
  .tab { padding-left:5px; padding-right:5px; }
  .panel-left .meter { grid-template-columns:96px minmax(0,1fr) 16px; }
  .who-wrap, .panel-left .who-wrap { padding-right:32px; }

  /* Noms entiers en mode compact, sur deux lignes si nécessaire. */
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:normal; overflow-wrap:anywhere; font-size:12px; line-height:1.12; }
  .compact-roles .mini.x { min-width:24px; height:24px; }
  .compact-roles .role-tools { top:12px; right:-2px; }
  .panel-compact .p-actions { bottom:0; }

  /* V2.16 : profils par rôle. */
  .role-switch-wrap { flex:none; }
  .role-switch { display:flex; align-items:center; gap:3px; padding:4px 8px; }
  .panel .role-switch { border-bottom:1px solid var(--line); }
  .role-now { min-width:44px; margin-right:auto; font:15px var(--condensed); color:var(--text); }
  .role-btn { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; background:none; border:1px solid transparent; border-radius:6px; color:var(--muted); }
  .role-btn svg { width:16px; height:16px; }
  .role-btn:hover { color:var(--text); border-color:var(--line); }
  .role-btn.on { color:var(--select); border-color:var(--select); }
  .role-btn.assigned:not(.on) { border-style:dashed; border-color:var(--conn); }
  .role-hint { margin:0; padding:2px 8px 6px; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .role-hint .link-btn { margin-left:6px; }
  .top .role-switch { padding:0 4px; }
  .profile-backup { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
  .file-btn { position:relative; display:inline-flex; align-items:center; cursor:pointer; }
  .file-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .brand-sub { margin:0 0 6px; }

  /* V2.15 : égalités, conseil unique, expérience. */
  .tie-group { flex:none; display:flex; flex-direction:column; gap:6px; }
  .tie-title { margin:0; color:var(--text); font-size:13px; }
  .tie-list { display:flex; flex-direction:column; gap:6px; }
  .tie-item { display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:6px 10px 6px 6px; background:var(--surface); border:1px dashed var(--prio); border-radius:6px; color:var(--text); text-align:left; }
  .tie-item:hover { border-color:var(--text); }
  .tie-item.picked { border-style:solid; border-color:var(--prio); box-shadow:inset 0 0 0 1px var(--prio); }
  .tie-text { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .tie-name { font:15px var(--condensed); overflow-wrap:anywhere; }
  .tie-text small { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .tie-check { flex:none; color:var(--prio); }
  .tie-group .note { margin:0; font-size:12px; }
  .stage-tie { display:flex; align-items:flex-end; }
  .stage-tie .stage-body { position:relative; left:auto; bottom:auto; width:100%; }
  .coach-line { flex:none; padding:6px 8px; border-left:2px solid var(--line); font-size:13px; }
  .coach-line b { display:block; overflow-wrap:anywhere; }
  .coach-line p { margin:2px 0 0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .link-btn { min-height:24px; padding:2px 0; background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline; }
  .link-btn:hover { color:var(--text); }
  .familiar-line { flex:none; margin:0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .familiar-line span { margin-right:4px; }
  .coach-level { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; margin:8px 0; }
  .coach-level select { min-height:28px; }
  .choice-block { margin:8px 0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  .choice-row { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:2px 0; font-size:13px; }
  .choice-row span { color:var(--muted); }
  .choice-row b { overflow-wrap:anywhere; }
  .exp-list, .advice-list { margin:4px 0; padding:0; list-style:none; font-size:13px; }
  .exp-list li { padding:2px 0; }
  .advice-item { padding:6px 0; border-bottom:1px solid var(--line); }
  .advice-item p { margin:2px 0; overflow-wrap:anywhere; }
  .advice-item small { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .unconfirmed .advice-item b { font-weight:500; color:var(--muted); }

  /* V2.14 : échelle de texte. Rien sous 12,5 sauf les libellés de rôle, très courts. */
  :root { --fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px;  }
  .hint, .rank-word, .rank-rec, .role-traits, .p-chip, .p-alt small, .p-threat-who, .p-ban .note, .result-note, .note { font-size:var(--fs-xs); }
  .panel-left .role-traits { font-size:var(--fs-xs); }
  .note { font-size:13px; }
  .stage-body { text-shadow:0 1px 3px rgba(10,8,14,.75); }
  .stage-body .cta, .stage-body .badge { text-shadow:none; }
  .scrim { background:linear-gradient(90deg,rgba(23,20,29,.95) 0%,rgba(23,20,29,.8) 46%,rgba(23,20,29,.08) 82%), linear-gradient(0deg,rgba(23,20,29,.78),transparent 58%); }
  .stage-notes { min-height:0; display:flex; flex-direction:column; gap:4px; margin-top:2px; }
  /* Danger et adversaire : deux lignes qui se lisent d'un coup d'œil, de couleurs différentes du badge du conseil. */
  .alert-line { color:var(--text); font-size:var(--fs-sm); line-height:1.3; overflow-wrap:anywhere; }
  .alert-line b { margin-right:4px; color:var(--threat); font-weight:700; }
  .opp-line { color:var(--muted); font-size:var(--fs-sm); line-height:1.3; overflow-wrap:anywhere; }
  .opp-line.unsure { color:var(--info); }
  .opp-line span { color:var(--muted); }
  .opp-line b { color:var(--text); font-weight:600; }
  .hint.warn { color:var(--info); }
  .assumed { display:block; color:var(--info); }
  .role-flex { color:var(--info); }
  .role.is-mid .role-traits { white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.2; }
  .panel-left .role.is-mid .role-traits { -webkit-line-clamp:3; }
  /* Panneau unique : la colonne en surbrillance et la ligne d'adversaire suffisent. */
  .compact-roles .role.is-mid .role-traits { display:none; }
  /* Noms dans les colonnes étroites : police condensée, sans couper un mot au milieu. */
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { font:13px/1.1 var(--condensed); white-space:normal; overflow-wrap:normal; word-break:normal; }
  /* Détails : présents, mais repliés. */
  .more-line summary, .p-more summary { display:list-item; min-height:24px; color:var(--muted); font-size:var(--fs-sm); cursor:pointer; }
  .more-line summary:hover, .p-more summary:hover { color:var(--text); }
  .more-line[open] .note { margin-top:2px; }
  .p-more { flex:none; }
  .p-more > section { margin-top:7px; }
  .p-more[open] { padding-bottom:4px; }
  /* Panneaux : le conseil reste net, sans repousser les raisons sous le pli. */
  .p-reco { height:clamp(84px,14vh,126px); border-width:2px; }
  .p-reasons li:last-child { margin-bottom:0; }
  .p-threat { align-items:flex-start; background:rgba(241,132,122,.08); border:0; border-left:3px solid var(--threat); border-radius:0 6px 6px 0; padding:6px 8px; }
  .p-threat b { font-size:var(--fs-md); overflow-wrap:anywhere; }
  .p-threat p { font-size:13px; }
  .p-body { gap:8px; }
  .cta:active { filter:brightness(.92); }
  .cta:focus-visible, .p-alt:focus-visible, .rank:focus-visible { outline-offset:1px; }
  .p-more summary:focus-visible, .more-line summary:focus-visible { outline-offset:1px; border-radius:3px; }

  /* Panneaux étroits : 125 % d'affichage Windows réduit 320 pixels physiques à 256 pixels d'interface. */
  @media (max-width:300px) {
    .panel .brand { font-size:18px; }
    .panel-left .col-left, .panel .p-body { padding-left:9px; padding-right:9px; }
    .panel .p-actions { margin-left:-9px; margin-right:-9px; padding-left:9px; padding-right:9px; }
    .p-compact-enemies { padding-left:9px; padding-right:9px; }
    .panel-left .roles > .role { gap:6px; padding:5px 4px; }
    .panel-left .role-icon { width:34px; font-size:12px; }
    .panel-left .role .portrait, .panel-left .slot-ghost { width:38px !important; height:38px !important; }
    .panel-left .who-wrap { gap:6px; padding-right:32px; }
    .panel-left .role-name, .panel-left .role.is-mid .role-name { font-size:15px; }
    .panel-left .meter { grid-template-columns:90px minmax(0,1fr) 14px; gap:6px; }
    .p-actions .cta { flex:1 1 auto; padding-left:10px; padding-right:10px; }
    .opt-word { display:none; }
    .p-alt { font-size:15px; gap:8px; }
    .p-threat { padding:7px 8px; }
  }

  /* Hauteur réduite : le verdict et l'alternative restent visibles sans défiler. */
  @media (max-height:600px) {
    .panel .p-reco { height:72px; }
    .compact-roles .role { min-height:70px; padding-top:2px; padding-bottom:2px; }
    .compact-roles .portrait, .compact-roles .slot-ghost { width:30px !important; height:30px !important; }
    .panel .p-body { gap:7px; padding-top:7px; }
    .panel .p-title { height:34px; }
    .panel-left .roles > .role { min-height:48px; padding-top:3px; padding-bottom:3px; }
    .panel-left .role .portrait, .panel-left .slot-ghost { width:38px !important; height:38px !important; }
    .panel-left .hint { margin-bottom:6px; }
    .panel .p-name { font-size:24px; }
    .panel .p-name.long { font-size:18px; }
  }

  /* Le mouvement réduit concerne aussi le CSS, pas seulement Motion. */
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-height:800px) and (min-width:1101px) {
    .col-left { padding:10px 12px; }
    .col-mid { padding:10px; gap:8px; }
    .plan-block { padding:10px 12px; }
    .hint { margin-bottom:6px; }
    .meters { gap:4px; }
    .roles { margin-bottom:8px; }
    .plan-row { min-height:30px; padding:2px 0; }
    .effects { margin-top:5px; min-height:0; }
    .stage { min-height:240px; }
  }
  @media (max-width:1100px) {
    .app { height:auto; min-height:100vh; }
    .top { position:sticky; top:0; z-index:30; gap:8px; padding:0 10px; }
.top .ghost-btn, .top .seg-tab { padding-left:8px; padding-right:8px; }
    .desk { grid-template-columns:minmax(280px,340px) minmax(0,1fr); }
    .col-left { border-right:1px solid var(--line); overflow:visible; }
    .col-mid { overflow:visible; }
    .stage { flex:none; height:auto; min-height:380px; display:flex; align-items:flex-end; }
    .stage-body { position:relative; left:auto; bottom:auto; padding-top:84px; }
    .col-right { grid-column:1 / -1; border-left:0; border-top:1px solid var(--line); overflow:visible; }
    .rank-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tab-body { overflow:visible; }
    .role .portrait, .slot-ghost { width:44px !important; height:44px !important; }
    .col-right { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto 1fr; align-items:start; }
    .plan-block { grid-row:1 / span 2; border-bottom:0; border-right:1px solid var(--line); height:100%; }
  }
  @media (max-width:720px) {
    .desk { display:block; }
    .app { padding-bottom:64px; }
    .col-right { display:flex; }
    .plan-block { border-right:0; border-bottom:1px solid var(--line); height:auto; }
    .stage .cta { display:none; }
    .mobile-bar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--surface); border-top:1px solid var(--line); }
    .mobile-name { display:flex; align-items:center; gap:8px; min-width:0; font:18px var(--condensed); }
    .mobile-bar .cta { flex:none; margin:0; }
    .role-empty .em { display:none; }
    .who-wrap { padding-right:0; }
    .role-tools { top:0; right:0; transform:none; }
    .role.is-mid .role-name { font-size:13px; }
    .roles > .role.is-mid { box-shadow:inset 0 2px 0 var(--text); }
    .effects { min-height:0; margin:0 0 4px; }
    .col-left { border-right:0; }
    .col-mid { padding:12px; }
    .roles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
    .role .portrait, .slot-ghost { width:44px !important; height:44px !important; }
    .change { left:12px; right:12px; }
    .role { flex-direction:column; min-height:92px; padding:6px 2px; gap:3px; text-align:center; background:var(--bg); }
    .who-wrap { flex:none; flex-direction:column; width:100%; gap:3px; }
    .role-who { width:100%; flex:none; }
    .role-icon { width:100%; }
    .profile { display:none; }
    .col-left { padding-bottom:6px; }
    .roles { margin-bottom:6px; }
    .role-name { font-size:13px; }
    .role-traits { display:none; }
    .role-empty { font-size:12px; }
    .role-tools { position:absolute; top:0; right:0; }
    .role-tools .to-mid { display:none; }
    .mini.x { min-width:24px; height:24px; }
    .stage { height:auto; min-height:320px; display:flex; align-items:flex-end; }
    .stage-body { position:relative; left:auto; bottom:auto; padding-top:84px; }
    .stage-body { max-width:100%; padding:14px; }
    .scrim { background:linear-gradient(0deg,rgba(23,20,29,.95) 12%,rgba(23,20,29,.72) 55%,rgba(23,20,29,.1) 100%); }
    .patch { display:none; }
    .plan-row { grid-template-columns:62px 1fr; }
  }
  /* ---------- Fenêtre principale à cinq sections (UX-3, COMPOSANTS-V3) ---------- */
  /* Échelle réduite : 12, 13, 15, 18, 24, 34 px. Espacements de 4 en 4. Rayons : étiquette 4, contrôle 6, boîte 10. */
  :root { --hover:#2C2535; --line-strong:#82778F; --accent-soft:#1A2E25; --accent-line:#3D5F4C; --good-soft:#1A2E25; --threat-soft:#35191B; --gold-soft:#2E2414; --gold-line:#6B5530;
    --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px; --fs-2xl:34px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --r-tag:999px; --r-ctl:6px; --r-box:8px; --nav-w:216px; }
  .shell { display:grid; grid-template-columns:var(--nav-w) minmax(0,1fr); height:100vh; }
  .nav { display:flex; flex-direction:column; min-height:0; overflow:auto; padding:var(--s4) var(--s3); background:var(--bg); border-right:1px solid var(--line); }
  .nav-brand { display:flex; align-items:center; gap:var(--s2); padding:0 var(--s2) var(--s5); }
  .nav-brand .p-logo { width:20px; height:20px; color:var(--prio); }
  .nav-brand .brand { font:600 26px/1 var(--display); letter-spacing:.02em; }
  .nav-brand small { margin-left:auto; padding:1px 6px; border:1px solid var(--line-strong); border-radius:var(--r-tag); color:var(--muted); font-size:var(--fs-xs); }
  .nav-list { display:flex; flex-direction:column; gap:2px; }
  .nav-grow { flex:1; min-height:var(--s4); }
  .nav-link { position:relative; display:flex; align-items:center; gap:var(--s3); width:100%; min-height:40px; padding:0 var(--s3); background:transparent; border:0; border-radius:var(--r-ctl); color:var(--muted); font-size:var(--fs-md); text-align:left; }
  .nav-link:hover { background:var(--hover); color:var(--text); }
  .nav-link[aria-current="page"] { background:var(--raised); color:var(--text); font-weight:600; }
  .nav-link[aria-current="page"]::before { content:""; position:absolute; left:calc(-1 * var(--s3)); top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--text); }
  .nav-link[aria-current="page"] .nav-icon { color:var(--text); }
  .nav-icon { flex:none; width:18px; height:18px; }
  .nav-state { display:grid; gap:var(--s2); margin-top:var(--s3); padding:var(--s3); border:0; background:var(--surface); border-radius:var(--r-box); font-size:var(--fs-sm); }
  .nav-line { display:flex; align-items:center; gap:var(--s2); min-width:0; }
  .nav-line .lbl { font-weight:600; }
  .nav-line .val { margin-left:auto; color:var(--muted); white-space:nowrap; }
  .nav-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .nav-dot.good { background:var(--good); } .nav-dot.wait { background:transparent; box-shadow:inset 0 0 0 2px var(--prio); } .nav-dot.idle { background:transparent; box-shadow:inset 0 0 0 2px var(--line-strong); } .nav-dot.bad { background:var(--threat); }
  .nav-role-icon { display:inline-flex; width:14px; height:14px; color:var(--text); }
  .nav-role-icon svg { width:14px; height:14px; }
  .nav-legal { padding:var(--s3) var(--s2) 0; color:var(--muted); font-size:var(--fs-xs); line-height:1.4; }

  .view { min-width:0; min-height:0; overflow:auto; }
  .view-sim { overflow:hidden; }
  .view .app { height:100%; }
  .top .seg-tab { white-space:nowrap; }
  /* La navigation prend 216 px : colonnes latérales un peu plus étroites, classement sur deux lignes jusqu'à 1 500 px. */
  @media (min-width:1101px) { .view .desk { grid-template-columns:clamp(270px,21vw,420px) minmax(0,1fr) clamp(290px,23vw,440px); } }
  @media (min-width:1101px) and (max-width:1500px) { .view .rank-list { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .view-title { margin:0; font:var(--fs-lg)/1.15 var(--condensed); white-space:nowrap; }
  .view-page { max-width:1180px; margin:0 auto; padding:var(--s5) var(--s6) var(--s6); }
  .view-head { display:flex; align-items:flex-end; gap:var(--s4); margin-bottom:var(--s5); }
  .view-head h1 { margin:0; font:600 var(--fs-2xl)/1.1 var(--display); letter-spacing:0; }
  .view-head p { margin:var(--s1) 0 0; color:var(--muted); font-size:var(--fs-sm); }
  .view-tools { display:flex; gap:var(--s2); margin-left:auto; }
  .box { background:var(--surface); border:0; border-radius:var(--r-box); }
  .box-pad { padding:var(--s4) var(--s5) var(--s5); }
  .box-title { margin:0 0 var(--s1); font:var(--fs-lg)/1.2 var(--condensed); }
  .box-sub { margin:0 0 var(--s4); color:var(--muted); font-size:var(--fs-sm); }
  .box h3 { margin:var(--s4) 0 var(--s1); color:var(--text); font:var(--fs-md) var(--condensed); }
  .box select { min-height:30px; padding:3px 6px; background:var(--bg); border:1px solid var(--line-strong); border-radius:var(--r-ctl); }
  .box input[type=file] { max-width:100%; min-height:28px; }
  .empty-note { margin:var(--s2) 0; padding:var(--s3) var(--s4); background:transparent; border:1px dashed var(--line-strong); border-radius:var(--r-ctl); color:var(--muted); font-size:var(--fs-sm); }

  /* ---------- Accueil (UX-8) ---------- */
  /* Une seule chose forte : la bannière d'état (ou le guide du premier lancement), dont le filet gauche dit le ton.
     Puis la chaîne de la draft, dans l'ordre où elle sert : client League, pool, panneaux ; chaque carte a son filet d'état.
     Enfin deux cartes calmes, sans filet : mise à jour et données. */
  .home { display:grid; gap:var(--s4); }
  .home .view-head { margin-bottom:0; }
  .home-hero { --tone:var(--good); display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:var(--s3) var(--s5); padding:var(--s5) var(--s5) var(--s5) var(--s5); background:linear-gradient(90deg,var(--raised),var(--surface) 60%); border-left:4px solid var(--tone); }
  .home-hero.tone-todo { --tone:var(--prio); }
  .home-hero.tone-error { --tone:var(--threat); }
  .hero-mark { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border:2px solid var(--tone); border-radius:50%; color:var(--tone); }
  .hero-mark .nav-icon { width:24px; height:24px; }
  .home-title { margin:0; font:600 30px/1.12 var(--display); letter-spacing:0; }
  .home-lead { margin:var(--s2) 0 0; color:var(--muted); font-size:var(--fs-md); max-width:68ch; }
  .hero-acts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:var(--s2); }
  .hero-acts .cta, .guide-acts .cta { margin:0; }
  .hero-acts .ghost-btn { min-height:40px; }
  /* Étape manquante ou erreur : les actions passent sous le texte, alignées sur lui, pour garder le message lisible. */
  .home-hero:not(.tone-ready):not(.tone-live) .hero-acts { grid-column:2 / -1; justify-content:flex-start; }
  .home-guide { padding:var(--s5); border-left:4px solid var(--prio); }
  .guide-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--s4); margin:var(--s4) 0 0; padding:0; list-style:none; }
  .guide-step { display:flex; flex-direction:column; gap:var(--s2); max-width:none; min-width:0; padding:var(--s4); background:var(--bg); border:0; border-radius:var(--r-ctl); }
  .guide-head { display:flex; align-items:center; gap:var(--s3); }
  .guide-num { flex:none; display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:2px solid var(--line-strong); border-radius:50%; color:var(--text); font:600 var(--fs-lg)/1 var(--display); font-variant-numeric:var(--figures); }
  .guide-head h3 { margin:0; font:var(--fs-lg)/1.2 var(--condensed); }
  .guide-text p { margin:2px 0 0; color:var(--muted); font-size:var(--fs-sm); }
  .guide-text .guide-risk { color:var(--secure); }
  .guide-tag { color:var(--prio); font-weight:600; }
  .guide-acts { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); margin-top:auto; padding-top:var(--s2); }
  .guide-acts .guide-go { min-height:40px; font-size:var(--fs-md); }
  .guide-foot { margin:var(--s3) 0 0; }
  .home-chain { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr); gap:0; background:var(--surface); border-radius:var(--r-box); }
  .home-card { --state:var(--line-strong); display:flex; flex-direction:column; gap:var(--s2); min-width:0; padding:var(--s4) var(--s5); border-top:3px solid var(--state); }
  .home-card.state-good { --state:var(--good); } .home-card.state-wait { --state:var(--prio); } .home-card.state-bad { --state:var(--threat); }
  .home-card.home-quiet { border-top:0; }
  .card-kicker { margin:0; color:var(--muted); font-size:var(--fs-sm); font-weight:400; }
  .card-state { display:flex; flex-wrap:nowrap; align-items:center; gap:var(--s2); margin:0; font:var(--fs-lg)/1.2 var(--condensed); letter-spacing:.01em; }
  .card-state small { color:var(--muted); font:var(--fs-sm) var(--body); }
  .card-state .nav-role-icon, .card-state .nav-role-icon svg { width:16px; height:16px; }
  .card-text { margin:0; color:var(--text); font-size:var(--fs-sm); line-height:1.4; }
  .card-text.small { color:var(--muted); }
  .card-acts { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); margin-top:auto; padding-top:var(--s2); }
  .home-portraits { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3) var(--s4); margin:var(--s1) 0; }
  .home-champ { display:inline-flex; flex-direction:column; align-items:center; gap:4px; max-width:72px; font-size:var(--fs-sm); text-align:center; overflow-wrap:anywhere; }
  .home-more { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:var(--s4); }
  .data-rows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2) var(--s5); margin:0; }
  .data-row { display:grid; gap:2px; min-width:0; padding-left:var(--s3); border-left:2px solid var(--line); }
  .data-row.ok { border-left-color:var(--good); }
  .data-row dt { color:var(--muted); font-size:var(--fs-xs); }
  .data-row dd { margin:0; font-size:var(--fs-sm); font-weight:600; overflow-wrap:anywhere; }
  /* Fenêtre basse (1366 x 768 à 125 % : 614 px de page) : marges resserrées pour tenir sur un écran. */
  @media (max-height:700px) {
    .home { gap:var(--s3); }
    .home .view-head p { display:none; }
    .home-hero, .home-guide { padding:var(--s4) var(--s5); }
    .home-title { font-size:var(--fs-xl); }
    .hero-mark { width:40px; height:40px; }
    .home-card { padding:var(--s3) var(--s4); gap:6px; }
    .guide-step { padding:var(--s3); }
  }
  /* Grand écran (1080 px de page et plus) : plus d'air, plutôt qu'un grand vide sous les cartes. */
  @media (min-height:960px) and (min-width:1400px) {
    .home { gap:var(--s5); padding-top:var(--s6); }
    .home-hero, .home-guide { padding:var(--s6); }
    .home-card { padding:var(--s5) var(--s6); gap:var(--s3); }
    .card-state { font-size:var(--fs-xl); }
    .card-text { font-size:var(--fs-md); }
  }  @media (max-width:980px) {
    .home-hero { grid-template-columns:auto minmax(0,1fr); }
    .hero-acts { grid-column:1 / -1; justify-content:flex-start; }
    .home-chain { grid-template-columns:minmax(0,1fr); }
    .home-more { grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width:720px) {
    .data-rows { grid-template-columns:minmax(0,1fr); }
  }

  .pool-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr); gap:var(--s4); align-items:start; }
  .pool-grid h3:first-child { margin-top:0; }
  .pool-grid .set-card { margin:0; padding:0; background:none; border:0; }
