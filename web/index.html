<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: blob: file: https://ddragon.leagueoflegends.com; connect-src https://ddragon.leagueoflegends.com; font-src 'self' data: file:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAFT</title>
<style>
  :root {
    --bg:#0a0f16; --surface:#111822; --raised:#18212e; --line:#263242; --text:#e8eef5; --muted:#93a3b6;
    --accent:#3fd8c6; --accent-ink:#04211e; --gold:#d4b36a; --threat:#f2777a;
    --condensed:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed",Bahnschrift,"Arial Narrow",Arial,sans-serif;
    --body:Bahnschrift,"Segoe UI",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  * { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 var(--body); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  h2, h3, p, ul { margin:0; padding:0; }
  ul { list-style:none; }

  .app { display:grid; grid-template-rows:52px minmax(0,1fr); height:100vh; }
  .top { display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line); }
.source-switch { margin:0; }
.sim-band { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:6px 18px; background:rgba(212,179,106,.10); border-bottom:1px solid var(--gold); color:var(--text); font-size:13px; }
.sim-band p { margin:0; }
.sim-band .grow { flex:1; }
.sim-band b { color:var(--gold); font-weight:600; }
  .brand { font:18px var(--condensed); letter-spacing:.02em; }
  .brand b { color:var(--accent); font-weight:inherit; }
  .patch { color:var(--muted); font-size:13px; }
  .top .grow { flex:1; }
  .ghost-btn { min-height:32px; padding:4px 12px; background:transparent; border:1px solid var(--line-strong); border-radius:6px; color:var(--text); font-size:13px; }
  .ghost-btn:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .ghost-btn:disabled { color:var(--muted); opacity:.55; }

  .desk { display:grid; grid-template-columns:clamp(300px,23vw,420px) minmax(0,1fr) clamp(310px,24vw,440px); min-height:0; }
  .col { min-height:0; display:flex; flex-direction:column; }
  .col-left { padding:14px; background:var(--surface); border-right:1px solid var(--line); overflow:auto; }
  .col-mid { padding:14px; gap:12px; overflow:auto; }
  .col-right { background:var(--surface); border-left:1px solid var(--line); overflow:hidden; }

  .sec-title { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font:18px var(--condensed); letter-spacing:.02em; }
  .sec-title small { color:var(--muted); font:13px var(--body); }

  /* Saisie */
  .search { position:relative; margin-bottom:6px; }
  #add, #q { width:100%; height:42px; padding:0 12px; background:var(--bg); border:1px solid var(--line-strong); border-radius:6px; font-size:15px; outline:none; transition:border-color .12s; }
  #add:focus, #q:focus { border-color:var(--accent); }
  #add:disabled { opacity:.55; }
  #add::placeholder, #q::placeholder { color:var(--muted); opacity:1; }
  .sugg { position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px); padding:4px; background:var(--raised); border:1px solid var(--line); border-radius:6px; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .sugg-item { display:flex; align-items:center; gap:10px; width:100%; padding:5px 8px; background:none; border:0; border-radius:4px; text-align:left; }
  .sugg-item.on, .sugg-item:hover { background:var(--line); }
  .sugg-empty { padding:8px; color:var(--muted); font-size:13px; }
  .hint { min-height:18px; margin-bottom:10px; color:var(--muted); font-size:12px; }
  .hint.warn { color:var(--gold); }

  /* Portraits */
  .portrait { position:relative; flex:none; display:block; overflow:hidden; background:var(--raised); border-radius:6px; }
  .portrait img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .16s; }
  .portrait img.ready { opacity:1; }
  .portrait.loading { background:linear-gradient(100deg,var(--raised) 30%,var(--line) 50%,var(--raised) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .portrait .init { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font:15px var(--condensed); }

  /* Rôles */
  .roles { flex:1 1 auto; display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
  .roles > .role { flex:1 1 60px; }
  .role .portrait { width:clamp(44px,6.6vh,76px) !important; height:clamp(44px,6.6vh,76px) !important; }
  .role { position:relative; display:flex; align-items:center; gap:10px; min-height:60px; padding:6px 8px; background:var(--bg); border:1px solid transparent; border-radius:6px; transition:border-color .12s, background-color .12s; }
  .role:hover { border-color:var(--line); }
  .role.target { border-color:var(--accent); }
  .role.is-mid { background:var(--raised); }
  .role-hit { position:absolute; inset:0; background:none; border:0; border-radius:6px; }
  .who-wrap { display:flex; flex:1; min-width:0; align-items:center; gap:10px; pointer-events:none; }
  .role-name, .role-traits { display:block; }
  .role-icon { flex:none; width:40px; color:var(--muted); text-align:center; font-size:12px; line-height:1.1; pointer-events:none; }
  .role-icon svg { display:block; width:20px; height:20px; margin:0 auto 2px; }
  .role.is-mid .role-icon { color:var(--accent); }
  .role-who { min-width:0; flex:1; pointer-events:none; }
  .role-name { font:18px/1.15 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-traits { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-empty { color:var(--muted); font-size:13px; pointer-events:none; }
  .role-tools { position:relative; display:flex; gap:2px; }
  .mini { min-width:28px; height:28px; padding:0 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:12px; }
  .mini:hover { color:var(--text); background:var(--line); }
  .mini.x { font-size:18px; line-height:1; }

  /* Profil de la composition */
  .meters { display:grid; gap:7px; }
  .meter { display:grid; grid-template-columns:96px 1fr; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .pips { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
  .pip { height:7px; background:var(--raised); border-radius:1px; overflow:hidden; }
  .pip i { display:block; height:100%; background:var(--accent); transform-origin:left; }
  .meter.danger .pip i { background:var(--threat); }

  /* Scène du verdict */
  .stage { position:relative; flex:1 1 300px; min-height:280px; overflow:hidden; background:var(--surface); border-radius:8px; isolation:isolate; }
  .splash { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
  .scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(10,15,22,.92) 0%,rgba(10,15,22,.62) 44%,rgba(10,15,22,.05) 78%), linear-gradient(0deg,rgba(10,15,22,.72),transparent 55%); }
  .stage-body { position:absolute; left:0; bottom:0; display:flex; flex-direction:column; gap:7px; max-width:min(560px,86%); padding:20px 22px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .badge { padding:2px 8px; background:rgba(10,15,22,.72); border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:13px; }
  .badge.net { color:var(--accent); border-color:var(--accent); }
  .badge.close { color:var(--gold); border-color:var(--gold); }
  .eyebrowless { color:var(--muted); font-size:13px; }
  .champ-name { font:clamp(34px,3.2vw,50px)/1.02 var(--condensed); letter-spacing:.005em; }
  .alt-line { display:flex; align-items:center; gap:8px; font-size:15px; }
  .alt-line em { color:var(--muted); font-style:normal; }
  .reasons li { font-size:15px; }
  .note { color:var(--muted); font-size:13px; }
  .note b { color:var(--text); font-weight:600; }
  .note .avoid { color:var(--threat); font-weight:600; }
  .note.warn { color:var(--gold); }
  .cta { align-self:flex-start; min-height:40px; margin-top:4px; padding:7px 18px; background:var(--accent); border:0; border-radius:6px; color:var(--accent-ink); font:18px var(--condensed); }
  .cta:hover { filter:brightness(1.1); }
  .cta.done { background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }

  /* Classement du pool */
  .rank-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .rank { display:flex; flex-direction:column; gap:6px; min-width:0; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:6px; text-align:left; transition:border-color .12s, background-color .12s; }
  .rank:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .rank:disabled { opacity:.45; }
  .rank.first { border-color:var(--accent); }
  .rank.picked { background:var(--raised); box-shadow:inset 0 0 0 2px var(--accent); }
  .rank-top { display:flex; align-items:center; gap:8px; min-width:0; }
  .rank-name { font:15px/1.1 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-word { font-size:12px; color:var(--muted); white-space:nowrap; }
  .rank-word.good { color:var(--accent); }
  .rank-word.bad { color:var(--threat); }
  .force { height:4px; background:var(--bg); border-radius:1px; overflow:hidden; }
  .force i { display:block; height:100%; background:var(--muted); transform-origin:left; }
  .rank.first .force i { background:var(--accent); }
  .rank-rec { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Colonne de droite */
  .plan-block { flex:none; padding:14px; border-bottom:1px solid var(--line); }
  .plan-row { display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:center; min-height:34px; padding:3px 0; }
  .plan-row > span:first-child { color:var(--muted); font-size:13px; }
  .faces { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .face { display:inline-flex; align-items:center; gap:5px; font-size:13px; }
  .ban-row { background:none; }
  .ban-row .face { color:var(--gold); }
  .results { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:8px; }
  .res { min-height:36px; padding:4px 10px; background:var(--raised); border:1px solid var(--line); border-radius:6px; font-size:15px; transition:background-color .12s, border-color .12s; }
  .res:hover:not(:disabled) { border-color:var(--muted); }
  .res:disabled { color:var(--muted); opacity:.5; }
  .res.win.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .res.loss.on { background:var(--threat); border-color:var(--threat); color:#2a0708; font-weight:600; }
  .res.skip.on { border-color:var(--text); }
  .result-note { margin-top:6px; color:var(--muted); font-size:13px; }

  .tabs { flex:none; display:flex; gap:0; padding:0 6px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab { position:relative; flex:none; padding:10px 7px; background:none; border:0; color:var(--muted); font-size:13px; }
  .tab:hover { color:var(--text); }
  .tab.on { color:var(--text); }
  .tab-line { position:absolute; left:5px; right:5px; bottom:-1px; height:2px; background:var(--accent); }
  .tab-body { flex:1; min-height:0; padding:12px 14px 18px; overflow:auto; }
  .tab-help { flex:none; margin:0; padding:6px 14px 0; font-size:13px; }
  .tab-help .link-btn.on { color:var(--text); }
  .tab-body h3 { margin:12px 0 5px; font:15px var(--condensed); color:var(--muted); }
  .tab-body h3:first-child { margin-top:0; }
  .small { color:var(--muted); font-size:13px; margin:4px 0; }
  .why-name { display:flex; align-items:center; gap:7px; margin-top:10px; font:15px var(--condensed); }
  .why { margin:3px 0 0 33px; font-size:13px; }
  .why .pos { color:var(--text); }
  .why .neg { color:var(--threat); }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .mcard { display:grid; grid-template-columns:32px 1fr; gap:4px 9px; padding:8px 0; border-bottom:1px solid var(--line); }
  .mcard-name { font:15px var(--condensed); }
  .mcard-line { grid-column:2; font-size:13px; color:var(--muted); }
  .mcard-line b { color:var(--text); font-weight:600; }
  .mcard-line .avoid { color:var(--threat); }
  .plain li { margin-bottom:5px; font-size:13px; }
  .plain b { font-weight:600; }
  .legal { margin-top:14px; color:var(--muted); font-size:12px; }

  .splash-stack { position:absolute; inset:0; z-index:-2; overflow:hidden; }
  .splash-stack .splash { z-index:auto; }
  .change { position:absolute; top:14px; left:22px; right:22px; z-index:1; max-width:560px; padding:7px 11px; background:rgba(10,15,22,.86); border:1px solid var(--gold); border-radius:4px; font-size:13px; }
  .change b { color:var(--gold); font-weight:600; }
  .change span { display:block; color:var(--muted); font-size:13px; }
  .reasons { min-height:44px; }
  .stage-notes { min-height:38px; }
  .rank { position:relative; }
  .rank.picked { box-shadow:none; }
  .rank-glow, .rank-ring, .role-flash, .sugg-hl { position:absolute; inset:0; pointer-events:none; }
  .rank-glow { background:var(--accent); border-radius:6px; }
  .rank-ring { border:2px solid var(--accent); border-radius:6px; }
  .role-flash { border-radius:6px; }
  .role-flash.add { background:var(--accent); }
  .role-flash.del { background:var(--threat); }
  .slot-ghost { flex:none; width:clamp(44px,6.6vh,76px); height:clamp(44px,6.6vh,76px); border:1px dashed var(--line); border-radius:6px; pointer-events:none; transition:border-color .12s; }
  .role:hover .slot-ghost, .role.target .slot-ghost { border-color:var(--muted); }
  .role .portrait { transition:transform .15s; }
  .role:hover .portrait { transform:scale(1.04); }
  .sugg { isolation:isolate; }
  .sugg-item { position:relative; }
  .sugg-item.on { background:none; }
  .sugg-hl { z-index:-1; background:var(--line); border-radius:4px; }
  .tab:active, .mini:active { transform:translateY(1px); }
  .mini { transition:color .12s, background-color .12s; }
  .tab { transition:color .12s; }
  /* V2 */
  .hint.done { color:var(--accent); }
  .roles > .role.is-mid { flex-grow:1.3; box-shadow:inset 3px 0 0 var(--accent); }
  .role.is-mid .role-name { font-size:18px; }
  .role-hit:focus-visible { outline-offset:-2px; }
  .who-wrap { padding-right:26px; }
  .role-tools { position:absolute; top:50%; right:6px; transform:translateY(-50%); align-items:center; }
  .to-mid { opacity:0; background:var(--raised); transition:opacity .12s, color .12s, background-color .12s; }
  .role:hover .to-mid, .role:focus-within .to-mid { opacity:1; }
  .to-mid:focus-visible { opacity:1; }
  .assumed, .role-flex { color:var(--gold); font-weight:500; }
  .slot-ghost { display:flex; align-items:center; justify-content:center; color:var(--line); }
  .slot-ghost svg { width:42%; height:42%; }
  .role:hover .slot-ghost, .role.target .slot-ghost { color:var(--muted); }
  .role.target .slot-ghost { border-color:var(--accent); color:var(--accent); }
  .meter { grid-template-columns:96px 1fr 18px; }
  .meter-label { min-width:0; }
  .meter-delta { color:var(--text); font-size:12px; text-align:right; }
  .meter-delta span { display:block; }
  .effects { min-height:36px; margin-top:8px; color:var(--muted); font-size:13px; }
  .effects span { display:block; }
  .effects .help { color:var(--accent); }
  .effects .hurt { color:var(--threat); }

  .splash-stack.loading { background:linear-gradient(100deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .splash-fail { position:absolute; top:12px; right:14px; color:var(--muted); font-size:13px; }

  .rank-word.best { display:inline-block; padding:0 6px; background:var(--accent); border-radius:3px; color:var(--accent-ink); font-weight:600; }
  .rank-word.alt { display:inline-block; padding:0 6px; border:1px solid var(--muted); border-radius:3px; color:var(--text); line-height:1.25; }
  .rank-word.other { color:var(--muted); }
  .rank-word.bad { color:var(--threat); }
  .rank.tier-other, .rank.tier-bad { background:transparent; }
  .rank.tier-other .rank-top, .rank.tier-bad .rank-top { opacity:.78; transition:opacity .12s; }
  .rank:hover .rank-top { opacity:1; }
  .rank .portrait { transition:transform .15s; }
  .rank:hover .portrait { transform:scale(1.05); }
  .rank.tier-alt .force i { background:var(--text); }
  .rank.tier-bad .force i { background:var(--threat); }
  .force i { transition:background-color .15s; }
  .chosen { position:absolute; top:6px; right:6px; z-index:1; display:flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--accent); border-radius:50%; color:var(--accent-ink); font-size:12px; font-weight:700; }
  .rank.picked .rank-name { padding-right:18px; }

  .wincon { margin:0 0 8px; padding:9px 11px; background:var(--raised); border-radius:6px; font-size:15px; line-height:1.3; }
  .wincon span { display:block; margin-bottom:2px; color:var(--accent); font:15px var(--condensed); }
  .plan-row.threat > span:first-child { color:var(--threat); }
  .plan-row.threat .portrait { box-shadow:0 0 0 1.5px var(--threat); }
  .plan-row.ban-row > span:first-child { color:var(--gold); }
  .plan-row.ban-row .portrait { box-shadow:0 0 0 1.5px var(--gold); }
  .faces { min-width:0; }
  .plan-block { padding-bottom:12px; }

  .winbars { display:grid; gap:6px; margin-bottom:4px; }
  .winbar { display:grid; grid-template-columns:minmax(0,90px) 1fr auto; align-items:center; gap:8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .winbar-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .winbar-track { height:7px; background:var(--bg); border-radius:1px; overflow:hidden; }
  .winbar-track i { display:block; height:100%; background:var(--accent); transform-origin:left; }
  .winbar.few .winbar-track i { background:var(--muted); }
  .winbar-val { color:var(--muted); font-size:13px; white-space:nowrap; }
  .history { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; }
  .game { width:13px; height:13px; border-radius:2px; }
  .game.win { background:var(--accent); }
  .game.loss { background:var(--threat); }

  .mobile-bar { display:none; }

  /* V2.1 */
  .note.risk { color:var(--threat); }
  .tab { padding:10px 6px; font-size:13px; }
  .seg-tabs { display:flex; gap:2px; margin-bottom:8px; padding:2px; background:var(--bg); border-radius:6px; }
  .seg-tab { flex:1; min-height:28px; padding:3px 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:13px; transition:background-color .12s, color .12s; }
  .seg-tab:hover { color:var(--text); }
  .seg-tab.on { background:var(--raised); color:var(--text); }
  .tips { margin-bottom:8px; }
  .tips li { position:relative; margin-bottom:7px; padding-left:12px; font-size:13px; line-height:1.35; }
  .tips li::before { content:""; position:absolute; left:0; top:.5em; width:5px; height:5px; background:var(--accent); border-radius:50%; }
  .matrix { margin:6px 0 10px; font-size:13px; }
  .mx-row { display:grid; grid-template-columns:minmax(0,1fr) repeat(var(--n,4),30px); grid-auto-flow:column; grid-auto-columns:30px; align-items:center; min-height:26px; border-bottom:1px solid var(--line); }
  .mx-head { min-height:32px; }
  .mx-row > span:first-child { min-width:0; padding-right:6px; }
  .mx-row > span:not(:first-child) { display:flex; justify-content:center; }
  .mx-cell { font-weight:700; color:var(--muted); }
  .mx-cell.up { color:var(--accent); }
  .mx-cell.down { color:var(--threat); }
  .pick-detail { border-bottom:1px solid var(--line); padding:4px 0 6px; }
  .pick-detail summary { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; font:15px var(--condensed); }
  .pick-detail .why { margin:4px 0 4px 2px; }
  .pick-detail a { color:var(--accent); }
  .cmp-head { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; color:var(--muted); font-size:12px; }

  /* Panneaux compagnon */

  .panel-left .effects { margin:8px 0 0; padding:7px 9px; background:var(--bg); border:1px solid #1f4a4a; border-radius:6px; }
  .panel-left .meter { grid-template-columns:minmax(0,84px) 1fr 16px; font-size:12px; }
  .p-scroll, .p-body { flex:1; min-height:0; overflow:auto; }
  .p-body { display:flex; flex-direction:column; gap:9px; padding:10px 12px 12px; }
  .panel-compact .p-body { overflow:visible; flex:none; }
  .p-compact-enemies { padding:10px 12px 0; }
  .compact-roles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; margin:0; }
  .compact-roles .role { flex-direction:column; min-height:84px; padding:4px 1px; gap:2px; text-align:center; }
  .compact-roles .who-wrap { flex:none; flex-direction:column; width:100%; padding:0; gap:2px; }
  .compact-roles .role-who { width:100%; flex:none; }
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { font-size:12px; }
  .compact-roles .role-traits, .compact-roles .to-mid, .compact-roles .role-empty .em { display:none; }
  .compact-roles .role-icon { width:100%; font-size:12px; }

  .compact-roles .portrait, .compact-roles .slot-ghost { width:34px !important; height:34px !important; }
  .compact-roles .mini.x { min-width:20px; height:20px; font-size:15px; }
  .p-status { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; }
  .p-reco { position:relative; flex:none; height:clamp(120px,19vh,180px); overflow:hidden; background:var(--bg); border:2px solid var(--accent); border-radius:8px; isolation:isolate; }
  .p-reco .splash { object-position:70% 18%; }
  .p-reco-scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(10,15,22,.9),rgba(10,15,22,.25) 75%); }
  .p-reco-text { position:absolute; left:12px; bottom:10px; right:10px; }
  .p-chip { display:inline-block; padding:1px 7px; background:var(--accent); border-radius:3px; color:var(--accent-ink); font-size:12px; font-weight:600; }
  .p-name { font:clamp(26px,9vw,36px)/1.05 var(--condensed); margin-top:3px; }
  .p-change { margin:0; padding:5px 8px; border:1px solid var(--gold); border-radius:4px; font-size:13px; }

  .p-alt { flex:none; display:flex; align-items:center; gap:10px; width:100%; padding:6px 10px 6px 6px; background:var(--bg); border:1px solid var(--line); border-radius:6px; text-align:left; font:18px var(--condensed); transition:border-color .12s; }

  .p-actions .cta { margin:0; min-height:36px; padding:5px 13px; font-size:15px; }
  .p-empty { color:var(--muted); }
  .settings-back { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(4,8,12,.72); }
  .settings { width:min(520px,100%); max-height:100%; overflow:auto; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .settings .sec-title { align-items:center; }
  .settings h3 { margin:12px 0 5px; color:var(--muted); font:15px var(--condensed); }
  .set-row { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .set-check, .set-line { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:13px; }
  .settings select { padding:3px 6px; background:var(--bg); border:1px solid var(--line-strong); border-radius:4px; }
  @keyframes shimmer { from { background-position:120% 0; } to { background-position:-120% 0; } }

  /* V2.7 : textes longs. Un mot sans espace se coupe au lieu de sortir de son conteneur. */
  .p-reasons li, .reasons li, .p-win p, .p-threat p, .p-change, .note, .small, .tips li, .wincon, .effects, .why li, .plain li, .p-empty, .hint, .result-note, td { overflow-wrap:anywhere; }
  .p-name, .champ-name, .p-threat-who, .face, .p-alt-text { min-width:0; overflow-wrap:anywhere; }
  .p-name.long { font-size:24px; line-height:1.1; }
  .champ-name.long { font-size:clamp(26px,2.4vw,36px); line-height:1.08; }
  .cta { max-width:100%; }
  .settings input[type=file] { max-width:100%; }
  .set-check { align-items:flex-start; }
  .set-check input { flex:none; margin-top:3px; }
  .p-ban-row { flex-wrap:wrap; }
  /* Dans le petit bandeau du verdict, ce message passerait sur le nom : l'absence d'image se voit déjà. */
  .p-reco .splash-fail { display:none; }
  .results { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .res { min-width:0; padding-left:4px; padding-right:4px; }
  /* La scène grandit avec son contenu : un verdict long ne déborde plus sur le classement. */
  .col-mid .stage { flex:1 0 auto; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; }
  .stage-body { position:relative; left:auto; bottom:auto; }
  /* Le bandeau de changement reste dans le flux : long ou court, il ne couvre jamais le verdict. */
  .change { position:relative; top:auto; left:auto; right:auto; flex:none; margin:14px 22px auto; align-self:flex-start; }
  .stage:has(.change) .splash-fail { display:none; }
  .cmp-head { flex-wrap:wrap; justify-content:center; }
  /* Boutons très rapprochés : le contour de focus reste à l'intérieur pour ne pas toucher le voisin. */
  .p-btn:focus-visible, .mini:focus-visible, .cmp-btn:focus-visible, .seg-tab:focus-visible, .tab:focus-visible, .res:focus-visible { outline-offset:-2px; }
  .pick-detail a { display:inline-block; padding:5px 0; }
  .settings input[type=file] { min-height:28px; }
  /* Réglages : l'essentiel d'abord, et une ligne d'aide sous les options qui en ont besoin. */
  .settings h3 { color:var(--text); }
  .set-card { margin-bottom:8px; padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .set-card.on { border-color:#1f4a4a; }
  .set-main { margin-bottom:3px; font-size:15px; font-weight:600; }
  .set-hint { margin:0 0 6px 21px; color:var(--muted); font-size:13px; line-height:1.3; }
  .set-hint.flush { margin-left:0; }
  .role-pick { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .role-pick .on { border-color:var(--accent); color:var(--accent); }
  .pool-list { display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px; }
  .pool-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; min-height:30px; padding:2px 8px 2px 3px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13px; }
  .pool-chip:hover { background:var(--raised); border-color:var(--muted); }
  .pool-chip.on { border-color:#1f4a4a; }
  .pool-chip b { color:var(--muted); font-weight:400; }

  .lcu-state { display:flex; align-items:center; gap:7px; margin:0 0 6px 21px; font-size:13px; font-weight:600; }
  .lcu-state i { flex:none; width:8px; height:8px; background:currentColor; border-radius:50%; }
  .lcu-state.good { color:var(--accent); }
  .lcu-state.wait { color:var(--gold); }
  .lcu-state.bad { color:var(--threat); }
  .lcu-state.idle { color:var(--muted); }
  .data-list { margin:8px 0 0; padding:0; list-style:none; }
  .data-list li { margin-bottom:9px; font-size:13px; }
  .data-list li.off > b { color:var(--muted); }
  .data-list p { margin:2px 0 0; color:var(--muted); font-size:13px; line-height:1.3; overflow-wrap:anywhere; }
  .data-kind { color:var(--muted); font-size:12px; }

  .set-more { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  .set-more summary { min-height:24px; color:var(--muted); font-size:13px; cursor:pointer; }
  .set-more p, .set-more .set-check { margin-top:6px; }

  /* Le panneau gauche défile au lieu de comprimer son contenu quand la hauteur manque. */
  .panel .col-left { overflow:auto; }
  .panel-left .col-left > * { flex-shrink:0; }
  .tab { padding-left:5px; padding-right:5px; }
  .panel-left .meter { grid-template-columns:96px minmax(0,1fr) 16px; }
  .who-wrap, .panel-left .who-wrap { padding-right:32px; }

  /* Noms entiers en mode compact, sur deux lignes si nécessaire. */
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:normal; overflow-wrap:anywhere; font-size:12px; line-height:1.12; }

  .compact-roles .role-tools { top:12px; right:-2px; }

  /* V2.16 : profils par rôle. */

  /* V2.15 : égalités, conseil unique, expérience. */
  .tie-group { flex:none; display:flex; flex-direction:column; gap:6px; }

  .tie-text small { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .tie-check { flex:none; color:var(--accent); }
  .tie-group .note { margin:0; font-size:12px; }
  .stage-tie { display:flex; align-items:flex-end; }
  .stage-tie .stage-body { position:relative; left:auto; bottom:auto; width:100%; }
  .coach-line { flex:none; padding:6px 8px; border-left:2px solid var(--line); font-size:13px; }
  .coach-line b { display:block; overflow-wrap:anywhere; }
  .coach-line p { margin:2px 0 0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .link-btn { min-height:24px; padding:2px 0; background:none; border:0; color:var(--muted); font-size:13px; text-decoration:underline; }
  .link-btn:hover { color:var(--text); }
  .familiar-line { flex:none; margin:0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .familiar-line span { margin-right:4px; }
  .coach-level { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; margin:8px 0; }
  .coach-level select { min-height:28px; }
  .choice-block { margin:8px 0; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  .choice-row { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:2px 0; font-size:13px; }
  .choice-row span { color:var(--muted); }
  .choice-row b { overflow-wrap:anywhere; }
  .exp-list, .advice-list { margin:4px 0; padding:0; list-style:none; font-size:13px; }
  .exp-list li { padding:2px 0; }
  .advice-item { padding:6px 0; border-bottom:1px solid var(--line); }
  .advice-item p { margin:2px 0; overflow-wrap:anywhere; }
  .advice-item small { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }

  /* V2.14 : échelle de texte. Rien sous 12,5 sauf les libellés de rôle, très courts. */
  :root { --fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px; --info:#8fbbe8; }
  .hint, .rank-word, .rank-rec, .role-traits, .p-chip, .p-alt small, .p-threat-who, .p-ban .note, .result-note, .note { font-size:var(--fs-xs); }

  .note { font-size:13px; }
  .stage-body { text-shadow:0 1px 3px rgba(4,8,12,.75); }
  .stage-body .cta, .stage-body .badge { text-shadow:none; }
  .scrim { background:linear-gradient(90deg,rgba(10,15,22,.95) 0%,rgba(10,15,22,.8) 46%,rgba(10,15,22,.08) 82%), linear-gradient(0deg,rgba(10,15,22,.75),transparent 58%); }
  .stage-notes { min-height:0; display:flex; flex-direction:column; gap:4px; margin-top:2px; }
  /* Danger et adversaire : deux lignes qui se lisent d'un coup d'œil, de couleurs différentes du badge du conseil. */
  .alert-line { color:var(--text); font-size:var(--fs-sm); line-height:1.3; overflow-wrap:anywhere; }
  .alert-line b { margin-right:4px; color:var(--threat); font-weight:600; }

  .opp-line.unsure { color:var(--info); }

  .opp-line b { color:var(--text); font-weight:600; }
  .hint.warn { color:var(--info); }
  .assumed { display:block; color:var(--info); }
  .role-flex { color:var(--info); }
  .role.is-mid .role-traits { white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.2; }
  .panel-left .role.is-mid .role-traits { -webkit-line-clamp:3; }
  /* Panneau unique : la colonne en surbrillance et la ligne d'adversaire suffisent. */
  .compact-roles .role.is-mid .role-traits { display:none; }
  /* Noms dans les colonnes étroites : police condensée, sans couper un mot au milieu. */
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { font:13px/1.1 var(--condensed); white-space:normal; overflow-wrap:normal; word-break:normal; }
  /* Détails : présents, mais repliés. */
  .more-line summary, .p-more summary { display:list-item; min-height:24px; color:var(--muted); font-size:var(--fs-sm); cursor:pointer; }
  .more-line summary:hover, .p-more summary:hover { color:var(--text); }
  .more-line[open] .note { margin-top:2px; }
  .p-more { flex:none; }
  .p-more > section { margin-top:7px; }
  .p-more[open] { padding-bottom:4px; }
  /* Panneaux : le conseil reste net, sans repousser les raisons sous le pli. */
  .p-reco { height:clamp(84px,14vh,126px); border-width:1px; }
  .p-reasons li:last-child { margin-bottom:0; }
  .p-threat { align-items:flex-start; background:rgba(242,119,122,.07); border:0; border-left:3px solid var(--threat); border-radius:0 6px 6px 0; padding:6px 8px; }
  .p-threat b { font-size:var(--fs-md); overflow-wrap:anywhere; }
  .p-threat p { font-size:13px; }
  .p-body { gap:8px; }
  .cta:active { filter:brightness(.92); }
  .cta:focus-visible, .p-alt:focus-visible, .rank:focus-visible { outline-offset:1px; }
  .p-more summary:focus-visible, .more-line summary:focus-visible { outline-offset:1px; border-radius:3px; }

  /* Panneaux étroits : 125 % d'affichage Windows réduit 320 pixels physiques à 256 pixels d'interface. */
  @media (max-width:300px) {
    .panel .brand { font-size:18px; }
    .panel-left .col-left, .panel .p-body { padding-left:9px; padding-right:9px; }
    .panel .p-actions { margin-left:-9px; margin-right:-9px; padding-left:9px; padding-right:9px; }
    .p-compact-enemies { padding-left:9px; padding-right:9px; }
    .panel-left .roles > .role { gap:6px; padding:5px 4px; }
    .panel-left .role-icon { width:34px; font-size:12px; }
    .panel-left .role .portrait, .panel-left .slot-ghost { width:38px !important; height:38px !important; }
    .panel-left .who-wrap { gap:6px; padding-right:32px; }
    .panel-left .role-name, .panel-left .role.is-mid .role-name { font-size:15px; }
    .panel-left .meter { grid-template-columns:90px minmax(0,1fr) 14px; gap:6px; }
    .p-actions .cta { flex:1 1 auto; padding-left:10px; padding-right:10px; }
    .opt-word { display:none; }
    .p-alt { font-size:15px; gap:8px; }
    .p-threat { padding:7px 8px; }
  }

  /* Hauteur réduite : le verdict et l'alternative restent visibles sans défiler. */
  @media (max-height:600px) {
    .panel .p-reco { height:72px; }
    .compact-roles .role { min-height:70px; padding-top:2px; padding-bottom:2px; }
    .compact-roles .portrait, .compact-roles .slot-ghost { width:30px !important; height:30px !important; }
    .panel .p-body { gap:7px; padding-top:7px; }
    .panel .p-title { height:34px; }
    .panel-left .roles > .role { min-height:48px; padding-top:3px; padding-bottom:3px; }
    .panel-left .role .portrait, .panel-left .slot-ghost { width:38px !important; height:38px !important; }
    .panel-left .hint { margin-bottom:6px; }
    .panel .p-name { font-size:24px; }
    .panel .p-name.long { font-size:18px; }
  }

  /* Le mouvement réduit concerne aussi le CSS, pas seulement Motion. */
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-height:800px) and (min-width:1101px) {
    .col-left { padding:10px 12px; }

    .hint { margin-bottom:6px; }
    .meters { gap:4px; }
    .roles { margin-bottom:8px; }
    .plan-row { min-height:30px; padding:2px 0; }

  }
  @media (max-width:1100px) {

.top .ghost-btn, .top .seg-tab { padding-left:8px; padding-right:8px; }
    .desk { grid-template-columns:minmax(280px,340px) minmax(0,1fr); }

    .rank-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tab-body { overflow:visible; }
    .role .portrait, .slot-ghost { width:44px !important; height:44px !important; }
    .col-right { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto 1fr; align-items:start; }

    .who-wrap { flex:none; flex-direction:column; width:100%; gap:3px; }

    .profile { display:none; }

    .roles { margin-bottom:6px; }
    .role-name { font-size:13px; }
    .role-traits { display:none; }

    .role-tools .to-mid { display:none; }

    .plan-row { grid-template-columns:62px 1fr; }

  /* ---------- Fenêtre principale à cinq sections (UX-3, COMPOSANTS-V3) ---------- */
  /* Échelle réduite : 12, 13, 15, 18, 24, 34 px. Espacements de 4 en 4. Rayons : étiquette 4, contrôle 6, boîte 10. */
  :root { --hover:#1e2938; --line-strong:#6b7c94; --accent-soft:#0e2a2a; --accent-line:#1f4a4a; --threat-soft:#2d1416; --gold-soft:#2a2312; --gold-line:#5a4a22;
    --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px; --fs-2xl:34px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --r-tag:4px; --r-ctl:6px; --r-box:10px; --nav-w:216px; }
  .shell { display:grid; grid-template-columns:var(--nav-w) minmax(0,1fr); height:100vh; }
  .nav { display:flex; flex-direction:column; min-height:0; overflow:auto; padding:var(--s4) var(--s3); background:var(--surface); border-right:1px solid var(--line); }
  .nav-brand { display:flex; align-items:center; gap:var(--s2); padding:0 var(--s2) var(--s5); }
  .nav-brand .p-logo { width:20px; height:20px; color:var(--accent); }
  .nav-brand .brand { font:var(--fs-xl)/1 var(--condensed); letter-spacing:0; }
  .nav-brand small { margin-left:auto; padding:1px 6px; border:1px solid var(--line-strong); border-radius:var(--r-tag); color:var(--muted); font-size:var(--fs-xs); }
  .nav-list { display:flex; flex-direction:column; gap:2px; }
  .nav-grow { flex:1; min-height:var(--s4); }
  .nav-link { position:relative; display:flex; align-items:center; gap:var(--s3); width:100%; min-height:40px; padding:0 var(--s3); background:transparent; border:0; border-radius:var(--r-ctl); color:var(--muted); font-size:var(--fs-md); text-align:left; }
  .nav-link:hover { background:var(--hover); color:var(--text); }
  .nav-link[aria-current="page"] { background:var(--raised); color:var(--text); }
  .nav-link[aria-current="page"]::before { content:""; position:absolute; left:calc(-1 * var(--s3)); top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
  .nav-link[aria-current="page"] .nav-icon { color:var(--accent); }
  .nav-icon { flex:none; width:18px; height:18px; }
  .nav-state { display:grid; gap:var(--s2); margin-top:var(--s3); padding:var(--s3); border:1px solid var(--line); border-radius:var(--r-box); font-size:var(--fs-sm); }
  .nav-line { display:flex; align-items:center; gap:var(--s2); min-width:0; }
  .nav-line .lbl { font-weight:600; }
  .nav-line .val { margin-left:auto; color:var(--muted); white-space:nowrap; }
  .nav-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .nav-dot.good { background:var(--accent); } .nav-dot.wait { background:var(--gold); } .nav-dot.bad { background:var(--threat); }
  .nav-role-icon { display:inline-flex; width:14px; height:14px; color:var(--accent); }
  .nav-role-icon svg { width:14px; height:14px; }
  .nav-legal { padding:var(--s3) var(--s2) 0; color:var(--muted); font-size:var(--fs-xs); line-height:1.4; }

  .view { min-width:0; min-height:0; overflow:auto; }
  .view-sim { overflow:hidden; }
  .view .app { height:100%; }
  .top .seg-tab { white-space:nowrap; }
  /* La navigation prend 216 px : colonnes latérales un peu plus étroites, classement sur deux lignes jusqu'à 1 500 px. */
  @media (min-width:1101px) { .view .desk { grid-template-columns:clamp(270px,21vw,420px) minmax(0,1fr) clamp(290px,23vw,440px); } }
  @media (min-width:1101px) and (max-width:1500px) { .view .rank-list { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .view-title { margin:0; font:var(--fs-lg)/1.15 var(--condensed); white-space:nowrap; }
  .view-page { max-width:1180px; margin:0 auto; padding:var(--s5) var(--s6) var(--s6); }
  .view-head { display:flex; align-items:flex-end; gap:var(--s4); margin-bottom:var(--s5); }
  .view-head h1 { margin:0; font:var(--fs-xl)/1.15 var(--condensed); }
  .view-head p { margin:var(--s1) 0 0; color:var(--muted); font-size:var(--fs-sm); }
  .view-tools { display:flex; gap:var(--s2); margin-left:auto; }
  .box { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-box); }
  .box-pad { padding:var(--s4) var(--s5) var(--s5); }
  .box-title { margin:0 0 var(--s1); font:var(--fs-lg)/1.2 var(--condensed); }
  .box-sub { margin:0 0 var(--s4); color:var(--muted); font-size:var(--fs-sm); }
  .box h3 { margin:var(--s4) 0 var(--s1); color:var(--text); font:var(--fs-md) var(--condensed); }
  .box select { min-height:30px; padding:3px 6px; background:var(--bg); border:1px solid var(--line-strong); border-radius:var(--r-ctl); }
  .box input[type=file] { max-width:100%; min-height:28px; }
  .empty-note { margin:var(--s2) 0; padding:var(--s3) var(--s4); background:var(--bg); border:1px dashed var(--line-strong); border-radius:var(--r-ctl); color:var(--muted); font-size:var(--fs-sm); }

  /* ---------- Accueil (UX-8) ---------- */
  /* Une seule chose forte : la bannière d'état (ou le guide du premier lancement), dont le filet gauche dit le ton.
     Puis la chaîne de la draft, dans l'ordre où elle sert : client League, pool, panneaux ; chaque carte a son filet d'état.
     Enfin deux cartes calmes, sans filet : mise à jour et données. */
  .home { display:grid; gap:var(--s4); }
  .home .view-head { margin-bottom:0; }
  .home-hero { --tone:var(--accent); display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:var(--s3) var(--s5); padding:var(--s5); border-left:4px solid var(--tone); }
  .home-hero.tone-todo { --tone:var(--gold); }
  .home-hero.tone-error { --tone:var(--threat); }
  .hero-mark { display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border:2px solid var(--tone); border-radius:50%; color:var(--tone); }
  .hero-mark .nav-icon { width:24px; height:24px; }
  .home-title { margin:0; font:var(--fs-2xl)/1.1 var(--condensed); }
  .home-lead { margin:var(--s2) 0 0; color:var(--muted); font-size:var(--fs-md); max-width:68ch; }
  .hero-acts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:var(--s2); }
  .hero-acts .cta, .guide-acts .cta { margin:0; }
  .hero-acts .ghost-btn { min-height:40px; }
  /* Étape manquante ou erreur : les actions passent sous le texte, alignées sur lui, pour garder le message lisible. */
  .home-hero:not(.tone-ready):not(.tone-live) .hero-acts { grid-column:2 / -1; justify-content:flex-start; }
  .home-guide { padding:var(--s5); border-left:4px solid var(--gold); }
  .guide-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--s4); margin:var(--s4) 0 0; padding:0; list-style:none; }
  .guide-step { display:flex; flex-direction:column; gap:var(--s2); max-width:none; min-width:0; padding:var(--s4); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-ctl); }
  .guide-head { display:flex; align-items:center; gap:var(--s3); }
  .guide-num { flex:none; display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:2px solid var(--gold); border-radius:50%; color:var(--gold); font:var(--fs-lg)/1 var(--condensed); }
  .guide-head h3 { margin:0; font:var(--fs-lg)/1.2 var(--condensed); }
  .guide-text p { margin:2px 0 0; color:var(--muted); font-size:var(--fs-sm); }
  .guide-text .guide-risk { color:var(--gold); }
  .guide-tag { color:var(--accent); font-weight:600; }
  .guide-acts { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); margin-top:auto; padding-top:var(--s2); }
  .guide-acts .guide-go { min-height:40px; font-size:var(--fs-md); }
  .guide-foot { margin:var(--s3) 0 0; }
  .home-chain { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s4); }
  .home-card { --state:var(--line-strong); display:flex; flex-direction:column; gap:var(--s2); min-width:0; padding:var(--s4) var(--s5); border-top:3px solid var(--state); }
  .home-card.state-good { --state:var(--accent); } .home-card.state-wait { --state:var(--gold); } .home-card.state-bad { --state:var(--threat); }
  .home-card.home-quiet { border-top-width:1px; border-top-color:var(--line); }
  .card-kicker { margin:0; color:var(--muted); font-size:var(--fs-sm); font-weight:400; }
  .card-state { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); margin:0; font:var(--fs-lg)/1.2 var(--condensed); }
  .card-state small { color:var(--muted); font:var(--fs-sm) var(--body); }
  .card-state .nav-role-icon, .card-state .nav-role-icon svg { width:16px; height:16px; }
  .card-text { margin:0; color:var(--text); font-size:var(--fs-sm); line-height:1.4; }
  .card-text.small { color:var(--muted); }
  .card-acts { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); margin-top:auto; padding-top:var(--s2); }
  .home-portraits { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2) var(--s3); margin:0; }
  .home-champ { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); }
  .home-more { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:var(--s4); }
  .data-rows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2) var(--s5); margin:0; }
  .data-row { display:grid; gap:2px; min-width:0; padding-left:var(--s3); border-left:2px solid var(--line); }
  .data-row.ok { border-left-color:var(--accent); }
  .data-row dt { color:var(--muted); font-size:var(--fs-xs); }
  .data-row dd { margin:0; font-size:var(--fs-sm); overflow-wrap:anywhere; }
  /* Fenêtre basse (1366 x 768 à 125 % : 614 px de page) : marges resserrées pour tenir sur un écran. */
  @media (max-height:700px) {
    .home { gap:var(--s3); }
    .home .view-head p { display:none; }
    .home-hero, .home-guide { padding:var(--s4) var(--s5); }
    .home-title { font-size:var(--fs-xl); }
    .hero-mark { width:40px; height:40px; }
    .home-card { padding:var(--s3) var(--s4); gap:6px; }
    .guide-step { padding:var(--s3); }
  }
  /* Grand écran (1080 px de page et plus) : plus d'air, plutôt qu'un grand vide sous les cartes. */
  @media (min-height:960px) and (min-width:1400px) {
    .home { gap:var(--s5); padding-top:var(--s6); }
    .home-hero, .home-guide { padding:var(--s6); }
    .home-card { padding:var(--s5) var(--s6); gap:var(--s3); }
    .card-state { font-size:var(--fs-xl); }
    .card-text { font-size:var(--fs-md); }
  }  @media (max-width:980px) {
    .home-hero { grid-template-columns:auto minmax(0,1fr); }
    .hero-acts { grid-column:1 / -1; justify-content:flex-start; }
    .home-chain { grid-template-columns:minmax(0,1fr); }
    .home-more { grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width:720px) {
    .data-rows { grid-template-columns:minmax(0,1fr); }
  }

  .pool-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr); gap:var(--s4); align-items:start; }
  .pool-grid h3:first-child { margin-top:0; }
  .pool-grid .set-card { margin:0; padding:0; background:none; border:0; }
  .stats-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr); gap:var(--s4); align-items:start; }
  .stats-side { display:grid; gap:var(--s4); }
  .set-page { display:grid; grid-template-columns:220px minmax(0,1fr); gap:var(--s5); align-items:start; }
  .subnav { position:sticky; top:0; display:grid; gap:2px; }
  .subnav-link { display:flex; align-items:center; gap:var(--s3); min-height:38px; padding:var(--s1) var(--s3); background:transparent; border:0; border-radius:var(--r-ctl); color:var(--muted); font-size:var(--fs-md); text-align:left; }
  .subnav-link:hover { background:var(--hover); color:var(--text); }
  .subnav-link.on { background:var(--raised); color:var(--text); box-shadow:inset 3px 0 0 var(--accent); }
  .subnav-link .nav-icon { width:16px; height:16px; }
  .set-body .set-check, .set-body .set-line { font-size:var(--fs-md); }
  .set-body .set-more { margin-top:var(--s4); }

  @media (max-width:1100px) {
    :root { --nav-w:92px; }
    .nav { padding:var(--s3) var(--s2); }
    .nav-brand { justify-content:center; padding:0 0 var(--s4); }
    .nav-brand .brand, .nav-brand small { display:none; }
    .nav-link { flex-direction:column; justify-content:center; gap:4px; min-height:58px; padding:6px 4px; font-size:var(--fs-xs); line-height:1.2; text-align:center; }
    .nav-link[aria-current="page"]::before { left:calc(-1 * var(--s2)); }
    .nav-state { padding:var(--s2); }
    .nav-line { justify-content:center; }
    .nav-line .lbl, .nav-line .val { display:none; }
    .nav-legal { display:none; }
    .view-page { padding:var(--s4) var(--s5) var(--s5); }
    .view-sim { overflow:auto; }
    .view .app { height:auto; }
    .pool-grid, .stats-grid { grid-template-columns:minmax(0,1fr); }

  /* Fenêtre étroite : le titre « Simulateur » est déjà marqué dans la navigation ; la barre garde ses commandes. */

  /* ---------- Mon pool (UX-4) ---------- */

  @media (max-width:1100px) {

    .pool-roles { grid-template-columns:repeat(5,minmax(0,1fr)); }

    .pool-role.on { box-shadow:inset 0 -3px 0 var(--accent); }
    .played-seg { margin-left:0; flex-wrap:wrap; }
    .played-seg .seg-tab span { display:none; }
  }
  /* ---------- Mes statistiques (UX-5) ---------- */
  .stats-tabs { display:flex; gap:var(--s5); margin:calc(-1 * var(--s2)) 0 var(--s4); border-bottom:1px solid var(--line); }
  .stats-tab { position:relative; min-height:40px; padding:0; background:none; border:0; color:var(--muted); font-size:var(--fs-md); }

  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:var(--s4); }
  .kpis > div { padding:var(--s4) var(--s5); border-left:1px solid var(--line); }
  .kpis > div:first-child { border-left:0; }
  .kpis span { display:block; color:var(--muted); font-size:var(--fs-sm); }
  .kpis b { font:var(--fs-xl)/1.2 var(--condensed); }
  .kpis small { color:var(--muted); font-size:var(--fs-sm); }
  .stats-overview { display:grid; gap:var(--s4); }
  .stats-grid .box-title small, .stats-overview .box-title small { margin-left:6px; color:var(--muted); font:var(--fs-sm) var(--body); }
  .stats-line.ok { margin:var(--s2) 0; font-size:var(--fs-md); font-weight:600; }
  .box-head-row { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3); padding:var(--s4) var(--s5) var(--s2); }
  .box-head-row .box-title { flex:1 1 auto; margin:0; }
  .stats-table { width:100%; border-collapse:collapse; font-size:var(--fs-sm); }
  .stats-table th, .stats-table td { padding:6px var(--s3); border-top:1px solid var(--line); text-align:left; font-weight:400; }

  .result-tag.loss { background:var(--threat-soft); color:var(--threat); }

  @media (max-width:1100px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .kpis > div:nth-child(3) { border-left:0; } .kpis > div:nth-child(n+3) { border-top:1px solid var(--line); } }  /* ---------- Overlay (UX-6) : outils en SVG, « Détails », source des adversaires ---------- */
  .tool-icon { display:block; width:16px; height:16px; margin:auto; }
  .p-btn { display:inline-flex; align-items:center; justify-content:center; }

  /* Libellés de rôle à 12 px (plus de 10,5) : le bouton de retrait du panneau unique descend sous le libellé. */
  .compact-roles .role-tools { top:18px; }  /* ---------- Harmonisation (UX-7) ---------- */
  /* Grand écran : pages plus larges, grilles qui occupent la place, lignes de texte bornées (75 signes environ). */
  .view-page { max-width:1440px; }

    .pool-layout { grid-template-columns:240px minmax(0,1fr); }

    .stats-grid { grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr); }
    .set-page { grid-template-columns:260px minmax(0,880px); }
  }</style>
</head>
<body>
<div id="root"></div>
<script src="draft-vendor/react.js"></script>
<script src="draft-vendor/react-dom.js"></script>
<script src="draft-vendor/framer-motion.js"></script>
<script src="draft-vendor/htm.js"></script>
<script src="draft-stats.js"></script>
<script src="draft-history.js"></script>
<script src="draft-role-rates.js"></script>
<script src="draft-role-rates-live.js"></script>
<script src="draft-matchups-live.js"></script>
<script src="i18n/fr.js"></script>
<script src="draft-i18n.js"></script>
<script src="draft-champions.js"></script>
<script src="draft-role-sheet.js"></script>
<script src="draft-engine.js"></script>
<script src="draft-data.js"></script>
<script src="draft-champion-official.js"></script>
<script src="draft-coaching.js"></script>
<script src="draft-mastery.js"></script>
<script src="draft-profiles.js"></script>
<script src="draft-providers.js"></script>
<script src="draft-champion-ids.js"></script>
<script>
if (!window.React || !window.ReactDOM || !window.Motion || !window.htm || typeof analyze === "undefined" || !window.I18N) {
  document.getElementById("root").innerHTML = '<p style="padding:24px;max-width:60ch">DRAFT ne peut pas démarrer : le dossier <b>draft-vendor</b> ou le fichier <b>draft-engine.js</b> est introuvable. Replace-les à côté de ce fichier, puis recharge la page.</p>';
  throw new Error("fichiers de DRAFT introuvables");
}
// Textes des nouveaux écrans : t(), tp() et tx() lisent web/i18n/fr.js (draft-i18n.js). Les textes existants n'y passent pas encore.
const { t, tp, tx } = window.I18N;
const state = { enemies: [], manualMid: null, held: null, shown: null, clear: true, current: null, boardKey: null };

function matchByKeys(names, keysOf, query) {
  const q = norm(query);
  if (!q) return [];
  const starts = names.filter(n => keysOf(n).some(k => k.startsWith(q)));
  const contains = names.filter(n => !starts.includes(n) && keysOf(n).some(k => k.includes(q)));
  return starts.concat(contains);
}

const suggest = query => matchByKeys(NAMES.filter(n => !state.enemies.includes(n)), champKeys, query).slice(0, 6);

function currentMid() {
  if (state.manualMid && state.enemies.includes(state.manualMid)) return state.manualMid;
  return identifiedOpponent(state.enemies, state.roleOf);
}

// Statistiques personnelles de l'ancien format (draft-stats.js), importées par le menu de l'icône (facultatif)
const STATS = window.DRAFT_STATS || null;
const RAW_NAMES = Object.assign(Object.fromEntries(NAMES.map(n => [norm(n), n])), { monkeyking:"Wukong", renata:"Renata Glasc" });
const toName = raw => RAW_NAMES[norm(raw || "")] || raw || "";
const STAT_ROWS = STATS && Array.isArray(STATS.rows)
  ? STATS.rows.map(r => Object.assign({}, r, { champ: toName(r.champ), mid: toName(r.mid) }))
  : [];
const MAIN_ACCOUNT = STATS && STATS.accounts && STATS.accounts[0];
// Personnalisation future : ces bilans restent affichés, sans modifier le score, tant qu'un test prudent ne justifie pas de les y intégrer.
const EVOLUTION_STEP = 20;
const inPool = name => PICKS.map(label).includes(name);
const SHRINK_K = 50;
const MIN_GAMES = 10;

function record(rows) {
  const wins = rows.filter(r => r.win).length;
  return { wins, losses: rows.length - wins, games: rows.length };
}
const fmtRecord = rec => `${rec.wins}V ${rec.losses}D`;
const pct = rec => rec.games ? `${Math.round(100 * rec.wins / rec.games)} %` : "-";

// Ramène un petit bilan vers le winrate du champion, pour éviter de surestimer quelques parties.
function shrunkRate(rec, base) {
  return (rec.wins + SHRINK_K * base) / (rec.games + SHRINK_K);
}

function matchupWord(rec, base) {
  if (rec.games < MIN_GAMES) return "pas assez de parties";
  const gap = shrunkRate(rec, base) - base;
  if (Math.abs(gap) < 0.03) return "pas de préférence";
  return gap > 0 ? "léger avantage" : "léger désavantage";
}

function personalLine(pick, mid) {
  if (!STAT_ROWS.length) return "";
  const rows = STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === label(pick));
  const all = record(rows);
  if (!all.games) return `aucune partie sur ${label(pick)}`;
  const base = fmtRecord(all);
  if (!mid) return base;
  const vs = record(rows.filter(r => r.mid === mid));
  if (!vs.games) return `${base}, jamais contre ${mid}`;
  return `${base}, contre ${mid} ${fmtRecord(vs)} : ${matchupWord(vs, all.wins / all.games)}`;
}


const JOURNAL_KEY = "draftJournal";

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || []; } catch (e) { return []; }
}

function saveJournal(list) {
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(list)); } catch (e) {}
}

function updateEntry(id, change) {
  const list = loadJournal();
  const entry = list.find(x => x.id === id);
  if (entry) { Object.assign(entry, change); saveJournal(list); }
}

function syncCurrentEntry() {
  if (state.current) updateEntry(state.current, { enemies: state.enemies.slice(), mid: currentMid() });
}


// ---------- Actions ----------
let rerender = () => {};
let V = null;
const ROLE_LABEL = { top:"Top", jungle:"Jungle", mid:"Mid", adc:"ADC", support:"Support" };

// Les rôles affichés suivent la répartition la plus probable du calcul (likelyAssignment, tirée de roleBelief).
// Ils servent à l'affichage ; seul l'adversaire direct influence le classement. L'adversaire affiché et les corrections sont respectés.
function likelyRoles() {
  const fixed = Object.assign({}, state.roleOf || {});
  const mid = currentMid();
  if (mid) fixed[mid] = myRole();
  return likelyAssignment(state.enemies, fixed);
}
function deriveSlots() { return likelyRoles().slots; }

// Rôle incertain d'un adversaire : « ADC ou Mid » si deux rôles sont proches, « ADC ? » si le rôle affiché reste peu probable.
function roleTag(info) {
  if (!info || !info.uncertain) return "";
  return info.close.length ? `${ROLE_LABEL[info.role]} ou ${ROLE_LABEL[info.close[0]]}` : `${ROLE_LABEL[info.role]} ?`;
}

function describeChange(prev, shown, heldEntry, ranking) {
  if (!prev || !prev.n || !prev.shown || prev.shown === shown || !state.lastAction) return null;
  const oldNow = ranking.find(p => p.pick === prev.shown);
  const oldBefore = prev.order.find(p => p.pick === prev.shown);
  const newBefore = prev.order.find(p => p.pick === shown);
  // Le nouveau nom menait déjà avant cet ajout : c'est la fin de la draft qui libère le nom affiché, pas ce champion.
  if (oldNow && state.enemies.length >= 5 && newBefore && oldBefore && newBefore.score > oldBefore.score) return { id: Date.now(), trigger: "Draft complète", from: label(prev.shown), to: label(shown), reason: "Il menait déjà de peu : le conseil change maintenant que la draft est complète." };
  // Sinon, la raison est le critère qui sépare le plus les deux picks maintenant.
  const lead = oldNow && leadCriterion(heldEntry, oldNow);
  const crit = lead && heldEntry.criteria.find(c => c.key === lead.key);
  const reason = !oldNow ? `${label(prev.shown)} est pris en face` : lead ? (crit && crit.impact > 0 && signedText(crit, 1)) || `avantage sur « ${lead.label} »` : "";
  return { id: Date.now(), trigger: state.lastAction, from: label(prev.shown), to: label(shown), reason };
}

function computeVerdict() {
  const prevV = V;
  const action = state.lastAction;
  if (!state.enemies.length) state.held = null;
  const n = state.enemies.length;
  const mid = currentMid();
  const manual = !!state.manualMid && state.enemies.includes(state.manualMid);
  const belief = manual ? null : opponentBelief(state.enemies, state.roleOf);
  const scenarios = belief && n ? beliefScenarios(belief) : null;
  const res = analyze(state.enemies, mid, PREFS.assumeFront, scenarios);
  if (!res.ranking.length) {
    state.held = null;
    state.shown = null;
    V = { n, mid, res, none:true, order:[], avoided:[], reasons:[], bans:suggestBans() };
    return;
  }
  // Draft complète : le classement fait foi, quel que soit l'ordre de saisie. Le maintien évite seulement de clignoter en cours de draft.
  state.held = !n ? null : n >= 5 ? res.ranking[0].pick : holdPick(res.ranking, state.held);
  const shown = state.held || res.ranking[0].pick;
  const heldEntry = res.ranking.find(p => p.pick === shown);
  const m = matchupOf(mid);
  const available = availablePicks(state.enemies);
  const avoided = m ? avoidedPicks(m).filter(p => available.includes(p) && p !== shown) : [];
  // Même évaluation : ces champions sont présentés à égalité. held ne sert plus alors qu'à stabiliser le reste de l'écran.
  const tied = heldEntry.tiedWith && heldEntry.tiedWith.length ? [heldEntry.pick].concat(heldEntry.tiedWith) : null;
  const notTied = p => !tied || !tied.includes(p.pick);
  const tiedEntries = tied ? tied.map(t => res.ranking.find(p => p.pick === t)) : [];
  const others = res.ranking.filter(p => p.pick !== shown && notTied(p));
  const rival = others.find(p => !avoided.includes(p.pick)) || others[0];
  const clear = !n || !others.length || heldEntry.score - others[0].score >= HOLD_GAP;
  state.shown = shown;
  state.clear = clear;
  const without = n && PREFS.assumeFront ? analyze(state.enemies, mid, false).ranking[0] : null;
  const order = (tied ? tiedEntries : [heldEntry]).concat(rival ? [rival] : [], others.filter(p => p !== rival));
  V = {
    n, mid, res, shown, rival, clear, avoided:tied ? avoided.filter(p => !tied.includes(p)) : avoided, order, tied,
    commonReasons: tied ? tiedEntries.map(positiveReasons).reduce((a, b) => a.filter(t => b.includes(t))) : [],
    reasons: positiveReasons(heldEntry),
    risk: mainRisk(heldEntry),
    midAlt: belief ? midSwapEffect(state.enemies, mid, shown, PREFS.assumeFront, belief.candidates.filter(c => c.p >= SCENARIO_MIN).map(c => c.name)) : null,
    belief, confidence: belief ? belief.confidence : null,
    hypothesis: belief && n ? beliefHypothesis(belief, mid) : null,
    provisional: !!belief && n > 0 && (belief.confidence === "low" || !!(scenarios && scenarios.length > 1 && scenarios.some(sc => analyze(state.enemies, sc.mid, PREFS.assumeFront).ranking[0].pick !== res.ranking[0].pick))),
    personal: personalLine(shown, mid),
    without: without && without.pick !== shown && !(scenarios && scenarios.length > 1) ? without.pick : null,
    bans: suggestBans(),
    // Passer d'un ex æquo à l'autre n'est pas un changement de conseil.
    change: action && !(tied && prevV && tied.includes(prevV.shown)) && !(prevV && prevV.tied && prevV.tied.includes(shown)) ? describeChange(prevV, shown, heldEntry, res.ranking) : null
  };
  state.lastAction = null;
}

function commit() {
  const action = state.lastAction;
  computeVerdict();
  syncCurrentEntry();
  publish(action);
}

// ---------- Synchronisation entre panneaux et préférences ----------
const PANEL = new URLSearchParams(location.search).get("panel") || "";
const IS_HOST = !!(window.chrome && window.chrome.webview);
const hostSend = msg => { if (IS_HOST) window.chrome.webview.postMessage(msg); };
const PREFS_KEY = "draftPrefs";
const PREFS = Object.assign({ excluded:[], favorite:null, assumeFront:true, coachLevel:"beginner", autoRole:"suggest" }, (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } })());
ENGINE_PREFS.excluded = PREFS.excluded;
ENGINE_PREFS.favorite = PREFS.favorite;
const hostState = { available:false, autostart:false, follow:true, autoDraft:true, topmost:false, compact:false, placement:"", phase:"", hotkey:false, diagnostics:false };
const SHARED = ["enemies", "manualMid", "held", "current", "roleOf", "targetRole", "selected", "notice", "sessionActive", "assignedRole", "roleManual", "roleDismissed", "roleHandled"];
let channel = null;
try { channel = new BroadcastChannel("draftmid"); } catch (e) {}
// Une page qui s'ouvre (Analyse détaillée, Comparer, rechargement) part d'une draft vide.
// Elle ne diffuse rien avant d'avoir reçu l'état des autres fenêtres, ou constaté qu'aucune ne répond :
// sinon sa draft vide écraserait la vraie draft des panneaux.
let synced = !channel;
const SYNC_WAIT_MS = 1500;
// Simulation (Draft aléatoire) : la fenêtre principale travaille sur sa propre draft, sans toucher à la draft en cours.
let simulating = false;

function publish(action) {
  rerender();
  if (!channel || !synced || simulating) return;
  const snapshot = { kind:"state", action: action || null, prefs: PREFS, profile: PROFILE };
  SHARED.forEach(k => { snapshot[k] = state[k]; });
  channel.postMessage(snapshot);
}

// ---------- Profils par rôle : un pool, des exclusions et un favori par rôle, enregistrés à chaque changement ----------
const APP_VERSION = "2.16.2";
let PROFILES = loadProfiles(localStorage, PREFS);
function useActiveRole() {
  if (!PROFILES.active) return;
  const r = PROFILES.roles[PROFILES.active];
  applyProfile({ role:PROFILES.active, pool:r.pool.slice() });
  PREFS.excluded = r.excluded.slice();
  PREFS.favorite = r.favorite;
  ENGINE_PREFS.excluded = PREFS.excluded;
  ENGINE_PREFS.favorite = PREFS.favorite;
}
useActiveRole();
// Copie de secours dans le dossier de données : le stockage du navigateur intégré peut être réinitialisé.
function storeProfiles() {
  try { persistProfiles(PROFILES, localStorage); } catch (e) {}
  hostSend({ cmd:"saveProfiles", json:JSON.stringify({ version:PROFILES_VERSION, active:PROFILES.active, roles:PROFILES.roles }) });
}
// source : "manual" (clic du joueur) ou "auto" (rôle attribué par le client, si le joueur l'a choisi).
function switchRole(role, source) {
  if (!PROFILE_ROLES.includes(role)) return;
  if (PROFILES.active !== role) {
    PROFILES.active = role;
    storeProfiles();
    useActiveRole();
    state.manualMid = null;
    state.roleOf = {};
    state.held = null;
    PICKS.forEach(p => preloadSplash(label(p)));
    sendProfile();
  }
  if (source === "manual") state.roleManual = true;
  if (source === "auto") state.roleHandled = role;
  state.lastAction = null;
  commit();
}
function handleAssignedRole(role) {
  const value = PROFILE_ROLES.includes(role) ? role : null;
  if (value === state.assignedRole) return;
  state.assignedRole = value;
  const session = { manual:!!state.roleManual, dismissed:state.roleDismissed, handled:state.roleHandled };
  if (decideRoleAction(PREFS.autoRole, session, PROFILES.active, value) === "switch") { switchRole(value, "auto"); return; }
  publish(null);
}
function resetRoleSession() { state.roleManual = false; state.roleDismissed = null; state.roleHandled = null; }
const roleSuggestion = () => decideRoleAction(PREFS.autoRole, { manual:!!state.roleManual, dismissed:state.roleDismissed, handled:state.roleHandled }, PROFILES.active, state.assignedRole) === "suggest" ? state.assignedRole : null;

function savePrefs(change) {
  Object.assign(PREFS, change);
  if (PROFILES.active && ("excluded" in change || "favorite" in change)) {
    PROFILES.roles[PROFILES.active].excluded = PREFS.excluded.slice();
    PROFILES.roles[PROFILES.active].favorite = PREFS.favorite;
    storeProfiles();
  }
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {}
  ENGINE_PREFS.excluded = PREFS.excluded;
  ENGINE_PREFS.favorite = PREFS.favorite;
  commit();
}

// Pendant une simulation, la draft en cours continue d'être suivie à part (liveCopy) : on y revient, ou on la copie, sans attendre.
let liveCopy = null;
function snapshotLive() {
  const copy = { kind:"state", action:null, prefs:JSON.parse(JSON.stringify(PREFS)), profile:PROFILE ? JSON.parse(JSON.stringify(PROFILE)) : null };
  SHARED.forEach(k => { copy[k] = state[k] === undefined ? undefined : JSON.parse(JSON.stringify(state[k])); });

}
if (channel) channel.onmessage = e => {
  const m = e.data;
  // Seule une page qui connaît la vraie draft répond : deux pages qui s'ouvrent en même temps ne s'écrasent pas.
  if (m.kind === "hello") { if (synced && !simulating) publish(null); return; }
  if (m.kind !== "state") return;
  synced = true;
  if (simulating) { liveCopy = m; rerender(); return; }
  applyRemote(m);
};
function applyRemote(m) {
  SHARED.forEach(k => { state[k] = m[k]; });
  PROFILES = loadProfiles(localStorage, PREFS);
  if (m.profile) applyProfile(m.profile);
  if (m.prefs) { Object.assign(PREFS, m.prefs); ENGINE_PREFS.excluded = PREFS.excluded; ENGINE_PREFS.favorite = PREFS.favorite; }
  state.lastAction = m.action;

}

  },
  remove(champion) { removeEnemy(champion); },
  replace(from, to) {
    const i = state.enemies.indexOf(from);
    if (i < 0 || state.enemies.includes(to)) return;
    const role = state.roleOf[from];
    state.enemies[i] = to;
    delete state.roleOf[from];
    if (role) state.roleOf[to] = role;
    if (state.manualMid === from) state.manualMid = to;
    state.lastAction = `${from} remplacé par ${to}`;
    state.notice = state.lastAction;
    commit();
  },
  setRole(champion, role) {
    if (!state.enemies.includes(champion)) return;
    if (role === myRole()) { setMid(champion); return; }

function leaveSimulation() {
  if (!simulating) return;

// Annuler (5 secondes) après une action qui retire des adversaires : Nouvelle draft, Retour arrière.
// La draft exacte est rétablie. L'annonce reste locale à la fenêtre qui a agi.
const UNDO_MS = 5000;
const UNDO_KEYS = ["enemies", "manualMid", "held", "current", "roleOf", "targetRole", "selected", "notice"];
let undoOffer = null;
const copyOf = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
function withUndo(text, action) {
  const snapshot = {};
  UNDO_KEYS.forEach(k => { snapshot[k] = copyOf(state[k]); });
  action();
  if (undoOffer) clearTimeout(undoOffer.timer);
  const offer = { id:Date.now(), text, snapshot };
  offer.timer = setTimeout(() => { if (undoOffer === offer) { undoOffer = null; rerender(); } }, UNDO_MS);
  undoOffer = offer;
  rerender();
}
function clearUndo() { if (undoOffer) { clearTimeout(undoOffer.timer); undoOffer = null; } }
function undoLast() {
  if (!undoOffer) return;
  const snapshot = undoOffer.snapshot;
  clearUndo();
  UNDO_KEYS.forEach(k => { state[k] = copyOf(snapshot[k]); });
  state.lastAction = null;
  commit();
  focusAdd();
}
const removeLastEnemy = () => { const last = state.enemies[state.enemies.length - 1]; withUndo(`Retrait de ${last}.`, () => removeEnemy(last)); };

function setMid(name) {
  const old = currentMid();
  if (old && old !== name && state.roleOf[name]) state.roleOf[old] = state.roleOf[name];
  delete state.roleOf[name];
  state.manualMid = name;
  state.selected = null;
  state.targetRole = null;
  state.lastAction = `${name} ${oppAt()}`;
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function clickRole(role) {
  const slots = deriveSlots();
  const occupant = slots[role];
  const picked = state.selected;
  if (picked && picked !== occupant) {
    const from = Object.keys(slots).find(r => slots[r] === picked);
    if (role === myRole()) { setMid(picked); return; }
    if (occupant) state.roleOf[occupant] = from === myRole() ? role : from;
    if (from === myRole()) { state.manualMid = occupant || null; if (occupant) delete state.roleOf[occupant]; }
    state.roleOf[picked] = role;
    state.selected = null;
    state.notice = `${picked} : ${ROLE_LABEL[role]}`;
    commit();
    return;
  }
  if (occupant) {
    state.selected = picked === occupant ? null : occupant;
    state.targetRole = null;
  } else {
    state.targetRole = state.targetRole === role ? null : role;
  }
  publish(null);
  if (state.targetRole) focusAdd();
}

function searchMatchups(query) {
  const byName = Object.fromEntries(MATCHUPS.map(m => [m.n, m]));
  return matchByKeys(MATCHUPS.map(m => m.n), n => [byName[n].n].concat(byName[n].a || []).map(norm), query).map(n => byName[n]);
}

function optionsFor(m) {
  const available = availablePicks([m.n]);
  const avoid = avoidedPicks(m);
  // Les notes viennent des vrais bilans quand ils existent, sinon du tableau : tri stable, donc le 1er choix écrit reste devant à égalité.
  const written = [m.first, m.second, ...PICKS].filter((p, i, all) => PICKS.includes(p) && all.indexOf(p) === i);
  const note = p => (RULES.matchup(p, null, { mid: m.n }) || [0])[0];
  const ranked = written.filter(p => available.includes(p) && !avoid.includes(p)).sort((a, b) => note(b) - note(a));
  return ranked.concat(written.filter(p => available.includes(p) && avoid.includes(p))).slice(0, 2);
}

function groupRows(rows, keyOf) {
  const map = new Map();
  rows.forEach(r => { const k = keyOf(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return [...map].map(([name, list]) => ({ name, rows: list })).sort((a, b) => b.rows.length - a.rows.length);
}

const CTA_HELP = "Note ce choix dans ton journal. Rien n'est envoyé au client LoL : tu verrouilles toi-même ton champion.";
const CLOSE_HELP = "Deux de tes champions ont des scores proches : les deux se défendent.";
const OPPONENT_HELP = "Le client ne donne pas les rôles adverses : cet adversaire est déduit, et se corrige dans la composition.";

// Une seule échelle pour ton vis-à-vis (docs/technique/GLOSSAIRE-LOL.md §3) : presque sûr, probable, hypothèse
// (1 ou 2 champions vus), pas identifié, pas encore choisi. Le mot suit la confiance calculée ; le seuil pour nommer ne change pas ici.
const seenText = n => `${n} champion${n > 1 ? "s" : ""} vu${n > 1 ? "s" : ""}`;
// Codes : "guess" (1 ou 2 champions vus), "likely", "sure". Le mot affiché vient de OPPONENT_LEVEL_WORD.
const OPPONENT_LEVEL_WORD = { guess:"hypothèse", likely:"probable", sure:"presque sûr" };
function opponentLevel() {
  if (!V.mid) return null;
  if (V.n <= 2) return "guess";
  return V.confidence === "high" ? "sure" : "likely";
}
// Personne de nommé : « pas encore choisi » (code "unrevealed") si aucun candidat plausible n'est révélé et qu'il reste une vraie chance
// qu'il ne soit pas encore pris (ou si rien n'est révélé), sinon « pas identifié » (code "unidentified").
function unnamedState() {
  const h = V.hypothesis;
  if (!V.n) return "unrevealed";
  return h && h.notYet && !h.others.length ? "unrevealed" : "unidentified";
}
const UNNAMED_WORD = { unrevealed:"pas encore choisi", unidentified:"pas identifié" };
const unnamedWord = () => UNNAMED_WORD[unnamedState()];
// Analyse, vis-à-vis pas nommé. Fidèle au calcul : avec des hypothèses, le critère matchup du pick affiché est leur moyenne pondérée.
function matchupUncertainText() {
  const shownEntry = V.res.ranking.find(p => p.pick === V.shown);
  return shownEntry && shownEntry.criteria.some(c => c.key === "matchup")
    ? `${oppName()} pas identifié : le matchup est une moyenne des hypothèses.`
    : `${oppName()} ${unnamedWord()} : le matchup ne compte pas encore.`;
}
// Étiquette de la ligne de ton rôle dans la composition adverse.
function opponentTag() {
  const level = opponentLevel();
  if (!level) return `${oppName()} ? pas identifié`;
  return level === "guess" ? `${oppName()} ? hypothèse (${seenText(V.n)})` : `${oppName()} d'en face (${OPPONENT_LEVEL_WORD[level]})`;
}

// Les hypothèses restent courtes, sans pourcentage : la qualité des données ne permet pas mieux.
function hypothesisText() {
  const h = V.hypothesis;
  if (!h) return "";
  const notYet = h.notYet;
  const named = h.others;
  if (!h.main && !named.length) return `${oppName()} d'en face : ${unnamedWord()}.`;
  if (!h.main) return `${oppName()} d'en face : pas identifié (${named.join(" ou ")}${notYet ? ", ou pas encore choisi" : ""}).`;
  const rest = named.length ? `, sinon ${named.join(" ou ")}${notYet ? " ou pas encore choisi" : ""}` : notYet ? ", sinon pas encore choisi" : "";
  const level = opponentLevel();
  if (level === "guess") return `${oppName()} ? ${h.main}, hypothèse (${seenText(V.n)})${rest}.`;
  return `${oppName()} d'en face : ${h.main} (${OPPONENT_LEVEL_WORD[level]})${rest}.`;
}

        </span>
      <//>

  </div>`;
}

function Meter({ label, count, danger }) {
  const before = useRef(count);
  const [delta, setDelta] = useState(null);
  useEffect(() => {
    if (before.current !== count) setDelta({ id: Date.now(), value: count - before.current });
    before.current = count;
  }, [count]);
  return html`<div className=${`meter${danger && count >= 2 ? " danger" : ""}`}>
    <${motion.span} key=${count} className="meter-label" initial=${count ? { color: danger ? "#f2777a" : "#3fd8c6" } : false} animate=${{ color:"#93a3b6" }} transition=${{ duration:.35 }}>${label}<//>
    <span className="pips" role="img" aria-label=${`${label} : ${count} sur 5`}>
      ${[0, 1, 2, 3, 4].map(i => html`<span key=${i} className="pip"><${motion.i} initial=${false} animate=${{ scaleX: i < count ? 1 : 0 }} transition=${{ ...QUICK, delay: i * .025 }} /></span>`)}
    </span>
    <span className="meter-delta" aria-hidden="true">${delta ? html`<${motion.span} key=${delta.id} initial=${{ opacity:1, y:0 }} animate=${{ opacity:0, y:-5 }} transition=${{ duration:.3, delay:.45 }}>${delta.value > 0 ? "+" : ""}${delta.value}<//>` : null}</span>
  </div>`;
}

function DraftEffects() {
  if (!V.n) return html`<p className="effects">Le profil se remplit à chaque adversaire ajouté.</p>`;
  const { strong, weak } = compoReading(V.res.counts);
  const key = strong.join() + "|" + weak.join();
  return html`<${motion.p} key=${key} className="effects" initial=${{ opacity:.4 }} animate=${{ opacity:1 }} transition=${QUICK}>
    ${strong.length ? html`<span className="hurt">Leurs forces : ${strong.join(", ")}</span>` : null}
    ${weak.length ? html`<span className="help">Leurs failles : ${weak.join(", ")}</span>` : null}
    ${!strong.length && !weak.length ? "Pas de profil marqué pour l'instant." : null}
  <//>`;
}

function UndoNote() {
  if (!undoOffer) return null;
  return html`<p className="hint done" role="status" data-test="undo">${undoOffer.text} <button type="button" className="link-btn" data-test="undo-action" onClick=${undoLast}>Annuler</button></p>`;
