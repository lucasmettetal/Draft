      <p className="small">${window.ROLE_RATES_LIVE ? t("settings.data.roles.live", { date: fmtDate(window.ROLE_RATES_LIVE.updated), count: window.ROLE_RATES_LIVE.games }) : (typeof ROLE_RATES !== "undefined" ? t("settings.data.roles.shipped", { patch: ROLE_RATES.patch }) : t("settings.data.roles.none"))} ${t("settings.data.roles.note")}</p>
      <h3>${t("settings.data.matchups.title")}</h3>
      <p className="small">${window.MATCHUPS_LIVE && !liveRoleOk() ? t("settings.data.matchups.otherRole", { role: ROLE_NAMES[window.MATCHUPS_LIVE.role || "mid"] }) : window.MATCHUPS_LIVE ? t("settings.data.matchups.live", { date: fmtDate(window.MATCHUPS_LIVE.updated), count: window.MATCHUPS_LIVE.games, pool: PICKS.map(p => t("settings.data.matchups.poolItem", { champion: label(p), count: (window.MATCHUPS_LIVE.pool[riotKey(label(p))] || { games:0 }).games })).join(", ") }) : t("settings.data.matchups.none")} ${t("settings.data.matchups.note", { min: MATCHUP_MIN_GAMES })}</p>
      <p className="small" role="status">${nativeText(hostState.rolesStatus)}</p>
      <p className="set-row">
        ${hostState.rolesRunning
          ? html`<button type="button" className="ghost-btn" data-test="stop-roles" onClick=${() => hostSend({ cmd:"updateRoles" })}>${t("settings.data.stopRoles")}</button>`
          : html`<button type="button" className="ghost-btn" data-test="update-roles" onClick=${() => hostSend({ cmd:"updateRoles" })}>${t("settings.data.updateRoles")}</button>
              <button type="button" className="ghost-btn" data-test="update-matchups" onClick=${() => hostSend({ cmd:"updateMatchups" })}>${t("settings.data.updateMatchups")}</button>`}
      </p>
    </div>` : null}
    <${DataSources} />
  </div>`;
  if (id === "updates") return host ? html`<div>
    <p className="small">${t("settings.updates.version", { version: APP_VERSION })}</p>
    ${hostState.updateStatus ? html`<p className="small" role="status" data-test="update-status">${nativeText(hostState.updateStatus)}</p>` : null}
    <p className="set-row"><button type="button" className="ghost-btn" data-test="check-update" disabled=${!!hostState.updateRunning} onClick=${() => hostSend({ cmd:"checkUpdate" })}>${hostState.updateRunning ? t("home.update.running") : t("home.update.check")}</button></p>
  </div>` : html`<${HostOnly} />`;
  return html`<div>
    <p className="small brand-sub">${t("settings.diag.about", { version: APP_VERSION })}</p>
    ${host ? html`<div>
      <label className="set-check"><input type="checkbox" checked=${hostState.diagnostics} onChange=${e => hostSend({ cmd:"setDiagnostics", value:e.target.checked })} /> ${t("settings.diag.journal")}</label>
      <dl className="facts" data-test="diag-state">
        <dt>${t("settings.diag.phase")}</dt><dd>${nativeText(hostState.phase) || "-"}</dd>
        ${hostState.placement && hostState.clientOpen !== false ? html`<dt>${t("settings.diag.placement")}</dt><dd>${nativeText(hostState.placement)}</dd>` : null}
      </dl>
      <p className="set-row"><button type="button" className="ghost-btn" data-test="lcu-diagnostic" onClick=${() => hostSend({ cmd:"lcuDiagnostic" })}>${t("settings.diag.lcu")}</button></p>
      <p className="set-hint flush">${t("settings.diag.lcuHint")}</p>
    </div>` : null}
  </div>`;
}

function SettingsPage({ onClose, solo }) {
  // Échap ramène à la section précédente sans effacer la draft en cours (comme l'ancienne fenêtre des réglages).
  useEffect(() => {
    const onEscape = e => { if (e.key === "Escape") { e.stopPropagation(); onClose(); } };
    document.addEventListener("keydown", onEscape, true);
    return () => document.removeEventListener("keydown", onEscape, true);
  }, [onClose]);
  // UX-7 : plus de bouton « Fermer » (reste de la modale) : la navigation suffit. Ouverts seuls pendant une draft (solo),
  // les réglages gardent un bouton qui referme la fenêtre, pour ne rien laisser devant le client.
  const section = uiSection;
  return html`<div className="view-page" data-test="settings">
    <${ViewHead} title=${t("nav.settings")} sub=${t("settings.sub")}
      tools=${solo ? html`<button type="button" className="ghost-btn" data-test="settings-close" autoFocus=${true} onClick=${onClose}>${t("settings.closeSolo")}</button>` : null} />
    <div className="set-page">
      <div className="subnav" role="tablist" aria-label=${t("settings.sectionsLabel")}>
        ${SETTINGS_SECTIONS.map(s => html`<button key=${s} type="button" role="tab" aria-selected=${s === section} data-test=${`settings-section-${s}`} className=${`subnav-link${s === section ? " on" : ""}`} onClick=${() => goView("settings", s)}>
          <${NavIcon} name=${SECTION_ICONS[s]} /><span>${t(SECTION_KEYS[s][0])}</span></button>`)}
      </div>
      <section className="box box-pad set-body" role="tabpanel" data-test=${`settings-body-${section}`} aria-labelledby="set-title">
        <h2 id="set-title" className="box-title">${t(SECTION_KEYS[section][0])}</h2>
        <p className="box-sub">${t(SECTION_KEYS[section][1])}</p>
        <${SettingsSection} id=${section} />
      </section>
    </div>
  </div>`;
}

function SimView() {
  return html`<div className="app" data-test="view-sim-body">
    <header className="top">
      <h1 id="view-title" className="view-title">${t("nav.sim")}</h1>
      <${RoleSwitch} />
      <span className="patch">${t("sim.patch", { patch: ddVersion.split(".").slice(0, 2).join(".") })}</span>
      <span className="grow"></span>
      <div className="seg-tabs source-switch" role="group" aria-label=${t("sim.source.label")}>
        <button type="button" className=${`seg-tab${simulating ? "" : " on"}`} aria-pressed=${!simulating} data-test="source-live" onClick=${leaveSimulation}>${t("sim.source.live")}</button>
        <button type="button" className=${`seg-tab${simulating ? " on" : ""}`} aria-pressed=${simulating} data-test="source-sim" onClick=${startSimulation}>${t("sim.source.sim")}</button>
      </div>
      <button type="button" className="ghost-btn" data-test="random-draft" data-random-draft=${true} onClick=${startRandomDraft}>${t("sim.random")}</button>
      <button type="button" className="ghost-btn" data-test="new-draft" disabled=${!state.enemies.length} onClick=${() => withUndo(simulating ? t("sim.undo.simCleared") : t("sim.undo.draftCleared"), resetDraft)}>${simulating ? t("sim.new.simulation") : t("sim.new.draft")}</button>
    </header>
    ${simulating ? html`<div className="sim-band" role="status" data-test="simulation" data-simulation=${true}>
      <p>${tx("sim.band.text", { simulation: html`<b>${t("sim.source.sim")}</b>` })}</p>
      <span className="grow"></span>
      <button type="button" className="ghost-btn" data-test="resume-live" disabled=${!liveCopy || !(liveCopy.enemies || []).length} title=${t("sim.resume.title")} onClick=${resumeLiveInSimulation}>${t("sim.resume")}</button>
      <button type="button" className="ghost-btn" data-test="leave-simulation" onClick=${leaveSimulation}>${t("sim.leave")}</button>
    </div>` : null}
    <div className="desk">
      <${EnemyPanel} />
      <div className="col col-mid"><${Stage} /><${Ranking} /></div>
      <${SidePanel} key=${navId} />
    </div>
    <${MobileBar} />
  </div>`;
}

function CompactEnemies() {
  const likely = likelyRoles(), slots = likely.slots;
  return html`<div className="p-compact-enemies">
    <${SearchBox} />
    <${UndoNote} />
    <div className="roles compact-roles">
      ${LEFT_ORDER.map(r => html`<${RoleRow} key=${r} role=${r} name=${slots[r]} assumed=${!state.manualMid} info=${slots[r] ? likely.byName[slots[r]] : null} />`)}
    </div>
  </div>`;
}

function PanelApp() {
  return html`<div className=${`panel panel-${PANEL}`} data-test="panel">
    <${TitleBar} />
    ${PANEL !== "left" ? html`<${RoleSwitch} />` : null}
    ${PANEL === "left" ? html`<${EnemyPanel} />` : null}
    ${PANEL === "right" ? html`<${VerdictPanel} />` : null}
    ${PANEL === "compact" ? html`<div className="p-scroll"><${CompactEnemies} /><${VerdictPanel} /></div>` : null}
  </div>`;
}

const isTextEntry = el => !!el && (el.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName));

function App() {
  const [, force] = useReducer(x => x + 1, 0);
  // Ouverts pendant une draft, les réglages sont seuls à l'écran : les fermer referme la fenêtre, pour ne rien laisser devant le client.
  const settingsWindow = useRef(IS_HOST && new URLSearchParams(location.search).get("solo") === "1");
  const closeSettings = useCallback(() => {
    if (settingsWindow.current) { settingsWindow.current = false; goView(uiBack === "settings" ? "home" : uiBack); hostSend({ cmd:"closeFull" }); return; }
    goView(uiBack === "settings" ? "home" : uiBack);
  }, []);
  useEffect(() => {
    rerender = force;
    // « Simuler une draft » du menu de l'icône quand la fenêtre n'était pas encore chargée.
    if (!PANEL || PANEL === "full") { if (new URLSearchParams(location.search).get("tab") === "simulate") startSimulation(); }
    if (channel) { channel.postMessage({ kind:"hello" }); setTimeout(() => { synced = true; }, SYNC_WAIT_MS); }
    if (IS_HOST) {
      window.chrome.webview.addEventListener("message", e => {
        const m = e.data;
        if (m.kind === "host") {
          Object.assign(hostState, m, { available:true });
          // Stockage du navigateur vide mais copie dans le dossier de données : les profils reviennent.
          if (!PROFILES.active && m.savedProfiles) {
            try { const back = normalizeProfiles(JSON.parse(m.savedProfiles)); if (back && back.active) { PROFILES = back; persistProfiles(PROFILES, localStorage); useActiveRole(); computeVerdict(); } } catch (e) {}
          }
          if (m.legacyProfile) {
            if (!PROFILE) { saveMyProfile(FIRST_PROFILE.role, FIRST_PROFILE.pool.map(label)); computeVerdict(); }
            hostSend({ cmd:"profileAdopted" });
          }
          if (PROFILE && !window.draftProfileSent) { window.draftProfileSent = true; sendProfile(); }
          if (!m.legacyProfile && !PROFILE && PANEL && PANEL !== "full" && !window.draftProfileAsked) { window.draftProfileAsked = true; hostSend({ cmd:"openFull", tab:"pool" }); }
          force();
          handleAssignedRole(m.assignedRole || null);
        }
        if (m.kind === "demo") runDemo(m.stepMs);
        if (m.kind === "draftStart") { clearUndo(); leaveSimulation(); resetRoleSession(); riotProvider.reset(); dispatchDraft({ type:"session-start" }); }
        if (m.kind === "lcuEnemies") applyDetected(m.ids);
        if (m.kind === "draftEnd") { sendValidationRow(); resetRoleSession(); dispatchDraft({ type:"session-end" }); }
        // Message gardé une version (alias) : ouvre la section Réglages.
        if (m.kind === "openSettings") { goView("settings", m.section); window.__openSettingsSeen = m.token || 0; }
        if (m.kind === "openTab") { history.replaceState(null, "", `?panel=full&tab=${m.tab}`); location.reload(); }
        // Ouverture d'une section ou d'un onglet sans recharger la page (« Détails », « Comparer ») : la draft affichée reste, aucune diffusion.
        if (m.kind === "openView") { openViewInPage(m.tab || "", m.source || ""); window.__openViewSeen = m.token || 0; }
      });
      hostSend({ cmd:"getHost" });
    }
    const onKey = e => {
      // Les raccourcis de la saisie ne valent que dans le Simulateur, et jamais pendant une saisie.
      if (uiView !== "sim") return;
      const active = document.activeElement;
      const add = document.getElementById("add");
      const inField = isTextEntry(active);
      // Échap ne retire aucun adversaire : dans la recherche, il vide seulement le texte saisi (SearchBox).
      if (e.key === "Escape") return;
      if (!inField) {
        if (e.key === "Backspace" && state.enemies.length) { e.preventDefault(); removeLastEnemy(); }
        else if (e.key.length === 1 && e.key !== " " && !e.ctrlKey && !e.metaKey && !e.altKey && add && !add.disabled) add.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusAdd();
    PICKS.forEach(p => preloadSplash(label(p)));
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(list => { if (list && list[0]) { ddVersion = list[0]; setKnownPatch(list[0]); force(); } }).catch(() => {});
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  if (PANEL && PANEL !== "full") return html`<${MotionConfig} reducedMotion="user"><${PanelApp} /><//>`;
  const view = uiView === "home" ? html`<${HomeView} />` : uiView === "pool" ? html`<${PoolPage} />` : uiView === "stats" ? html`<${StatsView} />`
    : uiView === "settings" ? html`<${SettingsPage} onClose=${closeSettings} solo=${settingsWindow.current} />` : html`<${SimView} />`;
  return html`<${MotionConfig} reducedMotion="user">
    <div className="shell" data-test="app">
      <${MainNav} />
      <main className=${`view view-${uiView}`} data-test=${`view-${uiView}`} aria-labelledby="view-title">${view}</main>
    </div>
  <//>`;
}

Object.assign(state, { roleOf:{}, targetRole:null, selected:null });
computeVerdict();
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
