function preloadSplash(name) { const img = new Image(); img.src = splashUrl(name); }

function SplashStack({ name }) {
  const [cur, setCur] = useState(name);
  const [under, setUnder] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (name === cur) return;
    setUnder(cur);
    setCur(name);
    setLoaded(false);
    setFailed(false);
    // L'ancienne image disparaît vite, même si la nouvelle tarde : jamais d'illustration périmée.
    const timer = setTimeout(() => setUnder(null), UNDER_MS);
    return () => clearTimeout(timer);
  }, [name]);
  return html`<div className=${`splash-stack${!loaded && !failed && !under ? " loading" : ""}`}>
    ${under ? html`<img className="splash" src=${splashUrl(under)} alt="" />` : null}
    ${failed ? null : html`<${motion.img} key=${cur} className="splash" src=${splashUrl(cur)} alt=""
      initial=${{ opacity:0, scale:1.07 }} animate=${loaded ? { opacity:1, scale:1 } : { opacity:0, scale:1.07 }}
      transition=${{ opacity:{ duration:.3 }, scale:{ duration:.7, ease:[.2,.8,.2,1] } }}
      onLoad=${() => setLoaded(true)} onError=${() => { setFailed(true); setUnder(null); }} />`}
    ${failed ? html`<p className="splash-fail">Illustration indisponible : vérifie ta connexion.</p>` : null}
  </div>`;
}

// ---------- Égalités, conseils et expérience : tout passe par des calculs protégés. Une erreur ici ne doit jamais toucher au verdict. ----------
const TIE_SHOWN = 3;
const speakVerdict = name => V.tied ? `Égalité entre ${V.tied.map(label).join(", ")}` : `Conseil : ${name}${V.rival ? `, ${V.clear ? "sinon" : "ou"} ${label(V.rival.pick)}` : ""}`;

function TieGroup({ detailed }) {

let coachMemo = { v:null };
function historyProfile() {
  if (historyProfile.done) return historyProfile.value;
  historyProfile.done = true;
  try { const h = importedHistory(); historyProfile.value = h ? familiarityProfile(h.rows) : null; historyProfile.info = h; } catch (e) { historyProfile.value = null; }
  return historyProfile.value;
}
function coachData() {
  if (coachMemo.v === V && coachMemo.level === PREFS.coachLevel) return coachMemo;
  coachMemo = { v:V, level:PREFS.coachLevel, advice:null, choices:null };
  if (V.none) return coachMemo;
  const manual = state.manualMid && state.enemies.includes(state.manualMid) ? state.manualMid : null;
  const input = { enemies:state.enemies, level:PREFS.coachLevel, manualOpponent:manual, fixedRoles:state.roleOf, hasFront:PREFS.assumeFront };
  const profile = historyProfile();
  try {
    const history = historyProfile.info;
    const position = { top:"TOP", jungle:"JUNGLE", mid:"MIDDLE", adc:"BOTTOM", support:"UTILITY" }[myRole()];
    coachMemo.advice = coachingAdvice(Object.assign({}, input, { pick:label(V.shown), personal:history ? personalTrends(history.rows, { position }) : null, maxItems:12 }));
  } catch (e) { coachMemo.advice = null; }
  try { coachMemo.choices = playerChoices(Object.assign({}, input, { profile, displayed:V.shown })); } catch (e) { coachMemo.choices = null; }
  return coachMemo;
}

// Pendant la draft : un seul conseil, et seulement s'il repose sur une donnée ou un calcul. Les avis à relire restent dans l'onglet Conseils.
const COACH_ESSENTIAL = ["draft.tie", "draft.conflict", "matchup.measured", "draft.close"];
function essentialAdvice() {
  const advice = coachData().advice;
  if (!advice) return null;
  return COACH_ESSENTIAL.map(id => advice.items.find(i => i.id === id && i.verification === "rule")).find(Boolean) || null;
}
const COACH_SHORT = 110;
// Les premières phrases seulement : le reste est dans l'onglet Conseils.
function shortAdvice(text) {
  let out = "";
  for (const sentence of text.split(/(?<=\.)\s+/)) {
    if ((out + " " + sentence).trim().length > COACH_SHORT) break;
    out = (out + " " + sentence).trim();
  }
  return out;
}
function CoachLine() {
  const item = essentialAdvice();
  if (!item) return null;
  return html`<section className="coach-line" aria-label="Conseil">
    ${item.id === "draft.tie" ? null : html`<b>${item.title}</b>`}
    ${shortAdvice(item.text) ? html`<p>${shortAdvice(item.text)}</p>` : null}
    <button type="button" className="link-btn" data-test="open-coach" onClick=${() => openDetail("coach")}>Voir les conseils</button>
  </section>`;
}
// Sur une ligne à part : le nombre de parties n'est ni une recommandation, ni une preuve de niveau.

    ${choices && choices.uncertainty.length ? html`<h3>Ce qui reste incertain</h3><ul className="advice-list">${choices.uncertainty.map(i => html`<${AdviceItem} key=${i.id} item=${i} />`)}</ul>` : null}

function rankWord(p, i) {
  if (V.tied && V.tied.includes(p.pick)) return ["À égalité", "best"];
  if (V.avoided.includes(p.pick)) return ["À éviter", "bad"];
  if (i === 0) return [V.clear ? "Recommandé" : "Très proche", "best"];
  if (i === 1) return [V.clear ? "Alternative" : "Très proche", V.clear ? "alt" : "best"];
  const far = V.order[0] && V.order[0].score - p.score >= HOLD_GAP;
  return [far ? "Moins adapté" : "Possible", far ? "bad" : "other"];
}

// Au-delà, la liste écraserait le verdict : le reste du pool se lit dans Analyse et Comparer.

            ${i === 0 && !V.tied ? html`<${motion.span} key=${`best-${p.pick}`} className="rank-glow" aria-hidden="true" initial=${{ opacity:.55 }} animate=${{ opacity:0 }} transition=${{ duration:.45 }} />` : null}

              </span>

            <span className="force" aria-hidden="true"><${motion.i} initial=${false} animate=${{ scaleX: Math.max(.04, (p.score - lo) / (hi - lo || 1)) }} transition=${QUICK} /></span>

const Faces = ({ names, empty }) => names.length
  ? html`<span className="faces">${names.map(n => html`<${motion.span} key=${n} className="face" initial=${{ scale:.86, opacity:.4 }} animate=${{ scale:1, opacity:1 }} whileHover=${{ y:-1 }} transition=${QUICK}><${Portrait} name=${n} size=${26} /> ${n}<//>`)}</span>`

}

function PlanBlock() {
  const list = loadJournal();
  const entry = state.current && list.find(x => x.id === state.current);
  const pending = !entry && !state.enemies.length && [...list].reverse().find(x => x.result === null);
  const c = V.res.counts;
  const playing = entry ? entry.picked : V.tied ? null : V.shown;
  const threats = playing ? threatsFor(playing, c) : [];
  const targets = playing ? targetsFor(playing, c) : [];
  return html`<section className="plan-block" aria-label="Plan de jeu">
    <h2 className="sec-title">Plan de jeu <small>${playing ? `avec ${label(playing)}` : ""}</small></h2>

      <span>Gagne si</span>${playing ? winCondition(playing, c) : "Choisis un champion."}
    <//>
    <div className="plan-row threat"><span>Menaces</span><${Faces} names=${threats} empty="Rien de particulier" /></div>
    <div className="plan-row target"><span>Cibles</span><${Faces} names=${targets} empty="Le carry le plus exposé" /></div>
    <div className="plan-row ban-row"><span>Bans</span><${Faces} names=${V.bans} empty="Aucun" /></div>
    ${pending ? html`<p className="result-note">Dernière partie : <b>${label(pending.picked)}</b>${pending.mid ? ` contre ${pending.mid}` : ""}</p>` : null}
    ${entry || pending ? html`<${ResultButtons} id=${entry ? entry.id : pending.id} result=${entry ? entry.result : null} disabled=${false} />` : null}

const PHASES = [["lane", "Lane"], ["mid", "Mid game"], ["fight", "Teamfights"]];

function PlanTab() {
  const [phase, setPhase] = useState("lane");
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const playing = entry ? entry.picked : V.tied ? null : V.shown;
  if (!playing) return html`<p className="small">${V.tied ? "Choisis un des champions à égalité pour voir son plan." : "Aucun pick disponible."}</p>`;
  const slots = deriveSlots();
  const plan = buildPlan(playing, V.res.counts, V.mid, slots.jungle);
  return html`<div>
    <div className="seg-tabs" role="group" aria-label="Phase de jeu">
      ${PHASES.map(([key, text]) => html`<button key=${key} type="button" data-test=${`plan-phase-${key}`} aria-pressed=${phase === key} className=${`seg-tab${phase === key ? " on" : ""}`} onClick=${() => setPhase(key)}>${text}</button>`)}
    </div>
    <${motion.ul} key=${phase + playing} className="tips" initial=${{ opacity:.4, y:4 }} animate=${{ opacity:1, y:0 }} transition=${QUICK}>
      ${plan[phase].map(tip => html`<li key=${tip}>${tip}</li>`)}
    <//>
    <p className="small">Avis général basé sur ${V.n > 1 ? `les ${V.n} champions adverses visibles` : V.n ? "1 champion adverse visible" : "aucun champion adverse pour l'instant"}, sans tenir compte des cooldowns ni des builds.</p>
  </div>`;
}

const IMPACT_MARK = v => v > 0 ? (v >= 2 ? "++" : "+") : v < 0 ? (v <= -2 ? "−−" : "−") : "=";
const impactText = v => v > 0 ? "avantage" : v < 0 ? "désavantage" : "neutre";

function CriteriaView() {
  const entries = V.res.ranking;
  const rows = CRITERIA.filter(def => entries.some(p => p.criteria.some(c => c.key === def.key)));
  const uncertain = [];
  if (V.hypothesis) uncertain.push(hypothesisText());
  if (V.res.ranking[0] && V.res.ranking[0].byScenario) uncertain.push("Classement pondéré entre ces hypothèses, avec les mêmes règles.");
  if (!V.mid) uncertain.push(matchupUncertainText());
  if (V.mid && !matchupOf(V.mid) && !PICKS.some(p => liveMatchup(p, V.mid))) uncertain.push(`Pas de données de matchup contre ${V.mid} : ce critère n'est pas évalué.`);
  if (V.tied) uncertain.push(`${V.tied.map(label).join(", ")} ont le même score. ${tieCauseText(tieCause(V.res.ranking, V.tied), V.tied[0])}`);
  if (entries[0] && V.shown !== entries[0].pick && !(V.tied && V.tied.includes(entries[0].pick))) uncertain.push(`${label(V.shown)} reste affiché : ${label(entries[0].pick)} mène de trop peu pour changer de nom en cours de draft.`);
  if (V.n < 5) uncertain.push(`Draft incomplète : ${V.n} adversaire${V.n > 1 ? "s" : ""} sur 5.`);
  if (V.res.unknown.length) uncertain.push(`Fiche provisoire : ${V.res.unknown.join(", ")}.`);
  uncertain.push(PREFS.assumeFront ? "Frontline alliée supposée (réglage)." : "Pas de frontline alliée supposée (réglage).");
  return html`<div>
    <p className="small">${uncertain.join(" ")}</p>
    <div className="matrix" role="table" aria-label="Critères par champion">
      <div className="mx-row mx-head" role="row"><span role="columnheader">Critère</span>${entries.map(p => html`<span key=${p.pick} role="columnheader" title=${label(p.pick)}><${Portrait} name=${label(p.pick)} size=${24} /></span>`)}</div>
      ${rows.map(def => html`<div key=${def.key} className="mx-row" role="row">
        <span role="cell">${def.label}</span>
        ${entries.map(p => {
          const c = p.criteria.find(x => x.key === def.key);
          const v = c ? c.impact : 0;
          return html`<span key=${p.pick} role="cell" className=${`mx-cell ${v > 0 ? "up" : v < 0 ? "down" : ""}`} title=${c ? c.text : "Non concerné"} aria-label=${`${label(p.pick)} : ${impactText(v)}`}>${IMPACT_MARK(v)}</span>`;
        })}
      </div>`)}
    </div>
    ${entries.map((p, i) => {
      const plus = p.why.filter(w => w.v > 0).sort((a, b) => b.v - a.v);
      const minus = p.why.filter(w => w.v < 0).sort((a, b) => a.v - b.v);
      const threats = threatsFor(p.pick, V.res.counts);
      const targets = targetsFor(p.pick, V.res.counts);
      const m = matchupOf(V.mid);
      return html`<details key=${p.pick} className="pick-detail" open=${i === 0}>
        <summary><${Portrait} name=${label(p.pick)} size=${24} /> ${label(p.pick)}</summary>
        <p className="small">${positionText(entries, p)}</p>
        ${plus.length ? html`<ul className="why">${plus.map(w => html`<li key=${w.text} className="pos">+ ${signedText(w, 1) || w.text}</li>`)}</ul>` : null}
        ${minus.length ? html`<ul className="why">${minus.map(w => html`<li key=${w.text} className="neg">− ${signedText(w, -1) || w.text}</li>`)}</ul>` : null}
        ${!plus.length && !minus.length ? html`<p className="small">Aucun critère ne le distingue dans cette draft.</p>` : null}
        ${threats.length ? html`<p className="small">Menaces : ${threats.join(", ")}</p>` : null}
        ${targets.length ? html`<p className="small">Opportunités : ${targets.join(", ")}</p>` : null}
        <p className="small">Condition de victoire : ${winCondition(p.pick, V.res.counts)}</p>
        ${m ? html`<p className="small"><a href=${matchupLink(p.pick, V.mid)} target="_blank" rel="noopener noreferrer">Vérifier ce matchup sur LoLalytics</a></p>` : null}
      </details>`;
    })}
    <h3>Bans conseillés</h3>
    <ul className="plain">${V.bans.map(n => html`<li key=${n}><b>${n}</b> : ${banReason(n)}</li>`)}</ul>
  </div>`;
}

function CompareBar({ row, max }) {
  const size = v => Math.min(1, Math.abs(v) / max);
  const side = (v, cls) => html`<span className=${`cmp-side ${cls}`}><${motion.i} className=${v > 0 ? "up" : v < 0 ? "down" : ""} initial=${false} animate=${{ scaleX:size(v) }} transition=${QUICK} /></span>`;
  return html`<div className="cmp-row">
    <span className="cmp-label">${row.label}</span>
    <span className="cmp-bars" role="img" aria-label=${`${row.label} : ${impactText(row.a)} pour le premier, ${impactText(row.b)} pour le second`}>${side(row.a, "left")}${side(row.b, "right")}</span>
  </div>`;
}

function CompareTab() {
  const entries = V.res.ranking;
  const [pair, setPair] = useState(null);
  if (entries.length < 2) return html`<p className="small">Il faut au moins deux picks disponibles pour comparer.</p>`;
  const defaults = V.tied ? [V.tied[0], V.tied[1]] : [V.shown, V.rival ? V.rival.pick : entries.find(p => p.pick !== V.shown).pick];
  const valid = pair && pair.every(p => entries.some(x => x.pick === p)) && pair[0] !== pair[1];
  const [pa, pb] = valid ? pair : defaults;
  const a = entries.find(x => x.pick === pa);
  const b = entries.find(x => x.pick === pb);
  const cmp = comparePicks(a, b);
  const max = Math.max(1, ...cmp.rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)]));
  const leader = a.score >= b.score ? a : b;
  const trailer = leader === a ? b : a;
  const select = (slot, pick) => { const next = [pa, pb]; next[slot] = pick; if (next[0] === next[1]) next[1 - slot] = slot === 0 ? pb === pick ? pa : pb : pa === pick ? pb : pa; setPair(next); };
  const picker = (slot, cur) => html`<div className="cmp-pick" role="group" aria-label=${slot === 0 ? "Premier champion" : "Second champion"}>
    ${entries.map(p => html`<button key=${p.pick} type="button" aria-pressed=${cur === p.pick} aria-label=${label(p.pick)} title=${label(p.pick)} className=${`cmp-btn${cur === p.pick ? " on" : ""}`} onClick=${() => select(slot, p.pick)}><${Portrait} name=${label(p.pick)} size=${26} /></button>`)}
  </div>`;
  const pros = (x, y) => cmp.rows.filter(r => (x === a ? r.diff > 0 : r.diff < 0)).map(r => x === a ? r.textA || `Moins pénalisé : ${r.label}` : r.textB || `Moins pénalisé : ${r.label}`).slice(0, 3);
  // whenBetter compte une frontline alliée et ignore les hypothèses sur le vis-à-vis : sinon, rien n'est affirmé.
  const severalHypotheses = !!(V.res.ranking[0] && V.res.ranking[0].byScenario);
  const when = severalHypotheses || !PREFS.assumeFront ? null : whenBetter(trailer.pick, leader.pick, state.enemies, V.mid);
  return html`<div className="compare">
    <div className="cmp-head">${picker(0, pa)}<b>VS</b>${picker(1, pb)}</div>
    <p className="cmp-title"><b>${label(pa)}</b> contre <b>${label(pb)}</b></p>
    <p className="small">${Math.abs(cmp.gap) < 1e-9 ? "À égalité sur le total des critères." : Math.abs(cmp.gap) < HOLD_GAP ? `Serré, léger avantage à ${label(leader.pick)}.` : `Avantage net à ${label(leader.pick)}.`}${leadCriterion(leader, trailer) ? ` ${label(leader.pick)} gagne surtout sur « ${leadCriterion(leader, trailer).label} »` : ""}${leadCriterion(leader, trailer) && comparePicks(trailer, leader).decisive.find(r => r.diff > 0) ? `, ${label(trailer.pick)} sur « ${comparePicks(trailer, leader).decisive.find(r => r.diff > 0).label} »` : ""}${leadCriterion(leader, trailer) ? "." : ""}</p>
    ${cmp.rows.length ? html`<div className="cmp-row cmp-legend" aria-hidden="true"><span></span><span className="cmp-bars"><span>${label(pa)}</span><span>${label(pb)}</span></span></div>` : null}
    ${cmp.rows.length ? cmp.rows.map(r => html`<${CompareBar} key=${r.key} row=${r} max=${max} />`) : html`<p className="small">Aucun critère ne les sépare pour l'instant.</p>`}
    ${[[a, b], [b, a]].map(([x, y]) => {
      const list = pros(x, y);
      const risk = mainRisk(x);
      return html`<div key=${x.pick} className="cmp-side-text">
        <h3>${label(x.pick)}</h3>
        <p className="small">${pickStyle(x.pick)}</p>
        ${list.length ? html`<ul className="why">${list.map(t => html`<li key=${t} className="pos">+ ${t}</li>`)}</ul>` : null}
        ${risk ? html`<ul className="why"><li className="neg">− ${risk}</li></ul>` : null}
      </div>`;
    })}
    <h3>${label(trailer.pick)} passerait devant</h3>
    <p className="small">${severalHypotheses ? "Pas calculé tant que ton vis-à-vis n'est pas identifié." : !when ? "Pas calculé sans frontline alliée : ces cas supposent une frontline dans ton équipe." : when.length ? when.join(", ") + "." : "Dans aucun des cas simples testés : autre vis-à-vis, absence de frontline ou nouvel adversaire type."}</p>
  </div>`;
}

function MatchupsTab() {
  const [value, setValue] = useState("");
  const hasTable = myRole() === "mid" && PICKS.some(p => WRITTEN_PICKS.includes(p));
  if (!hasTable) {
    if (!PICKS.some(p => liveRoleOk() && window.MATCHUPS_LIVE.pool[riotKey(label(p))])) return html`<p className="small">Pas encore de bilans pour ce profil : le conseil repose sur la composition adverse et les fiches de champions. Lance <b>Mettre à jour les matchups</b> dans les réglages.</p>`;
    const key = norm(value);
    const names = key ? NAMES.filter(n => champKeys(n).some(k => k.includes(key))).slice(0, 8) : [];
    return html`<div>
      <p className="small" style=${{ margin:"0 0 6px" }}>Regarde tes bilans contre un adversaire, sans toucher à ta draft.</p>
      <input id="q" type="search" value=${value} autoComplete="off" spellCheck="false" aria-label="Chercher un adversaire" placeholder="Adversaire : ahri, tf, kata..."
        onChange=${e => setValue(e.target.value)} onKeyDown=${e => { if (e.key === "Escape") { e.stopPropagation(); setValue(""); } }} />
      ${names.map(n => {
        const measured = PICKS.map(p => [p, liveMatchup(p, n)]).filter(x => x[1]);
        return html`<div key=${n} className="mcard">
          <${Portrait} name=${n} size=${32} />
          <span className="mcard-name">${n}</span>
          <span className="mcard-line">${measured.length ? `Bilans : ${measured.map(([p, x]) => `${label(p)} ${x.gap >= 0 ? "+" : ""}${Math.round(x.gap * 100)} % (${x.games})`).join(", ")}` : `Moins de ${MATCHUP_MIN_GAMES} parties : pas de bilan.`}</span>
        </div>`;
      })}

  }
  const found = value.trim() ? searchMatchups(value) : [];
  return html`<div>
    <p className="small" style=${{ margin:"0 0 6px" }}>Regarde quoi prendre contre un mid, sans toucher à ta draft.</p>
    <input id="q" type="search" value=${value} autoComplete="off" spellCheck="false" aria-label="Chercher un mid adverse" placeholder="Mid adverse : ahri, tf, kata..."
      onChange=${e => setValue(e.target.value)} onKeyDown=${e => { if (e.key === "Escape") { e.stopPropagation(); setValue(""); } }} />
    ${value.trim() && !found.length ? html`<p className="small">Pas dans le tableau. Ajoute ce champion à ta draft pour voir le classement.</p>` : null}
    ${found.map(m => {
      const [first, second] = optionsFor(m);
      const avoid = avoidedPicks(m).map(label).join(", ");
      const measured = PICKS.map(p => [p, liveMatchup(p, m.n)]).filter(x => x[1]);
      return html`<div key=${m.n} className="mcard">
        <${Portrait} name=${m.n} size=${32} />
        <span className="mcard-name">${m.n}</span>

        <span className="mcard-line">À éviter : <span className="avoid">${avoid || "rien de particulier"}</span></span>
        ${measured.length
          ? html`<span className="mcard-line">Bilans : ${measured.map(([p, x]) => `${label(p)} ${x.gap >= 0 ? "+" : ""}${Math.round(x.gap * 100)} % (${x.games})`).join(", ")}</span>`
          : html`<span className="mcard-line">Avis écrit à la main, pas encore de bilan.</span>`}
      </div>`;
    })}
  </div>`;
}

function WinBars({ title, groups }) {
  if (!groups.length) return null;
  return html`<div>
    ${title ? html`<h3>${title}</h3>` : null}
    <div className="winbars">
      ${groups.map(g => {
        const rec = record(g.rows);
        const few = rec.games < MIN_GAMES;
        return html`<div key=${g.name} className=${`winbar${few ? " few" : ""}`}>
          <span className="winbar-name">${g.name}</span>
          <span className="winbar-track" role="img" aria-label=${`${g.name} : ${fmtRecord(rec)}`}>
            <${motion.i} initial=${{ scaleX:0 }} animate=${{ scaleX: rec.games ? rec.wins / rec.games : 0 }} transition=${ARRIVE} />
          </span>
          <span className="winbar-val">${fmtRecord(rec)}${few ? "" : `, ${pct(rec)}`}</span>
        </div>`;
      })}

    <p className="small">Sans pourcentage : moins de ${MIN_GAMES} parties, trop peu pour conclure.</p>
  </div>`;

function evolutionGroups(rows) {
  const sorted = [...rows].sort((x, y) => x.time - y.time);
  const groups = [];
  for (let i = 0; i + EVOLUTION_STEP <= sorted.length; i += EVOLUTION_STEP) groups.push({ name:`${i + 1} à ${i + EVOLUTION_STEP}`, rows:sorted.slice(i, i + EVOLUTION_STEP) });
  return groups;
}

function JournalTab() {
  const list = loadJournal();

  const tally = rows => { const w = rows.filter(x => x.result === "win").length; return { wins:w, losses:rows.length - w, games:rows.length }; };
  const followed = tally(played.filter(x => x.picked === x.suggested));
  const other = tally(played.filter(x => x.picked !== x.suggested));
  return html`<div>
    ${played.length ? html`<h3>Dernières parties</h3>
      <div className="history" role="img" aria-label=${`${played.filter(x => x.result === "win").length} victoires sur ${played.length} parties notées`}>

      <${WinBars} title="Victoires par champion joué" groups=${groupRows(played.map(x => ({ win: x.result === "win", name: label(x.picked) })), r => r.name)} />

      <h3>Compositions récentes</h3>
      <ul className="comps">${played.slice(-5).reverse().map(x => html`<li key=${x.id}><span className=${`game ${x.result}`}></span><b>${label(x.picked)}</b><span className="comp-faces">${(x.enemies || []).map(n => html`<${Portrait} key=${n} name=${n} size=${22} />`)}</span></li>`)}</ul>` : null}
    <p className="small">Conseil suivi : ${fmtRecord(followed)}. Autre choix : ${fmtRecord(other)}. Ces chiffres ne prouvent pas que l'outil aide : tu ne choisis pas au hasard, et il faut plusieurs centaines de parties pour voir un écart fiable.</p>
    <table><thead><tr><th>Date</th><th>Pick</th><th>Mid</th><th>Conseil</th><th>Résultat</th></tr></thead>
    <tbody>${list.slice(-10).reverse().map(x => html`<tr key=${x.id}>
      <td>${new Date(x.date).toLocaleDateString("fr-FR")}</td><td>${label(x.picked)}</td><td>${x.mid || "-"}</td><td>${label(x.suggested || "-")}</td>

    <p style=${{ marginTop:10 }}><button type="button" className="ghost-btn" onClick=${exportJournal}>Télécharger le journal</button></p>
  </div>`;

let navTarget = urlTab(), navId = 0;
// source "live" : « Détails » depuis l'overlay montre la vraie draft. Une simulation en cours est quittée, rien n'est réinitialisé.
function openViewInPage(tab, source) {
  if (source === "live") leaveSimulation();
  // Sections de la fenêtre (UX-3) et anciens noms : « settings », « parties ». Le reste est un onglet du Simulateur.
  if (tab === "settings") { goView("settings"); return; }
  if (tab === "parties") { goView("stats"); return; }
  // « Simuler une draft » du menu de l'icône : le Simulateur, sur une simulation vide.
  if (tab === "simulate") { startSimulation(); goView("sim"); return; }
  if (VIEWS.includes(tab)) { goView(tab); return; }
  navTarget = tab || null;
  navId++;
  goView("sim");
}

// Le calcul des matchups tourne dans le programme : il a besoin du rôle et du pool, en noms de Riot.
function sendProfile() {
  if (PROFILE && IS_HOST) hostSend({ cmd:"setProfile", role: PROFILE.role, pool: PICKS.map(p => riotKey(label(p))) });
}

// Modifie le pool d'un rôle sans toucher aux autres. Un pool vide est permis : le rôle reste configuré.
function saveMyProfile(role, names) {
  const pool = uniqueList(names.map(pickId));
  const r = PROFILES.roles[role];
  r.pool = pool;
  r.excluded = r.excluded.filter(p => pool.includes(p));
  if (!pool.includes(r.favorite)) r.favorite = null;
  // Premier rôle configuré : il devient le rôle joué. Ensuite, modifier le pool d'un autre rôle ne change
  // ni le rôle joué ni le conseil (audit UX, problème 4) : « Jouer ce rôle » le fait explicitement.
  if (!PROFILES.active) { switchRole(role, "manual"); return; }
  storeProfiles();
  if (PROFILES.active !== role) { publish(null); return; }
  useActiveRole();
  state.held = null;
  pool.forEach(p => preloadSplash(label(p)));
  sendProfile();
  commit();
}

function ProfileBackup() {
  const [note, setNote] = useState("");
  const [, refresh] = useState(0);
  const download = () => {
    const url = URL.createObjectURL(new Blob([exportConfig(PROFILES, PREFS, APP_VERSION)], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "draft-profils.json"; a.click(); URL.revokeObjectURL(url);
    setNote("Profils exportés : rôles, champions et préférences, sans historique ni clé.");
  };
  const load = e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    file.text().then(text => {
      const parsed = parseConfig(text);
      if (!parsed.ok) { setNote(parsed.error + " Rien n'a été modifié."); return; }
      const done = applyConfig(parsed, PROFILES, localStorage);
      if (!done.ok) { setNote(done.error); return; }
      PROFILES = done.profiles;
      Object.assign(PREFS, parsed.preferences);
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e2) {}
      storeProfiles();
      useActiveRole();
      sendProfile();
      commit();
      setNote("Profils importés." + (parsed.warnings.length ? ` ${parsed.warnings.join(" ")}` : "") + " L'état précédent est sauvegardé.");
      refresh(x => x + 1);
    }).catch(() => setNote("Fichier illisible : rien n'a été modifié."));
  };
  const undo = () => {
    const back = restoreLastBackup(localStorage);
    if (!back) return;
    PROFILES = back; storeProfiles(); useActiveRole(); sendProfile(); commit();
    setNote("Profils précédents restaurés."); refresh(x => x + 1);
  };
  return html`<div className="set-row profile-backup">
    <button type="button" className="ghost-btn" data-test="export-profiles" onClick=${download}>Exporter mes profils</button>
    <label className="ghost-btn file-btn">Importer<input type="file" data-test="import-profiles" accept=".json,application/json" aria-label="Importer des profils" onChange=${load} /></label>
    ${latestProfilesBackup(localStorage) ? html`<button type="button" className="ghost-btn" data-test="undo-profiles-import" onClick=${undo}>Annuler le dernier import</button>` : null}
    ${note ? html`<p className="small" role="status">${note}</p>` : null}
  </div>`;
}

function DataSources() {
  // Le détail n'est calculé qu'à l'ouverture : les réglages restent immédiats.
  const [open, setOpen] = useState(false);
  const report = dataReport();
  const changes = open ? roleChanges() : [];
  const stale = report.filter(r => r.available && r.stale).length;
  const missing = report.filter(r => !r.available).length;
  const dateOf = d => { const t = Date.parse(d || ""); return isNaN(t) ? "inconnue" : new Date(t).toLocaleDateString("fr-FR"); };
  return html`<details className="set-more" onToggle=${e => setOpen(e.currentTarget.open)}>
    <summary>Sources de données${stale ? ` : ${stale} ancienne${stale > 1 ? "s" : ""}` : ""}${missing ? `${stale ? "," : " :"} ${missing} pas encore disponible${missing > 1 ? "s" : ""}` : ""}</summary>
    <ul className="data-list">${report.map(r => html`<li key=${r.id} className=${r.available ? "" : "off"}>
      <b>${r.label}</b> <span className="data-kind">${r.kindLabel}</span>${r.stale ? html` <span className="data-old">Ancienne</span>` : null}${r.available ? null : html` <span className="data-old">Pas encore disponible</span>`}
      <p>${r.source}.${!r.available || r.kind === "heuristic" ? "" : ` Patch : ${r.patch || "inconnu"}${r.stale ? ` (${r.age} patchs d'écart)` : ""}.`}${r.collected ? ` Date : ${dateOf(r.collected)}.` : ""}${!r.available || r.kind === "official" || r.kind === "heuristic" ? "" : ` Observations : ${r.games === null ? "non mesurées" : `${r.games} ${r.unit}`}.`}${r.region ? ` Région : ${r.region}.` : ""}${r.rank ? ` Rang : ${r.rank}.` : ""}${r.uncertainty ? ` Incertitude ${r.uncertainty}.` : ""}</p>
      <p>${r.note}${r.available ? ` ${r.terms}` : ""}</p>
    </li>`)}</ul>
    ${changes.length ? html`<h3>Rôles à surveiller</h3>
    <ul className="data-list">${changes.slice(0, 8).map(c => html`<li key=${c.name}><b>${c.name}</b> : plus souvent ${ROLE_NAMES[c.role]} que dans ${c.confirmed ? "les patchs précédents" : "la référence, à confirmer"} (${c.games} parties).</li>`)}</ul>` : null}
  </details>`;
}

// ---------- Fenêtre principale : cinq sections (UX-3) ----------
// Adresses : ?view=home|pool|sim|stats|settings (&section= pour les Réglages). Alias gardés une version : ?tab=settings, ?tab=parties,
// et les onglets du Simulateur (?tab=analyse, compare, coach...). Les nouveaux textes passent par t() (web/i18n/fr.js).
const VIEWS = ["home", "pool", "sim", "stats", "settings"];
const SETTINGS_SECTIONS = ["general", "league", "display", "data", "updates", "diag"];
function viewFromAddress() {
  const q = new URLSearchParams(location.search), v = q.get("view"), tab = q.get("tab");
  if (VIEWS.includes(v)) return v;
  if (tab === "settings") return "settings";
  if (tab === "parties") return "stats";
  if (VIEWS.includes(tab)) return tab;
  // Tout autre onglet (« simulate », « analyse », « compare »...) est une demande précise du Simulateur.
  if (tab) return "sim";
  // UX-8 : sans demande précise (adresse sans vue ni onglet), la fenêtre principale s'ouvre sur l'Accueil.
  return "home";
}
let uiView = viewFromAddress(), uiBack = "home";
let uiSection = (() => { const s = new URLSearchParams(location.search).get("section"); return SETTINGS_SECTIONS.includes(s) ? s : "general"; })();
function goView(view, section) {
  if (!VIEWS.includes(view)) return;
  if (view === "settings" && uiView !== "settings") uiBack = uiView;
  uiView = view;
  if (SETTINGS_SECTIONS.includes(section)) uiSection = section;
  if (PANEL === "full") history.replaceState(null, "", `?panel=full&view=${view}${view === "settings" ? `&section=${uiSection}` : ""}`);
  rerender();
  if (view === "sim") setTimeout(focusAdd, 0);
}

// ---------- Accueil (UX-8) : une seule chose forte, puis la chaîne de la draft et deux cartes d'état ----------
// L'Accueil lit l'état sans rien changer : aucun rôle, pool ou réglage n'est modifié sans un clic sur l'action qui le dit.
// Le guide du premier lancement ne garde que sa progression (étapes faites ou ignorées), dans sa propre clé du stockage.
const ONBOARDING_KEY = "draftOnboarding";
const onboarding = () => { try { return Object.assign({ started:false, skipped:[], tried:false }, JSON.parse(localStorage.getItem(ONBOARDING_KEY)) || {}); } catch (e) { return { started:false, skipped:[], tried:false }; } };
function storeOnboarding(change) {
  try { localStorage.setItem(ONBOARDING_KEY, JSON.stringify(Object.assign(onboarding(), change))); } catch (e) {}
  rerender();
}
const frDate = d => new Date(d).toLocaleDateString("fr-FR");
const frTime = d => new Date(d).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
// État de la lecture du client : « browser » hors application, « unavailable » si la version l'a coupée.
function leagueState() {
  if (!hostState.available) return "browser";
  if (!hostState.lcuConfirmed) return "unavailable";
  return ["connected", "waiting", "failed"].includes(hostState.lcuStatus) ? hostState.lcuStatus : "off";
}
const LEAGUE_DOT = { connected:"good", waiting:"wait", failed:"bad", off:"idle", unavailable:"idle", browser:"idle" };
// Conseil en blind du rôle joué : le 1er du même calcul que les panneaux sans adversaire (aucun poids ni tri propre à l'Accueil).
function blindAdvice() {
  if (!PROFILE || !PICKS.length) return null;
  const ranking = analyze([], null, PREFS.assumeFront).ranking;
  if (!ranking.length) return { none:true };
  return { names:[ranking[0].pick].concat(ranking[0].tiedWith || []).map(label) };
}
const liveDraft = () => { const s = simulating ? liveCopy : state; return s && s.sessionActive ? s : null; };

function HomeHero() {
  const role = PROFILES.active, count = role ? PROFILES.roles[role].pool.length : 0, lcu = leagueState(), live = liveDraft();

  let tone = "ready", title, lead, actions;
  if (!role) { tone = "todo"; title = t("home.hero.noRole"); lead = t("home.hero.noRole.lead"); actions = toPool; }
  else if (!count) { tone = "todo"; title = t("home.hero.emptyPool", { role:ROLE_NAMES[role] }); lead = t("home.hero.emptyPool.lead", { role:ROLE_NAMES[role] }); actions = toPool; }
  else if (blind && blind.none) { tone = "todo"; title = t("home.hero.allExcluded", { role:ROLE_NAMES[role] }); lead = t("home.hero.allExcluded.lead"); actions = toPool; }
  else if (lcu === "failed") {
    tone = "error"; title = t("home.hero.failed"); lead = t("home.hero.failed.lead");
    actions = html`<button type="button" className="cta" data-test="home-diagnostic" onClick=${() => hostSend({ cmd:"lcuDiagnostic" })}>${t("settings.diag.lcu")}</button>

    actions = simulate;

  return html`<section className=${`box home-hero tone-${tone}`} data-test="home-hero" data-tone=${tone} aria-labelledby="home-hero-title">
    <span className="hero-mark" aria-hidden="true"><${NavIcon} name=${mark} /></span>

  </section>`;
}

function HomeView() {
  const role = PROFILES.active, fresh = !(role && PROFILES.roles[role].pool.length);
  const ob = onboarding();
  // Pendant le guide, les étapes tiennent lieu de cartes League, pool et panneaux : rien n'est dit deux fois.
  // Profil vierge : le guide démarre et reste jusqu'à ce que chaque étape soit faite ou ignorée. Un profil déjà configuré ne le voit jamais.
  // Dans l'application, on attend l'état du programme : un profil existant (copie de secours, ancien profil) arrive avec lui.
  const known = !IS_HOST || hostState.available;
  useEffect(() => { if (known && fresh && !ob.started) storeOnboarding({ started:true }); }, [known, fresh, ob.started]);
  const done = { pool:!fresh, lcu:!!hostState.lcuEnabled || (hostState.available && !hostState.lcuConfirmed), panels:ob.tried };
  const steps = known && (ob.started || fresh) ? ["pool", "lcu", "panels"].filter(s => !done[s] && !ob.skipped.includes(s)) : [];
  return html`<div className="view-page home" data-test="home">
    <${ViewHead} title=${t("nav.home")} sub=${t("home.sub")} />
    ${steps.length ? html`<${HomeGuide} steps=${steps} />` : html`<${HomeHero} />
    <div className="home-chain">
      <${HomeLeague} /><${HomePool} /><${HomePanels} />
    </div>`}
    <div className="home-more"><${HomeUpdate} /><${HomeData} /></div>
  </div>`;
}

// exactement comme avant ; ceux des autres rôles ne s'appliquent qu'une fois ce rôle joué.
function setRoleChoices(role, change) {
  const r = PROFILES.roles[role];
  if (!r) return;
  if ("excluded" in change) r.excluded = uniqueList(change.excluded).filter(p => r.pool.includes(p));
  if ("favorite" in change) r.favorite = change.favorite && r.pool.includes(change.favorite) ? change.favorite : null;
  if (role === PROFILES.active) { savePrefs({ excluded:r.excluded.slice(), favorite:r.favorite }); return; }
  storeProfiles();
  publish(null);
}

function PoolPage() {
  const [role, setRole] = useState(PROFILES.active);
  const [query, setQuery] = useState("");
  const [saved, setSaved] = useState(null);
  const searchRef = useRef(null);
  const pool = role ? PROFILES.roles[role].pool.map(label) : [];
  const roleData = role ? PROFILES.roles[role] : null;
  const backToSearch = () => { if (searchRef.current) searchRef.current.focus(); };
  // Choisir un rôle ici montre et modifie son pool, sans changer le rôle joué (sauf s'il n'y en a pas encore).
  const pickRole = r => { if (!PROFILES.active) switchRole(r, "manual"); setRole(r); setQuery(""); setSaved(null); };
  const playRole = () => { switchRole(role, "manual"); setSaved(null); };
  const apply = (r, list) => { if (r) saveMyProfile(r, list); };
  const addChampion = n => { apply(role, pool.concat(n)); setSaved({ text:`Enregistré : ${n} ajouté au pool ${ROLE_NAMES[role]}.` }); };
  const removeChampion = n => {
    const back = { role, pool, excluded:roleData.excluded.slice(), favorite:roleData.favorite };
    apply(role, pool.filter(x => x !== n));
    setSaved({ text:`${n} retiré du pool ${ROLE_NAMES[role]}.`, back });
  };
  // Annuler un retrait : pool, exclusions et favori du rôle tels qu'ils étaient.
  const undoRemove = () => {
    const back = saved && saved.back;
    if (!back) return;
    apply(back.role, back.pool);
    setRoleChoices(back.role, { excluded:back.excluded, favorite:back.favorite });
    setSaved(null);
    backToSearch();
  };
  const toggleFavorite = p => {
    const next = roleData.favorite === p ? null : p;
    setRoleChoices(role, { favorite:next });
    setSaved({ text: next ? t("pool.saved.favorite", { champion:label(p), role:ROLE_NAMES[role] }) : t("pool.saved.favoriteNone", { role:ROLE_NAMES[role] }) });
  };
  const toggleExcluded = p => {
    const on = !roleData.excluded.includes(p);
    setRoleChoices(role, { excluded: on ? roleData.excluded.concat(p) : roleData.excluded.filter(x => x !== p) });
    setSaved({ text:t(on ? "pool.saved.excluded" : "pool.saved.included", { champion:label(p), role:ROLE_NAMES[role] }) });
  };
  const editingOther = role && PROFILES.active && role !== PROFILES.active;
  const key = norm(query);
  const found = key ? NAMES.filter(n => champKeys(n).some(k => k.includes(key))).slice(0, 12) : [];
  const choices = found.filter(n => !pool.includes(n));
  const suggested = role ? championsForRole(role).filter(n => !pool.includes(n)).slice(0, 12) : [];
  const chip = (n, already) => already
    ? html`<span key=${n} className="pool-chip already" data-test="pool-already" data-champion=${n}><${Portrait} name=${n} size=${24} /><span>${n}</span><small>${t("pool.search.already")}</small></span>`
    : html`<button key=${n} type="button" data-test="pool-add" data-champion=${n} className="pool-chip" onClick=${() => { addChampion(n); setQuery(""); backToSearch(); }}><${Portrait} name=${n} size=${24} /><span>${n}</span></button>`;
  return html`<div className="view-page pool-page">
    <${ViewHead} title=${t("nav.pool")} sub=${t("pool.sub")} />
    <${PlayedRoleBar} />
    <div className="pool-layout">
      <${PoolRoleList} role=${role} onPick=${pickRole} />
      <div className="pool-main">
        <section className="box" data-test="pool-box" aria-labelledby="pool-title">
          <header className="pool-head">
            <div>
              <h2 id="pool-title" className="box-title">${role ? t("pool.box.title", { role:ROLE_NAMES[role] }) : t("pool.box.noRole")}${role ? html` <small className="num">${tp("pool.box.count", pool.length)}</small>` : null}</h2>
              ${editingOther ? html`<p className="set-hint flush" role="status" data-test="pool-editing">Tu modifies le pool ${ROLE_NAMES[role]}. Ton rôle joué reste ${ROLE_NAMES[PROFILES.active]}. <button type="button" className="link-btn" data-test="pool-play-role" onClick=${playRole}>Jouer ce rôle</button></p>` : null}
              ${role ? null : html`<p className="set-hint flush" data-test="pool-need-role">Choisis d'abord ton rôle, puis ajoute tes champions.</p>`}
            </div>
            ${saved ? html`<p className="pool-saved" role="status" data-test="pool-saved">${saved.text}${saved.back ? html` <button type="button" className="ghost-btn" data-test="pool-undo" onClick=${undoRemove}>Annuler</button>` : null}</p>` : null}
          </header>
          <div className="pool-search-wrap">
            <input ref=${searchRef} className="pool-search" data-test="pool-search" type="search" value=${query} disabled=${!role} autoComplete="off" spellCheck="false" aria-label="Ajouter un champion" placeholder=${role ? "Ajouter un champion : ahri, tf, kata..." : "Choisis d'abord ton rôle"}
              onChange=${e => setQuery(e.target.value)}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); if (choices[0]) { addChampion(choices[0]); setQuery(""); } } else if (e.key === "Escape" && query) { e.stopPropagation(); setQuery(""); } }} />
            ${role ? html`<p className="small">${t("pool.search.hint")}</p>` : null}
            ${key ? html`<div className="pool-list" data-test="pool-results">
              ${found.map(n => chip(n, pool.includes(n)))}
              ${!found.length ? html`<span className="set-hint flush">Aucun champion trouvé.</span>` : null}
            </div>` : null}
          </div>
          ${role && pool.length ? html`<table className="pool-table" data-test="pool-table">
            <thead><tr><th scope="col">${t("pool.table.champion")}</th><th scope="col">${t("pool.table.favorite")}</th><th scope="col">${t("pool.table.excluded")}</th><th scope="col"><span className="sr">${t("pool.table.remove")}</span></th></tr></thead>
            <tbody>${roleData.pool.map(p => { const n = label(p); return html`<tr key=${p} data-test="pool-row" data-champion=${n}>
              <th scope="row"><span className="pool-name"><${Portrait} name=${n} size=${28} />${n}</span></th>
              <td><input type="radio" name=${`fav-${role}`} data-test="pool-favorite" data-champion=${n} checked=${roleData.favorite === p} aria-label=${t("pool.table.favoriteOf", { champion:n })} onClick=${() => toggleFavorite(p)} onChange=${() => {}} /></td>
              <td><input type="checkbox" data-test="pool-exclude" data-champion=${n} checked=${roleData.excluded.includes(p)} aria-label=${t("pool.table.excludedOf", { champion:n })} onChange=${() => toggleExcluded(p)} /></td>
              <td><button type="button" className="mini x" data-test="pool-remove" data-champion=${n} title=${`Retirer ${n}`} aria-label=${`Retirer ${n}`} onClick=${() => { removeChampion(n); backToSearch(); }}>×</button></td>
            </tr>`; })}</tbody>
          </table>
          <p className="small pool-table-help">${t("pool.table.help")}</p>` : role ? html`<p className="empty-note">Aucun champion pour ce rôle : ajoute-en pour obtenir un conseil.</p>` : null}
        </section>
        ${role && suggested.length ? html`<section className="box box-pad" data-test="pool-suggested">
          <h2 className="box-title">${t("pool.suggest.title", { role:ROLE_NAMES[role] })} <small>${t("pool.suggest.help", { role:ROLE_NAMES[role] })}</small></h2>
          <div className="pool-list">${suggested.map(n => chip(n, false))}</div>
        </section>` : null}
        <section className="box box-pad" data-test="pool-backup">
          <h2 className="box-title">${t("pool.backup.title")}</h2>
          <p className="set-hint flush">Chaque rôle garde son propre pool. Ils sont enregistrés automatiquement. Modifier un pool ne change pas ton rôle joué.</p>
          <${ProfileBackup} />
          <p className="set-hint flush">Sans statistiques calculées, le conseil repose sur des fiches écrites à la main : c'est un avis général.</p>
        </section>
      </div>
    </div>
  </div>`;
}

function JournalImport() {
  const [importNote, setImportNote] = useState("");
  const importJournal = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(text => {
      const incoming = JSON.parse(text);
      if (!Array.isArray(incoming)) throw new Error("format");
      const list = loadJournal();
      const known = new Set(list.map(x => x.id));
      const added = incoming.filter(x => x && x.id && x.picked && !known.has(x.id));
      saveJournal(list.concat(added).sort((a, b) => a.id - b.id));
      setImportNote(`${added.length} partie${added.length > 1 ? "s ajoutées" : " ajoutée"} à ton journal.`);
      publish(null);
    }).catch(() => setImportNote("Ce fichier n'est pas un journal DRAFT : rien n'a été modifié."));
  };
  return html`<details className="set-more" data-test="journal-import">
    <summary>${t("stats.oldFile.title")}</summary>
    <h3>Journal</h3>
    <p className="small">Pour récupérer un ancien journal, importe son fichier ici. Rien n'est supprimé.</p>
    <p><input type="file" data-test="import-journal" accept=".json,application/json" aria-label="Importer un journal" onChange=${importJournal} /></p>
    ${importNote ? html`<p className="small" data-test="journal-import-note">${importNote}</p>` : null}
  </details>`;
}

      <p className="small">${window.ROLE_RATES_LIVE ? `Calculés le ${new Date(window.ROLE_RATES_LIVE.updated).toLocaleDateString("fr-FR")} sur ${window.ROLE_RATES_LIVE.games} parties récentes.` : (typeof ROLE_RATES !== "undefined" ? `Statistiques livrées avec l'application, patch ${ROLE_RATES.patch}.` : "Pas encore calculés : les rôles habituels écrits à la main servent de repère.")} Ils servent à deviner ton vis-à-vis et à placer les adversaires dans leurs rôles.</p>
      <h3>Matchups</h3>
      <p className="small">${window.MATCHUPS_LIVE && !liveRoleOk() ? `Bilans calculés pour le rôle ${ROLE_NAMES[window.MATCHUPS_LIVE.role || "mid"]} : relance le calcul pour ton rôle actuel.` : window.MATCHUPS_LIVE ? `Calculés le ${new Date(window.MATCHUPS_LIVE.updated).toLocaleDateString("fr-FR")} sur ${window.MATCHUPS_LIVE.games} parties. ${PICKS.map(p => `${label(p)} : ${(window.MATCHUPS_LIVE.pool[riotKey(label(p))] || { games:0 }).games}`).join(", ")}.` : "Pas encore de bilans calculés."} Sous ${MATCHUP_MIN_GAMES} parties, le matchup n'utilise pas le bilan.</p>
      <p className="small" role="status">${hostState.rolesStatus || ""}</p>
      <p className="set-row">
        ${hostState.rolesRunning
          ? html`<button type="button" className="ghost-btn" data-test="stop-roles" onClick=${() => hostSend({ cmd:"updateRoles" })}>Arrêter le calcul</button>`
          : html`<button type="button" className="ghost-btn" data-test="update-roles" onClick=${() => hostSend({ cmd:"updateRoles" })}>Mettre à jour les rôles</button>
              <button type="button" className="ghost-btn" data-test="update-matchups" onClick=${() => hostSend({ cmd:"updateMatchups" })}>Mettre à jour les matchups</button>`}
      </p>
    </div>` : null}
    <${DataSources} />
  </div>`;
  if (id === "updates") return host ? html`<div>
    <p className="small">Version ${APP_VERSION}. DRAFT ne contacte GitHub que lorsque tu cliques.</p>
    ${hostState.updateStatus ? html`<p className="small" role="status" data-test="update-status">${hostState.updateStatus}</p>` : null}
    <p className="set-row"><button type="button" className="ghost-btn" data-test="check-update" disabled=${!!hostState.updateRunning} onClick=${() => hostSend({ cmd:"checkUpdate" })}>${hostState.updateRunning ? "Mise à jour en cours..." : "Rechercher une mise à jour"}</button></p>
  </div>` : html`<${HostOnly} />`;
  return html`<div>
    <p className="small brand-sub">DRAFT ${APP_VERSION} bêta : ton assistant stratégique pour League of Legends. Non approuvé par Riot Games.</p>
    ${host ? html`<div>
      <label className="set-check"><input type="checkbox" checked=${hostState.diagnostics} onChange=${e => hostSend({ cmd:"setDiagnostics", value:e.target.checked })} /> Journal de diagnostic de la détection (chiffres seulement)</label>
      <dl className="facts" data-test="diag-state">
        <dt>${t("settings.diag.phase")}</dt><dd>${hostState.phase || "-"}</dd>
        ${hostState.placement && hostState.clientOpen !== false ? html`<dt>${t("settings.diag.placement")}</dt><dd>${hostState.placement}</dd>` : null}
      </dl>
      <p className="set-row"><button type="button" className="ghost-btn" data-test="lcu-diagnostic" onClick=${() => hostSend({ cmd:"lcuDiagnostic" })}>${t("settings.diag.lcu")}</button></p>
      <p className="set-hint flush">${t("settings.diag.lcuHint")}</p>
    </div>` : null}
  </div>`;
}

function SettingsPage({ onClose, solo }) {
  // Échap ramène à la section précédente sans effacer la draft en cours (comme l'ancienne fenêtre des réglages).
  useEffect(() => {
    const onEscape = e => { if (e.key === "Escape") { e.stopPropagation(); onClose(); } };
    document.addEventListener("keydown", onEscape, true);
    return () => document.removeEventListener("keydown", onEscape, true);
  }, [onClose]);
  // UX-7 : plus de bouton « Fermer » (reste de la modale) : la navigation suffit. Ouverts seuls pendant une draft (solo),
  // les réglages gardent un bouton qui referme la fenêtre, pour ne rien laisser devant le client.
  const section = uiSection;
  return html`<div className="view-page" data-test="settings">
    <${ViewHead} title=${t("nav.settings")} sub=${t("settings.sub")}
      tools=${solo ? html`<button type="button" className="ghost-btn" data-test="settings-close" autoFocus=${true} onClick=${onClose}>${t("settings.closeSolo")}</button>` : null} />
    <div className="set-page">
      <div className="subnav" role="tablist" aria-label=${t("settings.sectionsLabel")}>
        ${SETTINGS_SECTIONS.map(s => html`<button key=${s} type="button" role="tab" aria-selected=${s === section} data-test=${`settings-section-${s}`} className=${`subnav-link${s === section ? " on" : ""}`} onClick=${() => goView("settings", s)}>
          <${NavIcon} name=${SECTION_ICONS[s]} /><span>${t(`settings.section.${s}`)}</span></button>`)}
      </div>
      <section className="box box-pad set-body" role="tabpanel" data-test=${`settings-body-${section}`} aria-labelledby="set-title">
        <h2 id="set-title" className="box-title">${t(`settings.section.${section}`)}</h2>
        <p className="box-sub">${t(`settings.${section}.sub`)}</p>
        <${SettingsSection} id=${section} />
      </section>
    </div>
  </div>`;
}

function SimView() {
  return html`<div className="app" data-test="view-sim-body">
    <header className="top">
      <h1 id="view-title" className="view-title">${t("nav.sim")}</h1>
      <${RoleSwitch} />
      <span className="patch">Patch ${ddVersion.split(".").slice(0, 2).join(".")}</span>
      <span className="grow"></span>
      <div className="seg-tabs source-switch" role="group" aria-label="Draft affichée">
        <button type="button" className=${`seg-tab${simulating ? "" : " on"}`} aria-pressed=${!simulating} data-test="source-live" onClick=${leaveSimulation}>Draft en cours</button>
        <button type="button" className=${`seg-tab${simulating ? " on" : ""}`} aria-pressed=${simulating} data-test="source-sim" onClick=${startSimulation}>Simulation</button>
      </div>
      <button type="button" className="ghost-btn" data-test="random-draft" data-random-draft=${true} onClick=${startRandomDraft}>Draft aléatoire</button>
      <button type="button" className="ghost-btn" data-test="new-draft" disabled=${!state.enemies.length} onClick=${() => withUndo(simulating ? "Simulation effacée." : "Draft effacée.", resetDraft)}>${simulating ? "Nouvelle simulation" : "Nouvelle draft"}</button>
    </header>
    ${simulating ? html`<div className="sim-band" role="status" data-test="simulation" data-simulation=${true}>
      <p><b>Simulation</b> : ta draft en cours n'est pas modifiée.</p>
      <span className="grow"></span>
      <button type="button" className="ghost-btn" data-test="resume-live" disabled=${!liveCopy || !(liveCopy.enemies || []).length} title="Copie la draft en cours dans la simulation, sans lien avec elle." onClick=${resumeLiveInSimulation}>Reprendre la draft en cours</button>
      <button type="button" className="ghost-btn" data-test="leave-simulation" onClick=${leaveSimulation}>Quitter la simulation</button>
    </div>` : null}
    <div className="desk">
      <${EnemyPanel} />
      <div className="col col-mid"><${Stage} /><${Ranking} /></div>
      <${SidePanel} key=${navId} />
    </div>
    <${MobileBar} />
  </div>`;
}

function CompactEnemies() {
  const likely = likelyRoles(), slots = likely.slots;
  return html`<div className="p-compact-enemies">
    <${SearchBox} />
    <${UndoNote} />
    <div className="roles compact-roles">
      ${LEFT_ORDER.map(r => html`<${RoleRow} key=${r} role=${r} name=${slots[r]} assumed=${!state.manualMid} info=${slots[r] ? likely.byName[slots[r]] : null} />`)}
    </div>
  </div>`;
}

function PanelApp() {
  return html`<div className=${`panel panel-${PANEL}`} data-test="panel">
    <${TitleBar} />
    ${PANEL !== "left" ? html`<${RoleSwitch} />` : null}
    ${PANEL === "left" ? html`<${EnemyPanel} />` : null}
    ${PANEL === "right" ? html`<${VerdictPanel} />` : null}
    ${PANEL === "compact" ? html`<div className="p-scroll"><${CompactEnemies} /><${VerdictPanel} /></div>` : null}
  </div>`;
}

const isTextEntry = el => !!el && (el.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName));

function App() {
  const [, force] = useReducer(x => x + 1, 0);
  // Ouverts pendant une draft, les réglages sont seuls à l'écran : les fermer referme la fenêtre, pour ne rien laisser devant le client.
  const settingsWindow = useRef(IS_HOST && new URLSearchParams(location.search).get("solo") === "1");
  const closeSettings = useCallback(() => {
    if (settingsWindow.current) { settingsWindow.current = false; goView(uiBack === "settings" ? "home" : uiBack); hostSend({ cmd:"closeFull" }); return; }
    goView(uiBack === "settings" ? "home" : uiBack);
  }, []);
  useEffect(() => {
    rerender = force;
    // « Simuler une draft » du menu de l'icône quand la fenêtre n'était pas encore chargée.
    if (!PANEL || PANEL === "full") { if (new URLSearchParams(location.search).get("tab") === "simulate") startSimulation(); }
    if (channel) { channel.postMessage({ kind:"hello" }); setTimeout(() => { synced = true; }, SYNC_WAIT_MS); }
    if (IS_HOST) {
      window.chrome.webview.addEventListener("message", e => {
        const m = e.data;
        if (m.kind === "host") {
          Object.assign(hostState, m, { available:true });
          // Stockage du navigateur vide mais copie dans le dossier de données : les profils reviennent.
          if (!PROFILES.active && m.savedProfiles) {
            try { const back = normalizeProfiles(JSON.parse(m.savedProfiles)); if (back && back.active) { PROFILES = back; persistProfiles(PROFILES, localStorage); useActiveRole(); computeVerdict(); } } catch (e) {}
          }
          if (m.legacyProfile) {
            if (!PROFILE) { saveMyProfile(FIRST_PROFILE.role, FIRST_PROFILE.pool.map(label)); computeVerdict(); }
            hostSend({ cmd:"profileAdopted" });
          }
          if (PROFILE && !window.draftProfileSent) { window.draftProfileSent = true; sendProfile(); }
          if (!m.legacyProfile && !PROFILE && PANEL && PANEL !== "full" && !window.draftProfileAsked) { window.draftProfileAsked = true; hostSend({ cmd:"openFull", tab:"pool" }); }
          force();
          handleAssignedRole(m.assignedRole || null);
        }
        if (m.kind === "demo") runDemo(m.stepMs);
        if (m.kind === "draftStart") { clearUndo(); leaveSimulation(); resetRoleSession(); riotProvider.reset(); dispatchDraft({ type:"session-start" }); }
        if (m.kind === "lcuEnemies") applyDetected(m.ids);
        if (m.kind === "draftEnd") { sendValidationRow(); resetRoleSession(); dispatchDraft({ type:"session-end" }); }
        // Message gardé une version (alias) : ouvre la section Réglages.
        if (m.kind === "openSettings") { goView("settings", m.section); window.__openSettingsSeen = m.token || 0; }
        if (m.kind === "openTab") { history.replaceState(null, "", `?panel=full&tab=${m.tab}`); location.reload(); }
        // Ouverture d'une section ou d'un onglet sans recharger la page (« Détails », « Comparer ») : la draft affichée reste, aucune diffusion.
        if (m.kind === "openView") { openViewInPage(m.tab || "", m.source || ""); window.__openViewSeen = m.token || 0; }
      });
      hostSend({ cmd:"getHost" });
    }
    const onKey = e => {
      // Les raccourcis de la saisie ne valent que dans le Simulateur, et jamais pendant une saisie.
      if (uiView !== "sim") return;
      const active = document.activeElement;
      const add = document.getElementById("add");
      const inField = isTextEntry(active);
      // Échap ne retire aucun adversaire : dans la recherche, il vide seulement le texte saisi (SearchBox).
      if (e.key === "Escape") return;
      if (!inField) {
        if (e.key === "Backspace" && state.enemies.length) { e.preventDefault(); removeLastEnemy(); }
        else if (e.key.length === 1 && e.key !== " " && !e.ctrlKey && !e.metaKey && !e.altKey && add && !add.disabled) add.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusAdd();
    PICKS.forEach(p => preloadSplash(label(p)));
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(list => { if (list && list[0]) { ddVersion = list[0]; setKnownPatch(list[0]); force(); } }).catch(() => {});
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  if (PANEL && PANEL !== "full") return html`<${MotionConfig} reducedMotion="user"><${PanelApp} /><//>`;
  const view = uiView === "home" ? html`<${HomeView} />` : uiView === "pool" ? html`<${PoolPage} />` : uiView === "stats" ? html`<${StatsView} />`
    : uiView === "settings" ? html`<${SettingsPage} onClose=${closeSettings} solo=${settingsWindow.current} />` : html`<${SimView} />`;
  return html`<${MotionConfig} reducedMotion="user">
    <div className="shell" data-test="app">
      <${MainNav} />
      <main className=${`view view-${uiView}`} data-test=${`view-${uiView}`} aria-labelledby="view-title">${view}</main>
    </div>
  <//>`;
}

Object.assign(state, { roleOf:{}, targetRole:null, selected:null });
computeVerdict();
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
