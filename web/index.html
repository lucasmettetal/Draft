function WinBars({ title, groups }) {
  if (!groups.length) return null;
  return html`<div>
    <h3>${title}</h3>
    <div className="winbars">
      ${groups.map(g => {
        const rec = record(g.rows);
        const few = rec.games < MIN_GAMES;
        return html`<div key=${g.name} className=${`winbar${few ? " few" : ""}`}>
          <span className="winbar-name">${g.name}</span>
          <span className="winbar-track" role="img" aria-label=${`${g.name} : ${fmtRecord(rec)}`}>
            <${motion.i} initial=${{ scaleX:0 }} animate=${{ scaleX: rec.games ? rec.wins / rec.games : 0 }} transition=${ARRIVE} />
          </span>
          <span className="winbar-val">${fmtRecord(rec)}${few ? "" : `, ${pct(rec)}`}</span>
        </div>`;
      })}
    </div>
    <p className="small">Sans pourcentage : moins de ${MIN_GAMES} parties, trop peu pour conclure.</p>
  </div>`;
}

function evolutionGroups(rows) {
  const sorted = [...rows].sort((x, y) => x.time - y.time);
  const groups = [];
  for (let i = 0; i + EVOLUTION_STEP <= sorted.length; i += EVOLUTION_STEP) groups.push({ name:`${i + 1} à ${i + EVOLUTION_STEP}`, rows:sorted.slice(i, i + EVOLUTION_STEP) });
  return groups;
}

const StatsTable = ({ title, groups }) => html`<div>
  <h3>${title}</h3>
  <table><thead><tr><th></th><th>Parties</th><th>Bilan</th><th>Winrate</th></tr></thead>
  <tbody>${groups.map(g => { const rec = record(g.rows); return html`<tr key=${g.name}><td>${g.name}</td><td>${rec.games}</td><td>${fmtRecord(rec)}</td><td>${pct(rec)}</td></tr>`; })}</tbody></table>
</div>`;

function JournalTab() {
  const list = loadJournal();
  if (!list.length) return html`<p className="small">Ton journal est vide : clique sur « Je prends » pendant une draft pour commencer.</p>`;
  const played = list.filter(x => x.result === "win" || x.result === "loss");
  const tally = rows => { const w = rows.filter(x => x.result === "win").length; return { wins:w, losses:rows.length - w, games:rows.length }; };
  const followed = tally(played.filter(x => x.picked === x.suggested));
  const other = tally(played.filter(x => x.picked !== x.suggested));
  return html`<div>
    ${played.length ? html`<h3>Dernières parties</h3>
      <div className="history" role="img" aria-label=${`${played.filter(x => x.result === "win").length} victoires sur ${played.length} parties notées`}>
        ${played.slice(-20).map((x, i) => html`<${motion.span} key=${x.id} className=${`game ${x.result}`} title=${`${label(x.picked)} : ${x.result === "win" ? "victoire" : "défaite"}`} initial=${{ scale:.5 }} animate=${{ scale:1 }} transition=${{ ...QUICK, delay:i * .012 }}><//>`)}
      </div>
      <${WinBars} title="Victoires par champion joué" groups=${groupRows(played.map(x => ({ win: x.result === "win", name: label(x.picked) })), r => r.name)} />
      <${WinBars} title="Selon le type de mid adverse" groups=${groupRows(played.filter(x => matchupOf(x.mid)).map(x => ({ win: x.result === "win", type: matchupOf(x.mid).t })), r => r.type)} />
      <h3>Compositions récentes</h3>
      <ul className="comps">${played.slice(-5).reverse().map(x => html`<li key=${x.id}><span className=${`game ${x.result}`}></span><b>${label(x.picked)}</b><span className="comp-faces">${(x.enemies || []).map(n => html`<${Portrait} key=${n} name=${n} size=${22} />`)}</span></li>`)}</ul>` : null}
    <p className="small">Conseil suivi : ${fmtRecord(followed)}. Autre choix : ${fmtRecord(other)}. Ces chiffres ne prouvent pas que l'outil aide : tu ne choisis pas au hasard, et il faut plusieurs centaines de parties pour voir un écart fiable.</p>
    <table><thead><tr><th>Date</th><th>Pick</th><th>Mid</th><th>Conseil</th><th>Résultat</th></tr></thead>

      <td>${new Date(x.date).toLocaleDateString("fr-FR")}</td><td>${label(x.picked)}</td><td>${x.mid || "-"}</td><td>${label(x.suggested || "-")}</td>

    <p style=${{ marginTop:10 }}><button type="button" className="ghost-btn" onClick=${exportJournal}>Télécharger le journal</button></p>
  </div>`;

    <section className="p-win"><b>Gagne si</b><p>${winCondition(V.shown, c)}</p></section>
    ${V.bans[0] ? html`<section className="p-ban" aria-label="Ban conseillé">
      <h2 className="p-h">Ban conseillé</h2>
      <div className="p-ban-row"><${Portrait} name=${V.bans[0]} size=${34} /><b>${V.bans[0]}</b>${V.bans.length > 1 ? html`<span>ou ${V.bans.slice(1).join(", ")}</span>` : null}</div>
      <p className="note">${V.bans[0]} ${banReason(V.bans[0])}.</p>
    </section>` : null}
    <div className="p-actions">
      <${motion.button} type="button" className=${`cta${picked ? " done" : ""}`} whileTap=${{ scale:.97 }} onClick=${() => choosePick(V.shown)}>${picked ? `${name} enregistré` : `Je prends ${name}`}<//>
      <button type="button" className="ghost-btn" onClick=${() => openDetail("analyse")}>Analyse<span className="opt-word"> détaillée</span></button>
    </div>
    ${entry || pending ? html`<div>
      ${pending ? html`<p className="result-note">Dernière partie : <b>${label(pending.picked)}</b></p>` : null}
      <${ResultButtons} id=${entry ? entry.id : pending.id} result=${entry ? entry.result : null} disabled=${false} />
    </div>` : null}
  </div>`;
}

const LCU_STATES = {
  connected: ["good", "Connecté au client LoL"],
  waiting: ["wait", "En attente : lance le client LoL pour vérifier"],
  failed: ["bad", "Client ouvert, mais connexion impossible"],
  off: ["idle", "Désactivée : la détection est estimée et peu fiable"]
};

// Le calcul des matchups tourne dans le programme : il a besoin du rôle et du pool, en noms de Riot.
function sendProfile() {
  if (PROFILE && IS_HOST) hostSend({ cmd:"setProfile", role: PROFILE.role, pool: PICKS.map(p => riotKey(label(p))) });
}

function saveMyProfile(role, names) {
  const pool = names.map(pickId);
  if (role !== myRole()) { state.manualMid = null; state.roleOf = {}; }
  saveProfile({ role, pool });
  state.held = null;
  savePrefs({ excluded: PREFS.excluded.filter(p => pool.includes(p)), favorite: pool.includes(PREFS.favorite) ? PREFS.favorite : null });
  pool.forEach(p => preloadSplash(label(p)));
  sendProfile();
}

function ProfileCard() {
  const [role, setRole] = useState(PROFILE ? PROFILE.role : null);
  const [pool, setPool] = useState(PROFILE ? PICKS.map(label) : []);
  const [query, setQuery] = useState("");
  const apply = (r, list) => { setRole(r); setPool(list); if (r && list.length) saveMyProfile(r, list); };
  const key = norm(query);
  const choices = (key ? NAMES.filter(n => champKeys(n).some(k => k.includes(key))) : role ? championsForRole(role) : []).filter(n => !pool.includes(n)).slice(0, 12);
  return html`<div>
    <h3>Mon profil</h3>
    <div className=${`set-card${PROFILE ? " on" : ""}`}>
      ${PROFILE ? null : html`<p className="set-main">Choisis ton rôle et tes champions pour obtenir un conseil.</p>`}
      <div className="role-pick" role="group" aria-label="Mon rôle">
        ${ROLE_ORDER.map(r => html`<button key=${r} type="button" className=${`ghost-btn${role === r ? " on" : ""}`} aria-pressed=${role === r} onClick=${() => apply(r, pool)}>${ROLE_NAMES[r]}</button>`)}
      </div>
      <div className="pool-list" aria-label="Mes champions">
        ${pool.map(n => html`<button key=${n} type="button" className="pool-chip on" title=${`Retirer ${n}`} aria-label=${`Retirer ${n}`} onClick=${() => apply(role, pool.filter(x => x !== n))}><${Portrait} name=${n} size=${24} /><span>${n}</span><b aria-hidden="true">×</b></button>`)}
        ${pool.length ? null : html`<span className="set-hint flush">Aucun champion pour l'instant.</span>`}
      </div>
      <input className="pool-search" type="search" value=${query} autoComplete="off" spellCheck="false" aria-label="Ajouter un champion" placeholder="Ajouter un champion : ahri, tf, kata..."
        onChange=${e => setQuery(e.target.value)} onKeyDown=${e => { if (e.key === "Enter" && choices[0]) { apply(role, pool.concat(choices[0])); setQuery(""); } }} />
      ${role || key ? html`<div className="pool-list">
        ${choices.map(n => html`<button key=${n} type="button" className="pool-chip" onClick=${() => { apply(role, pool.concat(n)); setQuery(""); }}><${Portrait} name=${n} size=${24} /><span>${n}</span></button>`)}
        ${key && !choices.length ? html`<span className="set-hint flush">Aucun champion trouvé.</span>` : null}
      </div>` : null}
      ${PROFILE && (!role || !pool.length) ? html`<p className="set-hint flush">Garde au moins un champion : ton profil précédent reste actif.</p>` : null}
      <p className="set-hint flush">Sans statistiques calculées, le conseil repose sur des fiches écrites à la main : c'est un avis général.</p>
    </div>
  </div>`;
}

function DataSources() {
  // Le détail n'est calculé qu'à l'ouverture : les réglages restent immédiats.
  const [open, setOpen] = useState(false);
  const report = dataReport();
  const changes = open ? roleChanges() : [];
  const stale = report.filter(r => r.available && r.stale).length;
  const missing = report.filter(r => !r.available).length;
  const dateOf = d => { const t = Date.parse(d || ""); return isNaN(t) ? "inconnue" : new Date(t).toLocaleDateString("fr-FR"); };
  return html`<details className="set-more" onToggle=${e => setOpen(e.currentTarget.open)}>
    <summary>Sources de données${stale ? ` : ${stale} ancienne(s)` : ""}${missing ? `${stale ? "," : " :"} ${missing} absente(s)` : ""}</summary>
    <ul className="data-list">${report.map(r => html`<li key=${r.id} className=${r.available ? "" : "off"}>
      <b>${r.label}</b> <span className="data-kind">${r.kindLabel}</span>${r.stale ? html` <span className="data-old">Ancienne</span>` : null}${r.available ? null : html` <span className="data-old">Absente</span>`}
      <p>${r.source}.${!r.available || r.kind === "heuristic" ? "" : ` Patch : ${r.patch || "inconnu"}${r.stale ? ` (${r.age} patchs d'écart)` : ""}.`}${r.collected ? ` Date : ${dateOf(r.collected)}.` : ""}${!r.available || r.kind === "official" || r.kind === "heuristic" ? "" : ` Observations : ${r.games === null ? "non mesurées" : `${r.games} ${r.unit}`}.`}${r.region ? ` Région : ${r.region}.` : ""}${r.rank ? ` Rang : ${r.rank}.` : ""}${r.uncertainty ? ` Incertitude ${r.uncertainty}.` : ""}</p>
      <p>${r.note} ${r.terms}</p>
    </li>`)}</ul>
    ${changes.length ? html`<h3>Rôles à surveiller</h3>
    <ul className="data-list">${changes.slice(0, 8).map(c => html`<li key=${c.name}><b>${c.name}</b> : plus souvent ${ROLE_NAMES[c.role]} que dans ${c.confirmed ? "les patchs précédents" : "la référence, à confirmer"} (${c.games} parties).</li>`)}</ul>` : null}
  </details>`;
}

function Settings({ onClose }) {
  const toggleExcluded = p => savePrefs({ excluded: PREFS.excluded.includes(p) ? PREFS.excluded.filter(x => x !== p) : PREFS.excluded.concat(p) });
  const importJournal = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(text => {
      const incoming = JSON.parse(text);
      if (!Array.isArray(incoming)) throw new Error("format");
      const list = loadJournal();
      const known = new Set(list.map(x => x.id));
      const added = incoming.filter(x => x && x.id && x.picked && !known.has(x.id));
      saveJournal(list.concat(added).sort((a, b) => a.id - b.id));
      setImportNote(`${added.length} partie(s) ajoutée(s) à ton journal.`);
      publish(null);
    }).catch(() => setImportNote("Ce fichier n'est pas un journal DraftMid : rien n'a été modifié."));
  };
  const [importNote, setImportNote] = useState("");
  // Échap ferme les réglages sans effacer la draft en cours.
  useEffect(() => {
    const onEscape = e => { if (e.key === "Escape") { e.stopPropagation(); onClose(); } };
    document.addEventListener("keydown", onEscape, true);
    return () => document.removeEventListener("keydown", onEscape, true);
  }, [onClose]);
  return html`<div className="settings-back" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <section className="settings" role="dialog" aria-modal="true" aria-label="Réglages">
      <header className="sec-title">Réglages <button type="button" className="ghost-btn" autoFocus=${true} onClick=${onClose}>Fermer</button></header>
      <${ProfileCard} />
      ${hostState.available ? html`<div>
        <h3>Détection de la draft</h3>
        <div className=${`set-card${hostState.lcuEnabled ? " on" : ""}`}>
          <label className="set-check set-main"><input type="checkbox" disabled=${!hostState.lcuConfirmed} checked=${hostState.lcuEnabled && hostState.lcuConfirmed} onChange=${e => hostSend({ cmd:"setLcu", value:e.target.checked })} /> Lire la draft depuis le client LoL</label>
          <p className="set-hint">Recommandé : les panneaux s'ouvrent au bon moment et les adversaires se remplissent seuls. Lecture seule, rien n'est modifié dans le client.</p>
          <p className=${`lcu-state ${(LCU_STATES[hostState.lcuStatus] || LCU_STATES.off)[0]}`} role="status"><i aria-hidden="true"></i>${(LCU_STATES[hostState.lcuStatus] || LCU_STATES.off)[1]}</p>
          <p className="set-hint">Riot n'a pas confirmé que c'est autorisé : tu l'actives à tes risques.</p>
        </div>
        <label className="set-check"><input type="checkbox" checked=${hostState.autoDraft} onChange=${e => hostSend({ cmd:"setAutoDraft", value:e.target.checked })} /> Afficher les panneaux automatiquement pendant la draft</label>
        <p className="set-hint">${hostState.hotkey ? "Ctrl+Alt+D" : "Le menu de l'icône"} affiche ou masque les panneaux à tout moment.</p>
        <h3>Fenêtres</h3>
        <label className="set-check"><input type="checkbox" checked=${hostState.follow} onChange=${e => hostSend({ cmd:"setFollow", value:e.target.checked })} /> Coller les panneaux au client LoL</label>
        <label className="set-check"><input type="checkbox" checked=${hostState.compact} onChange=${() => hostSend({ cmd:"toggleCompact" })} /> Un seul panneau</label>
        <label className="set-check"><input type="checkbox" checked=${hostState.topmost} onChange=${e => hostSend({ cmd:"setTopmost", value:e.target.checked })} /> Toujours au premier plan</label>
        <label className="set-check"><input type="checkbox" checked=${hostState.autostart} onChange=${e => hostSend({ cmd:"setAutostart", value:e.target.checked })} /> Démarrer avec Windows</label>
      </div>` : null}
      <h3>Mes picks</h3>
      <p className="set-hint flush">Exclure pour l'instant :</p>
      <div className="set-row">${PICKS.map(p => html`<label key=${p} className="set-check"><input type="checkbox" checked=${PREFS.excluded.includes(p)} onChange=${() => toggleExcluded(p)} /> ${label(p)}</label>`)}</div>
      <label className="set-line">À égalité exacte, préférer
        <select value=${PREFS.favorite || ""} onChange=${e => savePrefs({ favorite: e.target.value || null })}>
          <option value="">Aucun</option>
          ${PICKS.map(p => html`<option key=${p} value=${p}>${label(p)}</option>`)}
        </select>
      </label>
      <label className="set-check"><input type="checkbox" checked=${PREFS.assumeFront} onChange=${e => savePrefs({ assumeFront: e.target.checked })} /> Supposer un frontline dans mon équipe</label>
      ${hostState.available ? html`<div>
        <h3>Rôles des champions</h3>
        <p className="small">${window.ROLE_RATES_LIVE ? `Calculés le ${new Date(window.ROLE_RATES_LIVE.updated).toLocaleDateString("fr-FR")} sur ${window.ROLE_RATES_LIVE.games} parties récentes.` : (typeof ROLE_RATES !== "undefined" ? `Statistiques livrées avec l'application, patch ${ROLE_RATES.patch}.` : "Pas encore calculés : les rôles habituels écrits à la main servent de repère.")} Ils servent à deviner le mid adverse.</p>
        <h3>Matchups</h3>
        <p className="small">${window.MATCHUPS_LIVE && !liveRoleOk() ? `Bilans calculés pour le rôle ${ROLE_NAMES[window.MATCHUPS_LIVE.role || "mid"]} : relance le calcul pour ton rôle actuel.` : window.MATCHUPS_LIVE ? `Calculés le ${new Date(window.MATCHUPS_LIVE.updated).toLocaleDateString("fr-FR")} sur ${window.MATCHUPS_LIVE.games} parties. ${PICKS.map(p => `${label(p)} : ${(window.MATCHUPS_LIVE.pool[riotKey(label(p))] || { games:0 }).games}`).join(", ")}.` : "Pas encore de bilans calculés."} Sous ${MATCHUP_MIN_GAMES} parties, le matchup n'utilise pas le bilan.</p>
        <p className="small" role="status">${hostState.rolesStatus || ""}</p>
        <p className="set-row">
          ${hostState.rolesRunning
            ? html`<button type="button" className="ghost-btn" onClick=${() => hostSend({ cmd:"updateRoles" })}>Arrêter le calcul</button>`
            : html`<button type="button" className="ghost-btn" onClick=${() => hostSend({ cmd:"updateRoles" })}>Mettre à jour les rôles</button>
                <button type="button" className="ghost-btn" onClick=${() => hostSend({ cmd:"updateMatchups" })}>Mettre à jour les matchups</button>`}
        </p>
      </div>` : null}
      <h3>Journal</h3>
      <p className="small">Pour récupérer un ancien journal, importe son fichier ici. Rien n'est supprimé.</p>
      <p><input type="file" accept=".json,application/json" aria-label="Importer un journal" onChange=${importJournal} /></p>
      ${importNote ? html`<p className="small">${importNote}</p>` : null}
      <${DataSources} />
      <details className="set-more">
        <summary>Avancé</summary>
        <p><button type="button" className="ghost-btn" onClick=${() => { onClose(); runDemo(); }}>Lancer une draft de démonstration</button></p>
        ${hostState.available ? html`<div>
          <label className="set-check"><input type="checkbox" checked=${hostState.diagnostics} onChange=${e => hostSend({ cmd:"setDiagnostics", value:e.target.checked })} /> Journal de diagnostic de la détection (chiffres seulement)</label>
          <p className="small">${hostState.phase || ""}. ${hostState.placement || ""}</p>
        </div>` : null}
      </details>
    </section>
  </div>`;
}

function CompactEnemies() {
  const slots = deriveSlots();
  return html`<div className="p-compact-enemies">
    <${SearchBox} />
    <div className="roles compact-roles">
      ${LEFT_ORDER.map(r => html`<${RoleRow} key=${r} role=${r} name=${slots[r]} assumed=${!state.manualMid} />`)}
    </div>
  </div>`;
}

function PanelApp() {
  return html`<div className=${`panel panel-${PANEL}`}>
    <${TitleBar} />
    ${PANEL === "left" ? html`<${EnemyPanel} />` : null}
    ${PANEL === "right" ? html`<${VerdictPanel} />` : null}
    ${PANEL === "compact" ? html`<div className="p-scroll"><${CompactEnemies} /><${VerdictPanel} /></div>` : null}
  </div>`;
}

function App() {
  const [, force] = useReducer(x => x + 1, 0);
  const [showSettings, setShowSettings] = useState(() => new URLSearchParams(location.search).get("tab") === "settings");
  // Ouverts depuis un panneau, les réglages ont leur propre fenêtre : les fermer la referme aussi.
  const settingsWindow = useRef(IS_HOST && new URLSearchParams(location.search).get("tab") === "settings");
  const closeSettings = useCallback(() => {
    setShowSettings(false);
    if (settingsWindow.current) { settingsWindow.current = false; hostSend({ cmd:"closeFull" }); }
  }, []);
  useEffect(() => {
    rerender = force;
    if (channel) channel.postMessage({ kind:"hello" });
    if (IS_HOST) {
      window.chrome.webview.addEventListener("message", e => {
        const m = e.data;
        if (m.kind === "host") {
          Object.assign(hostState, m, { available:true });
          if (m.legacyProfile) {
            if (!PROFILE) { saveProfile(FIRST_PROFILE); computeVerdict(); }
            hostSend({ cmd:"profileAdopted" });
          }
          if (PROFILE && !window.draftProfileSent) { window.draftProfileSent = true; sendProfile(); }
          if (!m.legacyProfile && !PROFILE && PANEL && PANEL !== "full" && !window.draftProfileAsked) { window.draftProfileAsked = true; hostSend({ cmd:"openFull", tab:"settings" }); }
          force();
        }
        if (m.kind === "demo") runDemo(m.stepMs);
        if (m.kind === "draftStart") { riotProvider.reset(); dispatchDraft({ type:"session-start" }); }
        if (m.kind === "lcuEnemies") applyDetected(m.ids);
        if (m.kind === "draftEnd") { sendValidationRow(); dispatchDraft({ type:"session-end" }); }
        if (m.kind === "openSettings") setShowSettings(true);
        if (m.kind === "openTab") { history.replaceState(null, "", `?panel=full&tab=${m.tab}`); location.reload(); }
      });
      hostSend({ cmd:"getHost" });
    }
    const onKey = e => {
      const active = document.activeElement;
      const add = document.getElementById("add");
      const inField = active && (active.id === "add" || active.id === "q");
      if (e.key === "Escape") {
        if (!inField || active.id === "add") resetDraft();
      } else if (!inField) {
        if (e.key === "Backspace" && state.enemies.length) { e.preventDefault(); removeEnemy(state.enemies[state.enemies.length - 1]); }
        else if (e.key.length === 1 && e.key !== " " && !e.ctrlKey && !e.metaKey && !e.altKey && add && !add.disabled) add.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    focusAdd();
    PICKS.forEach(p => preloadSplash(label(p)));
    fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(list => { if (list && list[0]) { ddVersion = list[0]; setKnownPatch(list[0]); force(); } }).catch(() => {});
    return () => document.removeEventListener("keydown", onKey);
  }, []);
  if (PANEL && PANEL !== "full") return html`<${MotionConfig} reducedMotion="user"><${PanelApp} /><//>`;
  return html`<${MotionConfig} reducedMotion="user">
    ${showSettings ? html`<${Settings} onClose=${closeSettings} />` : null}
    <div className="app">
      <header className="top">
        <span className="brand">Draft<b>Mid</b></span>
        <span className="patch">Patch ${ddVersion.split(".").slice(0, 2).join(".")}</span>
        <span className="grow"></span>
        <button type="button" className="ghost-btn" onClick=${() => setShowSettings(true)}>Réglages</button>
        <button type="button" className="ghost-btn" disabled=${!state.enemies.length} onClick=${resetDraft}>Nouvelle draft</button>
      </header>
      <div className="desk">
        <${EnemyPanel} />
        <main className="col col-mid"><${Stage} /><${Ranking} /></main>
        <${SidePanel} />
      </div>
      <${MobileBar} />
    </div>
  <//>`;
}

Object.assign(state, { roleOf:{}, targetRole:null, selected:null });
computeVerdict();
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
