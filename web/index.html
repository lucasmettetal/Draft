<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DraftMid</title>
<style>
  :root {
    --bg:#0a0f16; --surface:#111822; --raised:#18212e; --line:#263242; --text:#e8eef5; --muted:#93a3b6;
    --accent:#3fd8c6; --accent-ink:#04211e; --gold:#d4b36a; --threat:#f2777a;
    --condensed:"Bahnschrift SemiBold Condensed","Bahnschrift Condensed",Bahnschrift,"Arial Narrow",Arial,sans-serif;
    --body:Bahnschrift,"Segoe UI",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  * { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 var(--body); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  h2, h3, p, ul { margin:0; padding:0; }
  ul { list-style:none; }

  .app { display:grid; grid-template-rows:52px minmax(0,1fr); height:100vh; }
  .top { display:flex; align-items:center; gap:14px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { font:20px var(--condensed); letter-spacing:.02em; }
  .brand b { color:var(--accent); font-weight:inherit; }
  .patch { color:var(--muted); font-size:12.5px; }
  .top .grow { flex:1; }
  .ghost-btn { min-height:32px; padding:4px 12px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13px; }
  .ghost-btn:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .ghost-btn:disabled { color:var(--muted); opacity:.55; }

  .desk { display:grid; grid-template-columns:clamp(300px,23vw,420px) minmax(0,1fr) clamp(310px,24vw,440px); min-height:0; }
  .col { min-height:0; display:flex; flex-direction:column; }
  .col-left { padding:14px; background:var(--surface); border-right:1px solid var(--line); overflow:auto; }
  .col-mid { padding:14px; gap:12px; overflow:auto; }
  .col-right { background:var(--surface); border-left:1px solid var(--line); overflow:hidden; }

  .sec-title { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; font:17px var(--condensed); letter-spacing:.02em; }
  .sec-title small { color:var(--muted); font:12.5px var(--body); }

  /* Saisie */
  .search { position:relative; margin-bottom:6px; }
  #add, #q { width:100%; height:42px; padding:0 12px; background:var(--bg); border:1px solid var(--line); border-radius:6px; font-size:15px; outline:none; transition:border-color .12s; }
  #add:focus, #q:focus { border-color:var(--accent); }
  #add:disabled { opacity:.55; }
  #add::placeholder, #q::placeholder { color:var(--muted); opacity:1; }
  .sugg { position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px); padding:4px; background:var(--raised); border:1px solid var(--line); border-radius:6px; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .sugg-item { display:flex; align-items:center; gap:10px; width:100%; padding:5px 8px; background:none; border:0; border-radius:4px; text-align:left; }
  .sugg-item.on, .sugg-item:hover { background:var(--line); }
  .sugg-empty { padding:8px; color:var(--muted); font-size:13px; }
  .hint { min-height:18px; margin-bottom:10px; color:var(--muted); font-size:12px; }
  .hint.warn { color:var(--gold); }

  /* Portraits */
  .portrait { position:relative; flex:none; display:block; overflow:hidden; background:var(--raised); border-radius:6px; }
  .portrait img { display:block; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .16s; }
  .portrait img.ready { opacity:1; }
  .portrait.loading { background:linear-gradient(100deg,var(--raised) 30%,var(--line) 50%,var(--raised) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .portrait .init { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font:15px var(--condensed); }

  /* Rôles */
  .roles { flex:1 1 auto; display:flex; flex-direction:column; gap:4px; margin-bottom:14px; }
  .roles > .role { flex:1 1 60px; }
  .role .portrait { width:clamp(44px,6.6vh,76px) !important; height:clamp(44px,6.6vh,76px) !important; }
  .role { position:relative; display:flex; align-items:center; gap:10px; min-height:60px; padding:6px 8px; background:var(--bg); border:1px solid transparent; border-radius:6px; transition:border-color .12s, background-color .12s; }
  .role:hover { border-color:var(--line); }
  .role.target { border-color:var(--accent); }
  .role.is-mid { background:var(--raised); }
  .role-hit { position:absolute; inset:0; background:none; border:0; border-radius:6px; }
  .who-wrap { display:flex; flex:1; min-width:0; align-items:center; gap:10px; pointer-events:none; }
  .role-name, .role-traits { display:block; }
  .role-icon { flex:none; width:40px; color:var(--muted); text-align:center; font-size:10.5px; line-height:1.1; pointer-events:none; }
  .role-icon svg { display:block; width:20px; height:20px; margin:0 auto 2px; }
  .role.is-mid .role-icon { color:var(--accent); }
  .role-who { min-width:0; flex:1; pointer-events:none; }
  .role-name { font:17px/1.15 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-traits { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-empty { color:var(--muted); font-size:13px; pointer-events:none; }
  .role-tools { position:relative; display:flex; gap:2px; }
  .mini { min-width:28px; height:28px; padding:0 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:12px; }
  .mini:hover { color:var(--text); background:var(--line); }
  .mini.x { font-size:17px; line-height:1; }

  /* Profil de la composition */
  .meters { display:grid; gap:7px; }
  .meter { display:grid; grid-template-columns:96px 1fr; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .pips { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
  .pip { height:7px; background:var(--raised); border-radius:1px; overflow:hidden; }
  .pip i { display:block; height:100%; background:var(--accent); transform-origin:left; }
  .meter.danger .pip i { background:var(--threat); }

  /* Scène du verdict */
  .stage { position:relative; flex:1 1 300px; min-height:280px; overflow:hidden; background:var(--surface); border-radius:8px; isolation:isolate; }
  .splash { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
  .scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(10,15,22,.92) 0%,rgba(10,15,22,.62) 44%,rgba(10,15,22,.05) 78%), linear-gradient(0deg,rgba(10,15,22,.72),transparent 55%); }
  .stage-body { position:absolute; left:0; bottom:0; display:flex; flex-direction:column; gap:7px; max-width:min(560px,86%); padding:20px 22px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .badge { padding:2px 8px; background:rgba(10,15,22,.72); border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:12.5px; }
  .badge.net { color:var(--accent); border-color:var(--accent); }
  .badge.close { color:var(--gold); border-color:var(--gold); }
  .eyebrowless { color:var(--muted); font-size:13px; }
  .champ-name { font:clamp(34px,3.2vw,50px)/1.02 var(--condensed); letter-spacing:.005em; }
  .alt-line { display:flex; align-items:center; gap:8px; font-size:15px; }
  .alt-line em { color:var(--muted); font-style:normal; }
  .reasons li { font-size:15px; }
  .note { color:var(--muted); font-size:13px; }
  .note b { color:var(--text); font-weight:600; }
  .note .avoid { color:var(--threat); font-weight:600; }
  .note.warn { color:var(--gold); }
  .cta { align-self:flex-start; min-height:40px; margin-top:4px; padding:7px 18px; background:var(--accent); border:0; border-radius:6px; color:var(--accent-ink); font:17px var(--condensed); }
  .cta:hover { filter:brightness(1.1); }
  .cta.done { background:transparent; color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }

  /* Classement du pool */
  .rank-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .rank { display:flex; flex-direction:column; gap:6px; min-width:0; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:6px; text-align:left; transition:border-color .12s, background-color .12s; }
  .rank:hover:not(:disabled) { border-color:var(--muted); background:var(--raised); }
  .rank:disabled { opacity:.45; }
  .rank.first { border-color:var(--accent); }
  .rank.picked { background:var(--raised); box-shadow:inset 0 0 0 2px var(--accent); }
  .rank-top { display:flex; align-items:center; gap:8px; min-width:0; }
  .rank-name { font:16px/1.1 var(--condensed); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-word { font-size:12px; color:var(--muted); white-space:nowrap; }
  .rank-word.good { color:var(--accent); }
  .rank-word.bad { color:var(--threat); }
  .force { height:4px; background:var(--bg); border-radius:1px; overflow:hidden; }
  .force i { display:block; height:100%; background:var(--muted); transform-origin:left; }
  .rank.first .force i { background:var(--accent); }
  .rank-rec { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Colonne de droite */
  .plan-block { flex:none; padding:14px; border-bottom:1px solid var(--line); }
  .plan-row { display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:center; min-height:34px; padding:3px 0; }
  .plan-row > span:first-child { color:var(--muted); font-size:13px; }
  .faces { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .face { display:inline-flex; align-items:center; gap:5px; font-size:13.5px; }
  .ban-row { background:none; }
  .ban-row .face { color:var(--gold); }
  .results { display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-top:8px; }
  .res { min-height:36px; padding:4px 10px; background:var(--raised); border:1px solid var(--line); border-radius:6px; font-size:14px; transition:background-color .12s, border-color .12s; }
  .res:hover:not(:disabled) { border-color:var(--muted); }
  .res:disabled { color:var(--muted); opacity:.5; }
  .res.win.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .res.loss.on { background:var(--threat); border-color:var(--threat); color:#2a0708; font-weight:600; }
  .res.skip.on { border-color:var(--text); }
  .result-note { margin-top:6px; color:var(--muted); font-size:12.5px; }

  .tabs { flex:none; display:flex; gap:0; padding:0 6px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab { position:relative; flex:none; padding:10px 7px; background:none; border:0; color:var(--muted); font-size:13.5px; }
  .tab:hover { color:var(--text); }
  .tab.on { color:var(--text); }
  .tab-line { position:absolute; left:5px; right:5px; bottom:-1px; height:2px; background:var(--accent); }
  .tab-body { flex:1; min-height:0; padding:12px 14px 18px; overflow:auto; }
  .tab-body h3 { margin:12px 0 5px; font:15px var(--condensed); color:var(--muted); }
  .tab-body h3:first-child { margin-top:0; }
  .small { color:var(--muted); font-size:13px; margin:4px 0; }
  .why-name { display:flex; align-items:center; gap:7px; margin-top:10px; font:16px var(--condensed); }
  .why { margin:3px 0 0 33px; font-size:13px; }
  .why .pos { color:var(--text); }
  .why .neg { color:var(--threat); }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .mcard { display:grid; grid-template-columns:32px 1fr; gap:4px 9px; padding:8px 0; border-bottom:1px solid var(--line); }
  .mcard-name { font:16px var(--condensed); }
  .mcard-line { grid-column:2; font-size:13px; color:var(--muted); }
  .mcard-line b { color:var(--text); font-weight:600; }
  .mcard-line .avoid { color:var(--threat); }
  .plain li { margin-bottom:5px; font-size:13px; }
  .plain b { font-weight:600; }
  .legal { margin-top:14px; color:var(--muted); font-size:11.5px; }

  .splash-stack { position:absolute; inset:0; z-index:-2; overflow:hidden; }
  .splash-stack .splash { z-index:auto; }
  .change { position:absolute; top:14px; left:22px; right:22px; z-index:1; max-width:560px; padding:7px 11px; background:rgba(10,15,22,.86); border:1px solid var(--gold); border-radius:4px; font-size:13.5px; }
  .change b { color:var(--gold); font-weight:600; }
  .change span { display:block; color:var(--muted); font-size:12.5px; }
  .reasons { min-height:44px; }
  .stage-notes { min-height:38px; }
  .rank { position:relative; }
  .rank.picked { box-shadow:none; }
  .rank-glow, .rank-ring, .role-flash, .sugg-hl { position:absolute; inset:0; pointer-events:none; }
  .rank-glow { background:var(--accent); border-radius:6px; }
  .rank-ring { border:2px solid var(--accent); border-radius:6px; }
  .role-flash { border-radius:6px; }
  .role-flash.add { background:var(--accent); }
  .role-flash.del { background:var(--threat); }
  .slot-ghost { flex:none; width:clamp(44px,6.6vh,76px); height:clamp(44px,6.6vh,76px); border:1px dashed var(--line); border-radius:6px; pointer-events:none; transition:border-color .12s; }
  .role:hover .slot-ghost, .role.target .slot-ghost { border-color:var(--muted); }
  .role .portrait { transition:transform .15s; }
  .role:hover .portrait { transform:scale(1.04); }
  .sugg { isolation:isolate; }
  .sugg-item { position:relative; }
  .sugg-item.on { background:none; }
  .sugg-hl { z-index:-1; background:var(--line); border-radius:4px; }
  .tab:active, .mini:active { transform:translateY(1px); }
  .mini { transition:color .12s, background-color .12s; }
  .tab { transition:color .12s; }
  /* V2 */
  .hint.done { color:var(--accent); }
  .roles > .role.is-mid { flex-grow:1.3; box-shadow:inset 3px 0 0 var(--accent); }
  .role.is-mid .role-name { font-size:19px; }
  .role-hit:focus-visible { outline-offset:-2px; }
  .who-wrap { padding-right:26px; }
  .role-tools { position:absolute; top:50%; right:6px; transform:translateY(-50%); align-items:center; }
  .to-mid { opacity:0; background:var(--raised); transition:opacity .12s, color .12s, background-color .12s; }
  .role:hover .to-mid, .role:focus-within .to-mid { opacity:1; }
  .to-mid:focus-visible { opacity:1; }
  .assumed { color:var(--gold); font-weight:500; }
  .slot-ghost { display:flex; align-items:center; justify-content:center; color:var(--line); }
  .slot-ghost svg { width:42%; height:42%; }
  .role:hover .slot-ghost, .role.target .slot-ghost { color:var(--muted); }
  .role.target .slot-ghost { border-color:var(--accent); color:var(--accent); }
  .meter { grid-template-columns:96px 1fr 18px; }
  .meter-label { min-width:0; }
  .meter-delta { color:var(--text); font-size:12px; text-align:right; }
  .meter-delta span { display:block; }
  .effects { min-height:36px; margin-top:8px; color:var(--muted); font-size:12.5px; }
  .effects span { display:block; }
  .effects .help { color:var(--accent); }
  .effects .hurt { color:var(--threat); }

  .splash-stack.loading { background:linear-gradient(100deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%); background-size:220% 100%; animation:shimmer 1s linear infinite; }
  .splash-fail { position:absolute; top:12px; right:14px; color:var(--muted); font-size:12.5px; }

  .rank-word.best { display:inline-block; padding:0 6px; background:var(--accent); border-radius:3px; color:var(--accent-ink); font-weight:600; }
  .rank-word.alt { display:inline-block; padding:0 6px; border:1px solid var(--muted); border-radius:3px; color:var(--text); line-height:1.25; }
  .rank-word.other { color:var(--muted); }
  .rank-word.bad { color:var(--threat); }
  .rank.tier-other, .rank.tier-bad { background:transparent; }
  .rank.tier-other .rank-top, .rank.tier-bad .rank-top { opacity:.78; transition:opacity .12s; }
  .rank:hover .rank-top { opacity:1; }
  .rank .portrait { transition:transform .15s; }
  .rank:hover .portrait { transform:scale(1.05); }
  .rank.tier-alt .force i { background:var(--text); }
  .rank.tier-bad .force i { background:var(--threat); }
  .force i { transition:background-color .15s; }
  .chosen { position:absolute; top:6px; right:6px; z-index:1; display:flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--accent); border-radius:50%; color:var(--accent-ink); font-size:12px; font-weight:700; }
  .rank.picked .rank-name { padding-right:18px; }

  .wincon { margin:0 0 8px; padding:9px 11px; background:var(--raised); border-radius:6px; font-size:15px; line-height:1.3; }
  .wincon span { display:block; margin-bottom:2px; color:var(--accent); font:15px var(--condensed); }
  .plan-row.threat > span:first-child { color:var(--threat); }
  .plan-row.threat .portrait { box-shadow:0 0 0 1.5px var(--threat); }
  .plan-row.ban-row > span:first-child { color:var(--gold); }
  .plan-row.ban-row .portrait { box-shadow:0 0 0 1.5px var(--gold); }
  .faces { min-width:0; }
  .plan-block { padding-bottom:12px; }

  .winbars { display:grid; gap:6px; margin-bottom:4px; }
  .winbar { display:grid; grid-template-columns:minmax(0,90px) 1fr auto; align-items:center; gap:8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .winbar-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .winbar-track { height:7px; background:var(--bg); border-radius:1px; overflow:hidden; }
  .winbar-track i { display:block; height:100%; background:var(--accent); transform-origin:left; }
  .winbar.few .winbar-track i { background:var(--muted); }
  .winbar-val { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .history { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; }
  .game { width:13px; height:13px; border-radius:2px; }
  .game.win { background:var(--accent); }
  .game.loss { background:var(--threat); }

  .mobile-bar { display:none; }

  /* V2.1 */
  .note.risk { color:var(--threat); }
  .tab { padding:10px 6px; font-size:13px; }
  .seg-tabs { display:flex; gap:2px; margin-bottom:8px; padding:2px; background:var(--bg); border-radius:6px; }
  .seg-tab { flex:1; min-height:28px; padding:3px 6px; background:none; border:0; border-radius:4px; color:var(--muted); font-size:13px; transition:background-color .12s, color .12s; }
  .seg-tab:hover { color:var(--text); }
  .seg-tab.on { background:var(--raised); color:var(--text); }
  .tips { margin-bottom:8px; }
  .tips li { position:relative; margin-bottom:7px; padding-left:12px; font-size:13.5px; line-height:1.35; }
  .tips li::before { content:""; position:absolute; left:0; top:.5em; width:5px; height:5px; background:var(--accent); border-radius:50%; }
  .matrix { margin:6px 0 10px; font-size:12.5px; }
  .mx-row { display:grid; grid-template-columns:minmax(0,1fr) repeat(var(--n,4),30px); grid-auto-flow:column; grid-auto-columns:30px; align-items:center; min-height:26px; border-bottom:1px solid var(--line); }
  .mx-head { min-height:32px; }
  .mx-row > span:first-child { min-width:0; padding-right:6px; }
  .mx-row > span:not(:first-child) { display:flex; justify-content:center; }
  .mx-cell { font-weight:700; color:var(--muted); }
  .mx-cell.up { color:var(--accent); }
  .mx-cell.down { color:var(--threat); }
  .pick-detail { border-bottom:1px solid var(--line); padding:4px 0 6px; }
  .pick-detail summary { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; font:16px var(--condensed); }
  .pick-detail .why { margin:4px 0 4px 2px; }
  .pick-detail a { color:var(--accent); }
  .cmp-head { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; color:var(--muted); font-size:12px; }
  .cmp-pick { display:flex; gap:2px; }
  .cmp-btn { padding:2px; background:none; border:1px solid transparent; border-radius:6px; opacity:.55; transition:opacity .12s, border-color .12s; }
  .cmp-btn:hover { opacity:1; }
  .cmp-btn.on { border-color:var(--accent); opacity:1; }
  .cmp-title { margin:0 0 2px; font-size:14px; }
  .cmp-row { display:grid; grid-template-columns:minmax(0,1fr) 112px; align-items:center; gap:8px; min-height:22px; font-size:12.5px; }
  .cmp-label { min-width:0; color:var(--muted); }
  .cmp-bars { display:grid; grid-template-columns:1fr 1fr; gap:2px; }

  .cmp-legend { min-height:0; font-size:11.5px; color:var(--muted); }

  /* Panneaux compagnon */
  .panel { display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--surface); border:1px solid #1f4a4a; border-radius:8px; }

  .panel-left .profile { display:block; }
  .panel-left .sec-title.profile { display:flex; }

  .panel-left .roles > .role.is-mid { box-shadow:inset 3px 0 0 var(--accent); }
  .panel-left .effects { margin:8px 0 0; padding:7px 9px; background:var(--bg); border:1px solid #1f4a4a; border-radius:6px; }
  .panel-left .meter { grid-template-columns:minmax(0,84px) 1fr 16px; font-size:12px; }
  .p-scroll, .p-body { flex:1; min-height:0; overflow:auto; }
  .p-body { display:flex; flex-direction:column; gap:9px; padding:10px 12px 12px; }
  .panel-compact .p-body { overflow:visible; flex:none; }
  .p-compact-enemies { padding:10px 12px 0; }
  .compact-roles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; margin:0; }
  .compact-roles .role { flex-direction:column; min-height:84px; padding:4px 1px; gap:2px; text-align:center; }
  .compact-roles .who-wrap { flex:none; flex-direction:column; width:100%; padding:0; gap:2px; }
  .compact-roles .role-who { width:100%; flex:none; }
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { font-size:12px; }
  .compact-roles .role-traits, .compact-roles .to-mid, .compact-roles .role-empty .em { display:none; }
  .compact-roles .role-icon { width:100%; font-size:10px; }
  .compact-roles .role-icon svg { display:none; }
  .compact-roles .role-tools { top:14px; right:0; transform:none; }
  .compact-roles .mini.x { background:rgba(10,15,22,.8); border-radius:3px; color:var(--text); }
  .compact-roles .portrait, .compact-roles .slot-ghost { width:34px !important; height:34px !important; }

  .p-status { display:flex; flex-wrap:wrap; gap:6px; min-height:24px; }
  .p-reco { position:relative; flex:none; height:clamp(120px,19vh,180px); overflow:hidden; background:var(--bg); border:2px solid var(--accent); border-radius:8px; isolation:isolate; }

  .p-reco-scrim { position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(10,15,22,.9),rgba(10,15,22,.25) 75%); }
  .p-reco-text { position:absolute; left:12px; bottom:10px; right:10px; }
  .p-chip { display:inline-block; padding:1px 7px; background:var(--accent); border-radius:3px; color:var(--accent-ink); font-size:12px; font-weight:600; }
  .p-name { font:clamp(26px,9vw,36px)/1.05 var(--condensed); margin-top:3px; }

  .p-alt { flex:none; display:flex; align-items:center; gap:10px; width:100%; padding:6px 10px 6px 6px; background:var(--bg); border:1px solid var(--line); border-radius:6px; text-align:left; font:18px var(--condensed); transition:border-color .12s; }

  .p-actions { position:sticky; bottom:-12px; z-index:3; display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:auto -12px -12px; padding:8px 12px 10px; background:var(--surface); border-top:1px solid var(--line); }
  .p-actions .cta { margin:0; min-height:36px; padding:5px 13px; font-size:15px; }
  .p-empty { color:var(--muted); }
  .settings-back { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(4,8,12,.72); }
  .settings { width:min(520px,100%); max-height:100%; overflow:auto; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .settings .sec-title { align-items:center; }
  .settings h3 { margin:12px 0 5px; color:var(--muted); font:15px var(--condensed); }
  .set-row { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .set-check, .set-line { display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:13.5px; }
  .settings select { padding:3px 6px; background:var(--bg); border:1px solid var(--line); border-radius:4px; }
  @keyframes shimmer { from { background-position:120% 0; } to { background-position:-120% 0; } }

  /* V2.7 : textes longs. Un mot sans espace se coupe au lieu de sortir de son conteneur. */
  .p-reasons li, .reasons li, .p-win p, .p-threat p, .p-change, .note, .small, .tips li, .wincon, .effects, .why li, .plain li, .p-empty, .hint, .result-note, td { overflow-wrap:anywhere; }
  .p-name, .champ-name, .p-threat-who, .face, .p-alt-text { min-width:0; overflow-wrap:anywhere; }
  .p-name.long { font-size:21px; line-height:1.1; }
  .champ-name.long { font-size:clamp(26px,2.4vw,36px); line-height:1.08; }
  .cta { max-width:100%; }
  .settings input[type=file] { max-width:100%; }
  .set-check { align-items:flex-start; }
  .set-check input { flex:none; margin-top:3px; }
  .p-ban-row { flex-wrap:wrap; }
  /* Dans le petit bandeau du verdict, ce message passerait sur le nom : l'absence d'image se voit déjà. */
  .p-reco .splash-fail { display:none; }
  .results { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .res { min-width:0; padding-left:4px; padding-right:4px; }

  .col-mid .stage { flex:1 0 auto; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; }
  .stage-body { position:relative; left:auto; bottom:auto; }
  /* Le bandeau de changement reste dans le flux : long ou court, il ne couvre jamais le verdict. */
  .change { position:relative; top:auto; left:auto; right:auto; flex:none; margin:14px 22px auto; align-self:flex-start; }
  .stage:has(.change) .splash-fail { display:none; }
  .cmp-head { flex-wrap:wrap; justify-content:center; }
  /* Boutons très rapprochés : le contour de focus reste à l'intérieur pour ne pas toucher le voisin. */
  .p-btn:focus-visible, .mini:focus-visible, .cmp-btn:focus-visible, .seg-tab:focus-visible, .tab:focus-visible, .res:focus-visible { outline-offset:-2px; }
  .pick-detail a { display:inline-block; padding:5px 0; }
  .settings input[type=file] { min-height:28px; }
  /* Réglages : l'essentiel d'abord, et une ligne d'aide sous les options qui en ont besoin. */
  .settings h3 { color:var(--text); }
  .set-card { margin-bottom:8px; padding:9px 11px; background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  .set-card.on { border-color:#1f4a4a; }
  .set-main { margin-bottom:3px; font-size:14.5px; font-weight:600; }
  .set-hint { margin:0 0 6px 21px; color:var(--muted); font-size:12.5px; line-height:1.3; }

  .role-pick { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .role-pick .on { border-color:var(--accent); color:var(--accent); }
  .pool-list { display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px; }
  .pool-chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; min-height:30px; padding:2px 8px 2px 3px; background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13px; }

  .pool-chip.on { border-color:#1f4a4a; }
  .pool-chip b { color:var(--muted); font-weight:400; }
  .pool-search { width:100%; height:34px; margin-bottom:6px; padding:0 10px; background:var(--surface); border:1px solid var(--line); border-radius:6px; color:var(--text); font-size:13.5px; }
  .lcu-state { display:flex; align-items:center; gap:7px; margin:0 0 6px 21px; font-size:13px; font-weight:600; }
  .lcu-state i { flex:none; width:8px; height:8px; background:currentColor; border-radius:50%; }
  .lcu-state.good { color:var(--accent); }
  .lcu-state.wait { color:var(--gold); }
  .lcu-state.bad { color:var(--threat); }
  .lcu-state.idle { color:var(--muted); }
  .data-list { margin:8px 0 0; padding:0; list-style:none; }
  .data-list li { margin-bottom:9px; font-size:13px; }
  .data-list li.off > b { color:var(--muted); }
  .data-list p { margin:2px 0 0; color:var(--muted); font-size:12.5px; line-height:1.3; overflow-wrap:anywhere; }
  .data-kind { color:var(--muted); font-size:12px; }
  .data-old { color:var(--gold); font-size:12px; }
  .set-more { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
  .set-more summary { min-height:24px; color:var(--muted); font-size:13.5px; cursor:pointer; }
  .set-more p, .set-more .set-check { margin-top:6px; }

  /* Le panneau gauche défile au lieu de comprimer son contenu quand la hauteur manque. */
  .panel .col-left { overflow:auto; }
  .panel-left .col-left > * { flex-shrink:0; }
  .tab { padding-left:5px; padding-right:5px; }
  .panel-left .meter { grid-template-columns:96px minmax(0,1fr) 16px; }
  .who-wrap, .panel-left .who-wrap { padding-right:32px; }

  /* Noms entiers en mode compact, sur deux lignes si nécessaire. */
  .compact-roles .role-name, .compact-roles .role.is-mid .role-name { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:normal; overflow-wrap:anywhere; font-size:11.5px; line-height:1.12; }
  .compact-roles .mini.x { min-width:24px; height:24px; }
  .compact-roles .role-tools { top:12px; right:-2px; }
  .panel-compact .p-actions { bottom:0; }

  /* Panneaux étroits : 125 % d'affichage Windows réduit 320 pixels physiques à 256 pixels d'interface. */

  @media (max-height:800px) and (min-width:1101px) {

  @media (max-width:1100px) {
    .app { height:auto; min-height:100vh; }
    .top { position:sticky; top:0; z-index:30; }
    .desk { grid-template-columns:minmax(280px,340px) minmax(0,1fr); }
    .col-left { border-right:1px solid var(--line); overflow:visible; }
    .col-mid { overflow:visible; }
    .stage { flex:none; height:auto; min-height:380px; display:flex; align-items:flex-end; }
    .stage-body { position:relative; left:auto; bottom:auto; padding-top:84px; }
    .col-right { grid-column:1 / -1; border-left:0; border-top:1px solid var(--line); overflow:visible; }
    .rank-list { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tab-body { overflow:visible; }
    .role .portrait, .slot-ghost { width:44px !important; height:44px !important; }
    .col-right { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto 1fr; align-items:start; }
    .plan-block { grid-row:1 / span 2; border-bottom:0; border-right:1px solid var(--line); height:100%; }
  }
  @media (max-width:720px) {
    .desk { display:block; }
    .app { padding-bottom:64px; }
    .col-right { display:flex; }
    .plan-block { border-right:0; border-bottom:1px solid var(--line); height:auto; }
    .stage .cta { display:none; }
    .mobile-bar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--surface); border-top:1px solid var(--line); }
    .mobile-name { display:flex; align-items:center; gap:8px; min-width:0; font:18px var(--condensed); }

    .col-left { border-right:0; }
    .col-mid { padding:12px; }
    .roles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
    .role .portrait, .slot-ghost { width:44px !important; height:44px !important; }
    .change { left:12px; right:12px; }

    .who-wrap { flex:none; flex-direction:column; width:100%; gap:3px; }

    .profile { display:none; }
    .col-left { padding-bottom:6px; }
    .roles { margin-bottom:6px; }
    .role-name { font-size:13px; }
    .role-traits { display:none; }
    .role-empty { font-size:11px; }

    .mini.x { min-width:24px; height:24px; }
    .stage { height:auto; min-height:320px; display:flex; align-items:flex-end; }
    .stage-body { position:relative; left:auto; bottom:auto; padding-top:84px; }
    .stage-body { max-width:100%; padding:14px; }

    .plan-row { grid-template-columns:62px 1fr; }
  }

<script src="draft-champion-ids.js"></script>
<script>
if (!window.React || !window.ReactDOM || !window.Motion || !window.htm || typeof analyze === "undefined") {
  document.getElementById("root").innerHTML = '<p style="padding:24px;max-width:60ch">DraftMid ne peut pas démarrer : le dossier <b>draft-vendor</b> ou le fichier <b>draft-engine.js</b> est introuvable. Replace-les à côté de ce fichier, puis recharge la page.</p>';
  throw new Error("fichiers de DraftMid introuvables");
}
const state = { enemies: [], manualMid: null, held: null, shown: null, clear: true, current: null, boardKey: null };

function matchByKeys(names, keysOf, query) {
  const q = norm(query);
  if (!q) return [];
  const starts = names.filter(n => keysOf(n).some(k => k.startsWith(q)));
  const contains = names.filter(n => !starts.includes(n) && keysOf(n).some(k => k.includes(q)));
  return starts.concat(contains);
}

const suggest = query => matchByKeys(NAMES.filter(n => !state.enemies.includes(n)), champKeys, query).slice(0, 6);

function currentMid() {
  if (state.manualMid && state.enemies.includes(state.manualMid)) return state.manualMid;
  return identifiedOpponent(state.enemies, state.roleOf);
}

// Statistiques personnelles, importées par draft-import-stats.bat (facultatif)
const STATS = window.DRAFT_STATS || null;
const RAW_NAMES = Object.assign(Object.fromEntries(NAMES.map(n => [norm(n), n])), { monkeyking:"Wukong", renata:"Renata Glasc" });
const toName = raw => RAW_NAMES[norm(raw || "")] || raw || "";
const STAT_ROWS = STATS && Array.isArray(STATS.rows)
  ? STATS.rows.map(r => Object.assign({}, r, { champ: toName(r.champ), mid: toName(r.mid) }))
  : [];
const MAIN_ACCOUNT = STATS && STATS.accounts && STATS.accounts[0];
// Personnalisation future : ces bilans restent affichés, sans modifier le score, tant qu'un test prudent ne justifie pas de les y intégrer.
const EVOLUTION_STEP = 20;
const inPool = name => PICKS.map(label).includes(name);
const SHRINK_K = 50;
const MIN_GAMES = 10;

function record(rows) {
  const wins = rows.filter(r => r.win).length;
  return { wins, losses: rows.length - wins, games: rows.length };
}
const fmtRecord = rec => `${rec.wins}V ${rec.losses}D`;
const pct = rec => rec.games ? `${Math.round(100 * rec.wins / rec.games)} %` : "-";

// Ramène un petit bilan vers le winrate du champion, pour éviter de surestimer quelques parties.
function shrunkRate(rec, base) {
  return (rec.wins + SHRINK_K * base) / (rec.games + SHRINK_K);
}

function matchupWord(rec, base) {
  if (rec.games < MIN_GAMES) return "pas assez de parties";
  const gap = shrunkRate(rec, base) - base;
  if (Math.abs(gap) < 0.03) return "pas de préférence";
  return gap > 0 ? "léger avantage" : "léger désavantage";
}

function personalLine(pick, mid) {
  if (!STAT_ROWS.length) return "";
  const rows = STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === label(pick));
  const all = record(rows);
  if (!all.games) return `aucune partie sur ${label(pick)}`;
  const base = fmtRecord(all);
  if (!mid) return base;
  const vs = record(rows.filter(r => r.mid === mid));
  if (!vs.games) return `${base}, jamais contre ${mid}`;
  return `${base}, contre ${mid} ${fmtRecord(vs)} : ${matchupWord(vs, all.wins / all.games)}`;
}


const JOURNAL_KEY = "draftJournal";

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || []; } catch (e) { return []; }
}

function saveJournal(list) {
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(list)); } catch (e) {}
}

function updateEntry(id, change) {
  const list = loadJournal();
  const entry = list.find(x => x.id === id);
  if (entry) { Object.assign(entry, change); saveJournal(list); }
}

function syncCurrentEntry() {
  if (state.current) updateEntry(state.current, { enemies: state.enemies.slice(), mid: currentMid() });
}


// ---------- Actions ----------
let rerender = () => {};
let V = null;
const REQUIRED_ROLES = ["top", "jungle", "mid", "adc", "support"];
const ROLE_LABEL = { top:"Top", jungle:"Jungle", mid:"Mid", adc:"ADC", support:"Support" };

function roleHints(name) {
  const shares = roleShares(name);
  const others = ROLE_ORDER.filter(role => role !== myRole());
  if (!shares) return others;
  return others.sort((a, b) => shares[ROLE_ORDER.indexOf(b)] - shares[ROLE_ORDER.indexOf(a)]);
}

// Les rôles servent à l'affichage ; seul le mid influence le calcul, comme avant.
function deriveSlots() {
  const slots = {};
  const mid = currentMid();
  if (mid) slots[myRole()] = mid;
  // Sans adversaire identifié, le candidat le plus plausible se place en dernier : s'il faut remplir la ligne, c'est lui qu'elle montre.
  const plausible = mid ? [] : opponentBelief(state.enemies, state.roleOf).candidates.map(c => c.name).reverse();
  const others = (mid ? state.enemies : plausible).filter(n => n !== mid);
  others.filter(n => state.roleOf[n] && state.roleOf[n] !== myRole()).forEach(n => { if (!slots[state.roleOf[n]]) slots[state.roleOf[n]] = n; });
  others.filter(n => !Object.values(slots).includes(n)).forEach(n => {
    const role = roleHints(n).find(r => !slots[r]) || REQUIRED_ROLES.find(r => !slots[r]);
    slots[role] = n;
  });
  return slots;
}

function describeChange(prev, shown, heldEntry, ranking) {
  if (!prev || !prev.n || !prev.shown || prev.shown === shown || !state.lastAction) return null;
  const oldNow = ranking.find(p => p.pick === prev.shown);
  const oldBefore = prev.order.find(p => p.pick === prev.shown);
  const newBefore = prev.order.find(p => p.pick === shown);
  const seen = (entry, w) => entry && entry.why.some(x => x.text === w.text);
  const loss = oldNow && oldNow.why.find(w => w.v < 0 && !seen(oldBefore, w));
  const gain = heldEntry.why.find(w => w.v > 0 && !seen(newBefore, w));
  const reason = !oldNow ? `${label(prev.shown)} est pris en face` : (loss || gain || {}).text || "";
  // Sans nouvelle raison, ce n'est pas ce champion qui a tout changé : l'écart existait déjà.
  if (!reason && state.enemies.length >= 5) return { id: Date.now(), trigger: "Draft complète", from: label(prev.shown), to: label(shown), reason: "Il menait déjà de peu : le nom attendait la fin de la draft pour changer." };
  return { id: Date.now(), trigger: state.lastAction, from: label(prev.shown), to: label(shown), reason };
}

function computeVerdict() {
  const prevV = V;
  const action = state.lastAction;
  if (!state.enemies.length) state.held = null;
  const n = state.enemies.length;
  const mid = currentMid();
  const manual = !!state.manualMid && state.enemies.includes(state.manualMid);
  const belief = manual ? null : opponentBelief(state.enemies, state.roleOf);
  const scenarios = belief && n ? beliefScenarios(belief) : null;
  const res = analyze(state.enemies, mid, PREFS.assumeFront, scenarios);
  if (!res.ranking.length) {
    state.held = null;
    state.shown = null;
    V = { n, mid, res, none:true, order:[], avoided:[], reasons:[], bans:suggestBans() };
    return;
  }
  // Draft complète : le classement fait foi, quel que soit l'ordre de saisie. Le maintien évite seulement de clignoter en cours de draft.
  state.held = !n ? null : n >= 5 ? res.ranking[0].pick : holdPick(res.ranking, state.held);
  const shown = state.held || res.ranking[0].pick;
  const heldEntry = res.ranking.find(p => p.pick === shown);
  const m = matchupOf(mid);
  const available = availablePicks(state.enemies);
  const avoided = m ? avoidedPicks(m).filter(p => available.includes(p) && p !== shown) : [];
  const others = res.ranking.filter(p => p.pick !== shown);
  const rival = others.find(p => !avoided.includes(p.pick)) || others[0];
  const clear = !n || !rival || heldEntry.score - rival.score >= HOLD_GAP;
  state.shown = shown;
  state.clear = clear;
  const without = n && PREFS.assumeFront ? analyze(state.enemies, mid, false).ranking[0] : null;
  const order = [heldEntry].concat(rival ? [rival] : [], others.filter(p => p !== rival));
  V = {
    n, mid, res, shown, rival, clear, avoided, order,
    reasons: positiveReasons(heldEntry),
    risk: mainRisk(heldEntry),
    midAlt: belief ? midSwapEffect(state.enemies, mid, shown, PREFS.assumeFront, belief.candidates.filter(c => c.p >= SCENARIO_MIN).map(c => c.name)) : null,
    belief, confidence: belief ? belief.confidence : null,
    hypothesis: belief && n ? beliefHypothesis(belief, mid) : null,
    provisional: !!belief && n > 0 && (belief.confidence === "faible" || !!(scenarios && scenarios.length > 1 && scenarios.some(sc => analyze(state.enemies, sc.mid, PREFS.assumeFront).ranking[0].pick !== res.ranking[0].pick))),
    personal: personalLine(shown, mid),
    without: without && without.pick !== shown ? without.pick : null,
    bans: suggestBans(),
    change: action ? describeChange(prevV, shown, heldEntry, res.ranking) : null
  };
  state.lastAction = null;
}

function commit() {
  const action = state.lastAction;
  computeVerdict();
  syncCurrentEntry();
  publish(action);
}

// ---------- Synchronisation entre panneaux et préférences ----------
const PANEL = new URLSearchParams(location.search).get("panel") || "";
const IS_HOST = !!(window.chrome && window.chrome.webview);
const hostSend = msg => { if (IS_HOST) window.chrome.webview.postMessage(msg); };
const PREFS_KEY = "draftPrefs";
const PREFS = Object.assign({ excluded:[], favorite:null, assumeFront:true }, (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } })());
ENGINE_PREFS.excluded = PREFS.excluded;
ENGINE_PREFS.favorite = PREFS.favorite;
const hostState = { available:false, autostart:false, follow:true, autoDraft:true, topmost:false, compact:false, placement:"", phase:"", hotkey:false, diagnostics:false };
const SHARED = ["enemies", "manualMid", "held", "current", "roleOf", "targetRole", "selected", "notice", "sessionActive"];
let channel = null;
try { channel = new BroadcastChannel("draftmid"); } catch (e) {}

function publish(action) {
  rerender();
  if (!channel) return;
  const snapshot = { kind:"state", action: action || null, prefs: PREFS, profile: PROFILE };
  SHARED.forEach(k => { snapshot[k] = state[k]; });
  channel.postMessage(snapshot);
}

function savePrefs(change) {
  Object.assign(PREFS, change);
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {}
  ENGINE_PREFS.excluded = PREFS.excluded;
  ENGINE_PREFS.favorite = PREFS.favorite;
  commit();
}

if (channel) channel.onmessage = e => {
  const m = e.data;
  if (m.kind === "hello") { publish(null); return; }
  if (m.kind !== "state") return;
  SHARED.forEach(k => { state[k] = m[k]; });
  if (m.profile) applyProfile(m.profile);
  if (m.prefs) { Object.assign(PREFS, m.prefs); ENGINE_PREFS.excluded = PREFS.excluded; ENGINE_PREFS.favorite = PREFS.favorite; }
  state.lastAction = m.action;
  computeVerdict();
  rerender();
};

// Les événements simulés passent par les mêmes opérations que la saisie.
const draftApi = {
  reset() { resetDraft(); },
  setActive(v) { state.sessionActive = v; state.notice = v ? "Sélection en cours" : "Sélection terminée"; publish(null); },
  add(champion, role) {
    if (role) state.targetRole = role;
    addEnemy(champion);
  },
  remove(champion) { removeEnemy(champion); },
  replace(from, to) {
    const i = state.enemies.indexOf(from);
    if (i < 0 || state.enemies.includes(to)) return;
    const role = state.roleOf[from];
    state.enemies[i] = to;
    delete state.roleOf[from];
    if (role) state.roleOf[to] = role;
    if (state.manualMid === from) state.manualMid = to;
    state.lastAction = `${from} remplacé par ${to}`;
    state.notice = state.lastAction;
    commit();
  },
  setRole(champion, role) {
    if (!state.enemies.includes(champion)) return;
    if (role === myRole()) { setMid(champion); return; }
    if (state.manualMid === champion) state.manualMid = null;
    state.roleOf[champion] = role;
    state.notice = `${champion} : ${ROLE_LABEL[role] || role}`;
    commit();
  }
};
const dispatchDraft = ev => applyDraftEvent(ev, draftApi);
const riotProvider = new RiotDraftProvider(dispatchDraft);
function applyDetected(ids) {
  riotProvider.update(ids.map(id => toName(CHAMPION_IDS[id])).filter(n => ROSTER[n] !== undefined));
}
let demoProvider = null;
function runDemo(stepMs) {
  if (demoProvider) demoProvider.stop();
  demoProvider = new MockDraftProvider(dispatchDraft, DEMO_SCRIPT, stepMs || 900);
  demoProvider.start();
}

// Jamais de focus pendant que l'utilisateur est ailleurs : une lecture du client ne doit rien interrompre.
const focusAdd = () => { const el = document.getElementById("add"); if (el && state.enemies.length < 5 && document.hasFocus()) el.focus(); };

function addEnemy(name) {
  if (!name || state.enemies.includes(name) || state.enemies.length >= 5) return;
  state.enemies.push(name);
  state.lastAction = `Ajout de ${name}`;
  state.notice = state.lastAction;
  if (state.targetRole) {
    if (state.targetRole === myRole()) state.manualMid = name;
    else state.roleOf[name] = state.targetRole;
    state.targetRole = null;
  }
  commit();
}

function removeEnemy(name) {
  state.enemies = state.enemies.filter(n => n !== name);
  delete state.roleOf[name];
  if (state.manualMid === name) state.manualMid = null;
  state.lastAction = `Retrait de ${name}`;
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function resetDraft() {
  state.enemies = [];
  state.manualMid = null;
  state.held = null;
  state.current = null;
  state.roleOf = {};
  state.targetRole = null;
  state.selected = null;
  state.notice = null;
  commit();
  focusAdd();
}

function setMid(name) {
  const old = currentMid();
  if (old && old !== name && state.roleOf[name]) state.roleOf[old] = state.roleOf[name];
  delete state.roleOf[name];
  state.manualMid = name;
  state.selected = null;
  state.targetRole = null;
  state.lastAction = `${name} ${oppAt()}`;
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function clickRole(role) {
  const slots = deriveSlots();
  const occupant = slots[role];
  const picked = state.selected;
  if (picked && picked !== occupant) {
    const from = Object.keys(slots).find(r => slots[r] === picked);
    if (role === myRole()) { setMid(picked); return; }
    if (occupant) state.roleOf[occupant] = from === myRole() ? role : from;
    if (from === myRole()) { state.manualMid = occupant || null; if (occupant) delete state.roleOf[occupant]; }
    state.roleOf[picked] = role;
    state.selected = null;
    state.notice = `${picked} : ${ROLE_LABEL[role]}`;
    commit();
    return;
  }
  if (occupant) {
    state.selected = picked === occupant ? null : occupant;
    state.targetRole = null;
  } else {
    state.targetRole = state.targetRole === role ? null : role;
  }
  publish(null);
  if (state.targetRole) focusAdd();
}

const LEFT_ORDER = ["top", "jungle", "mid", "adc", "support"];

function choosePick(pick) {
  if (state.current) {
    updateEntry(state.current, { picked: pick });
  } else {
    const entry = { id: Date.now(), date: new Date().toISOString(), suggested: state.shown, close: !state.clear, picked: pick, enemies: state.enemies.slice(), mid: currentMid(), result: null, engine: ENGINE_VERSION };
    const list = loadJournal();
    list.push(entry);
    saveJournal(list);
    state.current = entry.id;
  }
  publish(null);
}

function setResult(id, result) {
  updateEntry(id, { result });
  publish(null);
}

function exportJournal() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(loadJournal(), null, 2)], { type:"application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "draft-journal.json";
  a.click();
  URL.revokeObjectURL(url);
}

function searchMatchups(query) {
  const byName = Object.fromEntries(MATCHUPS.map(m => [m.n, m]));
  return matchByKeys(MATCHUPS.map(m => m.n), n => [byName[n].n].concat(byName[n].a || []).map(norm), query).map(n => byName[n]);
}

function optionsFor(m) {
  const available = availablePicks([m.n]);
  const avoid = avoidedPicks(m);
  // Les notes viennent des vrais bilans quand ils existent, sinon du tableau : tri stable, donc le 1er choix écrit reste devant à égalité.
  const written = [m.first, m.second, ...PICKS].filter((p, i, all) => PICKS.includes(p) && all.indexOf(p) === i);
  const note = p => (RULES.matchup(p, null, { mid: m.n }) || [0])[0];
  const ranked = written.filter(p => available.includes(p) && !avoid.includes(p)).sort((a, b) => note(b) - note(a));
  return ranked.concat(written.filter(p => available.includes(p) && avoid.includes(p))).slice(0, 2);
}

function groupRows(rows, keyOf) {
  const map = new Map();
  rows.forEach(r => { const k = keyOf(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return [...map].map(([name, list]) => ({ name, rows: list })).sort((a, b) => b.rows.length - a.rows.length);
}
const POSITIONS = { TOP:"Top", JUNGLE:"Jungle", MIDDLE:"Mid", BOTTOM:"ADC", UTILITY:"Support" };

// ---------- Portraits officiels (Data Dragon) ----------
const DD_FALLBACK = "16.21.1";
let ddVersion = DD_FALLBACK;
const DD_IDS = { "Wukong":"MonkeyKing", "Cho'Gath":"Chogath", "Kai'Sa":"Kaisa", "Kha'Zix":"Khazix", "Vel'Koz":"Velkoz", "Bel'Veth":"Belveth", "LeBlanc":"Leblanc", "Renata Glasc":"Renata" };
const ddId = name => DD_IDS[name] || name.replace(/[^A-Za-z0-9]/g, "");
const iconUrl = name => `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/champion/${ddId(name)}.png`;
const splashUrl = name => `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${ddId(name)}_0.jpg`;

// ---------- Interface ----------
const { useState, useEffect, useReducer, useRef, useCallback } = React;
const { motion, LayoutGroup, MotionConfig } = Motion;
const html = htm.bind(React.createElement);
const SNAP = { type:"spring", stiffness:520, damping:42, mass:.7 };
const QUICK = { duration:.18, ease:[.2,.8,.2,1] };
const ARRIVE = { duration:.26, ease:[.2,.8,.2,1] };
const UNDER_MS = 450;

function Portrait({ name, size = 40 }) {
  const [done, setDone] = useState({});
  const status = done[name] || "loading";
  const cls = `portrait${status === "loading" ? " loading" : ""}`;
  return html`<span className=${cls} style=${{ width:size, height:size }}>
    ${status !== "error" ? html`<img key=${name} src=${iconUrl(name)} alt="" className=${status === "ready" ? "ready" : ""} onLoad=${() => setDone({ [name]:"ready" })} onError=${() => setDone({ [name]:"error" })} />` : null}
    ${status === "error" ? html`<span className="init" aria-hidden="true">${name.slice(0, 2)}</span>` : null}
  </span>`;
}

const ROLE_PATHS = {
  top: "M3 3h14v4H7v10H3z M11 11h6v6h-6z",
  jungle: "M10 2c1 5 5 6 5 11a5 5 0 0 1-10 0c0-5 4-6 5-11z",
  mid: "M3 17 15 3h2v2L5 17z M3 3h6v3H6v3H3z M17 17h-6v-3h3v-3h3z",
  adc: "M17 17H3v-4h10V3h4z M3 3h6v6H3z",
  support: "M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z"
};
const RoleIcon = ({ role }) => html`<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d=${ROLE_PATHS[role]} /></svg>`;

function traitsOf(name) {
  const t = ROSTER[name] || "";
  if (t === "?") return "Profil inconnu";
  const words = [];
  if (t.includes("t")) words.push("Tank");
  if (t.includes("b")) words.push("Bruiser");
  if (t.includes("s")) words.push("Carry");
  if (t.includes("a")) words.push("Plongeur");
  if (t.includes("c")) words.push("Contrôle");
  if (t.includes("e")) words.push("Engage");
  return words.join(", ") || "Soutien";
}

function SearchBox() {
  const [value, setValue] = useState("");
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const full = state.enemies.length >= 5;
  const list = open ? suggest(value) : [];
  const confirm = name => { addEnemy(name); setValue(""); setSel(0); setTimeout(focusAdd, 0); };
  const onKey = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!list.length) return;
      e.preventDefault();
      setSel(s => (s + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (list.length) confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Tab" && !e.shiftKey && list.length) {
      e.preventDefault();
      confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Backspace" && !value && state.enemies.length) {
      removeEnemy(state.enemies[state.enemies.length - 1]);
    } else if (e.key === "Escape" && value) {
      e.stopPropagation();
      setValue("");
    }
  };
  const target = state.targetRole ? `Prochain champion : ${ROLE_LABEL[state.targetRole]}` : "";
  return html`<div className="search">
    <input id="add" type="search" value=${value} disabled=${full} autoComplete="off" spellCheck="false"
      aria-label="Ajouter un champion adverse"
      placeholder=${full ? "Draft complète" : (target || "Ajouter un adversaire : ahri, tf, kata...")}
      onChange=${e => { setValue(e.target.value); setSel(0); setOpen(true); }}
      onFocus=${() => setOpen(true)} onBlur=${() => setOpen(false)} onKeyDown=${onKey} />
    ${open && value.trim() ? html`<div className="sugg" role="listbox">
      ${list.length ? list.map((n, i) => html`<button key=${n} type="button" role="option" aria-selected=${i === sel} className=${`sugg-item${i === sel ? " on" : ""}`}
          onMouseDown=${e => { e.preventDefault(); confirm(n); }}>
          ${i === sel ? html`<${motion.span} layoutId="sugg-hl" className="sugg-hl" transition=${SNAP} />` : null}
          <${Portrait} name=${n} size=${28} /> ${n}
        </button>`) : html`<div className="sugg-empty">Aucun champion ne correspond à « ${value} ».</div>`}
    </div>` : null}
  </div>`;
}

// Relevé de validation : ce qui était affiché à la fin de la sélection. Local, sans joueur, seulement si le diagnostic est activé.
function sendValidationRow() {
  if (!hostState.diagnostics || !state.enemies.length || !V || V.none) return;
  const manual = state.manualMid && state.enemies.includes(state.manualMid);
  const corrections = (manual ? [`${state.manualMid}=${myRole()}`] : []).concat(Object.keys(state.roleOf || {}).filter(n => state.enemies.includes(n)).map(n => `${n}=${state.roleOf[n]}`));
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  hostSend({ cmd:"logDraft", row:[
    myRole(), PICKS.map(label).join(","), state.enemies.join(","), V.mid || "", manual ? "manuel" : V.confidence || "",
    V.hypothesis ? V.hypothesis.others.join(",") : "", label(V.shown), V.rival ? label(V.rival.pick) : "", V.provisional ? "oui" : "non",
    corrections.join(","), entry && entry.picked ? label(entry.picked) : ""
  ] });
}

const CONFIDENCE_WORD = { "élevée":"très probable", moyenne:"probable", faible:"non identifié" };

// Les hypothèses restent courtes, sans pourcentage : la qualité des données ne permet pas mieux.
function hypothesisText() {
  const h = V.hypothesis;
  if (!h) return "";
  if (!h.main) return `${oppName()} non identifié${h.others.length ? ` : ${h.others.join(" ou ")}` : ""}.`;
  return `${oppName()} supposé : ${h.main}${h.others.length ? `, sinon ${h.others.join(" ou ")}` : ""}.`;
}

function RoleRow({ role, name, assumed }) {
  const isMid = role === myRole();
  const previous = useRef(name);
  const [flash, setFlash] = useState(null);
  useEffect(() => {
    if (previous.current !== name) setFlash({ id: Date.now(), kind: name ? "add" : "del" });
    previous.current = name;
  }, [name]);
  const cls = `role${isMid ? " is-mid" : ""}${state.targetRole === role || (name && state.selected === name) ? " target" : ""}`;
  const label = name
    ? `${ROLE_LABEL[role]} : ${name}. ${state.selected && state.selected !== name ? `Échanger avec ${state.selected}` : "Sélectionner pour changer de rôle"}`
    : `${ROLE_LABEL[role]} vide. ${state.selected ? `Y placer ${state.selected}` : "Choisir ce rôle pour le prochain champion"}`;
  return html`<div className=${cls}>
    <button type="button" className="role-hit" aria-label=${label} aria-pressed=${state.targetRole === role || (!!name && state.selected === name)} onClick=${() => clickRole(role)}></button>
    ${flash ? html`<${motion.span} key=${flash.id} className=${`role-flash ${flash.kind}`} aria-hidden="true" initial=${{ opacity:.45 }} animate=${{ opacity:0 }} transition=${{ duration:.35 }} />` : null}
    <span className="role-icon"><${RoleIcon} role=${role} />${ROLE_LABEL[role]}</span>
    ${name ? html`<${motion.span} key=${name} layoutId=${`who-${name}`} initial=${{ scale:.86, opacity:.4 }} animate=${{ scale:1, opacity:1 }} transition=${SNAP} className="who-wrap">
        <${Portrait} name=${name} size=${44} />
        <span className="role-who">
          <span className="role-name" title=${name}>${name}</span>
          <span className="role-traits" title=${traitsOf(name)}>${isMid && assumed ? html`<b className="assumed">${oppName()} ${CONFIDENCE_WORD[V.confidence] || "probable"}</b> ` : ""}${traitsOf(name)}</span>
        </span>
      <//>
      <span className="role-tools">
        ${!isMid ? html`<button type="button" className="mini to-mid" aria-label=${`Placer ${name} ${oppAt()}`} onClick=${() => setMid(name)}>${oppName()}</button>` : null}
        <button type="button" className="mini x" aria-label=${`Retirer ${name}`} onClick=${() => removeEnemy(name)}>×</button>
      </span>`
    : html`<span className="slot-ghost" aria-hidden="true"><${RoleIcon} role=${role} /></span><span className="role-empty">${state.targetRole === role ? "Tape son nom" : html`Ajouter<span className="em">${role === "adc" ? " l'ADC" : ` le ${ROLE_LABEL[role]}`}</span>`}</span>`}
  </div>`;
}

function Meter({ label, count, danger }) {
  const before = useRef(count);
  const [delta, setDelta] = useState(null);
  useEffect(() => {
    if (before.current !== count) setDelta({ id: Date.now(), value: count - before.current });
    before.current = count;
  }, [count]);
  return html`<div className=${`meter${danger && count >= 2 ? " danger" : ""}`}>
    <${motion.span} key=${count} className="meter-label" initial=${count ? { color: danger ? "#f2777a" : "#3fd8c6" } : false} animate=${{ color:"#93a3b6" }} transition=${{ duration:.35 }}>${label}<//>
    <span className="pips" role="img" aria-label=${`${label} : ${count} sur 5`}>
      ${[0, 1, 2, 3, 4].map(i => html`<span key=${i} className="pip"><${motion.i} initial=${false} animate=${{ scaleX: i < count ? 1 : 0 }} transition=${{ ...QUICK, delay: i * .025 }} /></span>`)}
    </span>
    <span className="meter-delta" aria-hidden="true">${delta ? html`<${motion.span} key=${delta.id} initial=${{ opacity:1, y:0 }} animate=${{ opacity:0, y:-5 }} transition=${{ duration:.3, delay:.45 }}>${delta.value > 0 ? "+" : ""}${delta.value}<//>` : null}</span>
  </div>`;
}

function DraftEffects() {
  if (!V.n) return html`<p className="effects">Le profil se remplit à chaque adversaire ajouté.</p>`;
  const { strong, weak } = compoReading(V.res.counts);
  const key = strong.join() + "|" + weak.join();
  return html`<${motion.p} key=${key} className="effects" initial=${{ opacity:.4 }} animate=${{ opacity:1 }} transition=${QUICK}>
    ${strong.length ? html`<span className="hurt">Leurs forces : ${strong.join(", ")}</span>` : null}
    ${weak.length ? html`<span className="help">Leurs failles : ${weak.join(", ")}</span>` : null}
    ${!strong.length && !weak.length ? "Pas de profil marqué pour l'instant." : null}
  <//>`;
}

function EnemyPanel() {
  const slots = deriveSlots();
  const c = V.res.counts;
  const warn = V.n && !V.mid;
  return html`<aside className="col col-left" aria-label="Composition adverse">

    <${motion.p} key=${(warn ? "w" : "") + (state.selected || "") + (state.notice || "")} className=${`hint${warn ? " warn" : ""}${state.notice && !warn && !state.selected ? " done" : ""}`} initial=${{ opacity:.4, y:3 }} animate=${{ opacity:1, y:0 }} transition=${QUICK}>${warn ? (V.hypothesis && V.hypothesis.others.length ? `${hypothesisText()} Corrige si tu sais.` : `${oppName()} inconnu : place le bon champion ${oppAt()}.`) : state.selected ? `${state.selected} sélectionné : clique sur un autre rôle.` : state.notice || "Entrée ajoute, Échap efface."}<//>

function preloadSplash(name) { const img = new Image(); img.src = splashUrl(name); }

function SplashStack({ name }) {
  const [cur, setCur] = useState(name);
  const [under, setUnder] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (name === cur) return;
    setUnder(cur);
    setCur(name);
    setLoaded(false);
    setFailed(false);
    // L'ancienne image disparaît vite, même si la nouvelle tarde : jamais d'illustration périmée.
    const timer = setTimeout(() => setUnder(null), UNDER_MS);
    return () => clearTimeout(timer);
  }, [name]);
  return html`<div className=${`splash-stack${!loaded && !failed && !under ? " loading" : ""}`}>
    ${under ? html`<img className="splash" src=${splashUrl(under)} alt="" />` : null}
    ${failed ? null : html`<${motion.img} key=${cur} className="splash" src=${splashUrl(cur)} alt=""
      initial=${{ opacity:0, scale:1.07 }} animate=${loaded ? { opacity:1, scale:1 } : { opacity:0, scale:1.07 }}
      transition=${{ opacity:{ duration:.3 }, scale:{ duration:.7, ease:[.2,.8,.2,1] } }}
      onLoad=${() => setLoaded(true)} onError=${() => { setFailed(true); setUnder(null); }} />`}
    ${failed ? html`<p className="splash-fail">Illustration indisponible : vérifie ta connexion.</p>` : null}
  </div>`;
}

    </div></section>`;
  }

  const picked = entry && entry.picked === V.shown;
  const stagger = { hidden:{}, show:{ transition:{ staggerChildren:.045, delayChildren:.03 } } };
  const item = { hidden:{ y:10, opacity:.4 }, show:{ y:0, opacity:1, transition:ARRIVE } };
  return html`<section className="stage" aria-label="Recommandation">
    <${SplashStack} name=${name} />
    <div className="scrim"></div>
    ${V.change ? html`<${motion.p} key=${V.change.id} className="change" initial=${{ y:-8, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${ARRIVE}>
      <b>${V.change.trigger} :</b> ${V.change.to} passe devant ${V.change.from}${V.change.reason ? html`<span>${V.change.reason}</span>` : null}
    <//>` : null}
    <p className="sr" aria-live="polite">Prends ${name}${V.rival ? `, ${V.clear ? "sinon" : "ou"} ${label(V.rival.pick)}` : ""}</p>
    <${motion.div} key=${name} className="stage-body" variants=${stagger} initial="hidden" animate="show">
      <${motion.div} className="badges" variants=${item}>
        ${V.n ? html`<span className=${`badge ${V.clear ? "net" : "close"}`}>${V.clear ? "Choix net" : "Choix serré"}</span>` : null}
        ${V.n < 5 ? html`<span className="badge">Provisoire ${V.n}/5</span>` : null}
      <//>
      <${motion.div} className=${`champ-name${name.length > 18 ? " long" : ""}`} variants=${item}>${name}<//>
      ${V.rival ? html`<${motion.div} className="alt-line" variants=${item}>
        <em>${V.clear ? "Sinon" : "Ou"}</em> <${Portrait} name=${label(V.rival.pick)} size=${24} /> ${label(V.rival.pick)}
      <//>` : null}
      <${motion.ul} className="reasons" variants=${item}>
        ${(V.reasons.length ? V.reasons : ["Aucun argument particulier dans cette draft"]).map(t => html`<${motion.li} key=${t} initial=${{ x:-6, opacity:.4 }} animate=${{ x:0, opacity:1 }} transition=${ARRIVE}>${t}<//>`)}
      <//>
      <${motion.div} className="stage-notes" variants=${item}>
        ${V.risk ? html`<p className="note risk">Risque : ${V.risk}</p>` : null}
        ${V.avoided.length ? html`<p className="note">À éviter : <span className="avoid">${V.avoided.map(label).join(", ")}</span></p>` : null}
        ${V.personal ? html`<p className="note">Tes parties : ${V.personal}</p>` : null}
        ${V.without ? html`<p className="note">Sans frontline : <b>${label(V.without)}</b></p>` : null}
        ${V.provisional ? html`<p className="note warn">Provisoire. ${hypothesisText()}</p>` : null}
        ${V.midAlt ? html`<p className="note warn">Si ton adversaire ${oppAt()} est ${V.midAlt.mid} : <b>${label(V.midAlt.pick)}</b></p>` : null}
      <//>
      <${motion.button} type="button" className=${`cta${picked ? " done" : ""}`} variants=${item} whileHover=${{ y:-1 }} whileTap=${{ scale:.97 }} onClick=${() => choosePick(V.shown)}>
        <${motion.span} key=${picked ? "done" : "take"} style=${{ display:"inline-block" }} initial=${{ y:6, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${QUICK}>${picked ? `${name} enregistré` : `Je prends ${name}`}<//>
      <//>
    <//>
  </section>`;
}

function rankWord(p, i) {
  if (V.avoided.includes(p.pick)) return ["À éviter", "bad"];
  if (i === 0) return [V.clear ? "Recommandé" : "Au coude à coude", "best"];
  if (i === 1) return [V.clear ? "Alternative" : "Au coude à coude", V.clear ? "alt" : "best"];
  return [p.score < 0 ? "Peu adapté" : "Possible", p.score < 0 ? "bad" : "other"];
}

// Au-delà, la liste écraserait le verdict : le reste du pool se lit dans Analyse et Comparer.
const RANK_SHOWN = 4;

function Ranking() {
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const scores = V.order.map(p => p.score);
  const lo = Math.min(...scores, 0);
  const hi = Math.max(...scores, 1);
  return html`<section aria-label="Ton pool">
    <h2 className="sec-title">Ton pool <small>${V.order.length > RANK_SHOWN ? `Les ${RANK_SHOWN} meilleurs sur ${V.order.length}` : "Clique sur le champion que tu joues"}</small></h2>
    <${LayoutGroup}>
      <div className="rank-list">
        ${V.order.slice(0, RANK_SHOWN).map((p, i) => {
          const [word, tone] = rankWord(p, i);
          const name = label(p.pick);
          const isPicked = entry && entry.picked === p.pick;
          const rows = STAT_ROWS.length ? record(STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === name)) : null;
          return html`<${motion.button} key=${p.pick} layout="position" transition=${SNAP} type="button" whileHover=${{ y:-2 }} whileTap=${{ scale:.98 }}
            data-pick=${p.pick} aria-pressed=${!!isPicked}
            className=${`rank tier-${tone}${i === 0 ? " first" : ""}${isPicked ? " picked" : ""}`} onClick=${() => choosePick(p.pick)}>
            ${isPicked ? html`<${motion.span} key="chosen" className="chosen" initial=${{ scale:.5 }} animate=${{ scale:1 }} transition=${SNAP} title="Champion choisi"><span aria-hidden="true">✓</span><span className="sr">Choisi</span><//>` : null}
            ${i === 0 ? html`<${motion.span} key=${`best-${p.pick}`} className="rank-glow" aria-hidden="true" initial=${{ opacity:.55 }} animate=${{ opacity:0 }} transition=${{ duration:.45 }} />` : null}
            ${isPicked ? html`<${motion.span} layoutId="picked-ring" className="rank-ring" aria-hidden="true" transition=${SNAP} />` : null}
            <span className="rank-top">
              <${Portrait} name=${name} size=${36} />
              <span style=${{ minWidth:0 }}>
                <span className="rank-name" title=${name} style=${{ display:"block" }}>${name}</span>
                <${motion.span} key=${word} className=${`rank-word ${tone}`} initial=${{ y:5, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${QUICK}>${word}<//>
              </span>
            </span>
            <span className="force" aria-hidden="true"><${motion.i} initial=${false} animate=${{ scaleX: Math.max(.04, (p.score - lo) / (hi - lo || 1)) }} transition=${QUICK} /></span>
            ${rows && rows.games ? html`<span className="rank-rec">${fmtRecord(rows)}</span>` : null}
          <//>`;
        })}
      </div>
    <//>
  </section>`;
}

const Faces = ({ names, empty }) => names.length
  ? html`<span className="faces">${names.map(n => html`<${motion.span} key=${n} className="face" initial=${{ scale:.86, opacity:.4 }} animate=${{ scale:1, opacity:1 }} whileHover=${{ y:-1 }} transition=${QUICK}><${Portrait} name=${n} size=${26} /> ${n}<//>`)}</span>`
  : html`<span className="small">${empty}</span>`;

function ResultButtons({ id, result, disabled }) {
  const opts = [["win", "Victoire"], ["loss", "Défaite"], ["skip", "Ignorer"]];
  return html`<div className="results">
    ${opts.map(([key, text]) => html`<${motion.button} key=${key} type="button" disabled=${disabled} data-result=${key} aria-pressed=${result === key}
      whileHover=${disabled ? undefined : { y:-1 }} whileTap=${disabled ? undefined : { scale:.97 }} animate=${result === key ? { scale:[1, 1.05, 1] } : { scale:1 }} transition=${{ duration:.22 }} className=${`res ${key}${result === key ? " on" : ""}`} onClick=${() => setResult(id, key)}>${text}<//>`)}
  </div>`;
}

function PlanBlock() {
  const list = loadJournal();
  const entry = state.current && list.find(x => x.id === state.current);
  const pending = !entry && !state.enemies.length && [...list].reverse().find(x => x.result === null);
  const c = V.res.counts;
  const playing = entry ? entry.picked : V.shown;
  const threats = playing ? threatsFor(playing, c) : [];
  const targets = playing ? targetsFor(playing, c) : [];
  return html`<section className="plan-block" aria-label="Plan de jeu">
    <h2 className="sec-title">Plan de jeu <small>${playing ? `avec ${label(playing)}` : ""}</small></h2>
    <${motion.p} key=${playing || "none"} className="wincon" initial=${{ x:6, opacity:.4 }} animate=${{ x:0, opacity:1 }} transition=${ARRIVE}>
      <span>Gagne si</span>${playing ? winCondition(playing, c) : "Choisis un champion."}
    <//>
    <div className="plan-row threat"><span>Menaces</span><${Faces} names=${threats} empty="Rien de particulier" /></div>
    <div className="plan-row target"><span>Cibles</span><${Faces} names=${targets} empty="Le carry le plus exposé" /></div>
    <div className="plan-row ban-row"><span>Bans</span><${Faces} names=${V.bans} empty="Aucun" /></div>
    ${pending ? html`<p className="result-note">Dernière partie : <b>${label(pending.picked)}</b>${pending.mid ? ` contre ${pending.mid}` : ""}</p>` : null}
    <${ResultButtons} id=${entry ? entry.id : pending ? pending.id : 0} result=${entry ? entry.result : null} disabled=${!entry && !pending} />
    ${!entry && !pending ? html`<p className="result-note">Enregistre d'abord ton pick pour noter le résultat.</p>` : null}
  </section>`;
}

const PHASES = [["lane", "Lane"], ["mid", "Mid game"], ["fight", "Teamfights"]];

function PlanTab() {
  const [phase, setPhase] = useState("lane");
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const playing = entry ? entry.picked : V.shown;
  if (!playing) return html`<p className="small">Aucun pick disponible.</p>`;
  const slots = deriveSlots();
  const plan = buildPlan(playing, V.res.counts, V.mid, slots.jungle);
  return html`<div>
    <div className="seg-tabs" role="group" aria-label="Phase de jeu">
      ${PHASES.map(([key, text]) => html`<button key=${key} type="button" aria-pressed=${phase === key} className=${`seg-tab${phase === key ? " on" : ""}`} onClick=${() => setPhase(key)}>${text}</button>`)}
    </div>
    <${motion.ul} key=${phase + playing} className="tips" initial=${{ opacity:.4, y:4 }} animate=${{ opacity:1, y:0 }} transition=${QUICK}>
      ${plan[phase].map(tip => html`<li key=${tip}>${tip}</li>`)}
    <//>
    <p className="small">Avis général basé sur les 5 champions adverses, sans cooldowns ni builds vérifiés.</p>
  </div>`;
}

const IMPACT_MARK = v => v > 0 ? (v >= 2 ? "++" : "+") : v < 0 ? (v <= -2 ? "−−" : "−") : "=";
const impactText = v => v > 0 ? "avantage" : v < 0 ? "désavantage" : "neutre";

function AnalyseTab() {
  const entries = V.res.ranking;
  const rows = CRITERIA.filter(def => entries.some(p => p.criteria.some(c => c.key === def.key)));
  const uncertain = [];
  if (V.hypothesis) uncertain.push(`${hypothesisText()} Confiance ${V.confidence}.`);
  if (V.res.ranking[0] && V.res.ranking[0].byScenario) uncertain.push("Classement pondéré entre ces hypothèses, avec les mêmes règles.");
  if (!V.mid) uncertain.push(`${oppName()} inconnu : le matchup direct n'est pas évalué.`);
  if (V.mid && !matchupOf(V.mid) && !PICKS.some(p => liveMatchup(p, V.mid))) uncertain.push(`Pas de données de matchup contre ${V.mid} : ce critère n'est pas évalué.`);
  if (entries[0] && V.shown !== entries[0].pick) uncertain.push(`${label(V.shown)} reste affiché : ${label(entries[0].pick)} mène de trop peu pour changer de nom en cours de draft.`);
  if (V.n < 5) uncertain.push(`Draft incomplète : ${V.n} adversaire(s) sur 5.`);
  if (V.res.unknown.length) uncertain.push(`Profil provisoire : ${V.res.unknown.join(", ")}.`);
  uncertain.push("Frontline allié supposé.");
  return html`<div>
    <p className="small">${uncertain.join(" ")}</p>
    <div className="matrix" role="table" aria-label="Critères par champion">
      <div className="mx-row mx-head" role="row"><span role="columnheader">Critère</span>${entries.map(p => html`<span key=${p.pick} role="columnheader" title=${label(p.pick)}><${Portrait} name=${label(p.pick)} size=${24} /></span>`)}</div>
      ${rows.map(def => html`<div key=${def.key} className="mx-row" role="row">
        <span role="cell">${def.label}</span>
        ${entries.map(p => {
          const c = p.criteria.find(x => x.key === def.key);
          const v = c ? c.impact : 0;
          return html`<span key=${p.pick} role="cell" className=${`mx-cell ${v > 0 ? "up" : v < 0 ? "down" : ""}`} title=${c ? c.text : "Non concerné"} aria-label=${`${label(p.pick)} : ${impactText(v)}`}>${IMPACT_MARK(v)}</span>`;
        })}
      </div>`)}
    </div>
    ${entries.map((p, i) => {
      const plus = p.why.filter(w => w.v > 0).sort((a, b) => b.v - a.v);
      const minus = p.why.filter(w => w.v < 0).sort((a, b) => a.v - b.v);
      const threats = threatsFor(p.pick, V.res.counts);
      const targets = targetsFor(p.pick, V.res.counts);
      const m = matchupOf(V.mid);
      return html`<details key=${p.pick} className="pick-detail" open=${i === 0}>
        <summary><${Portrait} name=${label(p.pick)} size=${24} /> ${label(p.pick)}</summary>
        <p className="small">${positionText(entries, p)}</p>
        ${plus.length ? html`<ul className="why">${plus.map(w => html`<li key=${w.text} className="pos">+ ${w.text}</li>`)}</ul>` : null}
        ${minus.length ? html`<ul className="why">${minus.map(w => html`<li key=${w.text} className="neg">− ${w.text}</li>`)}</ul>` : null}
        ${!plus.length && !minus.length ? html`<p className="small">Aucun critère ne le distingue dans cette draft.</p>` : null}
        ${threats.length ? html`<p className="small">Menaces : ${threats.join(", ")}</p>` : null}
        ${targets.length ? html`<p className="small">Opportunités : ${targets.join(", ")}</p>` : null}
        <p className="small">Condition de victoire : ${winCondition(p.pick, V.res.counts)}</p>
        ${m ? html`<p className="small"><a href=${matchupLink(p.pick, V.mid)} target="_blank" rel="noopener noreferrer">Vérifier ce matchup sur LoLalytics</a></p>` : null}
      </details>`;
    })}
    <h3>Bans conseillés</h3>
    <ul className="plain">${V.bans.map(n => html`<li key=${n}><b>${n}</b> : ${banReason(n)}</li>`)}</ul>
  </div>`;
}

function CompareBar({ row, max }) {
  const size = v => Math.min(1, Math.abs(v) / max);
  const side = (v, cls) => html`<span className=${`cmp-side ${cls}`}><${motion.i} className=${v > 0 ? "up" : v < 0 ? "down" : ""} initial=${false} animate=${{ scaleX:size(v) }} transition=${QUICK} /></span>`;
  return html`<div className="cmp-row">
    <span className="cmp-label">${row.label}</span>

  </div>`;
}

function CompareTab() {
  const entries = V.res.ranking;
  const [pair, setPair] = useState(null);
  if (entries.length < 2) return html`<p className="small">Il faut au moins deux picks disponibles pour comparer.</p>`;
  const defaults = [V.shown, V.rival ? V.rival.pick : entries.find(p => p.pick !== V.shown).pick];
  const valid = pair && pair.every(p => entries.some(x => x.pick === p)) && pair[0] !== pair[1];
  const [pa, pb] = valid ? pair : defaults;
  const a = entries.find(x => x.pick === pa);
  const b = entries.find(x => x.pick === pb);
  const cmp = comparePicks(a, b);
  const max = Math.max(1, ...cmp.rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)]));
  const leader = a.score >= b.score ? a : b;
  const trailer = leader === a ? b : a;
  const select = (slot, pick) => { const next = [pa, pb]; next[slot] = pick; if (next[0] === next[1]) next[1 - slot] = slot === 0 ? pb === pick ? pa : pb : pa === pick ? pb : pa; setPair(next); };
  const picker = (slot, cur) => html`<div className="cmp-pick" role="group" aria-label=${slot === 0 ? "Premier champion" : "Second champion"}>
    ${entries.map(p => html`<button key=${p.pick} type="button" aria-pressed=${cur === p.pick} aria-label=${label(p.pick)} title=${label(p.pick)} className=${`cmp-btn${cur === p.pick ? " on" : ""}`} onClick=${() => select(slot, p.pick)}><${Portrait} name=${label(p.pick)} size=${26} /></button>`)}
  </div>`;
  const pros = (x, y) => cmp.rows.filter(r => (x === a ? r.diff > 0 : r.diff < 0)).map(r => x === a ? r.textA || `Moins pénalisé : ${r.label}` : r.textB || `Moins pénalisé : ${r.label}`).slice(0, 3);
  const when = whenBetter(trailer.pick, leader.pick, state.enemies, V.mid);
  return html`<div className="compare">
    <div className="cmp-head">${picker(0, pa)}<b>VS</b>${picker(1, pb)}</div>
    <p className="cmp-title"><b>${label(pa)}</b> contre <b>${label(pb)}</b></p>
    <p className="small">${Math.abs(cmp.gap) < 1e-9 ? "À égalité sur le total des critères." : Math.abs(cmp.gap) < HOLD_GAP ? `Serré, léger avantage à ${label(leader.pick)}.` : `Avantage net à ${label(leader.pick)}.`}${leadCriterion(leader, trailer) ? ` ${label(leader.pick)} gagne surtout sur « ${leadCriterion(leader, trailer).label} »` : ""}${leadCriterion(leader, trailer) && comparePicks(trailer, leader).decisive.find(r => r.diff > 0) ? `, ${label(trailer.pick)} sur « ${comparePicks(trailer, leader).decisive.find(r => r.diff > 0).label} »` : ""}${leadCriterion(leader, trailer) ? "." : ""}</p>
    ${cmp.rows.length ? html`<div className="cmp-row cmp-legend" aria-hidden="true"><span></span><span className="cmp-bars"><span>${label(pa)}</span><span>${label(pb)}</span></span></div>` : null}
    ${cmp.rows.length ? cmp.rows.map(r => html`<${CompareBar} key=${r.key} row=${r} max=${max} />`) : html`<p className="small">Aucun critère ne les sépare pour l'instant.</p>`}
    ${[[a, b], [b, a]].map(([x, y]) => {
      const list = pros(x, y);
      const risk = mainRisk(x);
      return html`<div key=${x.pick} className="cmp-side-text">
        <h3>${label(x.pick)}</h3>
        <p className="small">${pickStyle(x.pick)}</p>
        ${list.length ? html`<ul className="why">${list.map(t => html`<li key=${t} className="pos">+ ${t}</li>`)}</ul>` : null}
        ${risk ? html`<ul className="why"><li className="neg">− ${risk}</li></ul>` : null}
      </div>`;
    })}
    <h3>${label(trailer.pick)} passerait devant</h3>
    <p className="small">${when.length ? when.join(", ") + "." : "Dans aucun des cas simples testés : changement de mid, absence de frontline ou nouvel adversaire type."}</p>
  </div>`;
}
