<script>
if (!window.React || !window.ReactDOM || !window.Motion || !window.htm || typeof analyze === "undefined" || !window.I18N) {
  document.getElementById("root").innerHTML = '<p style="padding:24px;max-width:60ch">DRAFT ne peut pas démarrer : le dossier <b>draft-vendor</b> ou le fichier <b>draft-engine.js</b> est introuvable. Replace-les à côté de ce fichier, puis recharge la page.</p>';
  throw new Error("fichiers de DRAFT introuvables");
}
// Tous les textes de la page : t(), tp() et tx() lisent web/i18n/fr.js (draft-i18n.js, chargé avant le moteur). Dates : fmtDate.
const { t, tp, tx, fmtDate } = window.I18N;
const state = { enemies: [], manualMid: null, held: null, shown: null, clear: true, current: null, boardKey: null };

function matchByKeys(names, keysOf, query) {
  const q = norm(query);
  if (!q) return [];
  const starts = names.filter(n => keysOf(n).some(k => k.startsWith(q)));
  const contains = names.filter(n => !starts.includes(n) && keysOf(n).some(k => k.includes(q)));
  return starts.concat(contains);
}

const suggest = query => matchByKeys(NAMES.filter(n => !state.enemies.includes(n)), champKeys, query).slice(0, 6);

function currentMid() {
  if (state.manualMid && state.enemies.includes(state.manualMid)) return state.manualMid;
  return identifiedOpponent(state.enemies, state.roleOf);
}

// Statistiques personnelles de l'ancien format (draft-stats.js), importées par le menu de l'icône (facultatif)
const STATS = window.DRAFT_STATS || null;
const RAW_NAMES = Object.assign(Object.fromEntries(NAMES.map(n => [norm(n), n])), { monkeyking:"Wukong", renata:"Renata Glasc" });
const toName = raw => RAW_NAMES[norm(raw || "")] || raw || "";
const STAT_ROWS = STATS && Array.isArray(STATS.rows)
  ? STATS.rows.map(r => Object.assign({}, r, { champ: toName(r.champ), mid: toName(r.mid) }))
  : [];
const MAIN_ACCOUNT = STATS && STATS.accounts && STATS.accounts[0];
// Personnalisation future : ces bilans restent affichés, sans modifier le score, tant qu'un test prudent ne justifie pas de les y intégrer.
const EVOLUTION_STEP = 20;
const inPool = name => PICKS.map(label).includes(name);
const SHRINK_K = 50;
const MIN_GAMES = 10;

function record(rows) {
  const wins = rows.filter(r => r.win).length;
  return { wins, losses: rows.length - wins, games: rows.length };
}
const fmtRecord = rec => t("stats.record", { wins: rec.wins, losses: rec.losses });
const pct = rec => rec.games ? t("stats.percent", { value: Math.round(100 * rec.wins / rec.games) }) : "-";

// Ramène un petit bilan vers le winrate du champion, pour éviter de surestimer quelques parties.
function shrunkRate(rec, base) {
  return (rec.wins + SHRINK_K * base) / (rec.games + SHRINK_K);
}

function matchupWord(rec, base) {
  if (rec.games < MIN_GAMES) return t("stats.matchup.notEnough");
  const gap = shrunkRate(rec, base) - base;
  if (Math.abs(gap) < 0.03) return t("stats.matchup.noPreference");
  return gap > 0 ? t("stats.matchup.slightEdge") : t("stats.matchup.slightDisadvantage");
}

function personalLine(pick, mid) {
  if (!STAT_ROWS.length) return "";
  const rows = STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === label(pick));
  const all = record(rows);
  if (!all.games) return t("stats.personal.none", { champion: label(pick) });
  const base = fmtRecord(all);
  if (!mid) return base;
  const vs = record(rows.filter(r => r.mid === mid));
  if (!vs.games) return t("stats.personal.neverVs", { record: base, champion: mid });
  return t("stats.personal.vs", { record: base, champion: mid, vsRecord: fmtRecord(vs), word: matchupWord(vs, all.wins / all.games) });
}


const JOURNAL_KEY = "draftJournal";

function loadJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY)) || []; } catch (e) { return []; }
}

function saveJournal(list) {
  try { localStorage.setItem(JOURNAL_KEY, JSON.stringify(list)); } catch (e) {}
}

function updateEntry(id, change) {
  const list = loadJournal();
  const entry = list.find(x => x.id === id);
  if (entry) { Object.assign(entry, change); saveJournal(list); }
}

function syncCurrentEntry() {
  if (state.current) updateEntry(state.current, { enemies: state.enemies.slice(), mid: currentMid() });
}


// ---------- Actions ----------
let rerender = () => {};
let V = null;
const ROLE_LABEL = { top:t("role.name.top"), jungle:t("role.name.jungle"), mid:t("role.name.mid"), adc:t("role.name.adc"), support:t("role.name.support") };
// « Ajouter le Top », « Ajouter l'ADC » : l'article change avec le rôle et la langue, d'où une clé complète par rôle.
const ADD_TARGET_KEYS = { top:"enemy.row.addTarget.top", jungle:"enemy.row.addTarget.jungle", mid:"enemy.row.addTarget.mid", adc:"enemy.row.addTarget.adc", support:"enemy.row.addTarget.support" };

// Les rôles affichés suivent la répartition la plus probable du calcul (likelyAssignment, tirée de roleBelief).
// Ils servent à l'affichage ; seul l'adversaire direct influence le classement. L'adversaire affiché et les corrections sont respectés.
function likelyRoles() {
  const fixed = Object.assign({}, state.roleOf || {});
  const mid = currentMid();
  if (mid) fixed[mid] = myRole();
  return likelyAssignment(state.enemies, fixed);
}
function deriveSlots() { return likelyRoles().slots; }

// Rôle incertain d'un adversaire : « ADC ou Mid » si deux rôles sont proches, « ADC ? » si le rôle affiché reste peu probable.
function roleTag(info) {
  if (!info || !info.uncertain) return "";
  return info.close.length ? t("enemy.roleTag.or", { role: ROLE_LABEL[info.role], other: ROLE_LABEL[info.close[0]] }) : t("enemy.roleTag.unsure", { role: ROLE_LABEL[info.role] });
}

function describeChange(prev, shown, heldEntry, ranking) {
  if (!prev || !prev.n || !prev.shown || prev.shown === shown || !state.lastAction) return null;
  const oldNow = ranking.find(p => p.pick === prev.shown);
  const oldBefore = prev.order.find(p => p.pick === prev.shown);
  const newBefore = prev.order.find(p => p.pick === shown);
  // Le nouveau nom menait déjà avant cet ajout : c'est la fin de la draft qui libère le nom affiché, pas ce champion.
  if (oldNow && state.enemies.length >= 5 && newBefore && oldBefore && newBefore.score > oldBefore.score) return { id: Date.now(), trigger: t("advice.change.complete"), from: label(prev.shown), to: label(shown), reason: t("advice.change.leadComplete") };
  // Sinon, la raison est le critère qui sépare le plus les deux picks maintenant.
  const lead = oldNow && leadCriterion(heldEntry, oldNow);
  const crit = lead && heldEntry.criteria.find(c => c.key === lead.key);
  const reason = !oldNow ? t("advice.change.taken", { champion: label(prev.shown) }) : lead ? (crit && crit.impact > 0 && signedText(crit, 1)) || t("advice.change.edge", { criterion: lead.label }) : "";
  return { id: Date.now(), trigger: state.lastAction, from: label(prev.shown), to: label(shown), reason };
}

function computeVerdict() {
  const prevV = V;
  const action = state.lastAction;
  if (!state.enemies.length) state.held = null;
  const n = state.enemies.length;
  const mid = currentMid();
  const manual = !!state.manualMid && state.enemies.includes(state.manualMid);
  const belief = manual ? null : opponentBelief(state.enemies, state.roleOf);
  const scenarios = belief && n ? beliefScenarios(belief) : null;
  const res = analyze(state.enemies, mid, PREFS.assumeFront, scenarios);
  if (!res.ranking.length) {
    state.held = null;
    state.shown = null;
    V = { n, mid, res, none:true, order:[], avoided:[], reasons:[], bans:suggestBans() };
    return;
  }
  // Draft complète : le classement fait foi, quel que soit l'ordre de saisie. Le maintien évite seulement de clignoter en cours de draft.
  state.held = !n ? null : n >= 5 ? res.ranking[0].pick : holdPick(res.ranking, state.held);
  const shown = state.held || res.ranking[0].pick;
  const heldEntry = res.ranking.find(p => p.pick === shown);
  const m = matchupOf(mid);
  const available = availablePicks(state.enemies);
  const avoided = m ? avoidedPicks(m).filter(p => available.includes(p) && p !== shown) : [];
  // Même évaluation : ces champions sont présentés à égalité. held ne sert plus alors qu'à stabiliser le reste de l'écran.
  const tied = heldEntry.tiedWith && heldEntry.tiedWith.length ? [heldEntry.pick].concat(heldEntry.tiedWith) : null;
  const notTied = p => !tied || !tied.includes(p.pick);
  const tiedEntries = tied ? tied.map(t => res.ranking.find(p => p.pick === t)) : [];
  const others = res.ranking.filter(p => p.pick !== shown && notTied(p));
  const rival = others.find(p => !avoided.includes(p.pick)) || others[0];
  const clear = !n || !others.length || heldEntry.score - others[0].score >= HOLD_GAP;
  state.shown = shown;
  state.clear = clear;
  const without = n && PREFS.assumeFront ? analyze(state.enemies, mid, false).ranking[0] : null;
  const order = (tied ? tiedEntries : [heldEntry]).concat(rival ? [rival] : [], others.filter(p => p !== rival));
  V = {
    n, mid, res, shown, rival, clear, avoided:tied ? avoided.filter(p => !tied.includes(p)) : avoided, order, tied,
    commonReasons: tied ? tiedEntries.map(positiveReasons).reduce((a, b) => a.filter(t => b.includes(t))) : [],
    reasons: positiveReasons(heldEntry),
    risk: mainRisk(heldEntry),
    midAlt: belief ? midSwapEffect(state.enemies, mid, shown, PREFS.assumeFront, belief.candidates.filter(c => c.p >= SCENARIO_MIN).map(c => c.name)) : null,
    belief, confidence: belief ? belief.confidence : null,
    hypothesis: belief && n ? beliefHypothesis(belief, mid) : null,
    provisional: !!belief && n > 0 && (belief.confidence === "low" || !!(scenarios && scenarios.length > 1 && scenarios.some(sc => analyze(state.enemies, sc.mid, PREFS.assumeFront).ranking[0].pick !== res.ranking[0].pick))),
    personal: personalLine(shown, mid),
    without: without && without.pick !== shown && !(scenarios && scenarios.length > 1) ? without.pick : null,
    bans: suggestBans(),
    // Passer d'un ex æquo à l'autre n'est pas un changement de conseil.
    change: action && !(tied && prevV && tied.includes(prevV.shown)) && !(prevV && prevV.tied && prevV.tied.includes(shown)) ? describeChange(prevV, shown, heldEntry, res.ranking) : null
  };
  state.lastAction = null;
}

function commit() {
  const action = state.lastAction;
  computeVerdict();
  syncCurrentEntry();
  publish(action);
}

// ---------- Synchronisation entre panneaux et préférences ----------
const PANEL = new URLSearchParams(location.search).get("panel") || "";
const IS_HOST = !!(window.chrome && window.chrome.webview);
const hostSend = msg => { if (IS_HOST) window.chrome.webview.postMessage(msg); };
// I18N-3 : textes du programme (phase, placement, import, calcul, mise à jour) reçus en { key, vars } (Msg, src/Strings.cs),
// affichés dans la langue de la page. Une variable peut être un autre message. Un ancien texte brut est affiché tel quel.
const nativeText = m => !m ? "" : typeof m === "string" ? m : t(m.key, Object.fromEntries(Object.entries(m.vars || {}).map(([k, v]) => [k, v && typeof v === "object" && v.key ? nativeText(v) : v])));
const PREFS_KEY = "draftPrefs";
const PREFS = Object.assign({ excluded:[], favorite:null, assumeFront:true, coachLevel:"beginner", autoRole:"suggest" }, (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { return {}; } })());
ENGINE_PREFS.excluded = PREFS.excluded;
ENGINE_PREFS.favorite = PREFS.favorite;
const hostState = { available:false, autostart:false, follow:true, autoDraft:true, topmost:false, compact:false, placement:"", phase:"", hotkey:false, diagnostics:false };
const SHARED = ["enemies", "manualMid", "held", "current", "roleOf", "targetRole", "selected", "notice", "sessionActive", "assignedRole", "roleManual", "roleDismissed", "roleHandled"];
let channel = null;
try { channel = new BroadcastChannel("draftmid"); } catch (e) {}
// Une page qui s'ouvre (Analyse détaillée, Comparer, rechargement) part d'une draft vide.
// Elle ne diffuse rien avant d'avoir reçu l'état des autres fenêtres, ou constaté qu'aucune ne répond :
// sinon sa draft vide écraserait la vraie draft des panneaux.
let synced = !channel;
const SYNC_WAIT_MS = 1500;
// Simulation (Draft aléatoire) : la fenêtre principale travaille sur sa propre draft, sans toucher à la draft en cours.
let simulating = false;

function publish(action) {
  rerender();
  if (!channel || !synced || simulating) return;
  // QA 3.0 : les profils voyagent avec l'état. Relus dans localStorage, ils pouvaient être en retard : l'écriture d'une autre
  // fenêtre (autre processus WebView2) n'y est pas toujours visible à l'arrivée du message, et un panneau resté sur d'anciens
  // profils les réenregistrait ensuite (rôle automatique en début de draft), effaçant les derniers pools modifiés.
  const snapshot = { kind:"state", action: action || null, prefs: PREFS, profile: PROFILE, profiles: { version:PROFILES_VERSION, active:PROFILES.active, roles:PROFILES.roles } };
  SHARED.forEach(k => { snapshot[k] = state[k]; });
  channel.postMessage(snapshot);
}

// ---------- Profils par rôle : un pool, des exclusions et un favori par rôle, enregistrés à chaque changement ----------
const APP_VERSION = "2.16.2";
let PROFILES = loadProfiles(localStorage, PREFS);
function useActiveRole() {
  if (!PROFILES.active) return;
  const r = PROFILES.roles[PROFILES.active];
  applyProfile({ role:PROFILES.active, pool:r.pool.slice() });
  PREFS.excluded = r.excluded.slice();
  PREFS.favorite = r.favorite;
  ENGINE_PREFS.excluded = PREFS.excluded;
  ENGINE_PREFS.favorite = PREFS.favorite;
}
useActiveRole();
// Copie de secours dans le dossier de données : le stockage du navigateur intégré peut être réinitialisé.
function storeProfiles() {
  try { persistProfiles(PROFILES, localStorage); } catch (e) {}
  hostSend({ cmd:"saveProfiles", json:JSON.stringify({ version:PROFILES_VERSION, active:PROFILES.active, roles:PROFILES.roles }) });
}
// source : "manual" (clic du joueur) ou "auto" (rôle attribué par le client, si le joueur l'a choisi).
function switchRole(role, source) {
  if (!PROFILE_ROLES.includes(role)) return;
  if (PROFILES.active !== role) {
    PROFILES.active = role;
    storeProfiles();
    useActiveRole();
    state.manualMid = null;
    state.roleOf = {};
    state.held = null;
    PICKS.forEach(p => preloadSplash(label(p)));
    sendProfile();
  }
  if (source === "manual") state.roleManual = true;
  if (source === "auto") state.roleHandled = role;
  state.lastAction = null;
  commit();
}
function handleAssignedRole(role) {
  const value = PROFILE_ROLES.includes(role) ? role : null;
  if (value === state.assignedRole) return;
  state.assignedRole = value;
  const session = { manual:!!state.roleManual, dismissed:state.roleDismissed, handled:state.roleHandled };
  if (decideRoleAction(PREFS.autoRole, session, PROFILES.active, value) === "switch") { switchRole(value, "auto"); return; }
  publish(null);
}
function resetRoleSession() { state.roleManual = false; state.roleDismissed = null; state.roleHandled = null; }
const roleSuggestion = () => decideRoleAction(PREFS.autoRole, { manual:!!state.roleManual, dismissed:state.roleDismissed, handled:state.roleHandled }, PROFILES.active, state.assignedRole) === "suggest" ? state.assignedRole : null;

function savePrefs(change) {
  Object.assign(PREFS, change);
  if (PROFILES.active && ("excluded" in change || "favorite" in change)) {
    PROFILES.roles[PROFILES.active].excluded = PREFS.excluded.slice();
    PROFILES.roles[PROFILES.active].favorite = PREFS.favorite;
    storeProfiles();
  }
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) {}
  ENGINE_PREFS.excluded = PREFS.excluded;
  ENGINE_PREFS.favorite = PREFS.favorite;
  commit();
}

// Pendant une simulation, la draft en cours continue d'être suivie à part (liveCopy) : on y revient, ou on la copie, sans attendre.
let liveCopy = null;
function snapshotLive() {
  const copy = { kind:"state", action:null, prefs:JSON.parse(JSON.stringify(PREFS)), profile:PROFILE ? JSON.parse(JSON.stringify(PROFILE)) : null };
  SHARED.forEach(k => { copy[k] = state[k] === undefined ? undefined : JSON.parse(JSON.stringify(state[k])); });
  return copy;
}
if (channel) channel.onmessage = e => {
  const m = e.data;
  // Seule une page qui connaît la vraie draft répond : deux pages qui s'ouvrent en même temps ne s'écrasent pas.
  if (m.kind === "hello") { if (synced && !simulating) publish(null); return; }
  if (m.kind !== "state") return;
  synced = true;
  if (simulating) { liveCopy = m; rerender(); return; }
  applyRemote(m);
};
function applyRemote(m) {
  SHARED.forEach(k => { state[k] = m[k]; });
  const sent = m.profiles ? normalizeProfiles(m.profiles) : null;
  PROFILES = sent || loadProfiles(localStorage, PREFS);
  if (m.profile) applyProfile(m.profile);
  if (m.prefs) { Object.assign(PREFS, m.prefs); ENGINE_PREFS.excluded = PREFS.excluded; ENGINE_PREFS.favorite = PREFS.favorite; }
  state.lastAction = m.action;
  computeVerdict();
  rerender();
}

// Les événements simulés passent par les mêmes opérations que la saisie.
const draftApi = {
  reset() { resetDraft(); },
  setActive(v) { state.sessionActive = v; state.notice = v ? t("draft.notice.active") : t("draft.notice.ended"); publish(null); },
  add(champion, role) {
    if (role) state.targetRole = role;
    addEnemy(champion);
  },
  remove(champion) { removeEnemy(champion); },
  replace(from, to) {
    const i = state.enemies.indexOf(from);
    if (i < 0 || state.enemies.includes(to)) return;
    const role = state.roleOf[from];
    state.enemies[i] = to;
    delete state.roleOf[from];
    if (role) state.roleOf[to] = role;
    if (state.manualMid === from) state.manualMid = to;
    state.lastAction = t("draft.notice.replaced", { from, to });
    state.notice = state.lastAction;
    commit();
  },
  setRole(champion, role) {
    if (!state.enemies.includes(champion)) return;
    if (role === myRole()) { setMid(champion); return; }
    if (state.manualMid === champion) state.manualMid = null;
    state.roleOf[champion] = role;
    state.notice = t("draft.notice.role", { champion, role: ROLE_LABEL[role] || role });
    commit();
  }
};
const dispatchDraft = ev => applyDraftEvent(ev, draftApi);
const riotProvider = new RiotDraftProvider(dispatchDraft);
function applyDetected(ids) {
  riotProvider.update(ids.map(id => toName(CHAMPION_IDS[id])).filter(n => ROSTER[n] !== undefined));
}
// Simulation à la main : aucune lecture du client, et rien n'entre dans le relevé de validation.
// Entrer en simulation : la draft en cours est mise de côté (liveCopy), la simulation part vide.
function startSimulation() {
  if (simulating) return;
  liveCopy = snapshotLive();
  simulating = true;
  clearUndo();
  resetDraft();
}
function startRandomDraft() {
  const names = randomDraft();
  if (!names) return;
  startSimulation();
  resetDraft();
  names.forEach(addEnemy);
}
// « Reprendre la draft en cours » : copie la draft réelle dans la simulation. Aucun lien : la suite ne change que la simulation.
function resumeLiveInSimulation() {
  if (!simulating || !liveCopy) return;
  withUndo(t("draft.undo.resumed"), () => {
    ["enemies", "manualMid", "roleOf"].forEach(k => { state[k] = liveCopy[k] === undefined ? undefined : JSON.parse(JSON.stringify(liveCopy[k])); });
    state.held = null; state.current = null; state.targetRole = null; state.selected = null; state.notice = null;
    state.lastAction = null;
    commit();
  });
}

// Retour à la draft en cours : la simulation est effacée, la draft en cours suivie à part revient tout de suite,
// puis l'état des autres fenêtres est redemandé. Rien n'est diffusé : la vraie draft n'est jamais écrasée.
function leaveSimulation() {
  if (!simulating) return;
  clearUndo();
  if (!liveCopy) resetDraft();
  simulating = false;
  if (liveCopy) applyRemote(Object.assign({}, liveCopy, { action:null }));
  liveCopy = null;
  rerender();
  if (channel) channel.postMessage({ kind:"hello" });
}

let demoProvider = null;
function runDemo(stepMs) {
  if (demoProvider) demoProvider.stop();
  demoProvider = new MockDraftProvider(dispatchDraft, DEMO_SCRIPT, stepMs || 900);
  demoProvider.start();
}

// Jamais de focus pendant que l'utilisateur est ailleurs : une lecture du client ne doit rien interrompre.
const focusAdd = () => { const el = document.getElementById("add"); if (el && state.enemies.length < 5 && document.hasFocus()) el.focus(); };

function addEnemy(name) {
  if (!name || state.enemies.includes(name) || state.enemies.length >= 5) return;
  state.enemies.push(name);
  state.lastAction = t("draft.notice.added", { champion: name });
  state.notice = state.lastAction;
  if (state.targetRole) {
    if (state.targetRole === myRole()) state.manualMid = name;
    else state.roleOf[name] = state.targetRole;
    state.targetRole = null;
  }
  commit();
}

function removeEnemy(name) {
  state.enemies = state.enemies.filter(n => n !== name);
  delete state.roleOf[name];
  if (state.manualMid === name) state.manualMid = null;
  state.lastAction = t("draft.notice.removed", { champion: name });
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function resetDraft() {
  state.enemies = [];
  state.manualMid = null;
  state.held = null;
  state.current = null;
  state.roleOf = {};
  state.targetRole = null;
  state.selected = null;
  state.notice = null;
  commit();
  focusAdd();
}

// Annuler (5 secondes) après une action qui retire des adversaires : Nouvelle draft, Retour arrière.
// La draft exacte est rétablie. L'annonce reste locale à la fenêtre qui a agi.
const UNDO_MS = 5000;
const UNDO_KEYS = ["enemies", "manualMid", "held", "current", "roleOf", "targetRole", "selected", "notice"];
let undoOffer = null;
const copyOf = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
function withUndo(text, action) {
  const snapshot = {};
  UNDO_KEYS.forEach(k => { snapshot[k] = copyOf(state[k]); });
  action();
  if (undoOffer) clearTimeout(undoOffer.timer);
  const offer = { id:Date.now(), text, snapshot };
  offer.timer = setTimeout(() => { if (undoOffer === offer) { undoOffer = null; rerender(); } }, UNDO_MS);
  undoOffer = offer;
  rerender();
}
function clearUndo() { if (undoOffer) { clearTimeout(undoOffer.timer); undoOffer = null; } }
function undoLast() {
  if (!undoOffer) return;
  const snapshot = undoOffer.snapshot;
  clearUndo();
  UNDO_KEYS.forEach(k => { state[k] = copyOf(snapshot[k]); });
  state.lastAction = null;
  commit();
  focusAdd();
}
const removeLastEnemy = () => { const last = state.enemies[state.enemies.length - 1]; withUndo(t("draft.undo.removed", { champion: last }), () => removeEnemy(last)); };

function setMid(name) {
  const old = currentMid();
  if (old && old !== name && state.roleOf[name]) state.roleOf[old] = state.roleOf[name];
  delete state.roleOf[name];
  state.manualMid = name;
  state.selected = null;
  state.targetRole = null;
  state.lastAction = oppText("notice", { champion: name });
  state.notice = state.lastAction;
  commit();
  focusAdd();
}

function clickRole(role) {
  const slots = deriveSlots();
  const occupant = slots[role];
  const picked = state.selected;
  if (picked && picked !== occupant) {
    const from = Object.keys(slots).find(r => slots[r] === picked);
    if (role === myRole()) { setMid(picked); return; }
    if (occupant) state.roleOf[occupant] = from === myRole() ? role : from;
    if (from === myRole()) { state.manualMid = occupant || null; if (occupant) delete state.roleOf[occupant]; }
    state.roleOf[picked] = role;
    state.selected = null;
    state.notice = t("draft.notice.role", { champion: picked, role: ROLE_LABEL[role] });
    commit();
    return;
  }
  if (occupant) {
    state.selected = picked === occupant ? null : occupant;
    state.targetRole = null;
  } else {
    state.targetRole = state.targetRole === role ? null : role;
  }
  publish(null);
  if (state.targetRole) focusAdd();
}

const LEFT_ORDER = ["top", "jungle", "mid", "adc", "support"];

function choosePick(pick) {
  if (state.current) {
    updateEntry(state.current, { picked: pick });
  } else {
    const entry = { id: Date.now(), date: new Date().toISOString(), suggested: state.shown, close: !state.clear, picked: pick, enemies: state.enemies.slice(), mid: currentMid(), result: null, engine: ENGINE_VERSION };
    const list = loadJournal();
    list.push(entry);
    saveJournal(list);
    state.current = entry.id;
  }
  publish(null);
}

function setResult(id, result) {

function exportJournal() {

}

function searchMatchups(query) {
  const byName = Object.fromEntries(MATCHUPS.map(m => [m.n, m]));
  return matchByKeys(MATCHUPS.map(m => m.n), n => [byName[n].n].concat(byName[n].a || []).map(norm), query).map(n => byName[n]);
}

function optionsFor(m) {
  const available = availablePicks([m.n]);
  const avoid = avoidedPicks(m);
  // Les notes viennent des vrais bilans quand ils existent, sinon du tableau : tri stable, donc le 1er choix écrit reste devant à égalité.
  const written = [m.first, m.second, ...PICKS].filter((p, i, all) => PICKS.includes(p) && all.indexOf(p) === i);
  const note = p => (RULES.matchup(p, null, { mid: m.n }) || [0])[0];
  const ranked = written.filter(p => available.includes(p) && !avoid.includes(p)).sort((a, b) => note(b) - note(a));
  return ranked.concat(written.filter(p => available.includes(p) && avoid.includes(p))).slice(0, 2);
}

function groupRows(rows, keyOf) {
  const map = new Map();
  rows.forEach(r => { const k = keyOf(r); if (!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return [...map].map(([name, list]) => ({ name, rows: list })).sort((a, b) => b.rows.length - a.rows.length);
}

function SearchBox() {
  const [value, setValue] = useState("");
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const full = state.enemies.length >= 5;
  const list = open ? suggest(value) : [];
  const confirm = name => { addEnemy(name); setValue(""); setSel(0); setTimeout(focusAdd, 0); };
  const onKey = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!list.length) return;
      e.preventDefault();
      setSel(s => (s + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (list.length) confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Tab" && !e.shiftKey && list.length) {
      e.preventDefault();
      confirm(list[Math.min(sel, list.length - 1)]);
    } else if (e.key === "Backspace" && !value && state.enemies.length) {
      removeLastEnemy();
    } else if (e.key === "Escape" && value) {
      e.stopPropagation();
      setValue("");
    }
  };
  const target = state.targetRole ? t("draft.search.next", { role: ROLE_LABEL[state.targetRole] }) : "";
  return html`<div className="search">
    <input id="add" data-test="enemy-search" type="search" value=${value} disabled=${full} autoComplete="off" spellCheck="false"
      aria-label=${t("draft.search.label")}
      placeholder=${full ? t("draft.search.full") : (target || t("draft.search.placeholder"))}
      onChange=${e => { setValue(e.target.value); setSel(0); setOpen(true); }}
      onFocus=${() => setOpen(true)} onBlur=${() => setOpen(false)} onKeyDown=${onKey} />
    ${open && value.trim() ? html`<div className="sugg" role="listbox">
      ${list.length ? list.map((n, i) => html`<button key=${n} type="button" role="option" aria-selected=${i === sel} className=${`sugg-item${i === sel ? " on" : ""}`}

    </div>` : null}

}

// Une seule échelle pour ton vis-à-vis (docs/technique/GLOSSAIRE-LOL.md §3) : presque sûr, probable, hypothèse
// (1 ou 2 champions vus), pas identifié, pas encore choisi. Le mot suit la confiance calculée ; le seuil pour nommer ne change pas ici.
const seenText = n => tp("draft.seen", n);
// Codes : "guess" (1 ou 2 champions vus), "likely", "sure". Le mot affiché vient de OPPONENT_LEVEL_WORD.
const OPPONENT_LEVEL_WORD = { guess:t("coach.opponentWord.guess"), likely:t("coach.opponentWord.likely"), sure:t("coach.opponentWord.sure") };
function opponentLevel() {
  if (!V.mid) return null;
  if (V.n <= 2) return "guess";
  return V.confidence === "high" ? "sure" : "likely";
}
// Personne de nommé : « pas encore choisi » (code "unrevealed") si aucun candidat plausible n'est révélé et qu'il reste une vraie chance
// qu'il ne soit pas encore pris (ou si rien n'est révélé), sinon « pas identifié » (code "unidentified").
function unnamedState() {
  const h = V.hypothesis;
  if (!V.n) return "unrevealed";
  return h && h.notYet && !h.others.length ? "unrevealed" : "unidentified";
}
const UNNAMED_WORD = { unrevealed:t("draft.unnamed.unrevealed"), unidentified:t("draft.unnamed.unidentified") };
const unnamedWord = () => UNNAMED_WORD[unnamedState()];
// Analyse, vis-à-vis pas nommé. Fidèle au calcul : avec des hypothèses, le critère matchup du pick affiché est leur moyenne pondérée.
function matchupUncertainText() {
  const shownEntry = V.res.ranking.find(p => p.pick === V.shown);
  return shownEntry && shownEntry.criteria.some(c => c.key === "matchup")
    ? t("analysis.matchupUncertain.average", { role: oppName() })
    : t(unnamedState() === "unrevealed" ? "analysis.matchupUncertain.unrevealed" : "analysis.matchupUncertain.unidentified", { role: oppName() });
}
// Étiquette de la ligne de ton rôle dans la composition adverse.
function opponentTag() {
  const level = opponentLevel();
  if (!level) return t("enemy.tag.unidentified", { role: oppName() });
  return level === "guess" ? t("enemy.tag.guess", { role: oppName(), seen: seenText(V.n) }) : t("enemy.tag.level", { role: oppName(), level: OPPONENT_LEVEL_WORD[level] });
}

// Les hypothèses restent courtes, sans pourcentage : la qualité des données ne permet pas mieux.
function hypothesisText() {
  const h = V.hypothesis;
  if (!h) return "";
  const notYet = h.notYet;
  const named = h.others;
  if (!h.main && !named.length) return t(unnamedState() === "unrevealed" ? "draft.hyp.unrevealed" : "draft.hyp.unidentified", { role: oppName() });
  if (!h.main) return t(notYet ? "draft.hyp.unidentifiedNamesNotYet" : "draft.hyp.unidentifiedNames", { role: oppName(), names: I18N.listOr(named) });
  const rest = named.length ? (notYet ? "elseNotYet" : "else") : notYet ? "notYet" : "none";
  const level = opponentLevel();
  const vars = { role: oppName(), champion: h.main, seen: seenText(V.n), level: OPPONENT_LEVEL_WORD[level], names: I18N.listOr(named) };
  if (level === "guess") return t({ none:"draft.hyp.guess", else:"draft.hyp.guessElse", elseNotYet:"draft.hyp.guessElseNotYet", notYet:"draft.hyp.guessNotYet" }[rest], vars);
  return t({ none:"draft.hyp.level", else:"draft.hyp.levelElse", elseNotYet:"draft.hyp.levelElseNotYet", notYet:"draft.hyp.levelNotYet" }[rest], vars);
}

function SplashStack({ name }) {
  const [cur, setCur] = useState(name);
  const [under, setUnder] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (name === cur) return;
    setUnder(cur);
    setCur(name);
    setLoaded(false);
    setFailed(false);
    // L'ancienne image disparaît vite, même si la nouvelle tarde : jamais d'illustration périmée.
    const timer = setTimeout(() => setUnder(null), UNDER_MS);
    return () => clearTimeout(timer);
  }, [name]);
  return html`<div className=${`splash-stack${!loaded && !failed && !under ? " loading" : ""}`}>
    ${under ? html`<img className="splash" src=${splashUrl(under)} alt="" />` : null}
    ${failed ? null : html`<${motion.img} key=${cur} className="splash" src=${splashUrl(cur)} alt=""
      initial=${{ opacity:0, scale:1.07 }} animate=${loaded ? { opacity:1, scale:1 } : { opacity:0, scale:1.07 }}
      transition=${{ opacity:{ duration:.3 }, scale:{ duration:.7, ease:[.2,.8,.2,1] } }}
      onLoad=${() => setLoaded(true)} onError=${() => { setFailed(true); setUnder(null); }} />`}
    ${failed ? html`<p className="splash-fail">${t("advice.splashFailed")}</p>` : null}
  </div>`;
}

function TieGroup({ detailed }) {
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const list = V.tied.slice(0, TIE_SHOWN), more = V.tied.length - list.length;
  return html`<section className="tie-group" aria-label=${t("advice.tie.label")}>
    <p className="tie-title">${tx("advice.tie.heading", { picks: html`<b>${t("advice.tie.count", { count: V.tied.length })}</b>` })}</p>
    <div className="tie-list">
      ${list.map(p => {
        const chosen = entry && entry.picked === p, why = detailed ? positiveReasons(V.res.ranking.find(x => x.pick === p))[0] : null;
        return html`<button key=${p} type="button" className=${`tie-item${chosen ? " picked" : ""}`} aria-pressed=${!!chosen} title=${CTA_HELP} onClick=${() => choosePick(p)}>
          <${Portrait} name=${label(p)} size=${36} />
          <span className="tie-text"><span className="tie-name">${label(p)}</span>${p === PREFS.favorite ? html`<small>${t("advice.tie.favorite")}</small>` : null}${why ? html`<small>${why}</small>` : null}</span>
          ${chosen ? html`<span className="tie-check" aria-hidden="true">✓</span>` : null}
        </button>`;
      })}
    </div>
    <p className="note">${more ? tp("advice.tie.more", more) + " " : ""}${tieCauseText(tieCause(V.res.ranking, V.tied), V.tied[0])}</p>
  </section>`;
}

let coachMemo = { v:null };
function historyProfile() {
  if (historyProfile.done) return historyProfile.value;
  historyProfile.done = true;
  try { const h = importedHistory(); historyProfile.value = h ? familiarityProfile(h.rows) : null; historyProfile.info = h; } catch (e) { historyProfile.value = null; }
  return historyProfile.value;
}
function coachData() {
  if (coachMemo.v === V && coachMemo.level === PREFS.coachLevel) return coachMemo;
  coachMemo = { v:V, level:PREFS.coachLevel, advice:null, choices:null };
  if (V.none) return coachMemo;
  const manual = state.manualMid && state.enemies.includes(state.manualMid) ? state.manualMid : null;
  const input = { enemies:state.enemies, level:PREFS.coachLevel, manualOpponent:manual, fixedRoles:state.roleOf, hasFront:PREFS.assumeFront };
  const profile = historyProfile();
  try {
    const history = historyProfile.info;
    const position = { top:"TOP", jungle:"JUNGLE", mid:"MIDDLE", adc:"BOTTOM", support:"UTILITY" }[myRole()];
    coachMemo.advice = coachingAdvice(Object.assign({}, input, { pick:label(V.shown), personal:history ? personalTrends(history.rows, { position }) : null, maxItems:12 }));
  } catch (e) { coachMemo.advice = null; }
  try { coachMemo.choices = playerChoices(Object.assign({}, input, { profile, displayed:V.shown })); } catch (e) { coachMemo.choices = null; }
  return coachMemo;
}

// Pendant la draft : un seul conseil, et seulement s'il repose sur une donnée ou un calcul. Les avis à relire restent dans l'onglet Conseils.
const COACH_ESSENTIAL = ["draft.tie", "draft.conflict", "matchup.measured", "draft.close"];
function essentialAdvice() {
  const advice = coachData().advice;
  if (!advice) return null;
  return COACH_ESSENTIAL.map(id => advice.items.find(i => i.id === id && i.verification === "rule")).find(Boolean) || null;
}
const COACH_SHORT = 110;
// Les premières phrases seulement : le reste est dans l'onglet Conseils.
function shortAdvice(text) {
  let out = "";
  for (const sentence of text.split(/(?<=\.)\s+/)) {
    if ((out + " " + sentence).trim().length > COACH_SHORT) break;
    out = (out + " " + sentence).trim();
  }
  return out;
}
function CoachLine() {
  const item = essentialAdvice();
  if (!item) return null;
  return html`<section className="coach-line" aria-label=${t("advice.coachLine.label")}>
    ${item.id === "draft.tie" ? null : html`<b>${item.title}</b>`}
    ${shortAdvice(item.text) ? html`<p>${shortAdvice(item.text)}</p>` : null}
    <button type="button" className="link-btn" data-test="open-coach" onClick=${() => openDetail("coach")}>${t("advice.coachLine.open")}</button>
  </section>`;
}
// Sur une ligne à part : le nombre de parties n'est ni une recommandation, ni une preuve de niveau.

function rankWord(p, i) {
  if (V.tied && V.tied.includes(p.pick)) return [t("advice.rank.tie"), "best"];
  if (V.avoided.includes(p.pick)) return [t("advice.rank.avoid"), "bad"];
  if (i === 0) return [t(V.clear ? "advice.rank.recommended" : "advice.rank.veryClose"), "best"];
  if (i === 1) return [t(V.clear ? "advice.rank.alternative" : "advice.rank.veryClose"), V.clear ? "alt" : "best"];
  const far = V.order[0] && V.order[0].score - p.score >= HOLD_GAP;
  return [t(far ? "advice.rank.lessSuited" : "advice.rank.possible"), far ? "bad" : "other"];
}

// Au-delà, la liste écraserait le verdict : le reste du pool se lit dans Analyse et Comparer.
const RANK_SHOWN = 4;

function Ranking() {
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const scores = V.order.map(p => p.score);
  const lo = Math.min(...scores, 0);
  const hi = Math.max(...scores, 1);
  return html`<section aria-label=${t("pool.rank.label")}>
    <h2 className="sec-title">${t("pool.rank.label")} <small>${V.order.length > RANK_SHOWN ? t("pool.rank.top", { shown: RANK_SHOWN, total: V.order.length }) : t("pool.rank.hint")}</small></h2>
    <${LayoutGroup}>
      <div className="rank-list">
        ${V.order.slice(0, RANK_SHOWN).map((p, i) => {
          const [word, tone] = rankWord(p, i);
          const name = label(p.pick);
          const isPicked = entry && entry.picked === p.pick;
          const rows = STAT_ROWS.length ? record(STAT_ROWS.filter(r => r.acct === MAIN_ACCOUNT && r.champ === name)) : null;
          return html`<${motion.button} key=${p.pick} layout="position" transition=${SNAP} type="button" whileHover=${{ y:-2 }} whileTap=${{ scale:.98 }}
            data-pick=${p.pick} aria-pressed=${!!isPicked}
            className=${`rank tier-${tone}${i === 0 && !V.tied ? " first" : ""}${isPicked ? " picked" : ""}`} onClick=${() => choosePick(p.pick)}>
            ${isPicked ? html`<${motion.span} key="chosen" className="chosen" initial=${{ scale:.5 }} animate=${{ scale:1 }} transition=${SNAP} title=${t("pool.rank.chosen")}><span aria-hidden="true">✓</span><span className="sr">${t("pool.rank.chosenShort")}</span><//>` : null}
            ${i === 0 && !V.tied ? html`<${motion.span} key=${`best-${p.pick}`} className="rank-glow" aria-hidden="true" initial=${{ opacity:.55 }} animate=${{ opacity:0 }} transition=${{ duration:.45 }} />` : null}
            ${isPicked ? html`<${motion.span} layoutId="picked-ring" className="rank-ring" aria-hidden="true" transition=${SNAP} />` : null}
            <span className="rank-top">
              <${Portrait} name=${name} size=${44} />
              <span style=${{ minWidth:0 }}>
                <span className="rank-name" title=${name} style=${{ display:"block" }}>${name}</span>
                <${motion.span} key=${word} className=${`rank-word ${tone}`} initial=${{ y:5, opacity:.4 }} animate=${{ y:0, opacity:1 }} transition=${QUICK}>${word}<//>
              </span>
            </span>
            <span className="force" aria-hidden="true"><${motion.i} initial=${false} animate=${{ scaleX: Math.max(.04, (p.score - lo) / (hi - lo || 1)) }} transition=${QUICK} /></span>
            ${rows && rows.games ? html`<span className="rank-rec">${fmtRecord(rows)}</span>` : null}
          <//>`;
        })}
      </div>
    <//>
  </section>`;
}

const PHASES = [["lane", t("plan.phase.lane")], ["mid", t("plan.phase.mid")], ["fight", t("plan.phase.fight")]];

function PlanTab() {
  const [phase, setPhase] = useState("lane");
  const entry = state.current && loadJournal().find(x => x.id === state.current);
  const playing = entry ? entry.picked : V.tied ? null : V.shown;
  if (!playing) return html`<p className="small">${V.tied ? t("plan.chooseTied") : t("plan.noPick")}</p>`;
  const slots = deriveSlots();
  const plan = buildPlan(playing, V.res.counts, V.mid, slots.jungle);
  return html`<div>

const IMPACT_MARK = v => v > 0 ? (v >= 2 ? "++" : "+") : v < 0 ? (v <= -2 ? "−−" : "−") : "=";
const impactText = v => t(v > 0 ? "analysis.impact.up" : v < 0 ? "analysis.impact.down" : "analysis.impact.neutral");

function CriteriaView() {
  const entries = V.res.ranking;
  const rows = CRITERIA.filter(def => entries.some(p => p.criteria.some(c => c.key === def.key)));
  const uncertain = [];
  if (V.hypothesis) uncertain.push(hypothesisText());
  if (V.res.ranking[0] && V.res.ranking[0].byScenario) uncertain.push(t("analysis.weighted"));
  if (!V.mid) uncertain.push(matchupUncertainText());
  if (V.mid && !matchupOf(V.mid) && !PICKS.some(p => liveMatchup(p, V.mid))) uncertain.push(t("analysis.noMatchupData", { champion: V.mid }));
  if (V.tied) uncertain.push(t("analysis.tied", { champions: V.tied.map(label).join(", "), cause: tieCauseText(tieCause(V.res.ranking, V.tied), V.tied[0]) }));
  if (entries[0] && V.shown !== entries[0].pick && !(V.tied && V.tied.includes(entries[0].pick))) uncertain.push(t("analysis.held", { champion: label(V.shown), leader: label(entries[0].pick) }));
  if (V.n < 5) uncertain.push(tp("analysis.incomplete", V.n));
  if (V.res.unknown.length) uncertain.push(t("analysis.provisional", { champions: V.res.unknown.join(", ") }));
  uncertain.push(PREFS.assumeFront ? t("analysis.front.on") : t("analysis.front.off"));
  return html`<div>
    <p className="small">${uncertain.join(" ")}</p>
    <div className="matrix" role="table" aria-label=${t("analysis.matrix.label")}>
      <div className="mx-row mx-head" role="row"><span role="columnheader">${t("analysis.matrix.criterion")}</span>${entries.map(p => html`<span key=${p.pick} role="columnheader" title=${label(p.pick)}><${Portrait} name=${label(p.pick)} size=${24} /></span>`)}</div>
      ${rows.map(def => html`<div key=${def.key} className="mx-row" role="row">
        <span role="cell">${def.label}</span>
        ${entries.map(p => {
          const c = p.criteria.find(x => x.key === def.key);
          const v = c ? c.impact : 0;
          return html`<span key=${p.pick} role="cell" className=${`mx-cell ${v > 0 ? "up" : v < 0 ? "down" : ""}`} title=${c ? c.text : t("analysis.matrix.notConcerned")} aria-label=${t("analysis.matrix.cell", { champion: label(p.pick), impact: impactText(v) })}>${IMPACT_MARK(v)}</span>`;
        })}
      </div>`)}
    </div>
    ${entries.map((p, i) => {
      const plus = p.why.filter(w => w.v > 0).sort((a, b) => b.v - a.v);
      const minus = p.why.filter(w => w.v < 0).sort((a, b) => a.v - b.v);
      const threats = threatsFor(p.pick, V.res.counts);
      const targets = targetsFor(p.pick, V.res.counts);
      const m = matchupOf(V.mid);
      return html`<details key=${p.pick} className="pick-detail" open=${i === 0}>
        <summary><${Portrait} name=${label(p.pick)} size=${24} /> ${label(p.pick)}</summary>
        <p className="small">${positionText(entries, p)}</p>
        ${plus.length ? html`<ul className="why">${plus.map(w => html`<li key=${w.text} className="pos">+ ${signedText(w, 1) || w.text}</li>`)}</ul>` : null}
        ${minus.length ? html`<ul className="why">${minus.map(w => html`<li key=${w.text} className="neg">− ${signedText(w, -1) || w.text}</li>`)}</ul>` : null}
        ${!plus.length && !minus.length ? html`<p className="small">${t("analysis.detail.none")}</p>` : null}
        ${threats.length ? html`<p className="small">${t("analysis.detail.threats", { champions: threats.join(", ") })}</p>` : null}
        ${targets.length ? html`<p className="small">${t("analysis.detail.targets", { champions: targets.join(", ") })}</p>` : null}
        <p className="small">${t("analysis.detail.winCondition", { text: winCondition(p.pick, V.res.counts) })}</p>
        ${m ? html`<p className="small"><a href=${matchupLink(p.pick, V.mid)} target="_blank" rel="noopener noreferrer">${t("analysis.detail.lolalytics")}</a></p>` : null}
      </details>`;
    })}
    <h3>${t("analysis.bans.title")}</h3>
    <ul className="plain">${V.bans.map(n => html`<li key=${n}>${tx("analysis.bans.line", { champion: html`<b>${n}</b>`, reason: banReason(n) })}</li>`)}</ul>
  </div>`;
}

function CompareBar({ row, max }) {
  const size = v => Math.min(1, Math.abs(v) / max);
  const side = (v, cls) => html`<span className=${`cmp-side ${cls}`}><${motion.i} className=${v > 0 ? "up" : v < 0 ? "down" : ""} initial=${false} animate=${{ scaleX:size(v) }} transition=${QUICK} /></span>`;
  return html`<div className="cmp-row">
    <span className="cmp-label">${row.label}</span>
    <span className="cmp-bars" role="img" aria-label=${t("compare.bar.aria", { criterion: row.label, first: impactText(row.a), second: impactText(row.b) })}>${side(row.a, "left")}${side(row.b, "right")}</span>
  </div>`;
}

function CompareTab() {
  const entries = V.res.ranking;
  const [pair, setPair] = useState(null);
  if (entries.length < 2) return html`<p className="small">${t("compare.needTwo")}</p>`;
  const defaults = V.tied ? [V.tied[0], V.tied[1]] : [V.shown, V.rival ? V.rival.pick : entries.find(p => p.pick !== V.shown).pick];
  const valid = pair && pair.every(p => entries.some(x => x.pick === p)) && pair[0] !== pair[1];
  const [pa, pb] = valid ? pair : defaults;
  const a = entries.find(x => x.pick === pa);
  const b = entries.find(x => x.pick === pb);
  const cmp = comparePicks(a, b);
  const max = Math.max(1, ...cmp.rows.flatMap(r => [Math.abs(r.a), Math.abs(r.b)]));
  const leader = a.score >= b.score ? a : b;
  const trailer = leader === a ? b : a;
  const select = (slot, pick) => { const next = [pa, pb]; next[slot] = pick; if (next[0] === next[1]) next[1 - slot] = slot === 0 ? pb === pick ? pa : pb : pa === pick ? pb : pa; setPair(next); };
  const picker = (slot, cur) => html`<div className="cmp-pick" role="group" aria-label=${slot === 0 ? t("compare.first") : t("compare.second")}>
    ${entries.map(p => html`<button key=${p.pick} type="button" aria-pressed=${cur === p.pick} aria-label=${label(p.pick)} title=${label(p.pick)} className=${`cmp-btn${cur === p.pick ? " on" : ""}`} onClick=${() => select(slot, p.pick)}><${Portrait} name=${label(p.pick)} size=${26} /></button>`)}
  </div>`;
  const pros = (x, y) => cmp.rows.filter(r => (x === a ? r.diff > 0 : r.diff < 0)).map(r => x === a ? r.textA || t("compare.lessPenalized", { criterion: r.label }) : r.textB || t("compare.lessPenalized", { criterion: r.label })).slice(0, 3);
  // whenBetter compte une frontline alliée et ignore les hypothèses sur le vis-à-vis : sinon, rien n'est affirmé.
  const severalHypotheses = !!(V.res.ranking[0] && V.res.ranking[0].byScenario);
  const when = severalHypotheses || !PREFS.assumeFront ? null : whenBetter(trailer.pick, leader.pick, state.enemies, V.mid);
  return html`<div className="compare">
    <div className="cmp-head">${picker(0, pa)}<b>${t("compare.vs")}</b>${picker(1, pb)}</div>
    <p className="cmp-title">${tx("compare.title", { a: html`<b>${label(pa)}</b>`, b: html`<b>${label(pb)}</b>` })}</p>
    <p className="small">${[Math.abs(cmp.gap) < 1e-9 ? t("compare.summary.tie") : t(Math.abs(cmp.gap) < HOLD_GAP ? "compare.summary.close" : "compare.summary.clear", { champion: label(leader.pick) }), leadCriterion(leader, trailer) ? t(comparePicks(trailer, leader).decisive.find(r => r.diff > 0) ? "compare.summary.leadBoth" : "compare.summary.lead", { champion: label(leader.pick), criterion: leadCriterion(leader, trailer).label, other: label(trailer.pick), otherCriterion: (comparePicks(trailer, leader).decisive.find(r => r.diff > 0) || {}).label }) : ""].filter(Boolean).join(" ")}</p>
    ${cmp.rows.length ? html`<div className="cmp-row cmp-legend" aria-hidden="true"><span></span><span className="cmp-bars"><span>${label(pa)}</span><span>${label(pb)}</span></span></div>` : null}
    ${cmp.rows.length ? cmp.rows.map(r => html`<${CompareBar} key=${r.key} row=${r} max=${max} />`) : html`<p className="small">${t("compare.noCriterion")}</p>`}
    ${[[a, b], [b, a]].map(([x, y]) => {
      const list = pros(x, y);
      const risk = mainRisk(x);
      return html`<div key=${x.pick} className="cmp-side-text">
        <h3>${label(x.pick)}</h3>
        <p className="small">${pickStyle(x.pick)}</p>
        ${list.length ? html`<ul className="why">${list.map(t => html`<li key=${t} className="pos">+ ${t}</li>`)}</ul>` : null}
        ${risk ? html`<ul className="why"><li className="neg">− ${risk}</li></ul>` : null}
      </div>`;
    })}
    <h3>${t("compare.whenTitle", { champion: label(trailer.pick) })}</h3>
    <p className="small">${severalHypotheses ? t("compare.when.hypotheses") : !when ? t("compare.when.noFront") : when.length ? t("compare.when.list", { cases: when.join(", ") }) : t("compare.when.none")}</p>
  </div>`;
}

const midTypeLabel = type => ({ Mage:t("enemy.midType.mage"), Assassin:t("enemy.midType.assassin"), Tank:t("enemy.midType.tank"), Combattant:t("enemy.midType.fighter") }[type] || type);
function WinBars({ title, groups }) {
  if (!groups.length) return null;
  return html`<div>
    ${title ? html`<h3>${title}</h3>` : null}
    <div className="winbars">
      ${groups.map(g => {
        const rec = record(g.rows);
        const few = rec.games < MIN_GAMES;
        // QA-1 : sous 50 % de victoires, la barre quitte le vert des réussites (teinte neutre) ; le repère et le pourcentage restent.
        const under = !few && rec.wins / rec.games < 0.5;
        // Sous le seuil : pas de barre de victoires (elle suggérerait un taux), une jauge de crans montre l'échantillon.
        return html`<div key=${g.name} className=${`winbar${few ? " few" : ""}${under ? " under" : ""}`}>
          <span className="winbar-name">${g.name}</span>
          ${few ? html`<${SampleGauge} count=${rec.games} />` : html`<span className="winbar-track" role="img" aria-label=${t("stats.winbar.aria", { name: g.name, record: fmtRecord(rec) })}>
            <${motion.i} initial=${{ scaleX:0 }} animate=${{ scaleX: rec.games ? rec.wins / rec.games : 0 }} transition=${ARRIVE} /><b className="winbar-mid" aria-hidden="true"></b>
          </span>`}
          <span className="winbar-val">${few ? fmtRecord(rec) : t("stats.winbar.value", { record: fmtRecord(rec), percent: pct(rec) })}</span>
        </div>`;
      })}
    </div>
    <p className="small">${t("stats.winbar.few", { min: MIN_GAMES })}</p>
  </div>`;
}

function evolutionGroups(rows) {
  const sorted = [...rows].sort((x, y) => x.time - y.time);
  const groups = [];
  for (let i = 0; i + EVOLUTION_STEP <= sorted.length; i += EVOLUTION_STEP) groups.push({ name:t("stats.range", { from: i + 1, to: i + EVOLUTION_STEP }), rows:sorted.slice(i, i + EVOLUTION_STEP) });
  return groups;
}

const StatsTable = ({ title, groups }) => html`<div>

// QA-5 : mêmes règles que Mes statistiques pour l'historique Riot et les anciens imports : période, nombre de parties, seuil.
function RowsSample({ rows, test }) {
  if (!rows.length) return null;
  const times = rows.map(r => r.time).filter(x => typeof x === "number" && x > 0).sort((a, b) => a - b);
  const from = times.length ? fmtDate(times[0]) : "", to = times.length ? fmtDate(times[times.length - 1]) : "";
  const enough = rows.length >= MIN_GAMES;
  return html`<p className="stats-sample" data-test=${test}>${from ? html`<b className="num">${from === to ? t("stats.sample.periodOne", { date: from }) : t("stats.sample.period", { from, to })}</b>` : null}<span className="num">${tp("stats.sample.played", rows.length)}</span><span className=${enough ? "" : "stats-few"}>${t(enough ? "stats.sample.enough" : "stats.sample.few", { min: MIN_GAMES })}</span></p>`;
}

function openViewInPage(tab, source) {
  if (source === "live") leaveSimulation();
  // Sections de la fenêtre (UX-3) et anciens noms : « settings », « parties ». Le reste est un onglet du Simulateur.
  if (tab === "settings") { goView("settings"); return; }
  if (tab === "parties") { goView("stats"); return; }
  // « Simuler une draft » du menu de l'icône : le Simulateur, sur une simulation vide.
  if (tab === "simulate") { startSimulation(); goView("sim"); return; }
  if (VIEWS.includes(tab)) { goView(tab); return; }
  navTarget = tab || null;
  navId++;
  goView("sim");
}

// Modifie le pool d'un rôle sans toucher aux autres. Un pool vide est permis : le rôle reste configuré.
function saveMyProfile(role, names) {
  const pool = uniqueList(names.map(pickId));
  const r = PROFILES.roles[role];
  r.pool = pool;
  r.excluded = r.excluded.filter(p => pool.includes(p));
  if (!pool.includes(r.favorite)) r.favorite = null;
  // Premier rôle configuré : il devient le rôle joué. Ensuite, modifier le pool d'un autre rôle ne change
  // ni le rôle joué ni le conseil (audit UX, problème 4) : « Jouer ce rôle » le fait explicitement.
  if (!PROFILES.active) { switchRole(role, "manual"); return; }
  storeProfiles();
  if (PROFILES.active !== role) { publish(null); return; }
  useActiveRole();
  state.held = null;
  pool.forEach(p => preloadSplash(label(p)));
  sendProfile();
  commit();
}

function ProfileBackup() {
  const [note, setNote] = useState("");
  const [, refresh] = useState(0);
  const download = () => {
    const url = URL.createObjectURL(new Blob([exportConfig(PROFILES, PREFS, APP_VERSION)], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "draft-profils.json"; a.click(); URL.revokeObjectURL(url);
    setNote(t("pool.backup.exported"));
  };
  const load = e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    file.text().then(text => {
      const parsed = parseConfig(text);
      if (!parsed.ok) { setNote(t("pool.backup.refused", { error: parsed.error })); return; }
      const done = applyConfig(parsed, PROFILES, localStorage);
      if (!done.ok) { setNote(done.error); return; }
      PROFILES = done.profiles;
      Object.assign(PREFS, parsed.preferences);
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e2) {}
      storeProfiles();
      useActiveRole();
      sendProfile();
      commit();
      setNote(parsed.warnings.length ? t("pool.backup.importedWarnings", { warnings: parsed.warnings.join(" ") }) : t("pool.backup.imported"));
      refresh(x => x + 1);
    }).catch(() => setNote(t("pool.backup.unreadable")));
  };
  const undo = () => {
    const back = restoreLastBackup(localStorage);
    if (!back) return;
    PROFILES = back; storeProfiles(); useActiveRole(); sendProfile(); commit();
    setNote(t("pool.backup.restored")); refresh(x => x + 1);
  };
  return html`<div className="set-row profile-backup">
    <button type="button" className="ghost-btn" data-test="export-profiles" onClick=${download}>${t("pool.backup.export")}</button>
    <label className="ghost-btn file-btn">${t("pool.backup.import")}<input type="file" data-test="import-profiles" accept=".json,application/json" aria-label=${t("pool.backup.importLabel")} onChange=${load} /></label>
    ${latestProfilesBackup(localStorage) ? html`<button type="button" className="ghost-btn" data-test="undo-profiles-import" onClick=${undo}>${t("pool.backup.undo")}</button>` : null}
    ${note ? html`<p className="small" role="status">${note}</p>` : null}
  </div>`;
}

// ---------- Fenêtre principale : cinq sections (UX-3) ----------
// Adresses : ?view=home|pool|sim|stats|settings (&section= pour les Réglages). Alias gardés une version : ?tab=settings, ?tab=parties,
// et les onglets du Simulateur (?tab=analyse, compare, coach...). Les nouveaux textes passent par t() (web/i18n/fr.js).
const VIEWS = ["home", "pool", "sim", "stats", "settings"];
const SETTINGS_SECTIONS = ["general", "league", "display", "data", "updates", "diag"];
function viewFromAddress() {
  const q = new URLSearchParams(location.search), v = q.get("view"), tab = q.get("tab");
  if (VIEWS.includes(v)) return v;
  if (tab === "settings") return "settings";
  if (tab === "parties") return "stats";
  if (VIEWS.includes(tab)) return tab;
  // Tout autre onglet (« simulate », « analyse », « compare »...) est une demande précise du Simulateur.
  if (tab) return "sim";
  // UX-8 : sans demande précise (adresse sans vue ni onglet), la fenêtre principale s'ouvre sur l'Accueil.
  return "home";
}
let uiView = viewFromAddress(), uiBack = "home";
let uiSection = (() => { const s = new URLSearchParams(location.search).get("section"); return SETTINGS_SECTIONS.includes(s) ? s : "general"; })();
function goView(view, section) {
  if (!VIEWS.includes(view)) return;
  if (view === "settings" && uiView !== "settings") uiBack = uiView;
  uiView = view;
  if (SETTINGS_SECTIONS.includes(section)) uiSection = section;
  if (PANEL === "full") history.replaceState(null, "", `?panel=full&view=${view}${view === "settings" ? `&section=${uiSection}` : ""}`);
  rerender();
  if (view === "sim") setTimeout(focusAdd, 0);
}

// ---------- Accueil (UX-8) : une seule chose forte, puis la chaîne de la draft et deux cartes d'état ----------
// L'Accueil lit l'état sans rien changer : aucun rôle, pool ou réglage n'est modifié sans un clic sur l'action qui le dit.
// Le guide du premier lancement ne garde que sa progression (étapes faites ou ignorées), dans sa propre clé du stockage.
const ONBOARDING_KEY = "draftOnboarding";
const onboarding = () => { try { return Object.assign({ started:false, skipped:[], tried:false }, JSON.parse(localStorage.getItem(ONBOARDING_KEY)) || {}); } catch (e) { return { started:false, skipped:[], tried:false }; } };
function storeOnboarding(change) {
  try { localStorage.setItem(ONBOARDING_KEY, JSON.stringify(Object.assign(onboarding(), change))); } catch (e) {}
  rerender();
}
// Dates et heures selon la langue (draft-i18n.js) : en français, rendu identique à avant.
const frDate = d => fmtDate(d);
const frTime = d => I18N.fmtTime(d);
// État de la lecture du client : « browser » hors application, « unavailable » si la version l'a coupée.
function leagueState() {
  if (!hostState.available) return "browser";
  if (!hostState.lcuConfirmed) return "unavailable";
  return ["connected", "waiting", "failed"].includes(hostState.lcuStatus) ? hostState.lcuStatus : "off";
}
const LEAGUE_DOT = { connected:"good", waiting:"wait", failed:"bad", off:"idle", unavailable:"idle", browser:"idle" };
// Conseil en blind du rôle joué : le 1er du même calcul que les panneaux sans adversaire (aucun poids ni tri propre à l'Accueil).
function blindAdvice() {
  if (!PROFILE || !PICKS.length) return null;
  const ranking = analyze([], null, PREFS.assumeFront).ranking;
  if (!ranking.length) return { none:true };
  return { names:[ranking[0].pick].concat(ranking[0].tiedWith || []).map(label) };
}
const liveDraft = () => { const s = simulating ? liveCopy : state; return s && s.sessionActive ? s : null; };

function HomeHero() {
  const role = PROFILES.active, count = role ? PROFILES.roles[role].pool.length : 0, lcu = leagueState(), live = liveDraft();

  const simulate = html`<button type="button" className=${role && count ? "cta" : "ghost-btn"} data-test="home-simulate" onClick=${() => { startSimulation(); goView("sim"); }}>${t("home.action.simulate")}</button>`;
  let tone = "ready", title, lead, actions;
  if (!role) { tone = "todo"; title = t("home.hero.noRole"); lead = t("home.hero.noRole.lead"); actions = toPool; }
  else if (!count) { tone = "todo"; title = t("home.hero.emptyPool", { role:ROLE_NAMES[role] }); lead = t("home.hero.emptyPool.lead", { role:ROLE_NAMES[role] }); actions = toPool; }
  else if (blind && blind.none) { tone = "todo"; title = t("home.hero.allExcluded", { role:ROLE_NAMES[role] }); lead = t("home.hero.allExcluded.lead"); actions = toPool; }
  else if (lcu === "failed") {
    tone = "error"; title = t("home.hero.failed"); lead = t("home.hero.failed.lead");
    actions = html`<button type="button" className="cta" data-test="home-diagnostic" onClick=${() => hostSend({ cmd:"lcuDiagnostic" })}>${t("settings.diag.lcu")}</button>

function HomeView() {
  const role = PROFILES.active, fresh = !(role && PROFILES.roles[role].pool.length);
  const ob = onboarding();
  // Pendant le guide, les étapes tiennent lieu de cartes League, pool et panneaux : rien n'est dit deux fois.
  // Profil vierge : le guide démarre et reste jusqu'à ce que chaque étape soit faite ou ignorée. Un profil déjà configuré ne le voit jamais.
  // Dans l'application, on attend l'état du programme : un profil existant (copie de secours, ancien profil) arrive avec lui.
  const known = !IS_HOST || hostState.available;
  useEffect(() => { if (known && fresh && !ob.started) storeOnboarding({ started:true }); }, [known, fresh, ob.started]);
  const done = { pool:!fresh, lcu:!!hostState.lcuEnabled || (hostState.available && !hostState.lcuConfirmed), panels:ob.tried };
  const steps = known && (ob.started || fresh) ? ["pool", "lcu", "panels"].filter(s => !done[s] && !ob.skipped.includes(s)) : [];
  return html`<div className="view-page home" data-test="home">
    <h1 className="sr" data-test="home-h1">${t("nav.home")}</h1>
    ${steps.length ? html`<${HomeGuide} steps=${steps} />` : html`<${HomeHero} />
    <div className="home-chain">
      <${HomeLeague} /><${HomePool} /><${HomePanels} />
    </div>`}
    <div className="home-more"><${HomeUpdate} /><${HomeData} /></div>
  </div>`;
}

function setRoleChoices(role, change) {
  const r = PROFILES.roles[role];
  if (!r) return;
  if ("excluded" in change) r.excluded = uniqueList(change.excluded).filter(p => r.pool.includes(p));
  if ("favorite" in change) r.favorite = change.favorite && r.pool.includes(change.favorite) ? change.favorite : null;
  if (role === PROFILES.active) { savePrefs({ excluded:r.excluded.slice(), favorite:r.favorite }); return; }
  storeProfiles();
  publish(null);
}

  const roleData = role ? PROFILES.roles[role] : null;
  const backToSearch = () => { if (searchRef.current) searchRef.current.focus(); };
  // Choisir un rôle ici montre et modifie son pool, sans changer le rôle joué (sauf s'il n'y en a pas encore).
  const pickRole = r => { if (!PROFILES.active) switchRole(r, "manual"); setRole(r); setQuery(""); setSaved(null); };
  const playRole = () => { switchRole(role, "manual"); setSaved(null); };
  const apply = (r, list) => { if (r) saveMyProfile(r, list); };
  const addChampion = n => { apply(role, pool.concat(n)); setSaved({ text:t("pool.saved.added", { champion: n, role: ROLE_NAMES[role] }) }); };
  const removeChampion = n => {
    const back = { role, pool, excluded:roleData.excluded.slice(), favorite:roleData.favorite };
    apply(role, pool.filter(x => x !== n));
    setSaved({ text:t("pool.saved.removed", { champion: n, role: ROLE_NAMES[role] }), back });
  };
  // Annuler un retrait : pool, exclusions et favori du rôle tels qu'ils étaient.
  const undoRemove = () => {
    const back = saved && saved.back;
    if (!back) return;
    apply(back.role, back.pool);
    setRoleChoices(back.role, { excluded:back.excluded, favorite:back.favorite });
    setSaved(null);
    backToSearch();
  };
  const toggleFavorite = p => {
    const next = roleData.favorite === p ? null : p;
    setRoleChoices(role, { favorite:next });
    setSaved({ text: next ? t("pool.saved.favorite", { champion:label(p), role:ROLE_NAMES[role] }) : t("pool.saved.favoriteNone", { role:ROLE_NAMES[role] }) });
  };
  const toggleExcluded = p => {
    const on = !roleData.excluded.includes(p);
    setRoleChoices(role, { excluded: on ? roleData.excluded.concat(p) : roleData.excluded.filter(x => x !== p) });
    setSaved({ text:t(on ? "pool.saved.excluded" : "pool.saved.included", { champion:label(p), role:ROLE_NAMES[role] }) });
  };
  const editingOther = role && PROFILES.active && role !== PROFILES.active;
  const key = norm(query);
  const found = key ? NAMES.filter(n => champKeys(n).some(k => k.includes(key))).slice(0, 12) : [];
  const choices = found.filter(n => !pool.includes(n));
  const suggested = role ? championsForRole(role).filter(n => !pool.includes(n)).slice(0, 12) : [];
  const chip = (n, already) => already
    ? html`<span key=${n} className="pool-chip already" data-test="pool-already" data-champion=${n}><${Portrait} name=${n} size=${28} /><span>${n}</span><small>${t("pool.search.already")}</small></span>`
    : html`<button key=${n} type="button" data-test="pool-add" data-champion=${n} className="pool-chip" onClick=${() => { addChampion(n); setQuery(""); backToSearch(); }}><${Portrait} name=${n} size=${28} /><span>${n}</span></button>`;
  return html`<div className="view-page pool-page">
    <${ViewHead} title=${t("nav.pool")} sub=${t("pool.sub")} />
    <${PlayedRoleBar} />
    <div className="pool-layout">
      <${PoolRoleList} role=${role} onPick=${pickRole} />
      <div className="pool-main">
        <section className="box" data-test="pool-box" aria-labelledby="pool-title">
          <header className="pool-head">
            <div>
              <h2 id="pool-title" className="box-title">${role ? t("pool.box.title", { role:ROLE_NAMES[role] }) : t("pool.box.noRole")}${role ? html` <small className="num">${tp("pool.box.count", pool.length)}</small>` : null}</h2>
              ${editingOther ? html`<p className="set-hint flush" role="status" data-test="pool-editing">${t("pool.editing", { role: ROLE_NAMES[role], played: ROLE_NAMES[PROFILES.active] })} <button type="button" className="link-btn" data-test="pool-play-role" onClick=${playRole}>${t("pool.playRole")}</button></p>` : null}
              ${role ? null : html`<p className="set-hint flush" data-test="pool-need-role">${t("pool.needRole")}</p>`}
            </div>
            ${saved ? html`<p className="pool-saved" role="status" data-test="pool-saved">${saved.text}${saved.back ? html` <button type="button" className="ghost-btn" data-test="pool-undo" onClick=${undoRemove}>${t("common.cancel")}</button>` : null}</p>` : null}
          </header>
          <div className="pool-search-wrap">
            <input ref=${searchRef} className="pool-search" data-test="pool-search" type="search" value=${query} disabled=${!role} autoComplete="off" spellCheck="false" aria-label=${t("pool.search.label")} placeholder=${role ? t("pool.search.placeholder") : t("pool.search.placeholderNoRole")}
              onChange=${e => setQuery(e.target.value)}
              onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); if (choices[0]) { addChampion(choices[0]); setQuery(""); } } else if (e.key === "Escape" && query) { e.stopPropagation(); setQuery(""); } }} />
            ${role ? html`<p className="small">${t("pool.search.hint")}</p>` : null}
            ${key ? html`<div className="pool-list" data-test="pool-results">
              ${found.map(n => chip(n, pool.includes(n)))}
              ${!found.length ? html`<span className="set-hint flush">${t("pool.search.none")}</span>` : null}
            </div>` : null}
          </div>
          ${role && pool.length ? html`<table className="pool-table" data-test="pool-table">
            <thead><tr><th scope="col">${t("pool.table.champion")}</th><th scope="col">${t("pool.table.favorite")}</th><th scope="col">${t("pool.table.excluded")}</th><th scope="col"><span className="sr">${t("pool.table.remove")}</span></th></tr></thead>
            <tbody>${roleData.pool.map(p => { const n = label(p); return html`<tr key=${p} data-test="pool-row" data-champion=${n} className=${`${roleData.favorite === p ? "is-fav" : ""}${roleData.excluded.includes(p) ? " is-out" : ""}`.trim() || undefined}>
              <th scope="row"><span className="pool-name"><${Portrait} name=${n} size=${40} />${n}</span></th>
              <td><input type="radio" name=${`fav-${role}`} data-test="pool-favorite" data-champion=${n} checked=${roleData.favorite === p} aria-label=${t("pool.table.favoriteOf", { champion:n })} onClick=${() => toggleFavorite(p)} onChange=${() => {}} /></td>
              <td><input type="checkbox" data-test="pool-exclude" data-champion=${n} checked=${roleData.excluded.includes(p)} aria-label=${t("pool.table.excludedOf", { champion:n })} onChange=${() => toggleExcluded(p)} /></td>
              <td><button type="button" className="mini x" data-test="pool-remove" data-champion=${n} title=${t("pool.table.removeOne", { champion: n })} aria-label=${t("pool.table.removeOne", { champion: n })} onClick=${() => { removeChampion(n); backToSearch(); }}>×</button></td>
            </tr>`; })}</tbody>
          </table>
          <p className="small pool-table-help">${t("pool.table.help")}</p>` : role ? html`<p className="empty-note">${t("pool.table.empty")}</p>` : null}
        </section>
        ${role && suggested.length ? html`<section className="box box-pad" data-test="pool-suggested">
          <h2 className="box-title">${t("pool.suggest.title", { role:ROLE_NAMES[role] })} <small>${t("pool.suggest.help", { role:ROLE_NAMES[role] })}</small></h2>
          <div className="pool-list">${suggested.map(n => chip(n, false))}</div>
        </section>` : null}
        <section className="box box-pad" data-test="pool-backup">
          <h2 className="box-title">${t("pool.backup.title")}</h2>
          <p className="set-hint flush">${t("pool.backup.help")}</p>
          <${ProfileBackup} />
          <p className="set-hint flush">${t("pool.backup.rulesNote")}</p>
        </section>
      </div>
    </div>
  </div>`;
}

function JournalImport() {
  const [importNote, setImportNote] = useState("");
  const importJournal = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(text => {
      const incoming = JSON.parse(text);
      if (!Array.isArray(incoming)) throw new Error("format");
      const list = loadJournal();
      const known = new Set(list.map(x => x.id));
      const added = incoming.filter(x => x && x.id && x.picked && !known.has(x.id));
      saveJournal(list.concat(added).sort((a, b) => a.id - b.id));
      setImportNote(tp("journal.import.added", added.length));
      publish(null);
    }).catch(() => setImportNote(t("journal.import.refused")));
  };
  return html`<details className="set-more" data-test="journal-import">
    <summary>${t("stats.oldFile.title")}</summary>
    <h3>${t("journal.import.title")}</h3>
    <p className="small">${t("journal.import.help")}</p>
    <p><input type="file" data-test="import-journal" accept=".json,application/json" aria-label=${t("journal.import.label")} onChange=${importJournal} /></p>
    ${importNote ? html`<p className="small" data-test="journal-import-note">${importNote}</p>` : null}
  </details>`;
}

function StatsKpis() {
  const list = loadJournal(), played = list.filter(x => x.result === "win" || x.result === "loss");
  const wins = played.filter(x => x.result === "win").length, followed = list.filter(x => x.picked === x.suggested).length;
  const rows = historyRows(), when = window.DRAFT_HISTORY && window.DRAFT_HISTORY.generated;
  const kpi = (label, value, rest, test, extra) => html`<div data-test=${test}><span>${label}</span><b className="num">${value}</b>${rest ? html` <small>${rest}${extra || null}</small>` : null}</div>`;
  // B+ : sous MIN_GAMES parties terminées, jamais de pourcentage ; une jauge montre ce qui manque. Au-delà, le pourcentage, toujours avec son échantillon.
  const enough = played.length >= MIN_GAMES;
  const rate = enough ? html`<em className="kpi-rate num" data-test="kpi-rate">${t("stats.kpi.rate", { percent: pct({ wins, games: played.length }) })}</em>` : played.length ? html`<${SampleGauge} count=${played.length} />` : null;
  const dates = list.map(x => x.date).filter(Boolean).sort();
  const from = dates.length ? fmtDate(dates[0]) : "", to = dates.length ? fmtDate(dates[dates.length - 1]) : "";
  return html`<section className="kpis-wrap" data-test="stats-kpis-wrap">
    <div className=${`box kpis${list.length ? "" : " is-empty"}`} data-test="stats-kpis" aria-label=${t("stats.tabs.overview")}>
    ${kpi(t("stats.kpi.drafts"), list.length, "", "kpi-drafts")}
    ${kpi(t("stats.kpi.wins"), wins, tp("stats.kpi.winsOf", played.length), "kpi-wins", rate)}
    ${kpi(t("stats.kpi.followed"), followed, t("stats.kpi.followedOf", { count:list.length }), "kpi-followed")}
    ${kpi(t("stats.kpi.history"), rows ? rows.length : t("stats.kpi.none"), rows ? (when ? t("stats.kpi.historyWhen", { unit: tp("stats.kpi.historyUnit", rows.length), date: fmtDate(when) }) : tp("stats.kpi.historyUnit", rows.length)) : "", "kpi-history")}
    </div>
    <p className="stats-sample" data-test="stats-sample">${list.length
      ? html`<b className="num">${from === to ? t("stats.sample.periodOne", { date: from }) : t("stats.sample.period", { from, to })}</b><span className="num">${tp("stats.sample.played", played.length)}</span><span className=${enough ? "" : "stats-few"}>${t(enough ? "stats.sample.enough" : "stats.sample.few", { min: MIN_GAMES })}</span>`
      : html`<span>${t("stats.sample.none")}</span>`}</p>
  </section>`;
}

// Jauge de MIN_GAMES crans : parties terminées sur celles qu'il faut avant d'afficher un pourcentage.
function SampleGauge({ count }) {
  const n = Math.min(count, MIN_GAMES);
  return html`<span className="notches" role="img" aria-label=${tp("stats.gauge.aria", count, { min: MIN_GAMES })}>${Array.from({ length: MIN_GAMES }, (_, i) => html`<i key=${i} className=${i < n ? "on" : ""}></i>`)}</span>`;
}
