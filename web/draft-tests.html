<body>
<h1>Tests stratégiques du moteur DraftMid</h1>
<p>Chaque attente découle d'un principe de jeu, pas du score actuel. Un échec peut donc venir du moteur ou du principe : à examiner, pas à effacer. Le score sert à comparer les picks, ce n'est pas une probabilité.</p>
<div id="summary"></div>
<div id="out"></div>
<script>window.addEventListener("error", e => { document.title = "Test interrompu"; document.getElementById("out").insertAdjacentHTML("beforeend", "<div class=\"ko-line\">" + "ÉCHEC" + " : test interrompu, les vérifications suivantes ne se sont pas exécutées : " + e.message + "</div>"); });</script>
<script>try { localStorage.setItem("draftProfile", JSON.stringify({ role:"mid", pool:["TF", "Fizz", "Kog'Maw", "Xerath"] })); } catch (e) {}</script>
<script src="draft-role-rates.js"></script>
<script src="draft-champions.js"></script>
<script src="draft-role-sheet.js"></script>
<script src="draft-engine.js"></script>
<script src="draft-data.js"></script>
<script src="draft-providers.js"></script>
<script>
const scenarios = [];
const scenario = (name, why, enemies, mid, check) => scenarios.push({ name, why, enemies, mid, check });
const pos = (r, p) => r.ranking.findIndex(x => x.pick === p);
const impact = (r, p, key) => { const c = r.ranking.find(x => x.pick === p).criteria.find(x => x.key === key); return c ? c.impact : 0; };

scenario("Composition très tanky", "Kog'Maw fait des dégâts en % des PV, et Fizz n'a rien à éliminer.",
  ["Ornn", "Sejuani", "Galio", "Sion", "Braum"], "Galio", (r, t) => {
    t(pos(r, "Kog'Maw") === 0, "Kog'Maw arrive en tête");
    t(pos(r, "Fizz") >= 2, "Fizz n'est pas dans les deux premiers");
    t(impact(r, "Kog'Maw", "front") > 0, "le critère tanks favorise Kog'Maw");
  });
scenario("Beaucoup d'assassins", "Un champion immobile est la proie idéale des plongeurs.",
  ["Talon", "Kha'Zix", "Zed", "Samira", "Pyke"], "Zed", (r, t) => {
    t(pos(r, "Kog'Maw") >= 2 && pos(r, "Xerath") >= 2, "Kog'Maw et Xerath ne sont pas dans les deux premiers");
    t(impact(r, "Kog'Maw", "dive") < 0 && impact(r, "Xerath", "dive") < 0, "le critère plongeurs les pénalise tous les deux");
  });
scenario("Longue portée", "Xerath peut répondre à distance, Kog'Maw se fait toucher avant de frapper, et ces mages fragiles sont des cibles pour Fizz.",
  ["Jayce", "Nidalee", "Ziggs", "Varus", "Lux"], "Ziggs", (r, t) => {
    t(impact(r, "Xerath", "range") > 0, "le critère portée favorise Xerath");
    t(impact(r, "Kog'Maw", "range") < 0, "le critère portée pénalise Kog'Maw");
    t(impact(r, "Fizz", "targets") > 0, "Fizz a des cibles");
    t(pos(r, "Kog'Maw") !== 0, "Kog'Maw n'est pas en tête");
  });
scenario("Beaucoup de contrôles", "Un plongeur meurt s'il entre dans plusieurs contrôles ciblés.",
  ["Renekton", "Vi", "Lissandra", "Jinx", "Nautilus"], "Lissandra", (r, t) => {
    t(impact(r, "Fizz", "control") < 0, "le critère contrôles pénalise Fizz");
    t(pos(r, "Fizz") !== 0, "Fizz n'est pas en tête");
  });
scenario("Orientée engage", "Face à plusieurs engages, mieux vaut pouvoir jouer loin et revenir qu'être immobile.",
  ["Malphite", "Sejuani", "Galio", "Xayah", "Rakan"], "Galio", (r, t) => {
    t(impact(r, "TF", "control") > 0, "Twisted Fate est favorisé sur ce critère");
    t(impact(r, "Kog'Maw", "control") < 0 && impact(r, "Xerath", "control") < 0, "les champions immobiles sont pénalisés");
  });
scenario("Orientée poke", "Un assassin peut punir une équipe de poke fragile sans frontline.",
  ["Jayce", "Nidalee", "Zoe", "Ezreal", "Seraphine"], "Zoe", (r, t) => {
    t(pos(r, "Fizz") === 0, "Fizz arrive en tête");
    t(impact(r, "Kog'Maw", "range") < 0, "Kog'Maw reste pénalisé par la portée");
  });
scenario("Mixte équilibrée", "Sans profil dominant, le matchup mid doit peser le plus lourd.",
  ["Darius", "Vi", "Orianna", "Jinx", "Soraka"], "Orianna", (r, t) => {
    t(pos(r, "Fizz") === 0, "le 1er choix du tableau contre Orianna reste en tête");
    t(impact(r, "Fizz", "matchup") > 0, "le matchup l'explique");
  });
scenario("Bon matchup contre contrôles", "Vi et Lulu punissent Fizz malgré son bon matchup : le verdict doit rester ouvert, pas tranché en silence.",
  ["Darius", "Vi", "Orianna", "Jinx", "Lulu"], "Orianna", (r, t) => {
    t(impact(r, "Fizz", "matchup") > 0 && impact(r, "Fizz", "control") < 0, "l'avantage et le risque de Fizz sont tous les deux visibles");
    t(r.ranking[0].score - r.ranking[1].score < HOLD_GAP, "l'écart reste sous le seuil, donc affiché comme serré");
  });
scenario("Draft partielle, mid connu", "Peu d'informations : aucune règle de composition ne doit s'emballer.",
  ["Ahri"], "Ahri", (r, t) => {
    t(r.ranking.length === 4, "les 4 picks restent classés");
    t(impact(r, "Kog'Maw", "matchup") < 0, "le matchup est pris en compte");
    t(!r.ranking.some(p => p.criteria.some(c => c.key === "front" || c.key === "dive")), "aucun critère de composition n'est déclenché à tort");
  });
scenario("Mid inconnu", "Sans mid connu, on regarde quel pick a le moins de mauvais matchups, calculé depuis le tableau.",
  ["Ornn"], null, (r, t) => {
    t(r.ranking.every(p => p.criteria.some(c => c.key === "blind")), "le critère sécurité s'applique à tous");
    t(!r.ranking.some(p => p.criteria.some(c => c.key === "matchup")), "aucun matchup n'est inventé");
    const blind = p => impact(r, p, "blind");
    t(blind("TF") > blind("Fizz"), "le pick avec le moins de matchups à éviter est le mieux noté");
  });
scenario("Avantages et risques contradictoires", "Kog'Maw est bon contre 3 tanks mais à éviter contre Ahri : les deux doivent être visibles.",
  ["Ornn", "Sejuani", "Ahri", "Jinx", "Leona"], "Ahri", (r, t) => {
    t(impact(r, "Kog'Maw", "front") > 0, "avantage visible : tanks");
    t(impact(r, "Kog'Maw", "matchup") < 0, "risque visible : matchup");
    const k = r.ranking.find(p => p.pick === "Kog'Maw");
    t(k.why.some(w => w.v > 0) && k.why.some(w => w.v < 0), "les deux figurent dans les raisons");
  });
scenario("Presque ex æquo", "Exemple du brief : Twisted Fate et Kog'Maw ont des raisons opposées, le moteur doit le signaler.",
  ["Sett", "Vi", "Galio", "Samira", "Janna"], "Galio", (r, t) => {
    const gap = r.ranking[0].score - r.ranking[1].score;
    t(gap < HOLD_GAP, "l'écart reste sous le seuil, donc affiché comme serré");
    t(["TF", "Kog'Maw"].includes(r.ranking[0].pick) && ["TF", "Kog'Maw"].includes(r.ranking[1].pick), "Twisted Fate et Kog'Maw sont les deux premiers");
    const cmp = comparePicks(r.ranking[0], r.ranking[1]);
    t(cmp.decisive.length > 0, "la comparaison montre les critères qui font la différence");
  });
scenario("Champion pris en face", "Un champion déjà pris ne peut jamais être conseillé.",
  ["Fizz", "Ornn"], "Fizz", (r, t) => {
    t(pos(r, "Fizz") === -1, "Fizz n'est pas proposé");
    t(r.ranking.length === 3, "il reste 3 picks");
  });

const out = document.getElementById("out");
let fails = 0, total = 0;

function unitBlock(name, why, run) {
  const lines = [];
  const t = (ok, text) => { total++; if (!ok) fails++; lines.push(`<div class="${ok ? "" : "ko-line"}">${ok ? "OK" : "ÉCHEC"} : ${text}</div>`); };
  run(t);
  out.insertAdjacentHTML("beforeend", `<div class="case${lines.join("").includes("ÉCHEC") ? " ko" : ""}"><h2>${name}</h2><p class="why">${why}</p>${lines.join("")}</div>`);
}

unitBlock("Profils de joueur", "N'importe quel rôle et n'importe quel pool doivent donner un conseil complet, puis ton profil doit revenir à l'identique.", t => {
  const original = PROFILE;
  const letters = /^[hkdipqolgrnwetcE]*$/;
  t(NAMES.every(n => typeof CHAMPION_TRAITS[n] === "string"), "chaque champion a une fiche");
  t(Object.keys(CHAMPION_TRAITS).every(n => ROSTER[n] !== undefined && letters.test(CHAMPION_TRAITS[n])), "aucune fiche avec un nom ou une lettre inconnus");
  const team = ["Ornn", "Lee Sin", "Ahri", "Jinx", "Thresh"];
  const pools = { top:["Darius", "Malphite"], jungle:["Vi", "Amumu"], mid:["Ahri", "Zed"], adc:["Jinx", "Ezreal"], support:["Leona", "Soraka"] };
  const expected = { top:"Ornn", jungle:"Lee Sin", mid:"Ahri", adc:"Jinx", support:"Thresh" };
  Object.keys(pools).forEach(role => {
    applyProfile({ role, pool:pools[role] });
    t(guessMid(team) === expected[role], `${role} : l'adversaire direct est ${expected[role]}`);
    t(analyze(["Lux", "Garen"], null, true).ranking.length === 2, `${role} : les deux champions sont classés`);
    t(championsForRole(role).length >= 10, `${role} : des champions sont proposés`);
    const r = analyze(team, guessMid(team), true), texts = JSON.stringify(r.ranking.map(p => [p.criteria, buildPlan(p.pick, r.counts, guessMid(team), "Lee Sin"), winCondition(p.pick, r.counts), threatsFor(p.pick, r.counts), pickStyle(p.pick)]));
    t(!/undefined|NaN/.test(texts), `${role} : aucun texte incomplet`);
  });
  applyProfile({ role:"top", pool:["Darius", "Ahri"] });
  t(!matchupOf("Ahri"), "le tableau du mid ne s'applique pas à un autre rôle");
  t(analyze(["Ahri"], "Ahri", true).ranking.map(p => p.pick).join() === "Darius", "un champion pris en face sort du classement");
  applyProfile({ role:"mid", pool:["Ahri", "Fizz"] });
  t(analyze(["Lux"], "Lux", true).ranking.length === 2, "un pool mêlant champions du tableau et autres reste classé");
  applyProfile(null);
  t(PICKS.length === 0 && analyze(team, null, true).ranking.length === 0, "sans profil, aucun conseil inventé");
  applyProfile(original);
  t(PICKS.join() === "TF,Fizz,Kog'Maw,Xerath" && myRole() === "mid", "ton profil revient à l'identique");
});

unitBlock("Bilans par rôle", "Les bilans ne valent que pour le rôle calculé, et les noms particuliers de Riot doivent être reconnus.", t => {
  const original = PROFILE;
  window.MATCHUPS_LIVE = { role:"top", updated:"2026-11-04", games:900, pool: {
    darius: { wins:520, games:1000, vs:{ teemo:[20,100], ornn:[70,100], monkeyking:[62,100] } },
    monkeyking: { wins:500, games:1000, vs:{ teemo:[70,100], darius:[50,100] } }
  } };
  applyProfile({ role:"top", pool:["Darius", "Wukong"] });
  t(liveMatchup("Darius", "Teemo").gap < MATCHUP_AVOID_GAP, "le bilan s'applique au rôle calculé");
  t(liveMatchup("Darius", "Wukong").games === 100, "Wukong en face est retrouvé sous son nom Riot");
  t(liveMatchup("Wukong", "Teemo").gap > 0, "Wukong dans le pool est retrouvé sous son nom Riot");
  t(/sur 100 parties/.test(RULES.matchup("Darius", null, { mid:"Teemo" })[1]), "la raison cite les vraies parties");
  t(analyze(["Teemo"], "Teemo", true).ranking[0].pick === "Wukong", "le bilan change le classement");
  t(suggestBans()[0] === "Teemo" && /vraies parties/.test(banReason("Teemo")), "le ban vise le pire bilan");
  applyProfile({ role:"jungle", pool:["Darius", "Wukong"] });
  t(liveMatchup("Darius", "Teemo") === null, "un autre rôle n'utilise pas ces bilans");
  t(RULES.matchup("Darius", null, { mid:"Teemo" }) === null, "sans bilan, le critère reste neutre");
  delete window.MATCHUPS_LIVE;
  applyProfile(original);
  t(PICKS.join() === "TF,Fizz,Kog'Maw,Xerath", "ton profil revient à l'identique");
});

// Données contrôlées : aucun de ces chiffres ne décrit la méta réelle.
function withRoles(patches, now, run) {
  const saved = { live: window.ROLE_RATES_LIVE, known: knownPatch };
  window.ROLE_RATES_LIVE = patches ? { updated:"2026-11-04", games:0, regions:["Test"], patches } : undefined;
  knownPatch = now;
  try { run(); } finally { window.ROLE_RATES_LIVE = saved.live; knownPatch = saved.known; }
}
const bucket = champions => ({ games:100, collected:"2026-11-04", champions });
const pOf = (b, name) => { const c = b.candidates.find(x => x.name === name); return c ? c.p : null; };
const PURE = { vi:[0,300,0,0,0], garen:[300,0,0,0,0], jinx:[0,0,0,300,0], thresh:[0,0,0,0,300], ahri:[0,0,300,0,0], zed:[0,0,300,0,0] };

unitBlock("Déduction des rôles", "Toutes les répartitions sont pesées, sans rendre un rôle rare impossible ni afficher une certitude que les données ne donnent pas.", t => {
  withRoles({ "16.22": bucket(Object.assign({}, PURE, { ezreal:[0,0,8,292,0], yasuo:[150,0,150,0,0], yone:[150,0,150,0,0], vladimir:[150,0,150,0,0] })) }, "16.22", () => {
    let b = opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]);
    t(pOf(b, "Ahri") > .9 && b.confidence === "élevée", "1. un champion presque toujours mid : très probable");
    t(pOf(b, "Garen") < 1 && beliefScenarios(b)[0].mid === "Ahri", "1. la recommandation repose sur lui seul");
    b = opponentBelief(["Vladimir"]);
    t(Math.abs(b.candidates[0].share - .5) < .15 && b.confidence !== "élevée", "2. flex Top/Mid seul : aucune certitude");
    b = opponentBelief(["Vladimir", "Garen", "Vi", "Jinx", "Thresh"]);
    t(pOf(b, "Vladimir") > .8, "2. le même flex devient mid quand le top est pris");
    b = opponentBelief(["Garen", "Vi", "Ezreal", "Jinx", "Thresh"]);
    t(guessMid(["Garen", "Vi", "Ezreal", "Jinx", "Thresh"]) === "Ezreal" && pOf(b, "Ezreal") > .5, "3. un ADC devient mid si l'autre ADC occupe sa place");
    t(opponentBelief(["Ezreal"]).candidates[0].share > 0, "3. un rôle rare n'est jamais impossible");
    b = opponentBelief(["Yasuo", "Yone", "Vi", "Jinx", "Thresh"]);
    t(b.confidence === "faible" && beliefScenarios(b).length >= 2 && Math.abs(pOf(b, "Yasuo") - pOf(b, "Yone")) < .1, "4 et 12. deux répartitions presque égales : confiance faible, les deux sont gardées");
    t(identifiedOpponent(["Yasuo", "Yone", "Vi", "Jinx", "Thresh"]) === null, "confiance faible : personne n'est présenté comme l'adversaire");
    t(identifiedOpponent(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]) === "Ahri", "confiance suffisante : l'adversaire est nommé");
    t(identifiedOpponent(["Yasuo", "Yone", "Vi", "Jinx", "Thresh"], { Yone:"top" }) === "Yasuo", "une correction manuelle lève l'ambiguïté");
    const hidden = opponentBelief(["Vi", "Jinx"]);
    t(identifiedOpponent(["Vi", "Jinx"]) === null && beliefScenarios(hidden).some(x => x.mid === null), "adversaire pas encore révélé : personne n'est désigné");
    t(Math.abs(beliefScenarios(b).reduce((sum, x) => sum + x.p, 0) - 1) < 1e-9, "12. les hypothèses totalisent bien 1");
    b = opponentBelief(["Vi", "Jinx"]);
    t(b.unrevealed > .8 && guessMid(["Vi", "Jinx"]) === null && beliefScenarios(b).some(x => x.mid === null), "5. draft incomplète : le vrai adversaire peut ne pas être révélé");
    b = opponentBelief(["Ahri", "Vi"]);
    t(pOf(b, "Ahri") > .8 && b.unrevealed < .2, "5. un mid déjà révélé réduit cette possibilité");
    b = opponentBelief(["ChampionInconnu", "Vi"]);
    const unknown = b.candidates.find(x => x.name === "ChampionInconnu");
    t(!unknown.known && unknown.quality === "none" && !b.candidates.some(x => isNaN(x.p)), "6. un champion inconnu reste marqué sans donnée, sans chiffre inventé");
    t(guessMid(["ChampionInconnu"]) === null, "6. un champion inconnu n'est jamais supposé adversaire");
    t(!beliefScenarios(opponentBelief(["ChampionInconnu", "Vi", "Garen", "Jinx", "Thresh"])).some(x => x.mid === "ChampionInconnu"), "6. aucun matchup n'est évalué contre lui");
    b = opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"], { Ahri:"top", Garen:"mid" });
    t(pOf(b, "Garen") > .99, "ta correction manuelle l'emporte sur les statistiques");
    b = opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"], { Ahri:"top", Garen:"top" });
    t(b.candidates.every(x => !isNaN(x.p)) && pOf(b, "Ahri") > .5, "deux corrections contradictoires ne bloquent rien");
    t(!/%|\d/.test(JSON.stringify(beliefHypothesis(opponentBelief(["Yasuo", "Yone", "Vi", "Jinx", "Thresh"]), "Yasuo"))), "les hypothèses ne contiennent aucun pourcentage");
  });
  applyProfile({ role:"support", pool:["Leona"] });
  withRoles({ "16.22": bucket(PURE) }, "16.22", () => {
    t(pOf(opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]), "Thresh") > .9, "le même calcul vaut pour un autre rôle");
  });
  applyProfile({ role:"mid", pool:["TF", "Fizz", "Kog'Maw", "Xerath"] });
});

unitBlock("Fraîcheur et méta", "Le patch actuel passe d'abord, l'ancien sert de référence, et quelques parties ne font jamais une nouvelle méta.", t => {
  const row = { ahri:[0,0,300,0,0] };
  withRoles({ "16.22": bucket(row) }, "16.22", () => {
    const e = roleEvidence("Ahri");
    t(e.quality === "observed" && e.currentGames === 300 && e.effective === 300, "7. patch actuel : compté en entier, comme une observation");
  });
  withRoles({ "16.21": bucket(row) }, "16.22", () => {
    t(roleEvidence("Ahri").effective === 150 && roleEvidence("Ahri").currentGames === 0, "7. patch précédent : compte moitié moins, jamais comme du patch actuel");
  });
  withRoles({ "16.2": bucket(row) }, "16.22", () => {
    const e = roleEvidence("Ahri");
    t(e.quality === "old" || e.quality === "thin", "8. données très anciennes : signalées comme telles");
    t(e.games === 300, "8. rien n'est supprimé");
    t(opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]).confidence !== "élevée", "8. confiance plafonnée sur des données anciennes");
    t(dataReport().find(r => r.id === "riot-roles").stale, "8. la source est marquée ancienne dans les réglages");
  });
  withRoles({ "16.22": bucket({ thresh:[0,0,3,0,0] }) }, "16.22", () => {
    const e = roleEvidence("Thresh");
    t(e.quality === "thin" && e.shares[4] > e.shares[2], "9. trois parties ne renversent pas la référence");
    t(!e.shift, "9. trois parties ne font pas une méta");
  });
  withRoles({ "16.21": bucket({ yorick:[200,0,0,0,0] }), "16.22": bucket({ yorick:[0,0,60,0,0] }) }, "16.22", () => {
    const e = roleEvidence("Yorick");
    t(e.shift && ROLE_ORDER[e.shift.role] === "mid", "10. changement brutal : détecté avec assez de parties");
    t(e.shares[2] > .6, "10. le nouveau rôle prend le dessus sans réécrire le moteur");
    t(e.games === 260, "10. l'ancien patch reste conservé");
    t(roleChanges().some(c => c.name === "Yorick" && c.confirmed), "10. le champion est signalé dans les réglages");
  });
  withRoles({ "16.21": bucket({ yorick:[200,0,0,0,0] }), "16.22": bucket({ yorick:[0,0,6,0,0] }) }, "16.22", () => {
    const e = roleEvidence("Yorick");
    t(!e.shift && e.shares[0] > e.shares[2], "10. six parties différentes ne suffisent pas");
  });
  withRoles({ "16.21": bucket({ yorick:[100,0,0,0,0] }), "16.22": bucket({ yorick:[56,0,4,0,0] }) }, "16.22", () => {
    t(!roleEvidence("Yorick").shift, "10. une légère variation n'est pas un changement");
  });
});

unitBlock("Rôles écrits à la main", "Le repère sans licence à vérifier doit couvrir chaque champion, sauf ceux trop récents pour lui attribuer un rôle.", t => {
  t(NAMES.filter(n => !ROLE_SHEET[n]).join() === PROVISIONAL.slice().sort((a, b) => a.localeCompare(b, "fr")).join(), "seuls les champions provisoires sont absents");
  t(Object.keys(ROLE_SHEET).every(n => ROSTER[n] !== undefined && /^[tjmas]+$/.test(ROLE_SHEET[n])), "aucun nom ni rôle inconnu");
});

unitBlock("Sources", "Une source absente fait baisser la confiance, sans casser le conseil et sans chiffre inventé.", t => {
  withRoles(null, "16.22", () => {
    const report = dataReport(), live = report.find(r => r.id === "riot-roles");
    t(!live.available && live.games === null && live.patch === null, "11. source absente : aucun patch ni nombre inventés");
    t(typeof ROLE_RATES === "undefined" ? !report.find(r => r.id === "meraki-roles").available : report.find(r => r.id === "meraki-roles").stale && report.find(r => r.id === "meraki-roles").games === null, "la référence Meraki est absente, ou marquée ancienne si elle est présente");
    t(report.find(r => r.id === "written-matchups").kind === "heuristic" && report.find(r => r.id === "riot-roles").kind === "observed" && report.find(r => r.id === "meraki-roles").kind === "estimate", "observé, estimation et règle écrite restent distincts");
    t(opponentBelief(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]).confidence !== "élevée", "avec la seule référence, la confiance reste plafonnée");
    t(analyze(["Garen", "Vi", "Ahri", "Jinx", "Thresh"], guessMid(["Garen", "Vi", "Ahri", "Jinx", "Thresh"]), true).ranking.length === 4, "le conseil continue de fonctionner");

unitBlock("Recommandation sous incertitude", "Le classement pèse les hypothèses avec les mêmes règles, et ne suppose pas arbitrairement un seul adversaire.", t => {

  const a = analyze(enemies, "Akali", true), b = analyze(enemies, "Malzahar", true), mixed = analyze(enemies, "Akali", true, scenarios);
  ["TF", "Xerath"].forEach(p => {
    const sa = a.ranking.find(x => x.pick === p).score, sb = b.ranking.find(x => x.pick === p).score, sm = mixed.ranking.find(x => x.pick === p);
    t(Math.abs(sm.score - (.6 * sa + .4 * sb)) < 1e-9, `${p} : le score est la moyenne pondérée des hypothèses`);
    t(sm.byScenario.length === 2, `${p} : chaque hypothèse reste consultable`);
  });

  t(JSON.stringify(single.ranking) === JSON.stringify(plain.ranking), "une seule hypothèse donne exactement l'ancien calcul");
  const blind = analyze(["Vi", "Jinx"], null, true, [{ mid:"Vi", p:.5 }, { mid:null, p:.5 }]);
  t(blind.ranking.every(p => !isNaN(p.score)), "« pas encore choisi » est évalué comme un adversaire inconnu");
  const held = holdPick(mixed.ranking, mixed.ranking[1].pick);
  t(mixed.ranking[0].score - mixed.ranking[1].score < HOLD_GAP ? held === mixed.ranking[1].pick : held === mixed.ranking[0].pick, "la stabilité du verdict reste la même");

unitBlock("Cohérence du moteur", "Sur 400 drafts tirées avec une graine fixe : score, raisons et classement doivent toujours se répondre.", t => {
  let a = 987654321;
  const rnd = () => { a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const problems = { somme:0, ordre:0, raisons:0, pris:0, nan:0, stats:0, maintien:0, moyenne:0 };
  for (let i = 0; i < 400; i++) {
    const list = []; const size = 1 + i % 5;
    while (list.length < size) { const n = NAMES[Math.floor(rnd() * NAMES.length)]; if (!list.includes(n)) list.push(n); }
    const belief = opponentBelief(list), scenarios = beliefScenarios(belief);
    const r = analyze(list, identifiedOpponent(list), rnd() < .5, scenarios);
    r.ranking.forEach((p, k) => {
      if (isNaN(p.score)) problems.nan++;
      if (Math.abs(p.score - p.criteria.reduce((s, c) => s + c.impact, 0)) > 1e-9) problems.somme++;
      if (k && r.ranking[k - 1].score < p.score - 1e-6) problems.ordre++;
      if (list.includes(label(p.pick))) problems.pris++;
      const risk = mainRisk(p);
      if (positiveReasons(p).some(text => p.why.find(w => w.text === text).v <= 0) || (risk && p.why.find(w => w.text === risk).v >= 0)) problems.raisons++;
      if (p.criteria.some(c => /sur \d+ parties/.test(c.text))) problems.stats++;
      if (p.byScenario && Math.abs(p.score - p.byScenario.reduce((s, x) => s + x.p * x.score, 0)) > 1e-9) problems.moyenne++;
    });
    if (r.ranking.length && !r.ranking.some(p => p.pick === holdPick(r.ranking, "absent"))) problems.maintien++;
  }
  t(!problems.nan, "aucun score invalide");
  t(!problems.somme, "le score est toujours la somme des raisons");
  t(!problems.moyenne, "avec plusieurs hypothèses, le score reste leur moyenne pondérée");
  t(!problems.ordre, "le classement suit toujours les scores");
  t(!problems.raisons, "une raison positive n'est jamais un risque, et l'inverse");
  t(!problems.pris, "un champion pris en face n'est jamais conseillé");
  t(!problems.stats, "sans bilans calculés, aucune raison ne cite de parties : une règle n'est jamais présentée comme une statistique");
  t(!problems.maintien, "le maintien du verdict renvoie toujours un pick disponible");
});

// Invariants vérifiés sur des drafts au hasard, tirage reproductible.
let seed = 12345;
const rnd = n => { seed = (seed * 16807) % 2147483647; return seed % n; };
const names = Object.keys(ROSTER);
const issues = { somme:0, texte:0, signe:0, plan:0, double:0, aucun:0, carte:0, raison:0 };
const DRAFTS = 3000;
for (let i = 0; i < DRAFTS; i++) {
  const list = [];
  const n = rnd(6);
  while (list.length < n) { const c = names[rnd(names.length)]; if (!list.includes(c)) list.push(c); }
  const mids = list.filter(matchupOf);
  const mid = mids.length && rnd(4) ? mids[rnd(mids.length)] : null;
  const r = analyze(list, mid, rnd(5) !== 0);
  if (!r.ranking.length) issues.aucun++;
  r.ranking.forEach(p => {
    const sum = p.criteria.reduce((s, c) => s + c.impact, 0);
    if (Math.abs(sum - p.score) > 1e-9) issues.somme++;
    if (p.criteria.some(c => !c.text)) issues.texte++;
    if (p.why.some(w => /^(À éviter|Aucune cible|Ton équipe n'a pas)/.test(w.text) && w.v > 0)) issues.signe++;
    const keys = p.criteria.map(c => c.key);
    if (new Set(keys).size !== keys.length) issues.double++;
    const plan = buildPlan(p.pick, r.counts, mid, list[0]);
    if (![plan.lane, plan.mid, plan.fight].every(x => x.length >= 1 && x.length <= 3)) issues.plan++;
    if ([...plan.lane, ...plan.mid, ...plan.fight].some(x => /\b(undefined|null|false)\b/.test(x))) issues.plan++;
  });
  for (let a = 1; a < r.ranking.length; a++) {
    if (r.ranking[a - 1].score < r.ranking[a].score) issues.signe++;
    const lead = leadCriterion(r.ranking[a - 1], r.ranking[a]);
    if (r.ranking[a - 1].score - r.ranking[a].score > 1e-9 && (!lead || lead.diff <= 0)) issues.raison++;
  }
  r.ranking.forEach(p => { if (list.includes(label(p.pick))) issues.carte++; });
}
const labels = { somme:"le score est bien la somme des critères", texte:"chaque critère a une explication", signe:"le signe des raisons et le classement sont cohérents", double:"aucun critère compté deux fois pour un pick", plan:"chaque plan a 1 à 3 conseils complets", aucun:"il reste toujours un pick", carte:"un champion pris n'est jamais conseillé", raison:"le critère cité avantage bien le pick placé devant" };
const lines = Object.keys(labels).map(k => { total++; if (issues[k]) fails++; return `<div class="${issues[k] ? "ko-line" : ""}">${issues[k] ? "ÉCHEC" : "OK"} : ${labels[k]}${issues[k] ? ` (${issues[k]} cas)` : ""}</div>`; });
out.insertAdjacentHTML("beforeend", `<div class="case${lines.join("").includes("ÉCHEC") ? " ko" : ""}"><h2>Invariants sur ${DRAFTS} drafts au hasard</h2>${lines.join("")}</div>`);

// Part des premières places, pour repérer un favoritisme : ce n'est pas une mesure de qualité.
const firsts = {};
seed = 777;
for (let i = 0; i < DRAFTS; i++) {
  const list = [];
  while (list.length < 5) { const c = names[rnd(names.length)]; if (!list.includes(c)) list.push(c); }
  const mids = list.filter(matchupOf);
  const r = analyze(list, mids.length ? mids[rnd(mids.length)] : null, true);
  if (r.ranking[0]) firsts[r.ranking[0].pick] = (firsts[r.ranking[0].pick] || 0) + 1;
}
out.insertAdjacentHTML("beforeend", `<div class="case"><h2>Répartition des premières places</h2><p class="why">Drafts au hasard, peu réalistes : sert seulement à repérer un champion favorisé par construction.</p>${Object.entries(firsts).map(([k, v]) => `${label(k)} : ${v}`).join(", ")}</div>`);
document.getElementById("summary").textContent = `${total - fails} vérifications réussies sur ${total}.`;
document.title = fails ? `${fails} échec(s)` : "Tout est bon";
</script>
