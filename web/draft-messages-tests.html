<script>
// Relevé des messages réellement affichés par la vraie page, sur une série de drafts. Aucun score n'est modifié.
// Le relevé ne juge pas le style : il compte les messages vus, les rattache à l'inventaire, et note les explications
// qui contredisent le calcul (constats). Lancé par tools/extract-ui-messages.ps1, dans une copie de travail seulement.
const res = { version:1, runs:0, steps:0, observed:{}, hits:{}, unmatched:{}, constats:{}, coachRules:{}, errors:[] };
const wait = m => new Promise(r => setTimeout(r, m));
const settle = () => wait(25);
const clean = s => (s || "").replace(/\s+/g, " ").trim();
const PARAMS = new URLSearchParams(location.search);
const LIMIT = +PARAMS.get("limit") || 0;
const QUICK = PARAMS.get("quick") === "1";

// ---------- Inventaire ----------
const CATALOG = document.getElementById("catalog").textContent.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#")).map(line => {
  const parts = line.split(" | ");
  const [id, loc, ctx, tpl] = parts, re = parts.slice(4).join(" | ");
  let rx;
  if (re && re.startsWith("re:")) rx = new RegExp(re.slice(3));
  else if (tpl.startsWith("re:")) rx = new RegExp(tpl.slice(3));
  else {
    const hasVar = /\{[^}]*\}|\[\[/.test(tpl);
    const body = tpl.split(/(\{[^}]*\}|\[\[|\]\])/).map(p => p === "[[" ? "(?:" : p === "]]" ? ")?" : /^\{[^}]*\}$/.test(p) ? ".+?" : p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("");
    rx = new RegExp(!hasVar && tpl.length <= 24 ? `^${body}$` : body);
  }
  return { id, loc, ctx, tpl, rx, hidden:/\[non affiché\]/.test(ctx) };
}).filter(x => x.id);
// Un identifiant en double fausserait le rattachement : il est signalé comme une erreur du relevé.
CATALOG.map(x => x.id).filter((id, i, all) => all.indexOf(id) !== i).forEach(id => res.errors.push(`catalogue : identifiant en double ${id}`));

// ---------- Constats : l'explication affichée contredit-elle le calcul ? ----------
function constat(key, example) {
  const c = res.constats[key] || (res.constats[key] = { count:0, examples:[] });
  c.count++;
  if (c.examples.length < 4 && example) c.examples.push(example);
}

let NAMES = [];
let current = "";
function observe(text, where) {
  const t = clean(text);
  if (!t || t.length < 2) return;
  const o = res.observed[t] || (res.observed[t] = { n:0, where:[] });
  o.n++;
  if (o.where.length < 3 && !o.where.includes(where)) o.where.push(where);
}

// Texte d'un élément, sans les initiales qui remplacent un portrait absent (hors ligne).
function ownText(el) {
  let out = "";
  const walk = el.ownerDocument.createTreeWalker(el, 4);
  for (let n = walk.nextNode(); n; n = walk.nextNode()) if (!(n.parentElement && n.parentElement.closest(".init"))) out += n.textContent;
  return out;
}
function collect(doc, where) {
  doc.querySelectorAll("details").forEach(d => { d.open = true; });
  doc.body.querySelectorAll("*").forEach(el => {
    if (/^(SCRIPT|STYLE|PRE)$/i.test(el.tagName) || el.closest("svg") || el.closest(".init")) return;
    for (const n of el.childNodes) if (n.nodeType === 3 && n.textContent.trim()) { observe(ownText(el), where); break; }
    ["title", "aria-label", "placeholder"].forEach(a => { const v = el.getAttribute(a); if (v && v.trim()) observe(v, where + "@" + a); });
    if (el.tagName === "INPUT" && el.type === "search" && el.placeholder) observe(el.placeholder, where + "@placeholder");
  });
}

// ---------- La vraie page ----------
async function open(profile, panel, W, H, extra, folder) {
  localStorage.clear();
  if (profile) localStorage.setItem("draftProfile", JSON.stringify(profile));
  localStorage.setItem("draftPatch", "16.22");
  const f = document.createElement("iframe");
  f.width = W; f.height = H;
  f.src = (folder || "") + "index.html" + (panel ? "?panel=" + panel : "?x=1") + (extra || "");
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  await wait(300);
  const w = f.contentWindow;
  // Une erreur de rendu vide la page sans bruit : elle est relevée ici.
  w.addEventListener("error", e => res.errors.push(`erreur de page (${current}) : ${e.message}`));
  const original = w.console.error.bind(w.console);
  w.console.error = (...args) => { const t = args.map(a => a && a.message ? a.message : String(a)).join(" "); if (!/Failed to load resource|net::/.test(t)) res.errors.push(`console (${current}) : ${t.slice(0, 300)}`); original(...args); };
  w.eval(`window.$ = { get V(){return V}, get state(){return state}, get PREFS(){return PREFS}, analyze, commit, rerender, savePrefs, addEnemy, removeEnemy, setMid, clickRole, choosePick, setResult,
    coachData, essentialAdvice, hostState, historyProfile, opponentBelief, roleBelief, beliefScenarios, deriveSlots, comparePicks, whenBetter, matchupOf, label, myRole, saveMyProfile, draftApi,
    reset(){ state.enemies.length = 0; state.manualMid = null; state.held = null; state.roleOf = {}; state.targetRole = null; state.selected = null; state.notice = null; state.current = null; commit(); } }`);
  if (!NAMES.length) NAMES = w.eval("NAMES.slice()");
  return { f, w, d:f.contentDocument, $:w.$ };
}
const close = x => x.f.remove();
const text = e => e ? clean(e.textContent) : "";

async function useProfile(x, role, pool) {
  x.$.saveMyProfile(role, pool);
  x.$.savePrefs({ excluded:[], favorite:null });
  await settle();
}

// Constats calculés sur l'état courant. Chaque test refait le calcul, sans rien modifier.
// Les numéros B-xx renvoient au classement de docs/moteur/AUDIT-VOCABULAIRE.md. Après correction, leur compte doit tomber à 0.
function checks(x, where) {
  const $ = x.$, V = $.V, w = x.w, d = x.d;
  if (!V || V.none || !V.n) return;
  res.checked = res.checked || { steps:0, incomplete:0, ties:0, noFront:0, assumedShown:0, assumedThin:0, matchupLine:0, flexShown:0 };
  res.checked.steps++;
  if (V.n < 5) res.checked.incomplete++;
  if (V.tied) res.checked.ties++;
  if (!$.PREFS.assumeFront) res.checked.noFront++;
  if (d.querySelector(".assumed")) { res.checked.assumedShown++; if (V.n <= 2) res.checked.assumedThin++; }
  const ranking = V.res.ranking, first = ranking[0];
  const tag = `${current} [${V.n}/5, ${$.myRole()}]`;
  const shownEntry = ranking.find(p => p.pick === V.shown);
  const heldNotFirst = !V.tied && first && V.shown !== first.pick && !(first.tiedWith || []).includes(V.shown);
  if (heldNotFirst) {
    constat("Contexte : nom affiché classé derrière le 1er", `${tag} ${$.label(V.shown)} affiché, ${$.label(first.pick)} 1er (écart ${(first.score - shownEntry.score).toFixed(2)})`);
    const advice = $.coachData().advice;
    const close = advice && advice.items.find(i => i.id === "draft.close");
    const esc = n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (close && (new RegExp(esc($.label(V.shown)) + " (passe devant|mène)").test(close.title + " " + close.text) || /Écart de -/.test(close.text))) constat("B-01 « choix serré » : le nom affiché « passe devant » ou écart négatif", `${tag} ${close.text}`);
    const conflict = advice && advice.items.find(i => i.id === "draft.conflict");
    if (conflict && /reste devant|Le score reste le meilleur/.test(conflict.text)) constat("B-01 (draft.conflict) « reste devant / score le meilleur » pour un pick qui n'est pas 1er", `${tag} ${conflict.text}`);
    const choices = $.coachData().choices;
    if (choices && choices.strategic && choices.strategic.label === "Meilleur choix pour la draft") constat("B-02 « Meilleur choix pour la draft » sur un pick qui n'est pas 1er", `${tag} ${choices.strategic.champions.join(", ")}`);
    const alt = advice && advice.items.find(i => i.id === "champ.alternative");
    if (alt && /Aucun changement simple/.test(alt.text)) constat("B-23 « Quand préférer » : aucun changement ne le fait passer devant, alors qu'il est déjà devant", `${tag} ${alt.title} ${alt.text}`);
  }
  if (V.tied) {
    const worst = p => Math.round(Math.min(0, ...p.why.map(w => w.v)) * 1e6);
    const entries = V.tied.map(t => ranking.find(p => p.pick === t));
    if (new Set(entries.map(worst)).size > 1 && /n'a pas de sens|ordre alphabétique|ordre est alphabétique/.test(d.getElementById("root").textContent)) constat("B-04 égalité départagée par le risque, texte « alphabet / ordre sans sens »", `${tag} ${V.tied.map($.label).join(" = ")} (risques ${entries.map(e => (worst(e) / 1e6).toFixed(2)).join(" / ")})`);
  }
  const posTexts = (V.tied ? V.commonReasons : V.reasons) || [];
  posTexts.forEach(t => { if (/éviter/i.test(t)) constat("B-08 « À éviter » parmi les raisons positives", `${tag} ${t}`); });
  posTexts.concat(V.risk ? [V.risk] : []).forEach(t => { if (/ · /.test(t)) constat("B-08 raison mélangeant deux hypothèses sans les nommer", `${tag} ${t}`); });
  // Adversaire direct annoncé avec peu d'informations.
  // B-05 : avec 1 ou 2 champions révélés, l'adversaire nommé est une hypothèse, jamais « probable » ni « presque sûr » (étiquette, ligne d'adversaire).
  const assumed = d.querySelector(".assumed");
  const levelWord = /(très probable|presque sûr|\(probable\)| probable$)/;
  if (assumed && levelWord.test(text(assumed)) && V.n <= 2) constat(`B-05 « ${text(assumed)} » avec ${V.n} champion(s) révélé(s)`, `${tag} ${$.state.enemies.join(", ")} → ${V.mid}`);
  d.querySelectorAll(".opp-line, .hint.warn").forEach(e => { if (V.mid && V.n <= 2 && levelWord.test(text(e))) constat(`B-05 ligne d'adversaire « probable » avec ${V.n} champion(s) révélé(s)`, `${tag} ${text(e)}`); });
  // B-06 : personne d'identifié, la ligne du joueur montre un champion sans « ? » (ou l'ancien « non identifié »).
  d.querySelectorAll(".role.is-mid").forEach(row => {
    const who = text(row.querySelector(".role-name")), lab = text(row.querySelector(".assumed"));
    if (who && !V.mid && (!/\?/.test(lab) || /non identifié$/.test(lab))) constat("B-06 champion placé dans le rôle du joueur sans « ? » alors que personne n'est identifié", `${tag} ${who} : « ${lab} »`);
  });
  // B-06 : rôles affichés contre la répartition la plus probable, recalculée ici indépendamment (produit des parts de roleBelief).
  try {
    const slots = $.deriveSlots(), order = ["top", "jungle", "mid", "adc", "support"];
    const fixed = Object.assign({}, $.state.roleOf || {}); if (V.mid) fixed[V.mid] = $.myRole();
    const belief = $.roleBelief($.state.enemies, fixed), team = belief.team;
    const share = (i, r) => belief.evidence[i].shares[r];
    let best = 0;
    const walk = (i, used, w, lock) => { if (i === team.length) { best = Math.max(best, w); return; } order.forEach((role, r) => { if (!(used & (1 << r)) && (!lock || !fixed[team[i]] || fixed[team[i]] === role)) walk(i + 1, used | (1 << r), w * share(i, r), lock); }); };
    walk(0, 0, 1, true); if (!best) walk(0, 0, 1, false);
    const shownRole = n => Object.keys(slots).find(r => slots[r] === n);
    const product = team.reduce((w, n, i) => w * (shownRole(n) ? share(i, order.indexOf(shownRole(n))) : 0), 1);
    if (Math.abs(product - best) > 1e-9 * Math.max(best, 1e-12)) constat("B-06 rôles affichés différents de la répartition la plus probable du calcul", `${tag} ${team.map(n => `${n} ${shownRole(n) || "absent"}`).join(", ")}`);
    // Contexte : rôle affiché moins probable que le meilleur rôle pris seul (conflit entre champions). Doit alors porter une marque d'incertitude.
    team.forEach((name, i) => {
      if (fixed[name]) return;
      const shown = shownRole(name), m = belief.marginals[i], top = order[m.indexOf(Math.max(...m))];
      if (!shown || shown === top || m[order.indexOf(top)] - m[order.indexOf(shown)] < .1) return;
      const row = [...d.querySelectorAll(".role")].find(r => text(r.querySelector(".role-name")) === name);
      const mark = row ? text(row.querySelector(".role-flex") || row.querySelector(".assumed")) : "";
      if (row && !/(\?| ou )/.test(mark)) constat("B-06 rôle affiché moins probable qu'un autre, sans marque d'incertitude", `${tag} ${name} affiché ${shown}, calcul ${top} (${(m[order.indexOf(top)] * 100).toFixed(0)} % contre ${(m[order.indexOf(shown)] * 100).toFixed(0)} %)`);
    });
  } catch (e) { res.errors.push("B12 " + e.message); }
  // B-09 : le texte de l'analyse doit suivre le calcul du pick affiché (matchup présent = moyenne des hypothèses).
  // Texte que l'onglet Analyse affiche (même fonction que la page), complété par le DOM s'il est ouvert.
  const analysis = (!V.mid ? w.eval("matchupUncertainText()") + " " : "") + text(d.querySelector(".tab-body"));
  const shownHasMatchup = shownEntry && shownEntry.criteria.some(c => c.key === "matchup");
  if (!V.mid && /: le matchup (est une moyenne des hypothèses|ne compte pas encore)\./.test(analysis)) { res.checked.matchupLine++; if (shownHasMatchup) res.checked.matchupAveraged = (res.checked.matchupAveraged || 0) + 1; }
  if (d.querySelector(".role-flex")) res.checked.flexShown++;
  if (!V.mid && /n'est pas évalué\.|inconnu : le matchup/.test(analysis.replace(/Pas de données de matchup contre [^:]+: ce critère n'est pas évalué\./g, "")) && shownHasMatchup) constat("B-09 « inconnu : le matchup direct n'est pas évalué » alors que les hypothèses le comptent", `${tag} ${shownEntry.criteria.find(c => c.key === "matchup").text}`);
  if (!V.mid && /le matchup ne compte pas encore/.test(analysis) && shownHasMatchup) constat("B-09 « le matchup ne compte pas encore » alors que les hypothèses le comptent", `${tag} ${shownEntry.criteria.find(c => c.key === "matchup").text}`);
  if (!V.mid && /le matchup est une moyenne des hypothèses/.test(analysis) && !shownHasMatchup) constat("B-09 « moyenne des hypothèses » alors que le matchup ne compte pas", tag);
  if (V.without) {
    const sc = V.belief && V.n ? w.eval("beliefScenarios")(V.belief) : null;
    const real = $.analyze($.state.enemies, V.mid, false, sc).ranking[0];
    if (real && real.pick !== V.without) constat("B-10 « Sans frontline : X » calculé sans les hypothèses, autre résultat avec", `${tag} affiché ${$.label(V.without)}, avec hypothèses ${$.label(real.pick)}`);
  }
  // whenBetter et l'indicateur provisoire recalculent sans hypothèses.
  const plain = $.analyze($.state.enemies, V.mid, $.PREFS.assumeFront).ranking;
  if (plain[0] && first && plain[0].pick !== first.pick && !V.tied && !first.byScenario && $.PREFS.assumeFront) constat("B-10 classement sans hypothèses (Comparer, « passerait devant ») différent du classement affiché", `${tag} affiché ${$.label(first.pick)}, recalcul ${$.label(plain[0].pick)}`);
  if (!$.PREFS.assumeFront) {
    const rival = V.rival || ranking[1];
    if (rival && shownEntry) {
      const when = $.whenBetter(rival.pick, V.shown, $.state.enemies, V.mid);
      if (false && when.includes("si ton équipe n'a pas de frontline")) constat("B-10 « passerait devant si ton équipe n'a pas de frontline » alors que c'est déjà le réglage", `${tag} ${$.label(rival.pick)}`);
    }
  }
  const advice = $.coachData().advice;
  if (advice) {
    advice.items.forEach(i => { const k = i.id + ":" + i.level; res.coachRules[k] = (res.coachRules[k] || 0) + 1; });
    const written = advice.items.find(i => i.id === "matchup.written");
    if (written && V.mid) {
      const m = $.matchupOf(V.mid), pick = shownEntry && shownEntry.pick;
      const good = /bon choix/.test(written.title), avoid = m && (m.avoid || "").split(", ").includes(pick), top = m && (m.first === pick || m.second === pick);
      if ((good && avoid) || (!good && top)) constat("Contrôle titre du matchup écrit contraire au tableau pour l'adversaire nommé (moyenne des hypothèses)", `${tag} ${written.title}`);
    }
    const unknown = advice.items.find(i => i.id === "matchup.unknown");
    if (unknown && (/les deux cas/.test(unknown.title) || / ou /.test(unknown.title)) && !/ ou /.test(unknown.text) && !/ et /.test(unknown.text) && !/, /.test(unknown.text)) constat("B-14 « prépare les deux cas » avec un seul candidat nommé", `${tag} ${unknown.text}`);
    const blindCrit = shownEntry && shownEntry.criteria.some(c => c.key === "blind");
    if (unknown && /sans adversaire connu|sécurité du pick en blind/.test(unknown.text) && ($.myRole() !== "mid" || !blindCrit)) constat("B-12 critère « sans adversaire connu » annoncé alors qu'il ne s'applique pas", `${tag} ${unknown.text}`);
    const control = advice.items.find(i => i.id === "comp.control");
    const cc = shownEntry && shownEntry.criteria.find(c => c.key === "control");
    if (control && cc && cc.impact < 0 && /engages contre un champion lent/.test(cc.text) && /Si tu fonces|contrôles ciblés visibles/.test(control.text)) constat("B-15 « peuvent t'immobiliser / Si tu fonces » pour un malus d'engage sur un champion lent", `${tag} ${control.title} — ${control.text}`);
    const assassins = advice.items.find(i => i.id === "comp.assassins");
    if (assassins && /Il baisse avec une frontline alliée/.test(assassins.text)) constat("B-13 risque de plongeurs « baisse avec une frontline alliée » : le calcul n'en tient pas compte", tag);
    const conflict = advice.items.find(i => i.id === "draft.conflict");
    if (conflict && !heldNotFirst && ranking.length > 1 && /reste devant|reste le meilleur/.test(conflict.text) && shownEntry && shownEntry.tiedWith && shownEntry.tiedWith.length) constat("Contrôle « reste devant » alors qu'il est à égalité", tag);
  }
  if (V.change && V.change.reason && !/est pris en face|Il menait déjà/.test(V.change.reason)) {
    const now = ranking.find(p => p.pick === V.shown), old = ranking.find(p => $.label(p.pick) === V.change.from);
    if (now && old) {
      const row = $.comparePicks(now, old).decisive.find(r => r.diff > 0);
      if (row && row.textA !== V.change.reason && row.textB !== V.change.reason && !V.change.reason.includes(`« ${row.label} »`) && !(now.criteria.find(c => c.key === row.key) && w.signedText(now.criteria.find(c => c.key === row.key), 1) === V.change.reason)) constat("B-16 raison du changement de conseil différente du critère décisif", `${tag} ${V.change.from} → ${V.change.to} : « ${V.change.reason} », décisif « ${row.label} »`);
    }
  }
  if (V.n < 5 && d.getElementById("root").textContent.includes("basé sur les 5 champions adverses")) constat("B-11 « basé sur les 5 champions adverses » avec une draft incomplète", tag);
  if (V.clear && ranking.length > 2) {
    const others = ranking.filter(p => p.pick !== V.shown && !(V.tied || []).includes(p.pick));
    if (others[0] && shownEntry.score - others[0].score < 2) constat("B-24 « Choix net » alors qu'un autre pick est à moins de 2 points", `${tag} ${$.label(V.shown)} / ${$.label(others[0].pick)}`);
  }
}

// Panneau droit : étiquette « Recommandé » sur un nom qui n'est pas 1er.
function checksRight(x) {
  const $ = x.$, V = $.V;
  if (!V || V.none || !V.n || V.tied) return;
  const first = V.res.ranking[0];
  if (first && first.pick !== V.shown && !(first.tiedWith || []).includes(V.shown) && text(x.d.querySelector(".p-chip")) === "Recommandé") constat("B-03 étiquette « Recommandé » sur un nom qui n'est pas 1er", `${current} ${$.label(V.shown)} / ${$.label(first.pick)}`);
}

    for (const phase of ["Mid game", "Teamfights"]) { const b = [...x.d.querySelectorAll(".seg-tab")].find(e => text(e) === phase); if (b) { b.click(); await settle(); collect(x.d, where + " plan"); } }
    await clickTab(x, "matchups"); collect(x.d, where + " duel");

  }
  await clickTab(x, "plan");
}

async function runScenarios(list, panel, W, H, opts) {
  opts = opts || {};
  const x = await open(null, panel, W, H);
  for (const s of list) {
    current = `${opts.tag || panel || "fenêtre"} ${s.id}`;
    try {
      await useProfile(x, s.role, s.pool);
      if (opts.prefs) { x.$.savePrefs(opts.prefs); await settle(); }
      if (opts.before) await opts.before(x, s);
      x.$.reset(); await settle();
      for (let k = 0; k < s.enemies.length; k++) {
        x.$.addEnemy(s.enemies[k]); await settle();
        res.steps++;
        const last = k === s.enemies.length - 1;
        if (opts.each) await opts.each(x, s, k);
        if (panel === "right" || panel === "compact") { collect(x.d, current); checksRight(x); }
        else await fullTour(x, current, last && !QUICK);
        if (!panel) checks(x, current);
      }
      if (opts.after) await opts.after(x, s);
      res.runs++;
    } catch (e) { res.errors.push(current + " : " + e.message); }
  }
  close(x);
}

    const parsed = JSON.parse(config); if (parsed.roles) { parsed.roles.top = { pool:["Darius", "Garen"], excluded:[], favorite:"Ornn" }; delete parsed.roles.support; }
    await drop(profileInput(), "profils.json", JSON.stringify(parsed));
    const undo = [...x.d.querySelectorAll("button")].find(b => text(b) === "Annuler le dernier import"); if (undo) { undo.click(); await settle(); collect(x.d, current); }
    await drop(journalInput(), "journal.json", "{}");
    await drop(journalInput(), "journal.json", JSON.stringify([{ id:1, date:"2026-10-01T10:00:00Z", picked:"Fizz", suggested:"TF", enemies:["Ahri"], mid:"Ahri", result:"win" }]));
    close(x);
  }
  // Statistiques importées fictives : copie de la page avec un draft-stats.js SYNTHÉTIQUE (créée par l'outil).
  try {
    const x = await open({ role:"mid", pool:["TF", "Fizz", "Kog'Maw", "Xerath"] }, null, 1280, 720, "", "stats/");
    if (x.w.DRAFT_STATS) {
      current = "statistiques";
      for (const s of BUILTIN.filter(s => s.role === "mid").slice(0, 3)) { x.$.reset(); for (const n of s.enemies) { x.$.addEnemy(n); await settle(); collect(x.d, current); } await fullTour(x, current, true); }
      x.$.reset(); ["Vex"].forEach(n => x.$.addEnemy(n)); await settle(); collect(x.d, current);
    }
    close(x);
  } catch (e) { res.errors.push("statistiques : " + e.message); }
  // Réglages, avec les sections de l'application.
  {
    const x = await open({ role:"mid", pool:["TF", "Fizz", "Kog'Maw", "Xerath"] }, null, 1280, 900, "&tab=settings"); current = "réglages";
    collect(x.d, "réglages");
    Object.assign(x.$.hostState, { available:true, lcuConfirmed:true, lcuEnabled:true, lcuStatus:"waiting", hotkey:true, updateStatus:"", phase:"Client LoL fermé", placement:"Panneaux placés de chaque côté du client." });
    x.$.rerender(); await settle(); collect(x.d, "réglages application");
    for (const s of ["connected", "failed", "off"]) { x.$.hostState.lcuStatus = s; x.$.rerender(); await settle(); collect(x.d, "réglages lcu"); }
    Object.assign(x.$.hostState, { rolesRunning:true, historyRunning:true, updateRunning:true }); x.$.rerender(); await settle(); collect(x.d, "réglages calcul");
    x.$.hostState.historyRunning = false; x.$.hostState.historyHasMore = true; x.$.hostState.hotkey = false; x.$.rerender(); await settle(); collect(x.d, "réglages");
    x.w.eval("handleAssignedRole('jungle')"); await settle(); collect(x.d, "rôle attribué");
    close(x);
    const r = await open({ role:"mid", pool:["TF", "Fizz"] }, "right", 320, 720); current = "panneau";
    r.$.hostState.available = true; r.$.hostState.compact = false; r.w.eval("window.chrome = window.chrome || {}"); r.$.rerender(); await settle(); collect(r.d, "panneau vide"); close(r);
  }
  // Données calculées fictives : bilans de matchups et rôles observés. Données SYNTHÉTIQUES, jamais réelles.
  {
    const x = await open({ role:"mid", pool:["TF", "Fizz", "Kog'Maw", "Xerath"] }, null, 1280, 720); current = "données fictives";
    const sheet = x.w.eval("typeof ROLE_SHEET !== 'undefined' ? ROLE_SHEET : null") || {};
    const order = ["t", "j", "m", "a", "s"], champions = {};
    Object.keys(sheet).forEach(n => { const row = [0, 0, 0, 0, 0]; const first = String(sheet[n])[0]; if (order.includes(first)) row[order.indexOf(first)] = 400; champions[x.w.eval(`riotKey(${JSON.stringify(n)})`)] = row; });
    x.w.ROLE_RATES_LIVE = { version:2, updated:"2026-11-01", games:5000, regions:["EUW"], champions, patches:{ "16.22":{ games:5000, collected:"2026-11-01", champions } } };
    const live = role => { const pool = {}; x.w.eval("PICKS.map(p => riotKey(label(p)))").forEach((k, i) => { const vs = {}; NAMES.forEach((n, j) => { vs[x.w.eval(`riotKey(${JSON.stringify(n)})`)] = [Math.round(60 * (0.42 + ((i * 7 + j * 13) % 17) / 100)), j % 5 === 0 ? 20 : 60]; }); pool[k] = { wins:5000, games:10000, vs }; }); return { role, updated:"2026-11-01", games:20000, regions:["EUW"], patches:{ "16.22":pool }, pool }; };
    x.w.MATCHUPS_LIVE = live("mid"); x.$.commit(); await settle();
    for (const s of BUILTIN.filter(s => s.role === "mid").slice(0, 3)) { current = "données fictives " + s.id; x.$.reset(); for (const n of s.enemies) { x.$.addEnemy(n); await settle(); checks(x, current); } await fullTour(x, current, true); }
    await clickTab(x, "matchups"); const q = x.d.getElementById("q"); if (q) { const set = Object.getOwnPropertyDescriptor(x.w.HTMLInputElement.prototype, "value").set; set.call(q, "ahri"); q.dispatchEvent(new x.w.Event("input", { bubbles:true })); await settle(); collect(x.d, "duel mesuré"); }
    await useProfile(x, "top", ["Darius", "Garen", "Malphite"]); x.w.MATCHUPS_LIVE = live("top"); x.$.commit(); await settle();
    const top = BUILTIN.find(s => s.id === "TOP-range"); x.$.reset(); for (const n of top.enemies) { x.$.addEnemy(n); await settle(); checks(x, "données fictives top"); } await fullTour(x, "données fictives top", true);
    await clickTab(x, "matchups"); collect(x.d, "duel hors tableau");
    { const q2 = x.d.getElementById("q"); if (q2) { const set = Object.getOwnPropertyDescriptor(x.w.HTMLInputElement.prototype, "value").set; set.call(q2, "a"); q2.dispatchEvent(new x.w.Event("input", { bubbles:true })); await settle(); collect(x.d, "duel hors tableau"); } }
    x.w.MATCHUPS_LIVE = live("mid"); x.$.commit(); await settle(); await clickTab(x, "matchups"); collect(x.d, "duel autre rôle");
    const roles = JSON.stringify(x.w.ROLE_RATES_LIVE), topLive = JSON.stringify(live("top")), midLive = JSON.stringify(live("mid"));
    close(x);
    for (const [label, data] of [["réglages données", topLive], ["réglages données mid", midLive]]) {
      const s = await open({ role:"mid", pool:["TF", "Fizz"] }, null, 1280, 900, "&tab=settings"); current = label;
      s.w.ROLE_RATES_LIVE = s.w.JSON.parse(roles); s.w.MATCHUPS_LIVE = s.w.JSON.parse(data); s.$.hostState.available = true; s.$.commit(); s.$.rerender(); await settle(); collect(s.d, label); if (PARAMS.get("debug")) res.errors.push(label + " : " + s.d.body.innerText.slice(0, 3000)); close(s);
    }
  }
  // Historique fictif : expérience, résultats, incertitudes.
  {
    const hist = (pos, list) => { const rows = []; list.forEach(([champ, n, wins, old]) => { for (let i = 0; i < n; i++) rows.push({ id:champ + i, acct:"Test#TEST", time:Date.now() - (i + 1 + (old || 0)) * 864e5, patch:"16.22", sec:1800, champ, pos, win:(i * 7) % n < wins, k:5, d:4, a:6, mid:"", enemies:[] }); }); return { generated:new Date().toISOString(), accounts:["Test#TEST"], rows }; };
    const cases = [["mid", ["TF", "Fizz", "Kog'Maw", "Xerath"], "MIDDLE", [["TwistedFate", 120, 80], ["Fizz", 12, 4], ["Xerath", 40, 10, 90], ["KogMaw", 100, 25]], ["Malzahar", "Ornn", "Rengar"]],
      ["mid", ["TF", "Fizz", "Kog'Maw", "Xerath"], "MIDDLE", [["TwistedFate", 100, 80], ["Fizz", 100, 25], ["Xerath", 100, 50], ["KogMaw", 100, 50]], ["Azir", "Ornn", "Lee Sin", "Jinx", "Thresh"]],
      ["jungle", ["Viego", "Master Yi"], "JUNGLE", [["Viego", 50, 25], ["MasterYi", 45, 22]], ["Ornn", "Sion", "Maokai", "Jinx", "Thresh"]],
      ["top", ["Garen", "Malphite"], "TOP", [["Garen", 3, 2]], ["Ornn", "Lee Sin", "Ahri"]],
      ["support", ["Thresh", "Leona", "Lulu"], "UTILITY", [["Thresh", 40, 20, 60], ["Leona", 35, 18, 70]], ["Nautilus", "Jinx", "Qiyana"]],
      ["top", ["Darius", "Garen", "Malphite"], "TOP", [["Darius", 100, 52], ["Garen", 8, 4], ["Sion", 120, 60]], ["Sett", "Vi", "Galio", "Samira", "Janna"]],
      ["adc", ["Jinx", "Caitlyn", "Ezreal"], "BOTTOM", [["Caitlyn", 60, 20], ["Jinx", 5, 3]], ["Zed", "Kha'Zix", "Leona"]]];
    for (const [role, pool, pos, list, enemies] of cases) {
      const x = await open({ role, pool }, null, 1280, 720); current = "historique " + role;
      x.w.DRAFT_HISTORY = hist(pos, list); x.$.historyProfile.done = false; x.$.historyProfile.value = null; x.$.commit(); await settle();
      for (const n of enemies) { x.$.addEnemy(n); await settle(); }
      checks(x, current); await fullTour(x, current, true);
      const r = await open({ role, pool }, "right", 320, 720); r.w.DRAFT_HISTORY = x.w.DRAFT_HISTORY; r.$.historyProfile.done = false; r.$.commit(); for (const n of enemies) r.$.addEnemy(n); await settle(); collect(r.d, current + " panneau"); close(r);
      close(x);
    }
  }
}

(async () => {
  try {
    const dev = (window.SCENARIOS_DEV || []).map(s => ({ id:s.id, role:s.joueur.role, pool:s.joueur.pool, enemies:s.adversaires }));
    const list = BUILTIN.concat(LIMIT ? dev.slice(0, LIMIT) : dev);
    await runScenarios(list, null, 1280, 720);
    await runScenarios(BUILTIN.concat(dev.slice(0, LIMIT || 60)), null, 1280, 720, { tag:"sans frontline", prefs:{ assumeFront:false } });
    await runScenarios(list, "right", 320, 720);
    await runScenarios(BUILTIN.concat(dev.slice(0, Math.min(40, LIMIT || 40))), "compact", 282, 576);
    await runScenarios(BUILTIN.slice(0, 4), "left", 300, 720);
    await special();
  } catch (e) { res.errors.push("général : " + e.message); }
  // Rattachement à l'inventaire.
  const visible = CATALOG.filter(c => !c.hidden);
  Object.keys(res.observed).forEach(t => {
    const ids = CATALOG.filter(c => c.rx.test(t)).map(c => c.id);
    ids.forEach(id => { const h = res.hits[id] || (res.hits[id] = { n:0, example:t }); h.n += res.observed[t].n; });
    if (!ids.length) {
      let tpl = t;
      NAMES.slice().sort((a, b) => b.length - a.length).forEach(n => { tpl = tpl.split(n).join("{C}"); });
      tpl = tpl.replace(/[+-−]?\d+([,.]\d+)?/g, "{N}");
      if (!/^[{}CN ,·.:/%()×✓›⧉▭⚙+−-]*$/.test(tpl)) { const u = res.unmatched[tpl] || (res.unmatched[tpl] = { n:0, example:t, where:res.observed[t].where[0] }); u.n += res.observed[t].n; }
    }
  });
  res.summary = {
    inventaire:CATALOG.length, inventaireVisible:visible.length,
    observesDistincts:Object.keys(res.observed).length,
    inventaireObserve:visible.filter(c => res.hits[c.id]).length,
    nonDeclenches:visible.filter(c => !res.hits[c.id]).map(c => c.id),
    nonInventories:Object.keys(res.unmatched).length
  };
  const out = { summary:res.summary, runs:res.runs, steps:res.steps, checked:res.checked, constats:res.constats, hits:res.hits, unmatched:res.unmatched, coachRules:res.coachRules, errors:res.errors.slice(0, 50) };
  if (PARAMS.get("all") === "1") out.observed = Object.keys(res.observed).map(t => [t, res.observed[t].n, res.observed[t].where]);
  document.getElementById("out").textContent = JSON.stringify(out);
})();
</script>
