<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Tests des égalités</title></head><body><pre id="out"></pre>
<script src="draft-role-sheet.js"></script><script src="draft-champions.js"></script>
<script>localStorage.setItem("draftProfile",JSON.stringify({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]}));localStorage.setItem("draftPatch","16.22");</script>
<script src="draft-engine.js"></script><script src="draft-data.js"></script>
<script>
const res={ok:0,ko:[]};const t=(ok,text)=>{if(ok)res.ok++;else res.ko.push(text);};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
const FIVE=["Ornn","Lee Sin","Ahri","Jinx","Thresh"];
const signature=r=>({scores:Object.fromEntries(r.ranking.map(p=>[p.pick,Math.round(p.score*1e6)]).sort()),order:r.ranking.map(p=>p.pick).join(),ties:JSON.stringify(r.ties)});
const permute=(l,rng)=>{const c=l.slice();for(let i=c.length-1;i>0;i--){const k=Math.floor(rng()*(i+1));[c[i],c[k]]=[c[k],c[i]];}return c;};
// Ordre du pool : aucun effet, sur aucune draft.
{const rng=mulberry(77);const pools=[["role:jungle","Cho'Gath","Viego","Master Yi","Briar","Lee Sin"],["role:mid","TF","Fizz","Kog'Maw","Xerath"],["role:top","Darius","Garen","Sett","Malphite","Ornn","Sion"],["role:support","Thresh","Leona","Nautilus","Soraka","Lulu"],["role:adc","Jinx","Caitlyn","Vayne","Ashe"]];
 let bad=0,total=0,tied=0;pools.forEach(p=>{const role=p[0].split(":")[1],pool=p.slice(1);for(let i=0;i<200;i++){const size=i%6,l=[];while(l.length<size){const n=NAMES[Math.floor(rng()*NAMES.length)];if(!l.includes(n))l.push(n);}
   const mid=null;applyProfile({role,pool});const b=opponentBelief(l),sc=beliefScenarios(b);const ref=signature(analyze(l,identifiedOpponent(l),true,l.length?sc:null));if(ref.ties!=="[]")tied++;
   for(let k=0;k<4;k++){applyProfile({role,pool:permute(pool,rng)});const s=signature(analyze(l,identifiedOpponent(l),true,l.length?sc:null));total++;if(JSON.stringify(s)!==JSON.stringify(ref))bad++;}}});
 t(!bad,`pool mélangé : mêmes scores, même ordre, mêmes groupes (${total} essais, ${bad} écarts)`);t(tied>50,"le test couvre bien des drafts avec égalité ("+tied+")");
 res.essais=total;res.avecEgalite=tied;}
// Groupes ex æquo
{applyProfile({role:"jungle",pool:["Viego","Master Yi","Lee Sin"]});const r=analyze(["Ornn","Sion","Maokai","Jinx","Thresh"],null,true);const v=r.ranking.find(p=>p.pick==="Viego"),m=r.ranking.find(p=>p.pick==="Master Yi");
 t(v.score===m.score&&v.tiedWith.includes("Master Yi")&&m.tiedWith.includes("Viego"),"deux fiches identiques : ex æquo des deux côtés");t(r.ties.length>=1&&r.ties[0].picks.includes("Viego"),"le groupe est exposé");
 t(r.ranking.findIndex(p=>p.pick==="Master Yi")<r.ranking.findIndex(p=>p.pick==="Viego"),"ordre neutre : par nom");
 t(!r.ranking.some(p=>/alphab|égalité/i.test(p.criteria.map(c=>c.label).join())),"aucun critère ni bonus ajouté");
 const before=v.score;t(before===analyze(["Ornn","Sion","Maokai","Jinx","Thresh"],null,true).ranking.find(p=>p.pick==="Viego").score,"score inchangé");
 applyProfile({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]});const s=analyze(FIVE,"Ahri",true);t(s.ranking.every(p=>Array.isArray(p.tiedWith)),"chaque pick dit s'il est ex æquo");t(Array.isArray(s.ties),"la liste existe aussi sans égalité");}
// Différence de risque : même score, mais le moins pénalisé reste devant, comme avant. Ce sont bien des ex æquo sur le score.
{const fake=[{pick:"A",score:1,why:[{v:-1}]},{pick:"B",score:1,why:[{v:0}]}];const g=markTies(fake);t(g.length===1&&g[0].picks.length===2,"même score : même groupe");t(tieKey(1.0000001)===tieKey(1.0000002),"un écart d'arrondi n'est pas un écart de score");t(tieKey(1.1)!==tieKey(1.2),"un vrai écart reste un écart");}
// Le favori est un choix explicite du joueur, pas un bonus.
{applyProfile({role:"jungle",pool:["Viego","Master Yi"]});const team=["Ornn","Sion","Maokai","Jinx","Thresh"];const base=analyze(team,null,true);ENGINE_PREFS.favorite="Viego";const fav=analyze(team,null,true);ENGINE_PREFS.favorite=null;t(fav.ranking[0].pick==="Viego"&&base.ranking[0].pick==="Master Yi","le favori passe devant en cas d'égalité");t(fav.ranking[0].score===base.ranking[0].score&&fav.ties.length===base.ties.length,"sans changer aucun score, et l'égalité reste signalée");}
// Stabilité d'affichage : holdPick reste distinct.
{applyProfile({role:"jungle",pool:["Viego","Master Yi"]});const r=analyze(["Ornn","Sion","Maokai","Jinx","Thresh"],null,true);t(holdPick(r.ranking,"Viego")==="Viego","en cours de draft, le nom affiché reste stable même si le premier change");t(r.ranking[0].tiedWith.includes("Viego"),"et l'égalité reste exposée à côté");applyProfile({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]});const g=analyze(["Syndra"],"Syndra",true);t(holdPick(g.ranking,g.ranking[g.ranking.length-1].pick)===g.ranking[0].pick||g.ranking[0].score-g.ranking[g.ranking.length-1].score<HOLD_GAP,"un écart net change bien le nom affiché");}
// Plusieurs hypothèses : même règle.
{applyProfile({role:"mid",pool:["TF","Fizz","Kog'Maw","Xerath"]});const r=analyze(["Yasuo","Yone","Vi"],null,true,[{mid:"Yasuo",p:.5},{mid:"Yone",p:.5}]);t(r.ranking.every(p=>Array.isArray(p.tiedWith))&&Array.isArray(r.ties),"scores pondérés : mêmes informations d'égalité");}
document.getElementById("out").textContent=JSON.stringify(res);
</script></body></html>
