<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Tests du calcul de Mes statistiques</title></head><body><pre id="out"></pre>
<!-- Tests unitaires de web/draft-stats-calc.js (docs/stats/CALCULS.md) et lecture de fichiers d'historique de formats différents. Données fictives. -->
<!-- Lancement : tools\run-v215-tests.ps1 -Page draft-stats-tests.html -Work <dossier>. Page de test : exclue de la compilation. -->
<script src="draft-stats-calc.js"></script>
<script>
const res={ok:0,ko:[],notes:{}};const t=(ok,text)=>{if(ok)res.ok++;else res.ko.push(text);};
const near=(a,b)=>Math.abs(a-b)<1e-9;
const C=window.STATS_CALC;
const T0=Date.UTC(2026,2,1,18);
const row=(i,o)=>Object.assign({id:"FICTIF-"+i,acct:"Joueur#TEST",time:T0+i*36e5,patch:"16.6",sec:1800,champ:"Orianna",pos:"MIDDLE",win:i%2===0,k:5,d:4,a:6,mid:"Yasuo",enemies:["Darius","Viego","Yasuo","Jinx","Thresh"]},o||{});
const H=rows=>({generated:"2026-11-09T10:00:00Z",accounts:["Joueur#TEST"],skipped:[],rows});
const read=(rows,resolve)=>C.readHistory(H(rows),null,resolve);

// ---------- Winrate, dénominateur, petits échantillons ----------
{const r=read([...Array(10)].map((_,i)=>row(i,{win:i<6})));const s=C.summary(r);
t(s.record.games===10&&s.record.wins===6&&s.record.losses===4&&near(s.record.rate,.6),"winrate : 6 V sur 10 = 60 %, dénominateur 10");
const r9=read([...Array(9)].map((_,i)=>row(i)));t(C.summary(r9).record.rate===null&&C.summary(r9).record.games===9,"moins de 10 parties : aucun taux, nombre de parties gardé");
const champs=C.byChampion(read([...Array(12)].map((_,i)=>row(i,{champ:i<9?"Ahri":"Orianna"}))).games);
t(champs[0].champ==="Ahri"&&champs[0].games===9&&champs[0].rate===null&&champs[1].games===3,"par champion : 9 parties, pas de taux ; tri au nombre de parties");
t(C.record([]).games===0&&C.record([]).rate===null,"aucune partie : 0, pas de taux");}

// ---------- KDA : somme des parties, aucune mort ----------
{const g=read([row(1,{k:10,d:2,a:5}),row(2,{k:0,d:8,a:3})]).games;const k=C.kda(g);
t(near(k.ratio,(10+5+0+3)/(2+8))&&near(k.k,5)&&near(k.d,5)&&!k.deathless,"KDA : (ΣK+ΣA)/ΣD sur la somme, pas la moyenne des parties");
const z=C.kda(read([row(1,{k:3,d:0,a:4}),row(2,{k:2,d:0,a:1})]).games);
t(near(z.ratio,10)&&z.deathless===true,"ΣD = 0 : ratio = ΣK + ΣA, marqué sans mort");
const r=read([row(1),row(2,{k:"5"}),row(3,{a:-1}),row(4,{d:null})]);
t(r.quality.noKda===3&&C.kda(r.games).games===1&&r.games.length===4,"KDA invalide : écarté du KDA seulement, partie gardée");}

// ---------- Doublons ----------
{const r=read([row(1),row(1),row(1,{acct:"Autre#TEST"}),row(2,{id:""}),row(2,{id:""})]);
t(r.quality.duplicates===1&&r.games.length===4,"doublon même compte et même id : compté une fois ; autre compte : gardé");
t(r.quality.noId===2,"lignes sans identifiant : gardées et comptées à part");
t(r.accounts.length===2,"deux comptes comptés");}

// ---------- Données manquantes ----------
{const r=read([row(1,{win:undefined}),row(2,{win:"true"}),null,"x",[1],row(3,{pos:""}),row(4,{pos:"FILL"}),row(5,{pos:undefined}),row(6,{sec:undefined}),row(7,{time:undefined}),row(8,{time:1700}),row(9,{patch:"16"}),row(10,{patch:undefined}),row(11,{champ:""}),row(12,{mid:""})]);
const q=r.quality;
t(q.noResult===2&&q.unreadable===3,"sans résultat (absent ou texte) : écartée de toutes les mesures ; lignes illisibles comptées");
t(q.unknownRole===3&&r.games.filter(g=>g.role==="unknown").length===3,"rôle vide, inconnu ou absent : rôle inconnu");
t(q.noDuration===1&&C.summary(r).duration.games===r.games.length-1,"sans durée : écartée de la durée moyenne seulement");
t(q.noTime===2&&C.timeline(r.games).undated===2&&!!C.summary(r).period,"sans date valide : écartée de la période et de la chronologie");
t(q.noPatch===2&&C.summary(r).patches.count===1,"patch invalide : écarté des patchs");
t(q.unknownChampion===1&&C.byChampion(r.games).some(c=>c.champ===""),"champion vide : groupe « champion inconnu »");
t(C.matchups(r.games).withoutOpponent>=1,"mid sans adversaire : compté à part dans les vis-à-vis");
t(r.quality.read===15&&r.games.length===10,"15 lignes lues, 10 parties comptées");}

// ---------- Durées : millisecondes avant 11.20, remakes ----------
{const r=read([row(1,{sec:1800000,patch:"11.15"}),row(2,{sec:2000}),row(3,{sec:150000}),row(4,{sec:200}),row(5,{sec:19999})]);
t(r.quality.msConverted===2,"durées ≥ 20 000 lues comme des millisecondes : 2 converties");
t(r.quality.remakes===2&&r.games.length===3,"après conversion, moins de 300 s : remake écarté (150 000 ms et 200 s)");
t(near(C.summary(r).duration.meanSec,(1800+2000+19999)/3),"durée moyenne en secondes, après conversion");}

// ---------- Rôles ----------
{const g=read([row(1,{pos:"TOP"}),row(2,{pos:"TOP"}),row(3,{pos:"JUNGLE"}),row(4,{pos:"JUNGLE"}),row(5,{pos:""}),row(6,{pos:""}),row(7,{pos:""})]).games;
t(C.mainRole(g)==="top","rôle principal : égalité Top/Jungle tranchée dans l'ordre Top, Jungle, Mid, ADC, Support ; jamais le rôle inconnu");
const roles=C.byRole(g);t(roles.length===6&&roles[5].role==="unknown"&&roles[5].games===3&&roles.find(x=>x.role==="adc").games===0,"par rôle : les cinq rôles, plus rôle inconnu quand il existe");
t(C.byRole(read([row(1)]).games).length===5,"sans rôle inconnu : il n'apparaît pas");
t(C.mainRole(read([row(1,{pos:""})]).games)===null,"seulement des rôles inconnus : pas de rôle principal");
t(C.byChampion(g)[0].mainRole==="top","rôle principal d'un champion");}

// ---------- Chronologie : 93 parties, dernière tranche gardée ----------
{const g=read([...Array(93)].map((_,i)=>row(i))).games;const tl=C.timeline(g);
t(tl.slices.length===5&&tl.slices[4].from===81&&tl.slices[4].to===93&&!tl.slices[4].complete&&tl.slices.reduce((s,x)=>s+x.games,0)===93,"93 parties : 5 tranches, la dernière (81 à 93) gardée, aucune partie perdue");
t(tl.slices[4].rate!==null&&C.timeline(g.slice(0,85)).slices[4].rate===null,"tranche de 13 : taux ; tranche de 5 : pas de taux");
t(tl.points.length===93&&tl.points[0].time<tl.points[92].time,"suite des parties de la plus ancienne à la plus récente");}

// ---------- Vis-à-vis : mid seulement, filtres ----------
{const g=read([row(1,{mid:"Yasuo",champ:"Orianna"}),row(2,{mid:"Yasuo",champ:"Ahri"}),row(3,{mid:"Zed"}),row(4,{pos:"JUNGLE",champ:"LeeSin",mid:"Ahri"}),row(5,{pos:"TOP",mid:"Syndra"})]).games;
const m=C.matchups(g);t(m.available&&m.games===3&&m.opponents[0].name==="Yasuo"&&m.opponents[0].games===2&&m.opponents[0].champs.length===2,"vis-à-vis : parties en mid seulement, champions joués contre chacun");
const j=C.matchups(g,{role:"jungle"});t(!j.available&&j.games===1&&j.opponents.length===0,"jungle : adversaire non enregistré, nombre de parties du rôle donné");
const f=C.matchups(g,{champ:"Ahri"});t(f.games===1&&f.opponents.length===1&&f.played.length===2,"filtre par champion joué ; liste des champions du filtre complète");}

// ---------- Journal : origine, dénominateur, égalités ----------
{const E=(i,o)=>Object.assign({id:i,date:"2026-11-0"+(i%9+1)+"T10:00:00Z",suggested:"Orianna",picked:"Orianna",close:false,enemies:[],mid:"Yasuo",result:null,engine:"2.2"},o||{});
const J=C.journal([E(1),E(2,{picked:"Ahri"}),E(3,{result:"win"}),E(4,{origin:"draft",app:"3.0.0",result:"win"}),E(5,{origin:"draft",result:"loss",picked:"Ahri"}),E(6,{userOrigin:"real",result:"win"}),E(7,{userOrigin:"simulation",result:"win"}),E(8,{origin:"draft",result:"skip"}),E(9,{origin:"draft"})]);
t(J.recorded===9&&J.confirmed===5&&J.toSort===3&&J.simulations===1,"trois compteurs : 9 enregistrées, 5 confirmées (marque draft ou classée réelle), 3 à classer ; 1 simulation gardée");
t(J.finished.games===3&&J.finished.wins===2&&J.pending===1&&J.skipped===1,"terminées, en attente, ignorées : sur les entrées comptées");
t(J.followed.games===2&&J.followed.wins===2&&J.other.games===1,"conseil suivi : sur les parties terminées (2 sur 3), jamais sur toutes les drafts");
const T=C.journal([E(1,{origin:"draft",result:"win",suggested:"Orianna",picked:"Ahri",tied:true,tiedWith:["Orianna","Ahri"]}),E(2,{origin:"draft",result:"win",suggested:"Orianna",picked:"Viktor",tied:true,tiedWith:["Orianna","Ahri"]}),E(3,{origin:"draft",result:"win",suggested:"Orianna",picked:"Ahri",tiedWith:["Ahri"]})]);
t(T.followed.games===1&&T.ties===2,"égalité : un ex æquo choisi = conseil suivi ; hors du groupe, non ; sans « tied », aucune égalité reconstruite");
// Journal automatique (#40) et drafts annulées (#39) : origin « lcu » = vraie draft ; draft annulée gardée, jamais comptée.
const A=C.journal([E(1,{origin:"lcu",app:"3.0.0-beta.2",gameStarted:true,result:"win",picked:"Orianna",suggested:"Orianna",selection:"1"}),E(2,{origin:"lcu",gameStarted:true,result:null,picked:"Ahri",suggested:"Orianna",selection:"2"}),E(3,{origin:"draft",abandoned:true,result:null,picked:"Ahri"}),E(4,{origin:"draft",abandoned:true,result:"win",picked:"Orianna"}),E(5,{origin:"draft",result:"loss"})]);
t(A.recorded===5&&A.confirmed===3&&A.toSort===0&&A.abandoned===2,"journal automatique : entrées « lcu » confirmées, jamais à classer ; 2 drafts annulées gardées (5 enregistrées), non confirmées");
t(A.finished.games===2&&A.finished.wins===1&&A.pending===1&&A.followed.games===2&&A.followed.wins===1,"draft annulée : ni partie terminée, ni en attente, ni conseil suivi, même avec un résultat");
const AR=A.entries.filter(r=>r.abandoned);t(AR.length===2&&AR.every(r=>!r.counted)&&A.entries.filter(r=>r.entry.origin==="lcu").every(r=>r.counted&&r.origin==="draft"),"lignes du journal : annulées hors compte, « lcu » comptées comme drafts réelles");
t(C.journal([]).confirmed===0&&C.journal(null).recorded===0&&C.journal([null,"x"]).recorded===0,"journal vide ou abîmé : zéro, sans erreur");
const P=C.progress(read([...Array(22)].map((_,i)=>row(i))).games,J);
t(P.champion.have===22&&P.champion.need===30&&!P.champion.reached&&P.trend.need===40&&!P.trend.reached&&P.opponent.have===22&&P.opponent.reached&&P.advice.have===1,"« Pas encore » : progression vers 30, 40, 10 et 10 ; seuil atteint marqué");}

// ---------- Rapprochement avec l'historique Riot importé (beta.3) : gameId seulement, Riot fait foi ----------
{const E=(i,o)=>Object.assign({id:9000+i,date:"2026-11-20T18:00:00Z",suggested:"Orianna",picked:"Orianna",close:false,enemies:[],mid:"Yasuo",result:null,engine:"x",origin:"lcu",gameStarted:true,selection:String(i)},o||{});
const R=(id,o)=>row(0,Object.assign({id,acct:"Joueur#TEST",time:Date.UTC(2026,10,20,18,5),patch:"16.22",sec:1925,champ:"Orianna",pos:"MIDDLE",win:true,k:7,d:2,a:9,mid:"Ahri"},o||{}));
const G=rows=>read(rows).games;
const rowOf=(J,id)=>J.entries.find(r=>r.entry.id===id);
// Rapprochement par gameId : nombre ou texte, partie numérique de l'id Riot.
let J=C.journal([E(1,{gameId:7012345678}),E(2,{gameId:"7012345679"})],G([R("EUW1_7012345678"),R("EUW1_7012345679",{win:false})]));
let r1=rowOf(J,9001),r2=rowOf(J,9002);
t(!!r1.riot&&r1.riot.id==="EUW1_7012345678"&&r1.riot.result==="win"&&r1.riot.k===7&&r1.riot.d===2&&r1.riot.a===9&&r1.riot.durationSec===1925&&r1.riot.patch==="16.22"&&r1.riot.opponent==="Ahri","rapprochement par gameId : id Riot, résultat, K/D/A, durée, patch et adversaire de voie (mid)");
t(!!r2.riot&&r2.riot.result==="loss"&&r2.result==="loss","gameId en texte : rapproché aussi");
t(J.finished.games===2&&J.finished.wins===1&&J.pending===0&&J.riot.matched===2&&J.riot.notFound===0,"après l'import : 2 parties terminées (1 V), plus aucune en attente");
t(C.gameIdOf({gameId:0})===null&&C.gameIdOf({gameId:-5})===null&&C.gameIdOf({gameId:"EUW1_1"})===null&&C.gameIdOf({gameId:1.5})===null&&C.riotGameId("EUW1_7012345678")==="7012345678"&&C.riotGameId("FICTIF-1")===null&&C.riotGameId("EUW1_70X")===null,"gameId et id Riot invalides : ignorés");
// Plateformes différentes et plusieurs comptes.
J=C.journal([E(1,{gameId:111}),E(2,{gameId:222}),E(3,{gameId:333}),E(4,{gameId:11})],G([R("EUW1_111",{acct:"A#EUW"}),R("NA1_222",{acct:"B#NA",win:false}),R("EUW1_333",{acct:"A#EUW",win:true}),R("NA1_333",{acct:"B#NA",win:false})]));
t(rowOf(J,9001).riot.id==="EUW1_111"&&rowOf(J,9002).riot.id==="NA1_222"&&rowOf(J,9002).riot.result==="loss","plateformes EUW1 et NA1, deux comptes : chaque entrée rapprochée de sa partie");
t(rowOf(J,9003).riot===null&&J.riot.ambiguous===1,"même gameId sur EUW1 et NA1 : ambigu, aucun rapprochement");
t(rowOf(J,9004).riot===null&&J.riot.notFound===1,"gameId 11 : jamais rapproché de EUW1_111 (égalité exacte seulement)");
J=C.journal([E(1,{gameId:999})],G([R("EUW1_999",{acct:"A#EUW"}),R("EUW1_999",{acct:"Ancien#EUW"})]));
t(!!rowOf(J,9001).riot&&J.riot.matched===1,"même partie sous deux noms de compte, mêmes données : une seule partie, rapprochée");
// Entrée sans gameId : rien, même avec le même champion à la même heure.
J=C.journal([E(1,{origin:"draft",gameStarted:undefined,selection:undefined,date:"2026-11-20T18:05:00Z"}),E(2,{gameId:"",origin:"draft"})],G([R("EUW1_123")]));
t(J.entries.every(x=>x.riot===null)&&J.riot.matched===0&&J.riot.withoutGameId===2&&J.pending===2,"sans gameId : aucun rapprochement, ni par l'heure ni par le champion ; toujours en attente");
// Deux entrées, une seule partie Riot.
J=C.journal([E(1,{gameId:444}),E(2,{gameId:555})],G([R("EUW1_444")]));
t(!!rowOf(J,9001).riot&&rowOf(J,9002).riot===null&&J.riot.matched===1&&J.riot.notFound===1&&J.pending===1,"deux entrées, une partie Riot : seule l'entrée du même gameId est rapprochée");
J=C.journal([E(1,{gameId:666}),E(2,{gameId:666,origin:"draft"})],G([R("EUW1_666")]));
t(J.entries.every(x=>x.riot===null)&&J.riot.ambiguous===2&&J.riot.matched===0,"deux entrées du même gameId : une partie Riot ne confirme jamais deux entrées, aucune n'est rapprochée");
// Désaccord : Riot fait foi, le désaccord est montré, rien n'est effacé.
const D=[E(1,{gameId:701,result:"win",resultSource:"manual",picked:"Orianna",suggested:"Orianna"}),E(2,{gameId:702,result:"loss",resultSource:"lcu",picked:"Ahri",suggested:"Orianna"}),E(3,{gameId:703,result:"win"}),E(4,{gameId:704,result:"skip"})];
const before=JSON.stringify(D);
J=C.journal(D,G([R("EUW1_701",{win:false}),R("EUW1_702",{win:true}),R("EUW1_703",{win:true}),R("EUW1_704",{win:false})]));
const d1=rowOf(J,9001),d2=rowOf(J,9002),d3=rowOf(J,9003),d4=rowOf(J,9004);
t(d1.disagree&&d1.result==="loss"&&d1.storedSource==="manual"&&d1.entry.result==="win","désaccord manuel : Riot (défaite) fait foi, la victoire saisie est gardée et signalée");
t(d2.disagree&&d2.result==="win"&&d2.storedSource==="lcu"&&d2.entry.result==="loss","désaccord avec le client (resultSource lcu) : Riot fait foi, désaccord signalé");
t(!d3.disagree&&d3.result==="win"&&d3.storedSource==="manual","même résultat : aucun désaccord ; sans resultSource, saisie manuelle");
t(!d4.disagree&&d4.result==="loss"&&J.skipped===0,"entrée ignorée puis rapprochée : résultat de Riot, aucun désaccord");
t(J.riot.disagreements===2&&J.finished.games===4&&J.finished.wins===2&&J.followed.games===3&&J.followed.wins===1&&J.other.wins===1,"comptes : résultats de Riot (2 V sur 4), conseil suivi compris ; 2 désaccords");
t(JSON.stringify(D)===before,"rien n'est écrit dans les entrées : résultat, resultSource et champs inchangés");
// Entrée annulée : jamais rapprochée ni comptée.
J=C.journal([E(1,{gameId:777,abandoned:true}),E(2,{gameId:888,abandoned:true,result:"win"}),E(3,{gameId:888})],G([R("EUW1_777"),R("EUW1_888",{win:false})]));
t(rowOf(J,9001).riot===null&&!rowOf(J,9001).counted&&rowOf(J,9002).riot===null&&!!rowOf(J,9003).riot&&J.riot.matched===1&&J.riot.ambiguous===0&&J.finished.games===1&&J.finished.wins===0,"entrée annulée : jamais rapprochée ni comptée, même avec une partie Riot du même gameId");
// Aucune donnée inventée.
J=C.journal([E(1,{gameId:901}),E(2,{gameId:902}),E(3,{gameId:903}),E(4,{gameId:904,origin:undefined,gameStarted:undefined}),E(5,{gameId:905,origin:undefined,userOrigin:"simulation"})],
  G([R("EUW1_901",{k:undefined,d:undefined,a:undefined,patch:undefined,sec:undefined,pos:"TOP",mid:"Zed"}),R("EUW1_902",{sec:200}),R("EUW1_903",{win:undefined}),R("EUW1_904"),R("EUW1_905")]));
const n1=rowOf(J,9001).riot;
t(!!n1&&n1.k===null&&n1.d===null&&n1.a===null&&n1.patch===null&&n1.durationSec===null&&!("opponent" in n1)&&Object.keys(n1).sort().join()==="a,d,durationSec,id,k,patch,result","ligne Riot incomplète : champs absents laissés vides ; adversaire hors mid jamais déduit");
t(rowOf(J,9002).riot===null&&rowOf(J,9003).riot===null&&J.pending===2,"remake ou ligne sans résultat : aucun rapprochement, l'entrée reste en attente");
t(rowOf(J,9004).riot===null&&rowOf(J,9005).riot===null,"origine inconnue ou simulation : jamais rapprochée, rien n'est déduit");
const solo=C.journal([E(1,{gameId:901,result:"win"})]);
t(rowOf(solo,9001).riot===null&&solo.finished.wins===1&&solo.riot.matched===0,"sans historique importé : résultats stockés, aucun détail Riot");}

// ---------- Observations (seuil atteint) : test de COACHING-ARCHITECTURE.md, jamais la seule taille d'échantillon ----------
{const g=(n,o)=>[...Array(n)].map((_,i)=>row(1000+(o.base||0)+i,Object.assign({},o.f?o.f(i):{},o.fixed||{})));
const ws=(n,w)=>i=>({win:i<w});
// Orianna 40 parties (30 V) contre 40 parties des autres mids (15 V) : intervalle de Wilson [0,60 ; 0,86] au-dessus de 0,375.
let rows=g(40,{base:0,f:ws(40,30),fixed:{champ:"Orianna"}}).concat(g(40,{base:100,f:ws(40,15),fixed:{champ:"Ahri"}}));
let O=C.observations(read(rows).games,null);
const ori=O.find(o=>o.kind==="champion"&&o.subject==="Orianna"),ahr=O.find(o=>o.kind==="champion"&&o.subject==="Ahri");
t(!!ori&&ori.status==="above"&&ori.reference.games===40&&!!ahr&&ahr.status==="below","champion : intervalle qui exclut la moyenne des autres champions du rôle (au-dessus, en dessous)");
t(near(C.wilson(30,40)[0],0.5970306466284549)||Math.abs(C.wilson(30,40)[0]-0.597)<0.005,"Wilson 95 % calculé (30 sur 40 : borne basse 0,60)");
// Seuil atteint, mais référence trop petite : pas de comparaison.
O=C.observations(read(g(30,{base:200,f:ws(30,20),fixed:{champ:"Orianna"}}).concat(g(12,{base:300,f:ws(12,6),fixed:{champ:"Ahri"}}))).games,null);
t(O.find(o=>o.kind==="champion"&&o.subject==="Orianna").status==="noReference","30 parties sur le champion, 12 sur les autres : seuil atteint, aucune comparaison");
t(!O.some(o=>o.kind==="champion"&&o.subject==="Ahri"),"12 parties : aucune observation de champion");
// Tendance : 60 parties en mid, première moitié 7 V sur 30, seconde 23 V sur 30 : |z| >= 2, hausse.
rows=g(60,{base:400,f:i=>({win:i<30?i<7:i<53,champ:["Orianna","Ahri","Viktor"][i%3]})});
const up=C.observations(read(rows).games,null).find(o=>o.kind==="trend");
t(!!up&&up.status==="up"&&up.measure.z>=2&&up.measure.older.games===30,"tendance : hausse nette (z = "+(up?up.measure.z.toFixed(2):"?")+")");
rows=g(60,{base:500,f:i=>({win:i%2===0,champ:["Orianna","Ahri","Viktor"][i%3]})});
const flat=C.observations(read(rows).games,null).find(o=>o.kind==="trend");
t(!!flat&&flat.status==="flat"&&Math.abs(flat.measure.z)<2,"tendance : 60 parties alternées, aucune tendance nette détectée (seuil atteint n'est pas une preuve)");
t(!C.observations(read(g(39,{base:600,f:ws(39,30)})).games,null).some(o=>o.kind==="trend"),"39 parties dans le rôle : aucune observation de tendance");
// Vis-à-vis : deux adversaires testés (12 parties chacun) : intervalle à 99 % ; LeBlanc 1 V sur 12 sous la moyenne du mid.
rows=g(12,{base:700,f:ws(12,1),fixed:{mid:"LeBlanc"}}).concat(g(12,{base:800,f:ws(12,6),fixed:{mid:"Zed"}}),g(40,{base:900,f:ws(40,28),fixed:{mid:"Yasuo"}}));
O=C.observations(read(rows).games,null).filter(o=>o.kind==="opponent");
const lb=O.find(o=>o.subject==="LeBlanc"),zd=O.find(o=>o.subject==="Zed");
t(O.length===3&&lb.rule.level===99&&lb.status==="below"&&zd.status==="flat","vis-à-vis : 99 % dès que plusieurs adversaires sont testés ; sous la moyenne, ou aucun écart net");
