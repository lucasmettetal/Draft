<script>

// Historiques entièrement fictifs.
function games(champ,pos,n,w,{ago=1,span=60,k=5,d=4,a=6,enemies=[]}={}){const out=[];for(let i=0;i<n;i++){out.push({champ,pos,win:(i*7)%n<w,time:NOW-(ago+span*(n>1?(n-1-i)/(n-1):0))*DAY,k,d,a,enemies,acct:"Test#TEST"});}return out;}

{const rng=mul(21);applyProfile({role:"mid",pool:["Fizz","Xerath","Kog'Maw","TF","Ahri","Zed","Lux","Syndra"]});let changes=0;const p=prof(filler("MIDDLE").concat(games("Xerath","MIDDLE",80,40),games("Lux","MIDDLE",80,40)));for(let i=0;i<500;i++){const l=draw(rng,1+i%5);const a=personalizedRanking({enemies:l}),b=personalizedRanking({enemies:l,profile:p,model:"T"});if(b.tieBreak&&!(masteryKey(b.ranking[0].score)===masteryKey(a.ranking[0].score)&&b.ranking[0].risk===a.ranking[0].risk))changes++;}t(!changes,"T ne franchit jamais une différence de score ou de risque");applyProfile(MID);}
