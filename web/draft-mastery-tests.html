 const profiles=[null,prof(filler("MIDDLE")),prof(filler("MIDDLE").concat(games("Xerath","MIDDLE",25,20,{ago:300}),games("TwistedFate","MIDDLE",80,44),games("Fizz","MIDDLE",3,3)))];let broken=[],empty=0,undet=0,seen={},n=0;
